# Runs the TTCN-3 protocol conformance suites against native_sim.
#
# These are not part of the ordinary Twister run. They need a Titan
# installation, a network interface facing the device, and a checkout of the
# TTCN-3 suites, none of which a normal build has. They are also slow, and the
# suites cannot run at the same time as each other, so this runs nightly rather
# than per pull request.

name: Network protocol conformance

on:
  schedule:
    # 03:00 UTC nightly
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    if: github.repository_owner == 'zephyrproject-rtos'
    runs-on:
      group: zephyr-runner-v2-linux-x64-4xlarge
    timeout-minutes: 90
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.2.20260422
      # Creating the interface the suites talk to the device over needs to
      # configure networking in the container.
      options: '--entrypoint /bin/bash --cap-add=NET_ADMIN'
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Apply container owner mismatch workaround
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Zephyr environment
        uses: ./.github/actions/zephyr-ci-env
        with:
          group-filter: '+tools,'

      - name: Install Titan
        run: |
          apt-get update
          # expect is needed by suites that run through the main controller.
          apt-get install -y --no-install-recommends eclipse-titan expect
          echo "TTCN3_DIR=/usr" >> $GITHUB_ENV

      - name: Fetch the TTCN-3 modules
        run: |
          ${GITHUB_WORKSPACE}/../tools/net-tools/ttcn3/fetch-modules.sh

      - name: Create the network interface
        run: |
          ${GITHUB_WORKSPACE}/../tools/net-tools/net-setup.sh \
            --config ${GITHUB_WORKSPACE}/../tools/net-tools/zeth.conf start
          ip -br addr show zeth

      - name: Run the conformance suites
        run: |
          export ZEPHYR_BASE=${GITHUB_WORKSPACE}
          ./scripts/twister --platform native_sim --enable-slow --inline-logs \
            --testsuite-root tests/net/conformance

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: net-conformance-results
          path: |
            twister-out/twister.xml
            twister-out/**/twister_harness.log
          if-no-files-found: ignore
