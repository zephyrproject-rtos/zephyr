name: Requirements Traceability

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JOB_COUNT: 8

jobs:
  traceability-build:
    name: Coverage Run and Traceability Export
    runs-on:
      group: zephyr-runner-v2-linux-x64-4xlarge
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.4.20260912
      options: '--entrypoint /bin/bash'
    timeout-minutes: 420
    env:
      CCACHE_DIR: /node-cache/ccache-zephyr
      CCACHE_REMOTE_STORAGE: "redis://cache-*.keydb-cache.svc.cluster.local|shards=1,2,3"
      CCACHE_REMOTE_ONLY: "true"
      # `--specs` is ignored because ccache is unable to resolve the toolchain specs file path.
      CCACHE_IGNOREOPTIONS: '-specs=* --specs=*'

    steps:
    - name: Apply container owner mismatch workaround
      run: |
        # FIXME: The owner UID of the GITHUB_WORKSPACE directory may not
        #        match the container user UID because of the way GitHub
        #        Actions runner is implemented. Remove this workaround when
        #        GitHub comes up with a fundamental fix for this problem.
        git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Update PATH for west
      run: |
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Clone cached Zephyr repository
      continue-on-error: true
      run: |
        git clone --shared /repo-cache/zephyrproject/zephyr .
        git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: 3.12
        cache: pip
        cache-dependency-path: scripts/requirements-actions.txt

    - name: Install Python packages
      run: |
        pip install -r scripts/requirements-actions.txt --require-hashes

    - name: west setup
      run: |
        git config --global http.version HTTP/1.1
        west init -l . || true
        west update 1> west.update.log || west update 1> west.update-2.log
        west packages pip --install --ignore-venv-check

    - name: Environment Setup
      run: |
        echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$( cat SDK_VERSION )" >> $GITHUB_ENV

    - name: Set up ccache
      run: |
        mkdir -p ${CCACHE_DIR}
        ccache -M 10G
        ccache -p
        ccache -z -s -vv

    - name: Run tests with Twister (coverage, per-test matrix)
      continue-on-error: true
      run: |
        export ZEPHYR_BASE=${PWD}
        export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
        ./scripts/twister \
          -i --force-color -N -v \
          -p qemu_cortex_a53/qemu_cortex_a53 \
          -T tests/arch -T tests/kernel -T tests/lib \
          --coverage --coverage-tool lcov --coverage-per-test

    - name: Check Twister coverage outputs
      run: |
        ls -l twister-out/twister.json twister-out/coverage/test_matrix.json

    - name: Print ccache stats
      if: always()
      run: |
        ccache -s -vv

    - name: Install Python packages required for documentation build
      run: |
        pip install -r doc/requirements.txt --require-hashes

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install and vendor copies of JS libs within docs sources
      run: |
        npm install --prefix doc --ignore-scripts
        for pkg in mermaid d3; do
          mkdir -p doc/_static/js/${pkg}
          cp -a doc/node_modules/${pkg}/dist/. doc/_static/js/${pkg}/
        done

    - name: Build HTML documentation with requirements
      run: |
        DOC_TAG=development \
        SPHINXOPTS="-j ${JOB_COUNT} -W --keep-going -T" \
        SPHINXOPTS_EXTRA="-q" \
        make -C doc html-fast NO_EXTERNAL_DEPS=1

        ls -l doc/_build/html/needs.json

    - name: Export true-traceability static site
      run: |
        python3 doc/_scripts/traceability_app.py \
          --json doc/_build/html/needs.json \
          --twister twister-out/twister.json \
          --matrix twister-out/coverage/test_matrix.json \
          --export traceability-out

    - name: Compress artifacts
      run: |
        tar --use-compress-program="xz -T0" -cf html-output.tar.xz \
          --exclude html/_sources --exclude html/doxygen/xml \
          --directory=doc/_build html
        tar --use-compress-program="xz -T0" -cf traceability-output.tar.xz traceability-out
        tar --use-compress-program="xz -T0" -cf coverage-data.tar.xz \
          twister-out/twister.json twister-out/coverage/test_matrix.json

    - name: Upload HTML docs output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: html-output
        path: html-output.tar.xz

    - name: Upload traceability output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: traceability-output
        path: traceability-output.tar.xz

    - name: Upload coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-data
        path: coverage-data.tar.xz

  traceability-publish:
    name: Publish Documentation and Traceability Data
    needs: traceability-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

    - name: Uncompress artifacts
      run: |
        tar xf html-output/html-output.tar.xz -C html-output
        tar xf traceability-output/traceability-output.tar.xz -C traceability-output

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ vars.AWS_TESTING_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_TESTING_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Upload to AWS S3
      run: |
        aws s3 sync --quiet html-output/html \
          s3://testing.zephyrproject.org/doc/safety/ --delete
        aws s3 sync --quiet traceability-output/traceability-out \
          s3://testing.zephyrproject.org/true-traceability/ --delete
