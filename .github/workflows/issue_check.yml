name: Issue Check

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - typed
      - untyped

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issue-check:
    name: Issue Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'zephyrproject-rtos/zephyr' && github.event.issue.state == 'open'
    permissions:
      issues: write # to comment on issues

    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ISSUE_TEMPLATE
            scripts/ci/check_issue.py
            scripts/requirements-actions.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install Python packages
        run: |
          pip install -r scripts/requirements-actions.txt --require-hashes

      - name: Check the issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ORG: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          # A new comment is only posted when the issue is filed or reopened. Later
          # events update or remove that comment, so that editing an issue which
          # predates the templates does not draw one.
          COMMENT: >-
            ${{ contains(fromJSON('["opened", "reopened"]'), github.event.action)
            && 'create' || 'update' }}
        run: |
          python -u scripts/ci/check_issue.py -I "${ISSUE}" -o "${ORG}" -r "${REPO}" \
            --comment "${COMMENT}"
