# Informational kernel latency comparison.
#
# Runs tests/benchmarks/kernel_latency twice on the same runner, once on the
# pull request and once on the branch it targets, on one QEMU target per
# architecture. QEMU runs in icount mode there, so the cycle counter advances
# with executed instructions rather than with host time: a given binary
# reports the same numbers on every run, and a benchmark that moved between
# the two runs is a kernel path that executes a different number of
# instructions.
#
# The result is written to the job summary. This check is advisory: it never
# fails, and must not be added to the required checks.

name: Kernel latency

on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'include/zephyr/kernel.h'
      - 'include/zephyr/kernel/**'
      - 'include/zephyr/kernel_structs.h'
      - 'tests/benchmarks/kernel_latency/**'
      - 'subsys/testsuite/ztest/benchmark/**'
      - '.github/workflows/kernel-perf.yml'
    branches:
      - main
      - v*-branch
      - collab-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  kernel-perf:
    name: "Kernel latency"
    runs-on:
      group: zephyr-runner-v2-linux-x64-4xlarge
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.29.3.20260727
      options: '--entrypoint /bin/bash'
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BASE_REF: ${{ github.base_ref }}
      BENCHMARK: tests/benchmarks/kernel_latency
      # One target per architecture port, since the context switch and
      # interrupt paths the benchmark reaches are different code on each.
      # qemu_cortex_m3 is left out: QEMU does not implement the DWT cycle
      # counter, so every benchmark reads zero there.
      PLATFORMS: >-
        -p qemu_x86 -p qemu_x86_64
        -p qemu_cortex_r5 -p qemu_cortex_a9 -p qemu_cortex_a53
        -p qemu_riscv32 -p qemu_riscv64
        -p qemu_arc/qemu_arc_hs -p qemu_xtensa/dc233c
        -p qemu_leon3 -p qemu_malta -p qemu_or1k
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr

    steps:
      - name: Apply container owner mismatch workaround
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Clone cached Zephyr repository
        continue-on-error: true
        run: |
          git clone --shared /repo-cache/zephyrproject/zephyr .
          git remote set-url origin ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Same manifest group filter as the twister workflow: see net-perf.yml
      # for why the workspace cannot be trimmed further.
      - name: Environment Setup
        uses: ./.github/actions/zephyr-ci-env
        with:
          base-ref: ${{ github.base_ref }}
          group-filter: '+ci,'
          run-checks: 'true'

      - name: Install Python packages
        run: |
          pip install -r scripts/requirements-actions.txt --require-hashes

      # The setup step above rebases the pull request onto the target branch, so
      # this has to run after it: HEAD is the rebased series, not the pull
      # request head, and origin/${BASE_REF} is exactly what the series adds to.
      - name: Record the revisions to compare
        run: |
          echo "PR_SHA=$(git rev-parse HEAD)" >> ${GITHUB_ENV}
          echo "BASE_SHA=$(git rev-parse origin/${BASE_REF})" >> ${GITHUB_ENV}

      - name: Measure the pull request
        continue-on-error: true
        run: |
          # The step shell already sets pipefail, but the "|| echo" below
          # depends on it, so do not leave that to the runner default.
          set -o pipefail
          export ZEPHYR_BASE=${PWD}
          ./scripts/twister -T "${BENCHMARK}" ${PLATFORMS} \
              --outdir pr-run 2>&1 | tee pr-run.log \
              || echo "twister exited with status ${PIPESTATUS[0]}" | tee -a pr-run.log

      # Measure the target branch with the pull request's copy of the
      # benchmark, so the measuring instrument is identical on both sides and
      # only the kernel under test differs.
      - name: Measure the target branch
        continue-on-error: true
        run: |
          set -o pipefail
          export ZEPHYR_BASE=${PWD}
          git checkout -f "${BASE_SHA}"
          git checkout "${PR_SHA}" -- "${BENCHMARK}"
          ./scripts/twister -T "${BENCHMARK}" ${PLATFORMS} \
              --outdir base-run 2>&1 | tee base-run.log \
              || echo "twister exited with status ${PIPESTATUS[0]}" | tee -a base-run.log

      - name: Restore the pull request tree
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          git checkout -f "${PR_SHA}"

      # --exit-zero keeps this advisory even if a benchmark collapsed. A run
      # that produced no report at all is a different matter: report what
      # twister said, rather than leaving a bare "cannot read twister.json"
      # behind.
      - name: Compare and report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -s pr-run/twister.json ] || [ ! -s base-run/twister.json ]; then
              {
                  echo "### Kernel latency"
                  echo
                  echo "No comparison available: a measurement produced no twister"
                  echo "report. The tail of each run follows."
                  echo
                  for log in pr-run.log base-run.log; do
                      [ -f "${log}" ] || continue
                      echo "<details><summary>${log}</summary>"
                      echo
                      echo '```'
                      tail -n 40 "${log}"
                      echo '```'
                      echo
                      echo "</details>"
                      echo
                  done
                  echo "This check is informational and never fails a pull request."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
          fi

          "${BENCHMARK}"/scripts/kernel_latency_regression.py \
              --twister-json pr-run/twister.json \
              --baseline-twister-json base-run/twister.json \
              --markdown kernel-perf.md \
              --annotate \
              --exit-zero
          cat kernel-perf.md >> "${GITHUB_STEP_SUMMARY}"

      # The companion workflow that comments on the pull request runs in a
      # privileged context and cannot trust anything this job produces, so the
      # pull request number travels as its own artifact and is checked against
      # the measured commit there. Same shape as net-perf.yml.
      - name: Record the pull request number
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          echo "${{ github.event.pull_request.number }}" > pr_num

      - name: Upload the pull request number
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr_num
          path: pr_num
          if-no-files-found: ignore

      - name: Upload latency data
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-perf
          path: |
            kernel-perf.md
            pr-run/twister.json
            base-run/twister.json
            pr-run.log
            base-run.log
          if-no-files-found: ignore
