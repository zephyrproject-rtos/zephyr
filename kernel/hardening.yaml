# Security hardening database fragment for the kernel.

rules:
  BOUNDS_CHECK_BYPASS_MITIGATION:
    value: y
    rationale: |
      Inserts speculation barriers after bounds checks on array indexes passed in from user mode,
      mitigating Spectre V1 style bounds check bypass attacks.
    references: [CWE-1037]

  EXECUTE_XOR_WRITE:
    value: y
    rationale: |
      Enforces W^X: no memory page is both writable and executable, preventing injected data from
      being executed as code.
    references: [CWE-119]

  INIT_STACKS:
    value: n
    profiles: [strict]
    rationale: |
      Fills every thread and interrupt stack with a known pattern before use, so anyone able to read
      memory can measure how much of each stack has been used.

  MEM_DOMAIN_ISOLATED_STACKS:
    value: y
    rationale: |
      Keeps thread stacks isolated even between threads sharing a memory domain; without it, one
      compromised user thread can read and overwrite its domain peers' stacks, return addresses
      included.
    references: [CWE-668, CWE-787]

  OBJ_CORE:
    value: n
    profiles: [strict]
    rationale: |
      Links every participating kernel object into per-type lists that can be walked at run time,
      giving shell commands and other tooling a ready-made inventory of the system's kernel objects.
    references: [CWE-200]

  STACK_CANARIES:
    value: y
    rationale: |
      Compiler-inserted stack canaries detect stack buffer overflows before a corrupted return
      address is used, turning an exploitable overflow into a controlled error.
    references: [CWE-121]

  STACK_POINTER_RANDOM:
    min: 100
    rationale: |
      Randomizing each thread's initial stack pointer makes stack addresses unpredictable, raising
      the cost of stack-smashing and return-oriented-programming attacks. The offset is taken out
      of the thread's own stack, which is what keeps the recommended value small.
    references: [CWE-121]

  THREAD_MONITOR:
    value: n
    profiles: [strict]
    rationale: |
      Maintains a walkable list of all threads and their properties for debug tools, simplifying
      enumeration of the system's tasks.
    references: [CWE-200]

  THREAD_NAME:
    value: n
    profiles: [strict]
    rationale: |
      Stores human-readable thread names in RAM, labeling kernel structures for anyone able to read
      memory or logs.
    references: [CWE-200]

  THREAD_RUNTIME_STATS:
    value: n
    profiles: [strict]
    rationale: |
      Counts execution cycles per thread and for the whole system at every context switch,
      revealing each thread's CPU usage and activity pattern to anything that reads the statistics,
      such as the kernel shell.
    references: [CWE-200]

  USERSPACE_THREAD_MAY_RAISE_PRIORITY:
    value: n
    rationale: |
      Lets a user-mode thread raise the priority of itself or of any thread it has permission on,
      so compromised user code can starve or preempt the system's higher-priority threads.
    references: [CWE-269]
