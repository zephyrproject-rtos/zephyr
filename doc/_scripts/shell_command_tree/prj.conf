CONFIG_SHELL=y
CONFIG_SHELL_HELP=y
# Only the command tree is needed, the shell itself never has to run.
CONFIG_SHELL_AUTOSTART=n
# Lets shell modules that complete device arguments with devicetree node
# labels (e.g. the GPIO shell) be recognized as accepting device names.
CONFIG_DEVICE_DT_METADATA=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=4096
