description: AMD ACP DMIC (PDM) DAI (DMIC0/DMIC1)

compatible: "amd,dmic-dai"

include: [base.yaml]

properties:
  dai-index:
    type: int
    description: |
      DMIC instance index: 0=DMIC0 (PDM0), 1=DMIC1 (PDM1).
      Used by SOF to fetch the device for a given DAI index.
