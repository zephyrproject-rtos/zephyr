description: Test var-uint64 property type

compatible: "vnd,var-uint64-holder"

include: [base.yaml]

properties:
  val-32:
    type: var-uint64
    description: 1-cell (32-bit) var-uint64 value

  val-64:
    type: var-uint64
    description: 2-cell (64-bit) var-uint64 value

  val-with-default:
    type: var-uint64
    default: 42
    description: var-uint64 with a default; omitted from DTS to exercise the default path

  val-with-or:
    type: var-uint64
    description: var-uint64 with no default; omitted from DTS to exercise DT_PROP_OR fallback
