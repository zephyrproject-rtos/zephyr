description: Nuvoton, NPCX Host Sub-Modules container node with child devices

compatible: "nuvoton,npcx-host-sub-v2"

include: [base.yaml]

properties:
  "#address-cells":
    type: int
    const: 1

  "#size-cells":
    type: int
    const: 1

  host-acc-wui:
    type: phandle
    required: true
    description: |
      Mapping table between Wake-Up Input (WUI) and any legacy host
      access transactions.

      For example the WUI mapping on NPCX7 would be
         host-acc-wui = <&wui_host_acc>;

child-binding:
  description: Host sub-module child node
