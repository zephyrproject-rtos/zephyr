# Properties for Power Management (PM)

properties:
  wakeup-source:
    type: boolean
    description: |
      Property to identify that a device can be used as wake up source.

      When this property is provided a specific flag is set into the
      device that tells the system that the device is capable of
      wake up the system.

      Wake up capable devices are disabled (interruptions will not wake up
      the system) by default but they can be enabled at runtime if necessary.

  zephyr,pm-device-runtime-auto:
    type: boolean
    description: |
      Automatically configure the device for runtime power management after the
      init function runs.

  zephyr,disabling-power-states:
    type: phandles
    description: |
      List of power states that will disable this device power.

  zephyr,wakeup-disabling-power-states:
    type: phandles
    description: |
      List of power states this device cannot wake the system from, even when
      it is enabled as a wake up source.

      Absent, the device can wake the system from every state, which is what
      pm_device_wakeup_enable() has always meant, so nothing changes for a node
      that does not use this property.

      zephyr,disabling-power-states already implies this for the states it
      names: a device that has lost its power cannot wake the system.
      pm_device_wakeup_is_capable_from_state() reads both properties, so only
      the states missed by that rule need listing here: a state that keeps the
      device powered but that it still cannot wake from, for instance because
      the clock it counts from is not running there.
