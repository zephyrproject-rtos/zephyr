description: |
  STM32WBA 2.4 GHz radio.
  This device groups protocol frontends implemented on top of the same radio IP.

compatible: "st,stm32wba-radio"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true
    # Do not set min-len/max-len due to DT parsing process issues.
    # Rely on interrupt-names for the consistency.

  interrupt-names:
    required: true
    enum: ["radio", "radio-sw-low"]
    min-len: 2
    max-len: 2
