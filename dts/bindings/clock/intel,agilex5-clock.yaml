description: Agilex5 clock controller node

compatible: "intel,agilex5-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  sysmgr:
    type: phandle
    required: true
    description: phandle to the syscon node backing sysmgr registers

  "#clock-cells":
    const: 1

clock-cells:
  - clkid
