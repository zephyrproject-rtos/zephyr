title: Rockchip RK3588 CRU Clock Controller

description: |
  Clock controller for the Rockchip RK3588 CRU. Clock IDs are defined
  in include/zephyr/dt-bindings/clock/rk3588-cru.h.

compatible: "rockchip,rk3588-cru-clk"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 1

  clocks:
    description: |
      Optional external input clocks wired to CRU mux inputs (for example,
      fixed-clock nodes providing external GMAC PTP reference clocks).

  clock-names:
    description: |
      Names of optional external input clocks. Supported names are
      "clk_gmac0_ptpref_io" and "clk_gmac1_ptpref_io".

clock-cells:
  - clkid
