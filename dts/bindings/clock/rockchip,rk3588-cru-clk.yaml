title: Rockchip RK3588 CRU Clock Controller

description: |
  Clock controller for the Rockchip RK3588 CRU. It gates the peripheral clocks
  and selects the divider and parent of the ComboPHY0 reference clock. Clock IDs
  are defined in include/zephyr/dt-bindings/clock/rk3588-cru.h.

compatible: "rockchip,rk3588-cru-clk"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 1

clock-cells:
  - clkid
