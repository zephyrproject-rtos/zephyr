description: |
  STM32H7 main PLL.

  It can be used to describe 3 different PLLs: PLL1 (Main PLL), PLL2 and PLL3.
  Only PLL1 and PLL3 are supported for now.

  These PLLs could take one of clk_hse, clk_hsi or clk_csi as input clock, with
  an input frequency from 1 to 16 MHz. PLLM factor is used to set the input
  clock in this acceptable range.

  Each PLL can have up to 3 output clocks and for each output clock, the
  frequency can be computed with the following formulae:

    f(PLL_Px) = f(VCOx clock) / PLLPx   -> pllx_p_ck ((pll1_p_ck : sys_ck))
    f(PLL_Qx) = f(VCOx clock) / PLLQx   -> pllx_q_ck
    f(PLL_Rx) = f(VCOx clock) / PLLRx   -> pllx_r_ck

      with f(VCOx clock) = f(REFx_CK) × (PLLNx / PLLMx)

  The maximum PLL output frequency is device-dependent.
  Refer to your product's Reference Manual and Data Sheet for more details.

compatible: "st,stm32h7-pll-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 0

  clocks:
    required: true

  div-m:
    type: int
    required: true
    description: |
        Division factor for PLLx
        input clock
    min: 1
    max: 63

  mul-n:
    type: int
    required: true
    description: |
        Main PLL multiplication factor for VCOx
    min: 4
    max: 512

  div-p:
    type: int
    description: |
        PLL division factor for pllx_p_ck
        Note: For PLL1, P division factor must be 1 or even.
    min: 1
    max: 128

  div-q:
    type: int
    description: |
        PLL division factor for pllx_q_ck
    min: 1
    max: 128

  div-r:
    type: int
    description: |
        PLL division factor for pllx_r_ck
    min: 1
    max: 128

  fracn:
    type: int
    description: |
        PLLx FRACN value
    min: 0
    max: 8191

  no-auto-enable:
    type: boolean
    description: |
      Configure the PLL but do not enable it.

      The clock control driver programs the PLL source, dividers,
      multiplier and output enables at boot and on every exit from
      low-power modes, but leaves the PLL disabled. The application is
      responsible for enabling and disabling the PLL, and for keeping
      the voltage scale, flash latency and every clock derived from
      the PLL outputs within specification while doing so.

      Until the application enables the PLL, its outputs are stopped
      and peripherals clocked from them do not operate.

      A PLL with this property cannot be the system clock source.
      Not supported on dual-core SoCs.
