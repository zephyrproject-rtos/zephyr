description: Analog Devices AXI Clock Generator (MMCM wrapper)

compatible: "adi,axi-clkgen"

include: [base.yaml, clock-controller.yaml]

properties:
  reg:
    required: true

  adi,parent-clock-hz:
    type: int
    required: true
    description: Input clock frequency in Hz

  "#clock-cells":
    const: 0
