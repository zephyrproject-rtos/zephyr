description: Generic fixed-rate clock provider

compatible: "fixed-clock"

include: [base.yaml, clock-controller.yaml]

properties:
  clock-frequency:
    type: int
    description: output clock frequency (Hz)
    required: true

  startup-time-us:
    type: int
    description: |
      Oscillator or clock source startup time in microseconds.

      Useful for physical oscillators (crystal or RC) where consumers must
      wait after enabling before the clock is stable.

  "#clock-cells":
    const: 0
