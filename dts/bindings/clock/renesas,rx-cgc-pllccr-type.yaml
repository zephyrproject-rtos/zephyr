description: Renesas RX Clock Generation Circuit PLLCCR

compatible: "renesas,rx-cgc-pllccr-type"

include: [clock-controller.yaml, base.yaml]

properties:
  freq:
    type: int

  div:
    required: true
    type: int

  mul:
    type: array
    description: |
      Multiple to calculate the PLL frequency from the input clock frequency
      This array type is used for FSP configuration to set values into register.
      It contains both the integer and the fractional part.
      Note: for PLL child node (P, Q, R), the multiple should be set to <1 0>.

  "#clock-cells":
    const: 0
