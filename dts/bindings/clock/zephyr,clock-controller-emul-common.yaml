description: Clock controller emulation

include: [clock-controller.yaml, base.yaml]

properties:
  clock-ids:
    type: array
    description: |
      Clock identifiers supported by the controller. Each identifier consists
      of #clock-cells values, laid out in the same order as the clock-cells
      of a clocks phandle-array entry. How those cells reach the driver as a
      clock_control_subsys_t is described by each compatible.

  clock-initial-values:
    type: array
    description: Initial rate in Hz for each identifier in clock-ids.

  loose-check:
    type: boolean
    description: |
      A flag indicating not to check the validity of the operation (for example,
      the presence or absence of a clock ID) and not return an error response.
