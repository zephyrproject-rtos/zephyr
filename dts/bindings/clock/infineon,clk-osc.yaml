title: Infineon Clock Oscillators

description: Infineon Clock source Oscillators

compatible: "infineon,clk-osc"

include: [base.yaml, fixed-clock.yaml]

properties:
  reg:
    required: true

  eco-load-capacitance-pf:
    type: int
    description: Crystal load capacitance in picofarads.

  eco-esr-ohms:
    type: int
    description: Crystal equivalent series resistance in ohms.

  eco-drive-level-uw:
    type: int
    description: Crystal maximum drive level in microwatts.
