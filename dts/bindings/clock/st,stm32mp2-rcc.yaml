description: |
  STM32MP2 RCC (Reset and Clock controller).

  On STM32MP2 platforms, the clock tree is configured by the Cortex-A35 core.
  As a consequence, the only property to be set in devicetree node is the
  clock-frequency.

  As for the peripherals, the clocks are configured per peripheral in the
  corresponding device tree node. The clock controller is responsible for
  enabling/disabling the clocks for the peripherals, when allowed by the
  Resource Isolation Framework(RIF) peripheral, configured by the cortex-A35
  core.

  To declare a peripheral "PERx" clock in the dtsi, you can follow the example
  below, where the second entry is the clock crossbar (flexgen) channel that
  feeds the peripheral kernel clock. Declaring it lets the clock controller
  resolve the peripheral rate without any peripheral-specific code:
    PERx {
      ...
      clocks = <&rcc STM32_CLOCK(PERx, STM32_CLK)>,
               <&rcc STM32_SRC_FLEXGEN(12) NO_SEL>;
      ...
    };

  Beware that the channel mapping depends on the SoC derivative.

  Other clock sources (bus clocks, oscillators, PLL outputs) can be referenced
  the same way to query their rate through clock_control_get_rate(). All these
  entries are read-only: the clock tree is owned by the Cortex-A35, so they can
  neither be gated nor re-routed.

compatible: "st,stm32mp2-rcc"

include:
  - name: st,stm32-rcc.yaml
    property-blocklist:
      - ahb-prescaler
      - apb1-prescaler
      - apb2-prescaler
      - undershoot-prevention
