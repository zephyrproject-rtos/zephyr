title: STM32G5 RCC (Reset and Clock controller).

description: |
  This node controls system clock source selection and AHB/APB domain clocks
  on STM32G5 series MCUs.

  Refer to st,stm32-rcc.yaml for common RCC properties.

compatible: "st,stm32g5-rcc"

include:
  - name: st,stm32-rcc.yaml
    property-blocklist:
      - undershoot-prevention

properties:
  apb3-prescaler:
    type: int
    required: true
    enum:
      - 1
      - 2
      - 4
      - 8
      - 16
