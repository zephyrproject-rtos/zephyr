title: TI BQ25896 USB OTG boost regulator

description: |
  USB OTG boost regulator of the TI BQ25896, described as a child node of
  the "ti,bq25896" node. The current limits are 0.5 A, 0.75 A, 1.2 A,
  1.4 A, 1.65 A, 1.875 A and 2.15 A.

  Boost mode also needs the OTG pin of the device to be high.

compatible: "ti,bq25896-regulator"

include: ti,bq2589x-regulator-common.yaml

examples:
  - |
    bq25896@6b {
      compatible = "ti,bq25896";
      reg = <0x6b>;

      usb_otg_vbus: regulator {
        compatible = "ti,bq25896-regulator";
        regulator-init-microvolt = <4998000>;
        regulator-init-microamp = <500000>;
      };
    };
