description: |
  Broadcom BCM2712 SD host controller. Main-bank SDIO pins may be configured
  through pinctrl. Dedicated EMMC pads used by the SD card slot are not
  covered by the BCM2712 pinctrl driver and must retain the boot firmware
  configuration.

compatible: "brcm,bcm2712-sdhci"

include: [sdhc.yaml, pinctrl-device.yaml]

properties:
  sd-uhs-sdr50:
    type: boolean
    description: |
      The board supports SD UHS-I SDR50 signalling at 1.8 V. Drivers that
      implement this property may enable SDR50 when the host and card support it.

  sd-uhs-sdr104:
    type: boolean
    description: |
      The board supports SD UHS-I SDR104 signalling at 1.8 V. Drivers that
      implement this property may enable SDR104 when the host and card support it.

  no-1-8-v:
    type: boolean
    description: |
      The board does not support 1.8 V signalling, even if the host does.
      This property takes precedence over SD UHS capability properties.

  bus-width:
    type: int
    required: true
    description: Number of data lines connected to the SD or SDIO device.

  reg:
    required: true

  reg-names:
    required: true
    description: SDHCI host registers followed by the Broadcom cfg registers.

  clocks:
    required: true

  non-removable:
    type: boolean
    description: Permanently connected device; no card-detect GPIO is needed.

  cd-gpios:
    type: phandle-array
    description: Card detect GPIO, required for removable cards.

  vmmc-supply:
    type: phandle
    required: true
    description: Card power regulator.

  vqmmc-supply:
    type: phandle
    description: |
      SD signalling voltage regulator; absent for fixed 3.3 V signalling.
      When provided, this supply must remain enabled independently, for example
      through regulator-always-on. The driver sets its voltage but does not
      enable or disable it.
