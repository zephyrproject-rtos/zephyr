description: |
  Broadcom BCM2712 SD host controller. The SD pin multiplexing and pad
  configuration must be initialized by the boot firmware.

compatible: "brcm,bcm2712-sdhci"

include: sdhc.yaml

properties:
  sd-uhs-sdr50:
    type: boolean
    description: |
      The board supports SD UHS-I SDR50 signalling at 1.8 V. Drivers that
      implement this property may enable SDR50 when the host and card support it.

  sd-uhs-sdr104:
    type: boolean
    description: |
      The board supports SD UHS-I SDR104 signalling at 1.8 V. Drivers that
      implement this property may enable SDR104 when the host and card support it.

  no-1-8-v:
    type: boolean
    description: |
      The board does not support 1.8 V signalling, even if the host does.
      This property takes precedence over SD UHS capability properties.

  bus-width:
    type: int
    required: true
    description: Number of SD data lines connected to the card slot.

  reg:
    required: true

  reg-names:
    required: true
    description: SDHCI host registers followed by the Broadcom cfg registers.

  clocks:
    required: true

  cd-gpios:
    type: phandle-array
    required: true
    description: Card detect GPIO, active when a card is inserted.

  vmmc-supply:
    type: phandle
    required: true
    description: Card power regulator.

  vqmmc-supply:
    type: phandle
    required: true
    description: SD signalling voltage regulator.
