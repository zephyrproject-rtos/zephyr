title: Broadcom BCM2712 SD host controller.

description: |
  Main-bank SDIO pins may be configured through pinctrl. Dedicated EMMC
  pads used by the SD card slot are not covered by the BCM2712 pinctrl
  driver and must retain the boot firmware configuration.

compatible: "brcm,bcm2712-sdhci"

include: [sdhc.yaml, pinctrl-device.yaml]

properties:
  no-1-8-v:
    type: boolean
    description: |
      Disable 1.8 V signalling on this slot, even when supported by the host.

  bus-width:
    required: true

  reg:
    required: true

  reg-names:
    required: true
    description: SDHCI host registers followed by the Broadcom cfg registers.

  clocks:
    required: true

  non-removable:
    type: boolean
    description: Permanently connected device; no card-detect GPIO is needed.

  cd-gpios:
    type: phandle-array
    description: Card detect GPIO. Without it, a removable slot assumes a card is present.

  vmmc-supply:
    type: phandle
    required: true
    description: Card power regulator.

  vqmmc-supply:
    type: phandle
    description: |
      SD signalling voltage regulator; absent for fixed 3.3 V signalling.
      When provided, this supply must remain enabled independently, for example
      through regulator-always-on. The driver sets its voltage but does not
      enable or disable it.
