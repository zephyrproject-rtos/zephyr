description: TI SDHC Controller node

compatible: "ti,cc35xx-sdhc"

include: [sdhc.yaml, pinctrl-device.yaml]

properties:
  card-always-present:
    type: boolean
    description: |
      This switch can be used with boards which do not connect
      the card detect signal to the MCU to assume card is always present.

  base-bus-freq:
    type: int
    description: |
      Base SD clock frequency generated by SDMMC module.
      Used as reference for calculating SD clock divider.

  reg:
    required: true
    description: register space
