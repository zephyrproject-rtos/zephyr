description: |
  Zephyr SDHC emulator.

  Software emulation of an SD host controller that supports SD, SDHC,
  SDXC, eMMC, and SDIO card personalities.  Intended for native_sim
  testing and CI pipelines.

compatible: "zephyr,sdhc-emul"

include: [sdhc.yaml, sdhc-emul-host.yaml, sdhc-emul-common.yaml]
