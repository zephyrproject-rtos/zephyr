description: Cadence SD Host Controller

compatible: "cdns,sdhc"

include: [sdhc.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  broken-cd:
    type: boolean
    description:
      There is no card detection available; polling must be used.

  no-1-8-v:
    type: boolean
    description: |
      When the external SD card circuit does not support 1.8V, add this
      property to disable 1.8v card voltage of SD card controller.

  has-host:
    type: boolean
    description: |
      Whether this instance exposes a separate "host" MMIO region.
