# Common fields for SD host controllers

include: base.yaml

bus: sd

properties:
  max-current-330:
    type: int
    default: 0
    description: |
      Max drive current in mA at 3.3V. A value of zero indicates no maximum
      is specified by the driver.

  max-current-300:
    type: int
    default: 0
    description: |
      Max drive current in mA at 3.0V. A value of zero indicates no maximum
      is specified by the driver.

  max-current-180:
    type: int
    default: 0
    description: |
      Max drive current in mA at 1.8V. A value of zero indicates no maximum
      is specified by the driver.

  max-bus-freq:
    type: int
    default: 400000
    description: |
      Maximum bus frequency for SD card. This should be the highest frequency
      the SDHC is capable of negotiating with cards on the bus.

  min-bus-freq:
    type: int
    default: 400000
    description: |
      Minimum bus frequency for SD card. This should be the frequency that
      cards first will select when attached to the SDHC bus

  power-delay-ms:
    type: int
    default: 500
    description: |
      time in ms for SDHC to delay when toggling power to the SD card. This
      delay gives the card time to power up or down fully

  sd-uhs-modes:
    type: string-array
    enum:
      - "sdr50"
      - "ddr50"
      - "sdr104"
    description: |
      UHS-I bus speed modes the slot supports for SD and SDIO cards. The
      host reports a mode only if it is in this list and the controller
      supports it. Without this property, the modes the controller
      supports are not restricted.

      Use this property when a mode the controller supports is not
      reliable on the board, for example on a bus that is shared between
      slots. A slot where SDR104 tuning fails can be limited to DDR50:

        sd-uhs-modes = "ddr50";

  mmc-hs200-1_8v:
    type: boolean
    description: |
      The host controller supports HS200 at 1.8V

  mmc-hs400-1_8v:
    type: boolean
    description: |
      The host controller supports HS400 at 1.8V

  mmc-hs400-enhanced-strobe:
    type: boolean
    description: |
      The host controller and board support eMMC HS400 enhanced strobe.
      This mode also requires HS400 at 1.8V and an 8-bit data bus.

  bus-width:
    type: int
    description: |
      SDHC data bus width (in bits).
    enum: [1, 4, 8]
