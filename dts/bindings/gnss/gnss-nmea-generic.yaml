description: |
  Generic GNSS NMEA receiver

  Implement a generic NMEA based GNSS device.

compatible: "gnss-nmea-generic"

include:
  - uart-device.yaml

properties:
  enable-gpios:
    type: phandle-array
    description: |
      GPIO that enables the receiver when active and puts it into standby
      when inactive. The driver asserts this signal on resume and deasserts
      it on suspend.

  reset-gpios:
    type: phandle-array
    description: |
      GPIO that resets the receiver when active. The driver pulses this
      signal during initialization. Requires reset-pulse-duration-ms.

  reset-pulse-duration-ms:
    type: int
    description: Minimum reset pulse duration in milliseconds.

  startup-time-ms:
    type: int
    default: 0
    description: |
      Time in milliseconds for the receiver to start after asserting enable-gpios.
      The driver waits this long before communicating with the receiver.
      The default preserves operation without an enable signal. Set this to
      the receiver's wake-up time when enable-gpios is used.

examples:
  - |
    &uart0 {
            current-speed = <9600>;
            /* ... */
            gnss: gnss-nmea-generic {
                    compatible = "gnss-nmea-generic";
            };
    };
