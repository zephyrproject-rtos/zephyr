description: AMD ACP External Countdown Timer

compatible: "amd,acp-timer"

include: base.yaml

properties:
  interrupts:
    required: true

  clock-frequency:
    type: int
    required: true
    description: Timer clock frequency in Hz (typically 24000000 for ACPRefClk)
