description: Renesas RH850 OS timer (OSTM)

compatible: "renesas,rh850-ostm"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    required: true
    description: |
      Frequency in Hz of the OSTM count clock (CLKC_HSB_OSTM).
