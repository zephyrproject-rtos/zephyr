description: |
  OpenRISC tick timer.

  The timer is part of the CPU rather than a memory mapped peripheral, so the
  node carries no reg. It exists so that the timer can be named by
  /chosen/zephyr,system-timer and so that its frequency can be described
  alongside the hardware.

compatible: "openrisc,tick-timer"

include: base.yaml

properties:
  clock-frequency:
    type: int
    description: |
      The clock source frequency for this timer, in Hz. This value can be used as
      the default setting for SYS_CLOCK_HW_CYCLES_PER_SEC at the SoC level.
