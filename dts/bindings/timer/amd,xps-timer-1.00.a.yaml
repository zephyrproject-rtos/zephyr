description: |
  AMD/Xilinx AXI Timer IP node.

  When used as the Zephyr system clock, the node must provide register space,
  interrupts, and a clocks phandle whose target node exposes a clock-frequency
  property.

compatible: "amd,xps-timer-1.00.a"

include: [base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true
    description: |
      Interrupt generated by the timer counter used as the Zephyr system clock
      clockevent.

  clocks:
    required: true
    description: |
      Reference to the timer input clock.

      The Zephyr system clock driver obtains the timer frequency from the
      clock-frequency property on the devicetree node referenced by this
      phandle (for example, a fixed-clock node). That property must be present
      on the clock provider node.

  xlnx,one-timer-only:
    type: int
    required: true
    enum:
      - 0
      - 1
    description: |
      0 if both timers are enabled, 1 if only the first timer is enabled.
      When used as the Zephyr system clock (CONFIG_AMD_TMRCTR), this property
      must be 0. Single-timer configurations are not supported.
