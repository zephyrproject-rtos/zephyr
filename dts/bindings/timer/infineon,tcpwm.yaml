description: Infineon TCPWM Timer

compatible: "infineon,tcpwm"

include: base.yaml

properties:
  reg:
    type: array
    required: true
    description: Register base address and size information

  interrupts:
    type: array
    description: Interrupt mapping for TCPWM instance

  resolution:
    type: int
    required: true
    description: Counter/timer resolution (16 or 32 bits)
    enum:
      - 16
      - 32

  clk-dst:
    type: int
    required: true
    description: Peripheral clock destination ID for this TCPWM instance

  index:
    type: int
    description: Index of the TCPWM channel

  clock-frequency:
    type: int
    description: |
      TCPWM peripheral clock frequency in Hz. Required on devices using
      CONFIG_CLOCK_CONTROL_IFX_PERI_CLOCK_V2, where the driver requests this
      rate from the peripheral clock controller at init. This is the
      peripheral clock feeding the counter, not the observed PWM output
      frequency.
