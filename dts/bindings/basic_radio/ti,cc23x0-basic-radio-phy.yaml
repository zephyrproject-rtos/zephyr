description: |
  Child of a "ti,cc23x0-basic-radio" node. The first child is the boot PHY;
  basic_radio_config(dev, BASIC_RADIO_CONFIG_DT(node)) selects another one.

  Example:

    phy0: phy_default {
        compatible = "ti,cc23x0-basic-radio-phy";
        ti,radio-mode = <&ti_phy_ble_gen_1_mbps>;
        frequency-hz = <2450000000>;
        sync-word = <0x930B51DE>;
        tx-power-dbm = <5>;
    };

compatible: "ti,cc23x0-basic-radio-phy"

include: basic-radio-base.yaml

properties:
  ti,radio-mode:
    type: phandle
    required: true
    description: Operating mode node of a ti,cc23x0-radio-config.