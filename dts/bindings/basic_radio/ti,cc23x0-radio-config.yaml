description: |
  TI CC23x0 radio configuration exported from SmartRF Studio.

  One node per export. It carries the complete LRF_Config the radio needs:
  microcode image names, every LRF register segment (with the register
  names as comments), software configs, TX shapes and the TX power table.
  The CC23x0 basic_radio driver builds LRF_Config from this node at compile
  time. No generated C file is involved.

  Files with this node are generated, either by a SmartRF Studio .dtsi
  export or by scripts/basic_radio/ti_radio_config_to_dtsi.py from a C export. Do not
  edit register words by hand: a waveform change requires a new export.

  Children (see ti-radio-config-base.yaml):
    - "reg-config": the register segments, in LRF_RegConfigList order.
      Words that hold addresses use TI_LRF_PTR_* tokens.
    - One node per operating mode (for example 1 Mbps / 2 Mbps / Coded in
      the BLE generic PHY).

  Applications reference a mode node from a ti,cc23x0-basic-radio-phy node
  (ti,radio-mode), never this node.

  Example:

    ti_phy_ble_gen: ble-gen {
        compatible = "ti,cc23x0-radio-config";
        ti,pbe-image = "generic";
        ti,mce-image = "ble5";
        ti,rfe-image = "ble5";
        ...
        reg-config {
            common {
                ti,words = <0x0000003F 0x0004A002 0x00000000
                            TI_LRF_PTR_TX_POWER_TABLE ...>;
            };
        };
        ti_phy_ble_gen_1_mbps: mode-1-mbps {
            ti,phy-feature = <0x0000>;
            modulation = "2-gfsk";
            datarate-bps = <1000000>;
            ...
        };
    };

compatible: "ti,cc23x0-radio-config"

include: ti-radio-config-base.yaml

properties:
  ti,pbe-image:
    type: string
    required: true
    enum: ["ble5", "ble_cs", "common", "generic", "ieee"]
    description: PBE microcode image (LRF_PBE_binary_<name>).

  ti,mce-image:
    type: string
    required: true
    enum: ["ble5", "ble_cs", "common", "genfsk", "ieee"]
    description: MCE microcode image (LRF_MCE_binary_<name>).

  ti,rfe-image:
    type: string
    required: true
    enum:
      - "ble5"
      - "ble5_nopll"
      - "ble_cs"
      - "ble_cs_nopll"
      - "coherent_pll"
      - "coherent_pll_nopll"
      - "common"
      - "common_nopll"
      - "genfsk"
      - "genfsk_nopll"
      - "ieee"
      - "ieee_nopll"
    description: RFE microcode image (LRF_RFE_binary_<name>).

  ti,len-pos:
    type: int
    description: |
      PBE_GENERIC_RAM.LENCFG.LENPOS, bit position of the length field.
      Present only in exports that use the generic PBE image, and required
      there; exports for other PBE images (for example ble5) have no LENCFG.

  ti,num-len-bits:
    type: int
    description: |
      PBE_GENERIC_RAM.LENCFG.NUMLENBITS, size of the length field in bits.
      Present and required under the same condition as ti,len-pos.

  ti,tx-power-table:
    type: array
    required: true
    description: |
      LRF TX power table, one cell per entry, sorted from lowest to highest
      power. Each cell is TI_LRF_TX_POWER(dbm, temp_coeff, ib, gain, mode).

  ti,sw-config-0:
    type: array
    description: |
      LRF_SwConfig, seven cells: rxIntFrequency rxFrequencyOffset
      txFrequencyOffset modFrequencyDeviation txShape bwIndex bwIndexDither.
      txShape is the index N of ti,tx-shape-N, or TI_LRF_NO_TX_SHAPE.
      Referenced from register segments by TI_LRF_PTR_SW_CONFIG_0.

  ti,sw-config-1:
    type: array
    description: Same as ti,sw-config-0, referenced by TI_LRF_PTR_SW_CONFIG_1.

  ti,sw-config-2:
    type: array
    description: Same as ti,sw-config-0, referenced by TI_LRF_PTR_SW_CONFIG_2.

  ti,sw-config-3:
    type: array
    description: Same as ti,sw-config-0, referenced by TI_LRF_PTR_SW_CONFIG_3.

  ti,tx-shape-0:
    type: uint8-array
    description: LRF_TxShape coefficients.

  ti,tx-shape-0-scale:
    type: int
    description: LRF_TxShape scale for ti,tx-shape-0.

  ti,tx-shape-1:
    type: uint8-array
    description: LRF_TxShape coefficients.

  ti,tx-shape-1-scale:
    type: int
    description: LRF_TxShape scale for ti,tx-shape-1.

  ti,tx-shape-2:
    type: uint8-array
    description: LRF_TxShape coefficients.

  ti,tx-shape-2-scale:
    type: int
    description: LRF_TxShape scale for ti,tx-shape-2.

  ti,tx-shape-3:
    type: uint8-array
    description: LRF_TxShape coefficients.

  ti,tx-shape-3-scale:
    type: int
    description: LRF_TxShape scale for ti,tx-shape-3.

