description: |
  The node instantiates the radio device and holds its PHYs as child nodes
  with compatible "ti,cc23x0-basic-radio-phy". At least one child is required;
  the first child in DT source order is the boot PHY. The application
  selects another child at runtime with
  basic_radio_config(dev, BASIC_RADIO_CONFIG_DT(node)).

compatible: "ti,cc23x0-basic-radio"