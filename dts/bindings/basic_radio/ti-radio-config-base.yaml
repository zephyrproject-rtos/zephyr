description: |
  Children shared by the TI radio configuration bindings exported from
  SmartRF Studio (ti,cc23x0-radio-config, ti,cc140x-radio-config).

  A radio configuration node has two kinds of children:
    - Register containers. Each grandchild holds one register segment
      (ti,words) in the order the radio applies them.
    - Operating modes. Several modes can share one register configuration
      and differ only in the phyFeatures word. An export with a single
      mode has one mode child with ti,phy-feature = <0>.

child-binding:
  description: |
    Either a register container or an operating mode. Both share this
    binding, so mode properties cannot be marked required here; the driver
    checks them at build time for every mode an application references.

    Mode properties are derived from the register data by the exporter and
    describe what the radio does. They are read-only: to change them,
    export a new configuration from SmartRF Studio.
  properties:
    ti,phy-feature:
      type: int
      description: |
        Mode only (required). phyFeatures word written to the radio
        commands. Selects which feature-gated register segments are applied.
        If NO SubPHYs (like BLE 1M, 2M, Coded), then 0x000

    modulation:
      type: string
      enum:
        - "2-gfsk"
        - "4-gfsk"
        - "2-fsk"
        - "ook"
        - "msk"
        - "oqpsk"
        - "ofdm"
      description: |
        Mode only (required). Modulation scheme. The order matches
        enum basic_radio_modulation.

    datarate-bps:
      type: int
      description: |
        Mode only (required). Over-the-air bitrate in bits per second. For
        spread waveforms (O-QPSK, DSSS) this is the data rate, not the chip
        rate.

    deviation-hz:
      type: int
      description: Mode only. FSK / GFSK frequency deviation in Hz.

    frequency-min-hz:
      type: int
      description: Mode only (required). Lowest characterized carrier frequency in Hz.

    frequency-max-hz:
      type: int
      description: Mode only (required). Highest characterized carrier frequency in Hz.

    crc-enable:
      type: boolean
      description: Mode only. The PHY generates and checks a hardware CRC.

    variable-length:
      type: boolean
      description: Mode only. Frames carry an explicit length field.

  child-binding:
    description: One register segment (LRF_ConfigWord array), child of a register container.
    properties:
      ti,words:
        type: array
        required: true
        description: |
          Segment header word followed by region headers and values.
