# SPDX-License-Identifier: Apache-2.0

description: |
  Original Erbium integration of the Nekko Shakti UART, with 32-bit accesses
  at eight-byte intervals, InterruptEn at 0x30 and Rx_Threshold at 0x40.
  This layout is also implemented by the et-platform functional simulator.
  It differs from the later Erbium UART with separate interrupt raw, enable
  and status registers at 0x48, 0x50 and 0x58.

  Register documentation for this revision:
  https://github.com/openhwfoundation/core-et-erbium/blob/325b32b7efaa2c2ab9c91001c89d3f49a4740826/doc/uart.md

compatible: "aifoundry,shakti-uart-v1"

include: uart-controller.yaml

properties:
  reg:
    required: true

  clock-frequency:
    required: true

  current-speed:
    required: true

  parity:
    const: "none"

  stop-bits:
    const: "1"

  data-bits:
    const: 8
