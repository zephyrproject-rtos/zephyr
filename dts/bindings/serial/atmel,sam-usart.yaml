description: Atmel SAM family USART

compatible: "atmel,sam-usart"

include:
  - name: uart-controller.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  atmel,rs485-mode:
    type: boolean
    description: |
      RS-485 mode: RTS is driven high while the USART transmits, to enable the
      driver of an external RS-485 transceiver. RTS has to be assigned in
      pinctrl. Must not be combined with hw-flow-control.
