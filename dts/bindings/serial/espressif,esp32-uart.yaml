description: ESP32 UART

compatible: "espressif,esp32-uart"

include: [uart-controller.yaml, uart-controller-pin-inversion.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  stop-bits:
    description: |
      Sets the number of stop bits. Defaults to standard of 1 if not specified.
    default: "1"

  data-bits:
    description: |
      Sets the number of data bits. Defaults to standard of 8 if not specified.
    default: 8

  hw-rs485-hd-mode:
    type: boolean
    description: |
      Enable the hardware RS485 half duplex mode.
      Overrides hw-flow-control if both are set.
      Using this mode, the pin assigned to DTR
      is asserted during transmission.

  rx-fifo-threshold:
    type: int
    min: 1
    max: 127
    description: |
      Number of bytes in the RX FIFO that raises the RX FIFO full interrupt.
      A low value reports received bytes to the interrupt-driven API without
      waiting for the RX timeout, at the cost of more interrupts.
      When not set, the deprecated CONFIG_UART_ESP32_RX_FIFO_THRESH value is
      used.

  tx-fifo-threshold:
    type: int
    min: 1
    max: 127
    description: |
      Number of bytes in the TX FIFO at or below which the TX FIFO empty
      interrupt is raised.
      When not set, the deprecated CONFIG_UART_ESP32_TX_FIFO_THRESH value is
      used.

  rx-timeout:
    type: int
    default: 22
    min: 1
    max: 255
    description: |
      RX line idle time, in character times, after which the bytes held in the
      RX FIFO are reported to the interrupt-driven API even when fewer than
      rx-fifo-threshold bytes were received. The default keeps RX interrupts
      infrequent on ports that receive continuous data. Protocols that end a
      frame on line idle time, such as Modbus RTU, need a value below their
      inter-frame gap. Values above the hardware limit for the current frame
      format are clamped to that limit.

  uhci-slip-tx:
    type: boolean
    description: |
      Enable SLIP encoding on TX when using UART with DMA (async API).
      When enabled, the UHCI hardware automatically encodes transmitted data
      using SLIP framing (0xC0 -> 0xDB 0xDC, 0xDB -> 0xDB 0xDD).
      Disabled by default to prevent unintended data corruption.

  uhci-slip-rx:
    type: boolean
    description: |
      Enable SLIP decoding on RX when using UART with DMA (async API).
      When enabled, the UHCI hardware automatically decodes received data
      using SLIP framing (0xDB 0xDC -> 0xC0, 0xDB 0xDD -> 0xDB).
      Disabled by default to prevent unintended data corruption.
