description: |
  ABOV32 USART controller. The IP block supports asynchronous (UART),
  synchronous, and SPI communication modes.

compatible: "abov,abov32-usart"

include: [uart-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
