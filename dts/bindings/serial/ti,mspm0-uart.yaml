description: TI MSPM0 UART

compatible: "ti,mspm0-uart"

include: [uart-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clk-div:
    type: int
    default: 1
    enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
    description: |
      Clock divider selection value.

  rx-fifo-threshold:
    type: int
    default: 2
    enum: [0, 1, 2, 3, 4]
    description: |
     0 - MSPM0_UART_RX_FIFO_LEVEL_ONE_ENTRY
     1 - MSPM0_UART_RX_FIFO_LEVEL_1_4_FULL
     2 - MSPM0_UART_RX_FIFO_LEVEL_1_2_FULL
     3 - MSPM0_UART_RX_FIFO_LEVEL_3_4_FULL
     4 - MSPM0_UART_RX_FIFO_LEVEL_FULL

  tx-fifo-threshold:
    type: int
    default: 4
    enum: [0, 1, 2, 3, 4]
    description: |
      0 - MSPM0_UART_TX_FIFO_LEVEL_ONE_ENTRY
      1 - MSPM0_UART_TX_FIFO_LEVEL_1_4_EMPTY
      2 - MSPM0_UART_TX_FIFO_LEVEL_1_2_EMPTY
      3 - MSPM0_UART_TX_FIFO_LEVEL_3_4_EMPTY
      4 - MSPM0_UART_TX_FIFO_LEVEL_EMPTY

  is-unicomm-uart:
    type: boolean
    description: |
      Enables UNICOMMUART support.
