include: [uart-controller.yaml, pinctrl-device.yaml, nordic-clockpin.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  disable-rx:
    type: boolean
    description: |
      Disable UART reception capabilities (only required to disable reception
      if CONFIG_PINCTRL is enabled).

  current-speed:
    type: int
    required: true
    description: |
      Initial baud rate setting for UART.

  current-speed-is-enum:
    type: boolean
    description: |
      Baudrate setting is treated as an enum with following values:
      - 1200
      - 2400
      - 4800
      - 9600
      - 14400
      - 19200
      - 28800
      - 31250
      - 38400
      - 56000
      - 57600
      - 76800
      - 115200
      - 230400
      - 250000
      - 460800
      - 921600
      - 1000000
      - 2000000
      - 4000000
      - 8000000
