description: UART Emulator

compatible: "zephyr,uart-emul"

include: uart-controller.yaml

properties:
  tx-fifo-size:
    type: int
    default: 256
    description: |
      Size of the virtual UART TX FIFO

  rx-fifo-size:
    type: int
    default: 256
    description: |
      Size of the virtual UART RX FIFO

  loopback:
    type: boolean
    description: |
      Connects TX to RX internally creating a loop back connection. Useful
      for testing.

  latch-buffer-size:
    type: int
    default: 1
    description: |
      Size of the virtual UART latch buffer.

  supported-modes:
    type: string-array
    enum:
      - "polling"
      - "interrupt-driven"
      - "async"
    default: ["polling", "interrupt-driven", "async"]
    description: |
      Modes of the UART API the emulator supports, the interrupt-driven and asynchronous ones when
      their Kconfig options are enabled. Leaving one out emulates a UART driver that does not
      implement it: its operations are missing, as with such a driver. Polling, which every UART
      driver implements, is always supported, so "polling" alone emulates a UART with polling
      only.
