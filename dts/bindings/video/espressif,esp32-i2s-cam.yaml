title: ESP32 I2S camera interface

description: |
  Captures 8-bit parallel (DVP) camera data with the ESP32 I2S0 peripheral in
  camera slave mode.

  D0-D7, HREF and PCLK are routed with pinctrl to the I2S0I_DATA_IN0-7,
  I2S0I_H_ENABLE and I2S0I_WS_IN signals. VSYNC is read as a GPIO interrupt
  that delimits frames. The sensor clock (XCLK) is generated by a PWM channel.

  Camera mode is only available on I2S0. A board uses it by overriding the
  compatible of the i2s0 node.

  Example:

    &i2s0 {
      compatible = "espressif,esp32-i2s-cam";
      status = "okay";
      pinctrl-0 = <&i2s0_cam_default>;
      pinctrl-names = "default";
      pwms = <&ledc0 8 PWM_HZ(10000000) PWM_POLARITY_NORMAL>;
      vsync-gpios = <&gpio0 25 GPIO_ACTIVE_HIGH>;

      port {
        i2s0_ep_in: endpoint {
          remote-endpoint-label = "ov2640_ep_out";
        };
      };
    };

compatible: "espressif,esp32-i2s-cam"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  unit:
    type: int
    const: 0
    description: I2S unit number. Camera mode is only available on I2S0.

  pwms:
    type: phandle-array
    required: true
    description: |
      PWM channel generating the sensor clock (XCLK). The period sets the
      XCLK frequency, the duty cycle is 50%.

  vsync-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO connected to the sensor VSYNC output. The capture of a frame
      starts on the edge to the inactive level.

child-binding:
  child-binding:
    include: video-interfaces.yaml
