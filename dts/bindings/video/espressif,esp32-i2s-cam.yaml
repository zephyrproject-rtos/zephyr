title: ESP32 I2S camera interface

description: |
  Camera slave mode of the ESP32 I2S0 controller, which captures 8-bit
  parallel (DVP) camera data.

  The node is a child of the I2S0 controller node and shares its registers,
  clock and interrupt. The controller is either an audio interface or a
  camera interface, so this node is enabled while the I2S0 controller node
  stays disabled. Only I2S0 supports camera mode, I2S1 has no such node.

  D0-D7, HREF and PCLK are routed with pinctrl to the I2S0I_DATA_IN0-7,
  I2S0I_H_ENABLE and I2S0I_WS_IN signals. VSYNC is read as a GPIO interrupt
  that delimits frames.

  The controller samples pixel clocks up to about 15 MHz. The sensor keeps
  its pixel clock within that limit when its endpoint lists the limit in
  link-frequencies. The sensor clock is not generated by the controller, a
  pwm-clock node referenced by the sensor provides it.

compatible: "espressif,esp32-i2s-cam"

include: [base.yaml, pinctrl-device.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  vsync-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO connected to the sensor VSYNC output. The capture of a frame
      starts on the edge to the inactive level.

child-binding:
  child-binding:
    include: video-interfaces.yaml

examples:
  - |
    &i2s0_cam {
        status = "okay";
        pinctrl-0 = <&i2s0_cam_default>;
        pinctrl-names = "default";
        vsync-gpios = <&gpio0 25 GPIO_ACTIVE_HIGH>;

        port {
            i2s0_ep_in: endpoint {
                remote-endpoint-label = "gc2145_ep_out";
            };
        };
    };
