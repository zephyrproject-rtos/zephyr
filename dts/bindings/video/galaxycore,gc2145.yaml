description: |
  Galaxy Core GC2145 CMOS video sensor

  The frame interval is set by dividing the sensor clock, which divides the
  pixel clock by the same factor. On the parallel bus the receiver selects
  the fastest pixel clock it can sample as the link frequency. Both need the
  rate of the input clock, which is read from the clock controller referenced
  by clocks.

compatible: "galaxycore,gc2145"

include: i2c-device.yaml

properties:
  reset-gpios:
    type: phandle-array
    description: |
      The RESETn pin is asserted to disable the sensor causing a hard
      reset.  The sensor receives this as an active-low signal.
  pwdn-gpios:
    type: phandle-array
    description: |
      The PWDN pin is asserted to power down the sensor. The sensor
      receives this as an active high signal
  clocks:
    description: |
      Input clock of the sensor (MCLK). It is enabled before the sensor is
      probed, and its rate is read from the clock controller to compute the
      frame intervals.

child-binding:
  child-binding:
    include: video-interfaces.yaml
