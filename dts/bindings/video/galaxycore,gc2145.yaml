description: |
  Galaxy Core GC2145 CMOS video sensor

  The frame interval is set by dividing the sensor clock, which divides the
  pixel clock by the same factor. When the endpoint of the sensor lists
  link-frequencies, the pixel clock of the parallel bus is kept at or below
  the highest listed frequency. Both need the input clock frequency given
  by the clock-frequency property of the node referenced by clocks.

compatible: "galaxycore,gc2145"

include: i2c-device.yaml

properties:
  reset-gpios:
    type: phandle-array
    description: |
      The RESETn pin is asserted to disable the sensor causing a hard
      reset.  The sensor receives this as an active-low signal.
  pwdn-gpios:
    type: phandle-array
    description: |
      The PWDN pin is asserted to power down the sensor. The sensor
      receives this as an active high signal
  clocks:
    description: |
      Input clock of the sensor (MCLK). It is enabled before the sensor is
      probed, and the clock-frequency property of the clock node gives the
      input clock frequency from which the frame intervals are computed.

child-binding:
  child-binding:
    include: video-interfaces.yaml
