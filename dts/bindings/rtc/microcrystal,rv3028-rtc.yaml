description: Micro Crystal RV3028 RTC, periodic time update, alarm device and timestamp feature

compatible: "microcrystal,rv3028-rtc"

include: rtc-device.yaml

properties:
  timestamp-edge-detection:
    type: string
    enum:
      - "falling"
      - "rising"
    default: "falling"
    description: |
      Edge selection for timestamp events on the EVI pin. If omitted, the
      driver uses falling-edge detection.

  timestamp-filtering:
    type: string
    enum:
      - "no"
      - "256Hz"
      - "64Hz"
      - "8Hz"
    default: "no"
    description: |
      Digital filter setting for the EVI pin. If omitted, no digital filtering
      is used.

  timestamp-overwrite:
    type: string
    enum:
      - "first"
      - "last"
    default: "first"
    description: |
      Controls whether timestamp registers are overwritten when another event
      occurs before software reads the previous timestamp. The timestamp count
      register continues counting events independently of this setting.

      first - The timestamp of the first event is recorded
      last - The timestamp of the last event is recorded

  timestamp-source-backup:
    type: boolean
    description: |
      Automatic backup switchover is selected as timestamp source.
      A timestamp is generated and an interrupt is issued when the
      circuit goes to VBACKUP power state. Otherwise the source is
      the external EVI pin.

examples:
  - |
    /* Example node for an RV3028 RTC on the i2c0 bus. */
    &i2c0 {
      status = "okay";
      clock-frequency = <I2C_BITRATE_STANDARD>;

      rv3028: rv3028@52 {
        compatible = "microcrystal,rv3028";
        reg = <0x52>;
        int-gpios = <&gpiob 7 (GPIO_PULL_UP | GPIO_ACTIVE_LOW)>;
        backup-switch-mode = "disabled";
        status = "okay";

        rv3028_rtc: rtc {
          compatible = "microcrystal,rv3028-rtc";
          timestamp-edge-detection = "rising";
          timestamp-filtering = "256Hz";
          timestamp-source-backup;
          timestamp-overwrite = "last";
          status = "okay";
        };
      };
    };
