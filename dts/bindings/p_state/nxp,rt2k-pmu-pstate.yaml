description: |
  NXP RT2K PMU performance state (pstate): one of the run modes the PMU and the
  power controller switch between.

compatible: "nxp,rt2k-pmu-pstate"

include:
  - "zephyr,pstate.yaml"

properties:
  load-threshold:
    required: true

  cpu-frequency-level:
    type: string
    required: true
    enum:
      - low-leakage-run
      - normal-run
      - high-performance-run
    description: |
      Run mode of this performance state: Low Leakage Run, Normal Run or
      High Performance Run.
