description: Ameba Ledc

compatible: "realtek,ameba-ledc"

include: [base.yaml, pinctrl-device.yaml, led-strip.yaml]

# The timing properties below are raw LEDC register counts of the 40 MHz
# LEDC clock (25 ns per count), not nanoseconds.

properties:

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  output-rgb-mode:
    type: int
    required: true
    description: |
      LEDC output byte order selector (LED_RGB_MODE register field). Keep this
      at 0 (identity); the on-wire color order is set with color-mapping.

  wait-data-timeout:
    type: int
    required: true
    description: |
      Time the LEDC waits for new FIFO data before raising a wait-data
      timeout. Wait time = 25 ns * (N + 1), N in 0..0x7fff.

  data-tx-time0h:
    type: int
    required: true
    description: High time of a 0 code. Time = 25 ns * N, N > 0.

  data-tx-time0l:
    type: int
    required: true
    description: Low time of a 0 code. Time = 25 ns * N, N > 0.

  data-tx-time1h:
    type: int
    required: true
    description: High time of a 1 code. Time = 25 ns * N, N > 0.

  data-tx-time1l:
    type: int
    required: true
    description: Low time of a 1 code. Time = 25 ns * N, N > 0.

  refresh-time:
    type: int
    required: true
    description: |
      Reset (latch) low time sent after a frame.
      Reset time = 25 ns * (N + 1), N in 0..0x3fff.
