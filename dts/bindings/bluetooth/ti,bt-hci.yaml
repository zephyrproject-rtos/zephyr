# TI Internal Bluetooth HCI device (integrated SoC controller)

include: bt-hci.yaml

description: Bluetooth HCI provided by internal TI SoC controller

compatible: "ti,bt-hci"

properties:
  bt-hci-name:
    default: "TI BT HCI"
  bt-hci-bus:
    default: "virtual"
  bt-hci-quirks:
    default: ["no-reset"]
