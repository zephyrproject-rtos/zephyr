# TI UART Bluetooth HCI device

include: bt-hci.yaml

description: Bluetooth HCI behind a UART device (TI)

compatible: "ti,bt-hci"

properties:
  bt-hci-name:
    default: "TI BT HCI"
  bt-hci-bus:
    default: "BT_HCI_BUS_UART"
  bt-hci-quirks:
    default: ["BT_HCI_QUIRK_NO_RESET"]
