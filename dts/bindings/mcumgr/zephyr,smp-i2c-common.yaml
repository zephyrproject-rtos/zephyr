description: |
  Properties shared by the SMP-over-I2C target (zephyr,smp-i2c) and controller
  (zephyr,smp-i2c-client) nodes. Not matched directly. Included by both.

include: i2c-device.yaml

properties:
  data-ready-gpios:
    type: phandle-array
    min-len: 1
    max-len: 1
    description: |
      Optional single GPIO signalling that an SMP response is ready. The
      target node describes the pin it drives high when a response is
      buffered. The controller node describes the pin it samples with a
      rising-edge interrupt. When omitted, the controller polls by reading the
      SMP header until it is non-zero.
