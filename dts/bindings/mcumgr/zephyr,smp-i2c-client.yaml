title: MCUmgr SMP transport over I2C (controller mode)

description: |
  Describes an MCUmgr SMP target peer connected to this I2C bus controller.
  Raw SMP packets are exchanged, with the length taken from the SMP header.
  An optional data-ready GPIO line (data-ready-gpios) can be monitored to
  signal when an SMP response is ready on the target. If omitted, the controller
  polls by reading the SMP header until it is non-zero.

compatible: "zephyr,smp-i2c-client"

include: zephyr,smp-i2c-common.yaml

examples:
  - |
    #include <zephyr/dt-bindings/gpio/gpio.h>

    &i2c0 {
        smp_i2c_client: smp-i2c-client@54 {
            compatible = "zephyr,smp-i2c-client";
            reg = <0x54>;
            data-ready-gpios = <&gpio0 15 GPIO_ACTIVE_HIGH>;
        };
    };
