title: MCUmgr SMP transport over I2C

description: |
  The device operates as an I2C target and receives raw SMP packets from an
  I2C controller. The packet length is taken from the SMP header, so nothing is
  added to the SMP data. The target optionally asserts data-ready-gpios when an
  SMP response is available for the controller to read. When data-ready-gpios
  is omitted the controller polls by reading the SMP header, and an all-zero
  header indicates that no response is ready yet.

compatible: "zephyr,smp-i2c"

include: zephyr,smp-i2c-common.yaml

examples:
  - |
    #include <zephyr/dt-bindings/gpio/gpio.h>

    &i2c0 {
        smp_i2c: smp-i2c@55 {
            compatible = "zephyr,smp-i2c";
            reg = <0x55>;
            data-ready-gpios = <&gpio0 22 GPIO_ACTIVE_HIGH>;
        };
    };
