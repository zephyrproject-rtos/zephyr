description: |
  GPIO controlled charging state and status inputs. At least one of
  ctrl-gpios or charging-gpios must be provided. Status-only devices do not
  support enabling or disabling charging through the driver.

compatible: "zephyr,charger-gpio"

properties:
  ctrl-gpios:
    type: phandle-array
    description: |
      Pin that controls the charging state. Charging is enabled when active.

  charging-gpios:
    type: phandle-array
    description: |
      Input that is active while charging. When inactive, the charger reports
      not charging unless charge-done-gpios is active.

  charge-done-gpios:
    type: phandle-array
    description: |
      Input that is active when charging is complete. Requires charging-gpios.
      If both status inputs are active, the charger reports unknown status.
