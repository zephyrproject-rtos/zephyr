description:
  NXP MIPI DSI Split controller.
  The controller's registers are split into 5 functional blocks in IP level, including
  host controller(status control), DPI interface, DBI interface, APB packet interface,
  and D-PHY. The register regions and their names shall be specified properly in device
  tree for driver to access.

compatible: "nxp,mipi-dsi-split"

include: mipi-dsi-host.yaml

properties:
  reg:
    required: true
    description:
      Register regions for the host controller, DPI interface, DBI interface,
      APB packet interface, and D-PHY.

  reg-names:
    required: true
    description:
      Names of the register regions. Must include "host", "dpi", "dbi",
      "apb", and "dphy".

  interrupts:
    required: true

  nxp,lcdif:
    type: phandle
    description:
      Instance of the LCDIF peripheral. Only required when using the MIPI
      in video mode

  dpi-pixel-packet:
    type: string
    enum:
      - "16-bit"
      - "18-bit"
      - "18-bit-loose"
      - "24-bit"
    description:
      MIPI DSI pixel packet type send through DPI interface.

  dpi-video-mode:
    type: string
    enum:
      - "non-burst-sync-pulse"
      - "non-burst-sync-event"
      - "burst"
    description:
      DPI video mode.

  dpi-bllp-mode:
    type: string
    enum:
      - "blank"
      - "null"
      - "vertical-low-power"
      - "horizontal-low-power"
      - "low-power"
    description:
      Behavior in BLLP (Blanking or Low-Power Interval). "low-power" is both
      vertical and horizontal low power combined, for compatibility with
      boards/shields written against nxp,mipi-dsi-2l's enum of the same name.

  autoinsert-eotp:
    type: boolean
    description:
      Automatically insert an EoTp short packet when switching from HS to LP mode.

  esc-rx-clock:
    type: int
    default: 200000000
    description: |
      Target D-PHY RX escape clock frequency, in Hz (DSI D-PHY spec: 100-300 MHz).
      The achieved rate is the escape-clock-source frequency divided down to the
      nearest integer divider; see esc-tx-clock for the second stage.

  esc-tx-clock:
    type: int
    default: 20000000
    description: |
      Target D-PHY TX escape clock frequency, in Hz (DSI D-PHY spec: 12-20 MHz max).
      The achieved rate is esc-rx-clock's achieved frequency divided down further to
      the nearest integer divider.

  continuous-hs-clk:
    type: boolean
    description:
      Enable continuous high speed clock. Non-continuous clock mode Saves power but
      introduces latency when transitioning to high speed mode.
