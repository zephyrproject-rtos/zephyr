description: |
    STM32MP25 series MIPI DSI controller.

    On the STM32MP25 the DSI PHY reference clock and the LTDC pixel clock
    are generated by the RCC flexgen, which is configured by the Cortex-A35
    firmware. The "refclk" entry returns the DSI PHY reference clock rate
    (ck_ker_dsiphy) and the "pixelclk" entry the LTDC pixel clock rate
    (ck_ker_ltdc).

compatible: "st,stm32mp25-mipi-dsi"

include:
  - name: st,stm32-mipi-dsi.yaml
    property-blocklist:
      - lp-rx-filter
