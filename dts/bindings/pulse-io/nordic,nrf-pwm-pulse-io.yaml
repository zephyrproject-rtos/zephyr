title: nRF PWM pulse_io controller

description: |
  The nRF PWM peripheral exposed through the pulse_io API. It transmits
  CELL mode streams, one EasyDMA word per cell, on PWM_OUT0. It has
  one transmit channel, index 0, and no receive.

  Select it by overwriting the compatible of an nRF PWM node. The PWM
  driver then does not bind that instance. Route only PWM_OUT0 in the
  pinctrl states: in this mode every connected output carries the same
  waveform.

compatible: "nordic,nrf-pwm-pulse-io"

include: [base.yaml, pinctrl-device.yaml, memory-region.yaml, pulse-io-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  idleout-supported:
    type: boolean
    description: |
      Indicates if the PWM instance has the IDLEOUT register.

  "#pulse-io-cells":
    const: 1

examples:
  - |
    &pinctrl {
            pwm1_default: pwm1_default {
                    group1 {
                            psels = <NRF_PSEL(PWM_OUT0, 1, 3)>;
                    };
            };
    };

    &pwm1 {
            compatible = "nordic,nrf-pwm-pulse-io";
            status = "okay";
            #pulse-io-cells = <1>;
            pinctrl-0 = <&pwm1_default>;
            pinctrl-names = "default";
    };

    / {
            led_strip: ws2812 {
                    compatible = "worldsemi,ws2812-pulse-io";
                    pulse-ios = <&pwm1 0>;
                    chain-length = <8>;
                    color-mapping = <LED_COLOR_ID_GREEN
                                     LED_COLOR_ID_RED
                                     LED_COLOR_ID_BLUE>;
            };
    };
