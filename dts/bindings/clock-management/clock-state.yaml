compatible: "clock-state"

description: |
  Statically defined clock configuration within a clock domain. Each
  configuration should define settings for the clock nodes in the clock tree
  that this clock domain configures. Clock states must be defined as children
  of a clock-domain node.

properties:
  clocks:
    type: phandle-array
    required: true
    description: |
      Settings for clock nodes to apply when this state is selected.
  rank:
    type: int
    default: 0
    description: |
      Rank of this configuration. Lower rank values are preferred over higher
      rank values when the user requests a clock state with the best ranking.
      Defaults to 0, the highest possible rank.
