description: |
  This file needs to be included by devices that need to specify clock
  controller requests. The maximum number of requests currently defined is 5
  (clock-request-0...clock-request-4) but can be incremented if required.
  Request indices must be contiguous and start from zero, and the
  clock-request-names property must provide one name per request.
  Each clock request is a list of clock domain phandles, each followed by a
  bitmask of the clock states within that domain that are suitable for the
  request. Bit n of the mask selects the nth clock-state child of the domain,
  counted in the order the children are declared in devicetree (the rank
  property does not affect this numbering). The CLK_STATE_n macros from
  zephyr/dt-bindings/clock-management/clock-management.h can be used to
  build the mask, for example:

    clock-request-0 = <&uart_domain CLK_STATE_0>;
    clock-request-1 = <&uart_domain (CLK_STATE_0 | CLK_STATE_2)
                       &pll_domain CLK_STATE_1>;

  If multiple clock states are allowed for a given clock domain,
  the lowest rank state will be selected. If other clock consumers
  have outstanding requests on a given clock domain, these requests
  will be considered when selecting the best clock state for that domain.
properties:
  clock-outputs:
    type: phandles
    description: Output clock sources

  clock-output-names:
    type: string-array
    description: |
      Names for clock outputs. The number of names needs to match the number
      of output clock sources.

  clock-request-0:
    type: phandle-array
    specifier-space: clock-state
    description: |
      Clock request/s for the first state. Each entry is a clock domain
      phandle followed by a bitmask of the clock states within that domain
      that are suitable for this request.

  clock-request-0-locking:
    type: boolean
    description: |
       Set if the clock request for the first state should "lock" the clocks
       it affects. If set, the clock domains referenced by this request, and
       the clock nodes configured by the states selected within those domains,
       will deny reconfiguration attempts from other consumers until this
       consumer switches to a different request.

  clock-request-1:
    type: phandle-array
    specifier-space: clock-state
    description: |
      Clock configuration/s for the second state. See clock-request-0.

  clock-request-1-locking:
    type: boolean
    description: |
      Clock lock setting for the second state. See clock-request-0-locking.

  clock-request-2:
    type: phandle-array
    specifier-space: clock-state
    description: |
      Clock configuration/s for the third state. See clock-request-0.

  clock-request-2-locking:
    type: boolean
    description: |
      Clock lock setting for the third state. See clock-request-0-locking.

  clock-request-3:
    type: phandle-array
    specifier-space: clock-state
    description: |
      Clock configuration/s for the fourth state. See clock-request-0.

  clock-request-3-locking:
    type: boolean
    description: |
      Clock lock setting for the fourth state. See clock-request-0-locking.

  clock-request-4:
    type: phandle-array
    specifier-space: clock-state
    description: |
      Clock configuration/s for the fifth state. See clock-request-0.

  clock-request-4-locking:
    type: boolean
    description: |
      Clock lock setting for the fifth state. See clock-request-0-locking.

  clock-request-names:
    type: string-array
    description: |
      Names for the clock requests, one per clock-request-<i> property, in
      index order. Each name is converted to a C identifier named
      CLOCK_MANAGEMENT_STATE_<NAME>, where <NAME> is the uppercased name with
      non-alphanumeric characters replaced by underscores. Drivers pass this
      identifier to clock_management_request_state(). The names "default"
      and "sleep" map to the standard identifiers
      CLOCK_MANAGEMENT_STATE_DEFAULT and CLOCK_MANAGEMENT_STATE_SLEEP; any
      other name requires the driver to define the matching identifier,
      starting from CLOCK_MANAGEMENT_STATE_PRIV_START.
