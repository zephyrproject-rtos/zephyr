description: |
  ADI MAX32 Clock source node. This node accepts one specifier, which
  either gates the clock (when set to 0), or ungates the clock (when set to 1).
  Other specifier values may cause undefined behavior.

compatible: "adi,max32-clock-source"

include: [clock-node.yaml]

properties:
  reg:
    required: true
    description: |
      Tuple containing address of register and width of the bitfield
      to set to enable the clock source.

  offset:
    type: int
    required: true
    description: |
      Bit offset of the bitfield to set to enable the clock source.

  frequency:
    type: int
    required: true
    description: |
      Frequency this clock source provides, in Hz.

  enum:
    type: int
    required: true
    description: |
      Enum value of the clock source as defined by the MAX32 HAL.

  "#clock-cells":
    const: 1

clock-cells:
  - gate
