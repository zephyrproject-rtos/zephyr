description: |
  TI AM13E2 Input XBAR peripheral binding.

  Routes a GPIO pin (raw GPIO number, TRM Table 20-9) into one of the 28
  INPUTXBAR channels. A consumer selects the channel via the control cell.

  The trailing mux-states cell is packed with
  AM13E2_XBAR_IN_STATE(pin, raw) from
  <zephyr/dt-bindings/mux/ti_am13e2_xbar_in.h> - each GPIO's signal
  reaches the Input X-BAR through a RAW_INPUTSELECT_Pn mux. 
  raw=1 selects the raw pad signal, raw=0 (reset default) selects
  the signal after the GPIO peripheral module processes it.

  Consumers may also drive the channel at runtime with mux-controls and
  mux_control_set(dev, AM13E2_XBAR_IN_STATE(gpio_number, 1)).

compatible: "ti,am13e2-xbar-in"

include: [base.yaml, mux-controller.yaml]

properties:
  reg:
    required: true

  "#mux-control-cells":
    const: 1

  "#mux-state-cells":
    const: 2


mux-control-cells:
  - channel

mux-state-cells:
  - channel
  - pin

examples:
  - |
    #include <zephyr/dt-bindings/mux/ti_am13e2_xbar_in.h>

    &xbar1 {
            status = "okay";
    };

    my_consumer {
            mux-states = <&xbar1 CHANNEL AM13E2_XBAR_IN_STATE(GPIO_NUMBER, 1)>;
    };
  - |
    &xbar1 {
            status = "okay";
    };

    my_consumer {
            mux-controls = <&xbar1 CHANNEL>;
    };
