description: |
  Microchip SAM NAND Flash driver G1

examples:
  - |
    Example devicetree configuration:

      nand0: nandflash {
        compatible = "microchip,nand-g1-flash";
        nand-controller = <&nfc>;
        cs-gpios = <&piod 4 GPIO_ACTIVE_LOW>;
        status = "okay";
      };

compatible: "microchip,nand-g1-flash"

include:
  - name: base.yaml

properties:
  nand-controller:
    type: phandle
    required: true
    description: |
      Hold a phandle reference to the nand-controller.

  cs-gpios:
    type: phandle-array
    description: GPIO cs pin.
