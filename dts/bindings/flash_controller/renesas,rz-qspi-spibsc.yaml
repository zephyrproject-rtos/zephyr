description: |
    Renesas RZ SPIBSC NOR FLASH controller supporting the JEDEC CFI interface.

compatible: "renesas,rz-qspi-spibsc"

include: ["flash-controller.yaml", "jedec,jesd216.yaml"]

on-bus: qspi

examples:
  - |
    ext_flash_ctrl: flash-controller@0 {
      compatible = "renesas,rz-qspi-spibsc";
      reg = <0>;
      status = "okay";
      #address-cells = <1>;
      #size-cells = <1>;
      ranges = <0x0 0x20000000 DT_SIZE_M(16)>;

      at25ql128a: qspi-nor-flash@0 {
        compatible = "soc-nv-flash";
        reg = <0x0 DT_SIZE_M(16)>;
        write-block-size = <1>;
        erase-block-size = <4096>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        partitions {
          ranges;
          #address-cells = <1>;
          #size-cells = <1>;

          reserved: partition@0 {
            compatible = "zephyr,mapped-partition";
            reg = <0x00000000 0x20000>;
            read-only;
          };

          header: partition@20000 {
            label = "header";
            compatible = "zephyr,mapped-partition";
            reg = <0x00020000 0x200>;
            read-only;
          };

          slot0_partition: partition@20200 {
            label = "image-0";
            compatible = "zephyr,mapped-partition";
            reg = <0x00020200 DT_SIZE_M(4)>;
            read-only;
          };

          storage_partition: partition@420200 {
            label = "storage";
            compatible = "zephyr,mapped-partition";
            reg = <0x00420200 (DT_SIZE_M(16) - DT_SIZE_M(4) - 0x20200)>;
          };
        };
      };
    };
