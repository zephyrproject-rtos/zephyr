description: Renesas RA family flash low-power controller

compatible: "renesas,ra-flash-lp-controller"

include: base.yaml

properties:
  programming-enable:
    type: boolean
    description: |
      Enable code flash programming configuration

  command-interface:
    type: phandle
    required: true
    description: |
      Phandle to command interface node.
