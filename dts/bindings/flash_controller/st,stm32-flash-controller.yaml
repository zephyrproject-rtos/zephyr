description: STM32 Family flash controller

compatible: "st,stm32-flash-controller"

include: flash-controller.yaml

properties:
  st,rdp1-enable-byte:
    type: int
    default: 0x55
    description: |
      This property provides a byte which should used to enable non-permanent
      readout protection (RDP1). Actually, any byte except 0xAA and 0xCC
      (which are used by RDP0 and RDP2 respectively) can be used to enable
      RDP1 but in multi-image environment, some other image could check if
      RDP1 is enabled by comparing it to some hardcoded value. The byte has to
      be different than 0xAA and 0xCC.

  st,flash-latency:
    type: int
    description: |
      Flash wait-state (LATENCY) count to program directly into the flash
      controller's access control register, bypassing the VOS-only
      algorithm. Optional: when absent, flash wait-states are computed
      from VOS alone as before (unchanged behavior).

      No build-time validation is performed against HCLK or supply
      voltage: the board author is expected to have already consulted
      their exact part's reference manual wait-state table for the
      correct value given their actual HCLK and the parameters that
      govern it on their series (e.g. VDD, VCO frequency). Consult that
      table before setting this -- e.g. some parts only characterize
      their lowest voltage bands with the flash prefetch buffer disabled
      (see e.g. RM0090 Section 3.5.1 for STM32F405xx/407xx/415xx/417xx);
      CONFIG_STM32_FLASH_PREFETCH is not touched by this property.

      Useful whenever the reference manual's wait-state table cannot be
      reduced to the vendor algorithm's computation -- e.g. a board that
      runs below the nominal voltage range VOS alone assumes (level-
      shifted to match a companion SoC's logic level), or a series where
      latency depends on a factor (such as VCO frequency) the vendor
      algorithm doesn't account for.
