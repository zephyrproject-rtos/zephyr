title: Silicon Labs Series 3 EXTMEM (External Memory Interface)

description: |
  External Memory Interface on Silicon Labs Series 3 SoCs.
  This subsystem accesses and controls external serial flash memory used as the
  main off-chip program memory.

compatible: "silabs,series3-extmem"

include: base.yaml

properties:
  clock-frequency:
    type: int
    description: QSPI clock frequency (Hz).
