description: Renesas RA family flash high-performance controller

compatible: "renesas,ra-flash-hp-controller"

include: base.yaml

properties:
  programming-enable:
    type: boolean
    description: |
      Enable code flash programming configuration

  erase-value-undefined:
    type: boolean
    description: |
      Areas of flash that are in an erased state will read back undefined values.

  command-interface:
    type: phandle
    required: true
    description: |
      Phandle to command interface node.
