description: Retained register based retained memory area.

compatible: "zephyr,retained-reg"

include: base.yaml

properties:
  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  reg:
    required: true

  alignment:
    type: int
    default: 1
    enum:
      - 1
      - 4
      - 8
    description: |
      Minimal read and write operations alignment to use with the register.
      The default is a standard byte-per-byte memcpy.
