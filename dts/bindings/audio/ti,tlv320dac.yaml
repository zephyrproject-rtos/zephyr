description: Texas Instruments TLV320DAC310x Audio DAC

compatible: "ti,tlv320dac"

include: i2c-device.yaml

properties:
  reset-gpios:
    type: phandle-array

  use-volume-control-pin:
    type: boolean
    description: |
      Control the volume of the codec using the VOL/MICDET pin. This pin is
      shared with the microphone detection function, so it will not work if
      the microphone detection function is enabled.

  use-internal-pll-with-bclk:
    type: boolean
    description: |
      Use the internal PLL to generate the required clocks from BCLK.

  round-up-slot-width-for-internal-pll:
    type: boolean
    description: |
      Some SoC (like STM32) use 32 bit slots to transport 20 or 24 bit
      samples. If this is the case with your SoC, set this boolean.

  speaker-gain:
    type: int
    default: 6
    enum:
      - 6
      - 12
      - 18
      - 24
    description: |
      Sets the gain (in dB) of the speaker driver output stage.
      The reset value is 6dB.
