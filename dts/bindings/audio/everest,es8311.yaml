description: |
  Everest Semiconductor ES8311 low-power mono audio codec.

  The ES8311 is a single-chip mono ADC/DAC with an I2C control interface
  (7-bit address 0x18 or 0x19, selected by the CE pin) and an I2S/PCM audio
  data interface.

  The codec can take its internal master clock either from a dedicated MCLK
  pin or from the I2S bit clock.

  This driver supports both, selected by audio_codec_cfg.mclk_freq:

  - mclk_freq == 0 derives the master clock from BCLK. A 16-bit stereo frame is
    32 bit clocks, and register 0x02 multiplies that source by 8, giving 256 * Fs.
    The multiplier is what bounds this mode: the recommended operating conditions
    state that a source multiplied by 4 or 8 must exceed 1 MHz at 3.3 V DVDD, and
    32 * Fs clears that only from 32 kHz up. The driver cannot read DVDD, so it
    applies the 3.3 V figure and accepts this mode at 32, 44.1 and 48 kHz.
  - mclk_freq == 256 * Fs takes the clock from the MCLK pin with no multiplier,
    and serves every rate the driver lists. Any other non-zero value is rejected
    rather than ignored: it would describe a clock the part is not being given.

  Word sizes other than 16 bits are rejected in both modes: a 24-bit frame carries
  48 bit clocks and a 32-bit frame 64, and the dividers here are written for the
  32-bit-clock frame. Frames with other than two slots are rejected for the same
  reason -- the 32 * Fs figure above assumes exactly two.

  Whichever clock is named must actually be present on the pin before the codec is
  opened, and a board using the external-MCLK mode has to route MCLK.

  A wider frame is not an escape from that bound, which is worth stating because it
  is the obvious thing to try. Widening the slot to 32 bits doubles the bit clock to
  64 * Fs, and at 8 kHz that is 512 kHz: enough for the 1.8 V DVDD minimum, still
  short of the 1 MHz one that applies at 3.3 V. This driver refuses the rate in that
  mode rather than widening the frame, and offers the MCLK pin, which needs no
  multiplier at all.

  One published recommendation this driver does NOT follow, stated rather than left
  to be discovered: the recommended operating conditions ask that MCLK, LRCK and
  SCLK be present before any control register is written, and that the part
  otherwise be reset afterwards. This driver writes its control registers from
  init(), which runs at POST_KERNEL, before any application has configured an I2S
  peripheral, so no clock is running then. The remedy the note offers is not
  available either: register 0x00 does not reset the register file, and issuing it
  costs about 6.2 seconds of a capture noise floor of exactly zero, measured. What
  stands behind the deviation is measurement rather than argument -- every rate and
  route this driver advertises has been exercised on hardware, in both clock modes,
  with every control write made this way -- and measurement on a handful of boards
  is not a guarantee across process, voltage and temperature.

  This driver does not reset the codec, and there is no reset-gpios property,
  because the ES8311 has no reset pin. Its twenty pins are the I2C three, MCLK,
  SCLK, LRCK, ASDOUT, DSDIN, MIC1P/N, OUTP/N, the four supply pairs, and three
  analog filtering-capacitor pins. There is no signal to wire a reset line to.

  Nor does it issue the register-0x00 software reset that the reference drivers
  use. That reset does not do what its name suggests: RST_DIG is documented as
  "reset digital except control port block", and the control port block is where
  the registers live, so no value of 0x00 resets the register file. What it does
  do is clear CSM_ON, which powers the analog down -- and measured on hardware,
  the ADC then returns a noise floor of exactly zero for about six seconds, at
  every sample rate. A reset is only ever a shortcut to a known register state,
  and this driver reaches that state the long way instead, by programming every
  register its behaviour depends on. On a settled part that costs nothing
  measurable.

  The consequence is that the codec inherits its register file from whatever ran
  last, so the driver normalises the registers it depends on rather than trusting
  any of them. That includes 0xFA bit 0 (INI_REG), whose only published description
  is "reset registers to default except itself": an ES8311 driver carried in Rockchip
  BSP kernels asserts it in its i2c shutdown handler and never clears it, so a part
  can be handed over with its register file sitting at the defaults. init() reads the
  identity first and releases the bit afterwards, before the quiescing writes that
  have to land. A part that cannot identify itself is rejected without being written
  to at all.

  Board policy: devicetree properties, and what is still compiled in
  ------------------------------------------------------------------

  Two board-policy choices are devicetree properties (defined below), because they are the
  ones most likely to differ between boards and to be met as silence or as clipping. Mainline
  Linux exposes each as a control, and both Espressif reference drivers hard-code them:

    everest,mic-pga-gain-db  analog PGA gain, 0..30 dB in 3 dB steps (0x14 [3:0]); default 0
    everest,mono-dac-source  which I2S slot the mono DAC plays (0x09 bit 7); default left

  The mono DAC source is the one most easily met as silence: the ES8311 has a single DAC, 0x09
  bit 7 chooses which half of the stereo frame it plays, and a board that puts its samples in the
  other slot hears nothing with every register reading back as intended.

  Capture gain stacks, and the total is worth knowing before raising the PGA. The driver also
  writes 0x16 ADC_SCALE as +24 dB, which is that register's own reset value, so a board on the
  0 dB PGA default still has 24 dB of digital gain ahead of INPUT_VOLUME. The PGA is the one
  that matters: it sits in FRONT of the ADC, and no amount of digital attenuation recovers a
  front end that clipped. Raise it deliberately, per board.

  Three choices remain compiled in:

    capture input  MIC1, differential (0x14 LINSEL). The ES8311 has exactly one analog input,
                   the differential MIC1P/MIC1N pair -- there is no single-ended analog
                   microphone (the mux has two states, disabled or MIC1P-MIC1N, and Linux models
                   it the same way). 0x14 bit 6 selects a DIGITAL microphone on MIC1P instead;
                   that is a different input this driver does not support at all.
    ADC scale      +24 dB (0x16), which is the register's reset value; the driver writes it
                   whole so that ADC_SYNC (bit 5, clear at reset) is set for a standard audio
                   clock. It could become a property in a follow-up.
    output mode    headphone, 0x13 HPSW set. The part also has a line-out mode, and this
                   version does not expose it: every measurement behind either value was taken
                   through a board power amplifier, which cannot tell the two apart at the
                   codec pins. A devicetree property is a stable interface once merged, so it
                   waits for a differential measurement at OUTP/OUTN. Note HPSW resets CLEAR,
                   so line-out, not headphone, is the reset default.

  Power management: the application owns it
  -----------------------------------------

  In the BCLK-derived mode this codec takes its whole internal clock tree from the I2S
  bit clock. When BCLK stops, the clock tree stops -- and a DAC that is powered and
  unmuted at that moment has its modulator frozen on its last sample, which is a DC
  level sitting on the amplifier. That is why init() quiesces the part, why configure()
  mutes before it reclocks, and why I2S_OPT_BIT_CLK_GATED is refused. Driving MCLK
  removes that particular failure, since the tree then runs from a clock the transport
  does not stop, but it does not remove the need to mute before suspending: what the
  DAC does with a stalled serial port has not been characterised here.

  It is also what a system suspend does, or runtime power management on the I2S
  controller, and this driver implements NO power-management actions: it registers no
  PM control callback and does nothing on suspend or resume. The application must stop
  or mute the codec before it suspends or power-manages the I2S controller. Mainline
  Linux's es8311 has suspend/resume and bias-level handling; that is the shape of the
  follow-up, and it is not in this version.

  Clock sequencing: the application owns this too
  -----------------------------------------------

  The transport and the codec output have to be sequenced, and how much rests on it depends on
  which clock source is in use. The I2S controller must run a CONTINUOUS bit clock while
  streaming in either mode (I2S_OPT_BIT_CLK_GATED is refused in both).

  The hard rule is on the way DOWN: never let BCLK stop while the DAC is powered and unmuted.
  In the BCLK-derived mode the codec's clock IS the bit clock, so with no clock the modulator
  freezes on its last sample -- a DC level sitting on the amplifier. In the external-MCLK mode
  the clock tree survives a stopped bit clock, and what the DAC does with a stalled serial port
  has not been characterised here, so the same order is asked for rather than a weaker one.
  audio_codec_stop_output() (or an OUTPUT_MUTE) must land BEFORE the transport stops or the
  I2S controller is suspended.

  For startup, the recommended order is to have the transport already running -- continuous BCLK,
  with silent frames flowing -- BEFORE audio_codec_start_output() unmutes the DAC, so the first
  unmute lands into a running clock and cannot produce a step:

      audio_codec_configure()      # the DAC comes up powered but MUTED
      i2s_configure()
      queue initial (silent) I2S buffers
      i2s_trigger(START)           # continuous BCLK begins, silence flows
      audio_codec_start_output()   # first DAC unmute, into a running clock

  samples/drivers/i2s/i2s_codec does neither of those things, and it is worth being precise
  about which half matters. It unmutes BEFORE it starts the transport, which also works in
  practice but relies on the DAC's un-clocked idle level, something this driver has not
  characterised on silicon. More importantly it stops with I2S_TRIGGER_DROP and never calls
  audio_codec_stop_output(), which is the DOWN rule above. Neither is a defect in the sample
  for a codec with its own clock; both are why an application using THIS codec should follow
  the order given here rather than that sample.

  Shutdown reverses the streaming pair: audio_codec_stop_output() (mute), then stop the
  transport. A board with a separate power-amp enable should gate the speaker with THAT -- on
  only once clean frames are flowing, off before the mute -- which is the primary click control
  on such boards. Capture is symmetric: configure() leaves the microphone muted, and
  audio_codec_start() with AUDIO_DAI_DIR_RX is the first unmute. The ADC's analog settling is
  measured in seconds, so an application should discard the first buffers rather than expect the
  opening frames to be clean.

compatible: "everest,es8311"

properties:
  everest,mono-dac-source:
    type: string
    enum:
      - "left"
      - "right"
    default: "left"
    description: |
      Which slot of the stereo I2S frame the single (mono) DAC plays, via 0x09 bit 7
      (SDP_IN_SEL). "left" is the reset default and the value for a mono stream placed in the
      left slot; "right" takes the right slot. An application whose samples are in the other
      slot hears silence with every register reading back as intended.

  everest,mic-pga-gain-db:
    type: int
    enum: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27, 30]
    default: 0
    description: |
      Analog microphone PGA gain in dB, 0x14 bits [3:0] (3 dB per step, 0-30 dB). The default is
      0 dB, which is also this field's reset value: the gain is ahead of the ADC, clipping there
      cannot be undone by the digital INPUT_VOLUME downstream, so a board asks for it
      explicitly. Both Espressif reference drivers hard-code the 30 dB maximum, which suits a
      quiet analog MEMS microphone and will clip a hotter one.

# The power properties are BLOCKED, not merely unimplemented.
#
# supply-gpios and vin-supply arrive here from power.yaml, via i2c-device.yaml, and this
# driver reads neither: a board whose codec sits behind a switch or a regulator must bring
# that rail up itself, and must do it before POST_KERNEL, because that is when this driver
# probes and reads the chip ID. Ordinary application code runs too late; a board that cannot
# power the rail from its own init needs zephyr,deferred-init and an explicit device_init().
# Saying so in a comment is not enough. A board could write
# supply-gpios on an es8311 node, have it validate, and then watch the driver probe an
# unpowered codec and reject it -- with the devicetree looking entirely correct. Blocking
# the properties turns that into a build error naming the property, which is what a
# contract is for.
#
# It is deliberately all-or-nothing. power.yaml specifies an ORDER between the two when a
# board has both -- enable the regulator, then assert the GPIO -- so honouring one half
# would leave that contract undefined for any board that sets both. Doing it properly means
# both properties, the ordering, and a shutdown path, against a board with the hardware to
# exercise it. That is a follow-up, and it lifts this blocklist.
#
# One warning for whoever writes it: gating this codec's supply at runtime is not free.
# Measured on hardware, cutting its analog supply and restoring it leaves the ADC deaf for
# several seconds -- the same as the register-0x00 reset above, and unlike a full cold
# power-on, which does not do it.
include:
  - name: i2c-device.yaml
    property-blocklist:
      - supply-gpios
      - vin-supply
