title: Everest Semiconductor ES8311 Audio Codec

description: |
  Mono ADC/DAC with an I2C control interface and an I2S/PCM audio interface.
  The CE pin selects the 7-bit I2C address, 0x18 or 0x19. The microphone
  input is differential MIC1P/MIC1N; the output is OUTP/OUTN.

compatible: "everest,es8311"

include:
  - name: i2c-device.yaml
    property-blocklist:
      - supply-gpios
      - vin-supply

properties:
  everest,mono-dac-source:
    type: string
    enum:
      - "left"
      - "right"
    default: "left"
    description: |
      Stereo I2S slot used by the mono DAC. The default supports mono
      streams carried in the first slot. Select "right" when the wanted
      samples are in the second slot.

  everest,mic-pga-gain-db:
    type: int
    enum: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27, 30]
    default: 0
    description: |
      Analog microphone PGA gain in dB, before ADC conversion. The default
      adds no PGA gain, reducing clipping risk with an unknown microphone
      level. Increase the gain when the board's microphone output needs
      amplification. Digital volume cannot recover a signal clipped here.
