description: WM8904 audio codec

include: [i2c-device.yaml]

compatible: "wolfson,wm8904"

properties:
  reg:
    required: true
  clock-source:
    type: string
    default: "MCLK"
    description: |
      Codec's internal clock signal (SYSCLK) source selection. These options
      are available:
      - "MCLK": WM8904's MCLK pin (supplied by the host)
      - "FLL":  WM8904's FLL facility, can be free-running
      The "MCLK" option is default, as this clock signal is usually supplied
      by the host.
    enum:
      - "MCLK"
      - "FLL"
  clocks:
    type: phandle-array
    required: true
    description: |
      Phandle to the clock supplying the codec's MCLK pin. When
      "clock-source" is set to "FLL", this clock also acts as the FLL
      reference clock. If the clock is not backed by a real clock
      controller, a "fixed-clock" node can be used to describe its
      frequency.
  clock-names:
    type: string-array
    required: true
    description: Must contain "mclk" matching the MCLK input
    enum:
      - mclk
  input-pga-select:
    type: int
    enum: [1, 2, 3]
    description: |
      Selects the WM8904 input PGA source channel.
      Only single-ended input mode is supported.
      On the 32-pin QFN package, only channels 1 and 2 are supported.
  wolfson,mic-bias-voltage:
    type: string
    description: |
      Select microphone bias voltage for the connected microphone input.
      * "avdd-9-10":  Vbias = 9/10 x AVDD
      * "avdd-10-9":  Vbias = 10/9 x AVDD
      * "avdd-7-6":   Vbias = 7/6 x AVDD
      * "avdd-4-3":   Vbias = 4/3 x AVDD
      * "avdd-3-2":   Vbias = 3/2 x AVDD

      If the property is not present, the bias voltage is not enabled.
    enum:
      - "avdd-9-10"
      - "avdd-10-9"
      - "avdd-7-6"
      - "avdd-4-3"
      - "avdd-3-2"
