title: Texas Instruments TLV320AIC3104 stereo audio codec

description: |
  Texas Instruments TLV320AIC3104 low-power stereo audio codec.
  I2C control interface with page-based register access (pages 0 and 1).
  Datasheet: https://www.ti.com/product/TLV320AIC3104

  The 32-pin RHB package has no interrupt output pin.

compatible: "ti,tlv320aic3104"

include: i2c-device.yaml

properties:
  reset-gpios:
    type: phandle-array
    required: true
    description: GPIO for hardware reset (active-low)

  clocks:
    description: |
      Optional MCLK provider, named "mclk" in clock-names. When present,
      audio_codec_configure() takes the MCLK rate from this clock instead of
      audio_codec_cfg.mclk_freq. A provider with a clock-frequency
      property, such as a fixed-clock for an on-board oscillator, is read
      at build time. Any other provider is switched on and read through the
      clock control API (CONFIG_CLOCK_CONTROL), and its specifier may have no
      cells or a "name" cell.

  clock-names:
    description: Must be "mclk" when clocks is present.

  mic-bias-level:
    type: int
    default: 0
    enum:
      - 0
      - 1
      - 2
      - 3
    description: |
      MICBIAS output level (page 0, register 25, D7-D6).
      0 = off (default, matches the part's reset state). 1 = 2 V.
      2 = 2.5 V. 3 = connected to AVDD.

  adc-high-pass-filter:
    type: int
    default: 0
    enum:
      - 0
      - 1
      - 2
      - 3
    description: |
      ADC high-pass filter corner for both channels (page 0, register 12,
      D7-D4). 0 = disabled (default, matches the part's reset state).
      1 = 0.0045 x fS(ADC). 2 = 0.0125 x fS(ADC). 3 = 0.025 x fS(ADC).

  hprcom-vcm-output:
    type: boolean
    description: |
      Drive HPRCOM as a constant common-mode voltage and power it up
      (page 0, register 38 D5-D3 = 001, and register 72).

      Set this on a board that returns the headphone load through HPRCOM
      instead of ground - a jack whose sleeve is wired to the pin rather
      than to GND. Without it HPRCOM stays at its reset state, which is
      powered down and high-impedance, and such a load has no return path:
      the two channels end up in series with a floating midpoint, so only
      their difference is audible and a mono source is silent.

      Leave it out on a board that grounds the sleeve. HPRCOM is then
      unused, and powering it would only burn current.

  hp-single-ended:
    type: boolean
    description: |
      The board drives its headphone load from HPLOUT and HPROUT alone,
      each through a coupling capacitor, and leaves HPLCOM and HPRCOM
      unconnected. configure() then writes page 0 register 14 as 0x80:
      ac-coupled drivers, D6 (stereo fully differential configuration)
      clear.

      Without it register 14 is 0xC0, which also tells the codec that
      HPLOUT/HPLCOM and HPROUT/HPRCOM drive a fully differential load.

      Do not set it together with hprcom-vcm-output. A load returned
      through HPRCOM is a pseudo-differential one (register 14 D3), which
      the driver does not program; a build with both set fails.
