description: MAX98091 I2S Audio Codec

compatible: "maxim,max98091"

include: [i2c-device.yaml]

properties:
  reg:
    required: true
  mclk-frequency:
    type: int
    required: true
    description: External MCLK frequency in Hz
  dmic-clk-frequency:
    type: int
    enum: [1536000, 2048000, 2457600, 3072000, 4096000, 6144000]
    description: Digital microphone clock frequency in Hz
