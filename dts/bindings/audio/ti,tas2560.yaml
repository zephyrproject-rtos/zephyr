description: |
  Texas Instruments TAS2560 Class-D audio amplifier.

  One node is one mono amplifier. A stereo board is two nodes on the same bus,
  each with its own I2C address and ti,asi-channel.

  Playback is 16-bit I2S at 16, 48, or 96 kHz. The PLL takes BCLK and must
  stay between 512 kHz and 20 MHz. I2S has two slots, so 8 kHz would be a
  256 kHz bit clock and is rejected even though PCM_RATE can encode it. The
  PLL output is 1024 times the sample rate, which is J = 32 for 16-bit I2S.

compatible: "ti,tas2560"

include: i2c-device.yaml

properties:
  ti,asi-channel:
    type: int
    default: 0
    enum:
      - 0
      - 1
      - 2
    description: |
      I2S channel mixed into this amplifier.
      0 is left, 1 is right, 2 is (left + right) / 2.
      The driver sets ASI_MODE to I2S, so mono PCM is not available.
