description: |
  SFF-8472 managed pluggable transceiver (SFP, SFP+, SFP28).

  The serial ID page (A0h) is read at the node's I2C address, which is 0x50 for
  a standard module. The digital diagnostic monitoring page (A2h) is read at the
  address given by the diagnostics-address property, 0x51 by default.

compatible: "sff,sff8472"

include: i2c-device.yaml

properties:
  diagnostics-address:
    type: int
    default: 0x51
    description: |
      I2C address of the SFF-8472 digital diagnostic monitoring page (A2h).
