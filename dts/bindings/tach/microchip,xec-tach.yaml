description: Microchip XEC tachometer controller

compatible: "microchip,xec-tach"

include:
  - name: tach.yaml
  - name: pinctrl-device.yaml
  - name: microchip,dmec-ecia-girq.yaml

properties:
  "#address-cells":
    required: true
    const: 1
  "#size-cells":
    type: int
    const: 0
  reg:
    required: true

  interrupts:
    required: true

  pcr-scr:
    type: int
    required: true
    description: |
      TACH Power Clock Reset(PCR) peripheral index and bit position

  tach-edges:
    type: int
    default: 5
    enum:
      - 2
      - 3
      - 5
      - 9
    description: |
      Number of TACH edges the hardware counts 100 kHz clocks over. A TACH
      period is three edges, so the measurement window is 1/2, 1, 2 or 4 TACH
      periods for 2, 3, 5 or 9 edges respectively. A wider window is more
      accurate but takes longer to latch and saturates at a higher fan speed.
      The default of 5 edges matches a fan producing two TACH periods per
      revolution and is the hardware reset value's typical use.

  pulses-per-round:
    type: int
    default: 2
    description: |
      Number of TACH periods the fan generates per revolution. Typical DC
      brushless fans emit a 50% duty cycle, two-period square wave per
      revolution, hence the default of 2.

  clock-frequency:
    type: int
    default: 100000
    description: |
      Frequency in Hz of the clock the hardware counts while the TACH edges are
      observed. Nominally 100 kHz, and the default, but the block divides the
      48 MHz PLL by 480 and that PLL is only specified to 46.56 to 49.44 MHz
      when it is referenced to the internal silicon oscillator, narrowing to
      47.5 to 48.5 MHz with an external reference. The driver takes this value
      as exact, so whatever the real clock differs from it by appears in every
      reported RPM as a flat multiplicative bias. Set it from a measurement of
      the divided clock on the part, or leave it at the nominal value and
      accept the tolerance.
