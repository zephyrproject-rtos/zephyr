description: |
    Atmel SAM0 USB in device mode.

    This binding also covers SAM0-compatible USB controllers used by
    Microchip devices.

compatible: "atmel,sam0-usb"

include:
  - name: usb-ep.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    description: |
      Clock phandles used to drive the USB controller.

  clock-names:
    description: |
      Clock names corresponding to the clocks property.

  nvm-calib:
    type: phandle
    description: |
      NVM area that holds the USB pad calibration values. The bit offsets in
      calib-mapping are counted from the start of this area.

  calib-mapping:
    type: array
    description: |
      Location of the USB pad calibration values in the area given by
      nvm-calib. Three entries in the order TRANSN, TRANSP and TRIM, each
      <nvm_bit default>.

      nvm_bit is the bit offset of the value and must not cross a 32-bit word
      boundary. default is used when all bits of the value are set, which
      means the fuse is unprogrammed.
