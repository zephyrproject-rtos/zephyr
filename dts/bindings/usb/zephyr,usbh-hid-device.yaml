description: Bindings for HID Host driver device

compatible: "zephyr,usbh-hid-device"

include: base.yaml

properties:
  reg:
    required: true
    description: USB device vendor + device IDs (0xFFFFFFFF acts as wildcard)

  start-with-boot-protocol:
    type: boolean
    description: Most USB HID devices will implement a common report descriptor
      known as "boot protocol". It is meant to let host machines interact
      with the device even without loading a fully fledged HID driver,
      usually in the context of a bootloader. It works well by itself,
      so it may be used as a more lightweight alternative to the full report parsing.

  match-class:
    type: boolean
    description: Whether to use the VID-DID combination or just match this to
      any HID device.

  in-idle-rate-ms:
    type: array
    default: [0, 0]
    description: List of idle rates to be applied to report IDs. Odd entries
      represent report IDs, even entries are the corresponding period in
      milliseconds (must be a multiple of 4).
