title: Microchip PIC32CZ USBHS controller

description: |
  USB controller for the PIC32CZ CA family's USBHS peripheral
  (module name="USBHS" id="03787", usb_otg_2_0_ctlr_v2).

  The peripheral is a Mentor Graphics Inventra MUSB core behind a
  Microchip wrapper: the wrapper registers occupy the low offsets, the
  MUSB core starts at offset 0x1000, and a PHY control block sits at
  0x1500.

  The signals are on dedicated pads, not on GPIO, so there is no pinctrl
  property. Each instance needs a 270 ohm 1% resistor from its USBRBIASn
  pad to AGND; without it the PHY will not meet the USB electrical spec.

  The role is selected at build time: the device controller driver forces
  a B-plug identity and the host controller driver an A-plug identity in
  software. Neither consults the USBID pad.

compatible: "microchip,pic32cz-usbhs"

include: mentor,musb-common.yaml

properties:
  clocks:
    required: true

  clock-names:
    required: true

  drd-gpios:
    type: phandle-array
    description: |
      Select line of the analog switch that connects the Type-C CC
      pull-down resistors to the CC pins, where the board puts the
      resistors behind such a switch. The active level selects the device
      side (Rd) and the inactive level the host side (Rp), so the flags in
      the phandle carry the polarity and the drivers encode none of their
      own. The device driver drives it active, the host driver inactive.

      Omit it on a board whose CC resistors connect to CC directly.

  vbus-enable-gpios:
    type: phandle-array
    description: |
      Enable input of the VBUS power switch on the connector, where the
      board can source 5 V onto it. Driven to its inactive level during
      init: a device that sources VBUS into a host puts two supplies
      against each other. The host driver asserts it while the controller
      is enabled. The flags in the phandle carry the polarity.

      Omit it on a board that cannot source VBUS on this port.

examples:
  - |
    usbhs1: usb@4f012000 {
            compatible = "microchip,pic32cz-usbhs";
            reg = <0x4f012000 0x2000>;
            interrupts = <214 0>;
            clocks = <&mclkperiph CLOCK_MCHP_MCLKPERIPH_ID_HUSB1>;
            clock-names = "mclk";
            num-bidir-endpoints = <8>;
            maximum-speed = "full-speed";
            status = "okay";
    };
