description: ITE IT51XXX usb host controller

compatible: "ite,it51xxx-uhc"

include: [usb-controller.yaml, pinctrl-device.yaml, "ite,general-config.yaml"]

properties:
  phy-handle:
    type: phandle

  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
