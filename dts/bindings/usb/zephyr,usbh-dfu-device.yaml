description: Bindings for DFU Host driver device

compatible: "zephyr,usbh-dfu-device"

include: base.yaml

properties:
  reg:
    required: true
    description: USB device vendor + device IDs (0xFFFFFFFF acts as wildcard)
  match-class:
    type: boolean
    description: Whether to use the VID-DID combination or just match this to
      any DFU device.
