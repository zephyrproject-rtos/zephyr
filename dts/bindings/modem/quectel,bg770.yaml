description: Quectel BG770 modem

compatible: "quectel,bg770"

include: zephyr,cellular-modem-device.yaml

properties:
  mdm-power-gpios:
    type: phandle-array

  mdm-reset-gpios:
    type: phandle-array
    required: true

  zephyr,mdm-reset-behavior:
    default: ["hold_on_suspend", "toggle_on_resume", "toggle_on_recovery"]
