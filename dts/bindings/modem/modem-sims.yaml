description: |
  SIM slots of a cellular modem.

  A node with this compatible, named "sim-slots", is a child of the modem node.
  Each of its children is one SIM slot: a SIM holder, or a SIM interface of the
  modem. A slot with a mux-states property is selected by applying that MUX
  state, for example with a gpio-mux driving a switch that routes the SIM lines
  of the modem to one of several SIM holders. A slot without it is a SIM
  interface of the modem, which the modem driver selects, for example with an
  AT command. Either all slots have a mux-states property, or none.

  A modem node without a sim-slots child has a single SIM.

  Example of a modem with one SIM interface, switched between two SIM holders
  by one GPIO:

    sim_mux: sim-mux {
            compatible = "gpio-mux";
            #mux-control-cells = <0>;
            #mux-state-cells = <1>;
            mux-gpios = <&gpio0 5 GPIO_ACTIVE_HIGH>;
    };

    &uart1 {
            modem {
                    compatible = "quectel,bg95";

                    sim-slots {
                            compatible = "modem-sims";
                            #address-cells = <1>;
                            #size-cells = <0>;

                            sim0: sim-slot@0 {
                                    reg = <0>;
                                    mux-states = <&sim_mux 0>;
                                    default-sim;
                            };

                            sim1: sim-slot@1 {
                                    reg = <1>;
                                    mux-states = <&sim_mux 1>;
                            };
                    };
            };
    };

  Example of a modem with two SIM interfaces, which it selects itself:

    &uart1 {
            modem {
                    compatible = "simcom,a76xx";

                    sim-slots {
                            compatible = "modem-sims";
                            #address-cells = <1>;
                            #size-cells = <0>;

                            sim-slot@0 {
                                    reg = <0>;
                            };

                            sim-slot@1 {
                                    reg = <1>;
                            };
                    };
            };
    };

compatible: "modem-sims"

properties:
  "#address-cells":
    type: int
    required: true
    const: 1

  "#size-cells":
    type: int
    required: true
    const: 0

child-binding:
  description: |
    One SIM slot.

  include:
    - name: mux-consumer.yaml
      property-allowlist:
        - mux-states

  properties:
    reg:
      type: array
      required: true
      description: |
        Index of the SIM slot, from 0 to 255. This is the slot index of the
        cellular API. For a SIM interface of the modem, it is the index the
        modem gives that interface.

    mux-states:
      description: |
        MUX state that routes the modem to this SIM slot. Without it, the
        modem selects the slot.

    default-sim:
      type: boolean
      description: |
        Select this SIM slot when the device starts. At most one slot can have
        this property. Without it, the first slot is selected.
