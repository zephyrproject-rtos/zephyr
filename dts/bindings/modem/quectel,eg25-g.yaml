description: Quectel EG25-G modem

compatible: "quectel,eg25-g"

include: zephyr,cellular-modem-device.yaml

properties:
  mdm-reset-gpios:
    type: phandle-array

  mdm-dtr-gpios:
    type: phandle-array

  mdm-wdisable-gpios:
    type: phandle-array

  target-baudrate:
    enum: [9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600]

  zephyr,mdm-reset-behavior:
    default: ["toggle_on_recovery"]
