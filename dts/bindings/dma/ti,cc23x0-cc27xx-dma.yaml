description: |
  TI CC23X0_CC27XX uDMA controller

  channel: Select channel for data transmitting. Channels are either
    Dedicated uDMA channels (DCH) for peripherals or Event Publisher Channels
    (ECH) that can be connected to any EVTSVT publishers.

  slot: For ECH channels, the slot should be an EVTSVT event publisher ID.
    For DCH channels, it should be an EVTSVT IP ID.

  In the driver, setting the source_chaning_en enables the uDMA auto mode, and
  deselecting enables basic mode. Setting source_handshake selects software
  triggered transfers and deselecting it enables hardware triggered transfers.


compatible: "ti,cc23x0-cc27xx-dma"

include: dma-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#dma-cells":
    const: 2
    description: |
      The 1st cell specifies the DMA channel to be used for the data transfer.
      This channel should be unique between all peripherals that are using the
      DMA instance.
      The 2nd cell defines the peripheral trigger which is the source of the transfer.
      See the SoC's reference manual for all the supported request sources.

      Example of devicetree DMA channel configuration for the client part:

      &uart0 {
          dmas = <&dma 0 7>, <&dma 1 6>;
          dma-names = "rx", "tx";
      };

      Above, fragment 0 and 1 represent the different channels used to transfer
      data between peripheral and RAM. The numbers 7/6 are uart0 rx/tx triggers.

dma-cells:
  - channel
  - trigsrc
