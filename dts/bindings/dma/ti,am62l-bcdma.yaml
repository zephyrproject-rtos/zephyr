title: TI AM62L main DMSS Block Copy DMA (BCDMA)

description: |
  TI AM62L main DMSS Block Copy DMA (BCDMA)

  The BCDMA moves data described by Transfer Request (TR) descriptors that
  software places on a ring per channel. The driver writes the channel and
  ring registers directly and uses no TISCI resource manager. Each ring has
  its own GIC SPI, so the ring interrupts are described with an
  interrupt-map keyed by the ring index. The ring-to-SPI table is not in
  the TRM; it follows the TI vendor devicetree.

  Channel numbers use one index space shared with the rings and with the
  interrupt-map child specifier:

    0-127    split TX/RX channels that serve the PDMA peripherals
             (CHANRT index)
    128-143  block-copy (memory to memory) channels; the CHANRT and ring
             index is the channel number, block-copy channel n is 128 + n

  A DMA specifier has two cells, the channel number and the ASEL (address
  space select, TRM 11.3.2.4.3) used for the rings, descriptors and data of
  that channel. ASEL 14 and 15 route the transfers through the A53 ACP so
  they are coherent with the CPU caches (TRM 3.5).

compatible: "ti,am62l-bcdma"

include: [dma-controller.yaml, interrupt-nexus.yaml]

properties:
  reg:
    required: true
    description: |
      Global configuration (gcfg), split channel realtime (chanrt),
      block-copy channel realtime (bchanrt) and ring realtime (ringrt)
      regions.

  reg-names:
    required: true

  "#address-cells":
    required: true
    const: 0

  "#interrupt-cells":
    const: 1

  "#dma-cells":
    const: 2

  dma-channels:
    required: true
    const: 144

  dma-buf-addr-alignment:
    const: 64

  ti,asel:
    type: int
    default: 0
    enum: [0, 14, 15]
    description: |
      ASEL of the block-copy channels when the DMA configuration does not
      select one. 0 is the default address space; 14 and 15 go through the
      A53 ACP.

dma-cells:
  - channel_id
  - asel

examples:
  - |
    #include <zephyr/dt-bindings/interrupt-controller/arm-gic.h>

    main_bcdma: dma-controller@485c4000 {
      compatible = "ti,am62l-bcdma";
      reg = <0x485c4000 0x4000>, <0x48800000 0x80000>,
            <0x48880000 0x10000>, <0x47000000 0x200000>;
      reg-names = "gcfg", "chanrt", "bchanrt", "ringrt";
      #address-cells = <0>;
      #interrupt-cells = <1>;
      interrupt-map = <128 &gic 0 GIC_SPI 516 IRQ_TYPE_LEVEL IRQ_DEFAULT_PRIORITY>;
      #dma-cells = <2>;
      dma-channels = <144>;
      dma-buf-addr-alignment = <64>;
    };
