description: TM1650 7-segment LED display I2C controller

compatible: "titanmec,tm1650"

include: ["i2c-device.yaml", "titanmec,tm1650-common.yaml"]

examples:
  - |
    &i2c {
      status = "okay";

      auxdisplay_0: auxdisplay@24 {
        compatible = "titanmec,tm1650";
        status = "okay";
        reg = <0x24>; /* Base addresse 0x48 shifted right by 1 bit */
        columns = <4>;
        rows = <1>;
      };
    };
