title: Analog Devices ADV7535 MIPI DSI endpoint

description: |
  MIPI DSI endpoint of an ADV7535 bridge. This is an auxiliary node: it only
  describes the DSI link so that the endpoint is enumerated by its MIPI DSI
  host parent. The corresponding I2C control device is described separately
  with an 'adi,adv7535' compatible node and has a reference to the DSI endpoint node.

compatible: "adi,adv7535-dsi"

include: mipi-dsi-device.yaml

properties:
  data-lanes:
    type: array
    required: true
    enum:
      - 2
      - 3
      - 4
    description: |
      Number of data lanes. ADV7535 supports from 2 to 4 DSI data lanes.
      This impacts what resolutions and refresh rates will be achievable.

  pixel-format:
    enum:
      - 0 # MIPI_DSI_PIXFMT_RGB888
    description: |
      Pixel format from dt-bindings/mipi_dsi/mipi_dsi.h. The bridge only
      supports MIPI_DSI_PIXFMT_RGB888.

  display-timing:
    type: phandle
    required: true
    description: |
      zephyr,panel-timing node describing the porches, sync lengths and pixel
      clock of the HDMI output. Its parent is the display controller node
      that owns the timing and carries the active area.

  test-pattern:
    type: int
    enum:
      - 0
      - 1
    description: |
      Show test patterns generated by ADV7535.
      Available test patterns:
      0 : Vertical color bars
      1 : Grayscale gradient
