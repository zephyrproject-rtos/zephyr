title: Analog Devices ADV7535 DSI-to-HDMI display bridge

description: |
    The ADV7535 provides a MIPI® display serial interface (MIPI/ DSI) input receiver and
    a High-Definition Multimedia Interface (HDMI®) transmitter output.
    The DSI receiver input supports DSI video mode operation only, and specifically,
    only supports non-burst mode with sync pulses.
    The DSI receiver provides up to four lanes of MIPI/DSI data, each running up to 891 Mbps.
    The HDMI transmitter supports video resolutions up to a maximum TMDS clock frequency
    of 148.5 MHz. The ADV7535 also provides an audio input port,
    which supports the insertion of audio into the HDMI stream.

compatible: "adi,adv7535"

include: mipi-dsi-device.yaml

properties:
  edid-addr:
    type: int
    default: 0x3f
    description: |
      Optional EDID I2C address. The default matches the address used by
      the ADV7535 when it is initially configured. Set this property when
      the default address conflicts with another device on the I2C bus.

  packet-addr:
    type: int
    default: 0x38
    description: |
      Optional packet I2C address. The default matches the address used by
      the ADV7535 when it is initially configured. Set this property when
      the default address conflicts with another device on the I2C bus.

  cec-addr:
    type: int
    default: 0x3c
    description: |
      Optional CEC I2C address. The default matches the address used by the
      ADV7535 when it is initially configured. Set this property when the
      default address conflicts with another device on the I2C bus.

  fixed-addr:
    type: int
    default: 0x00
    description: |
      Optional fixed I2C address. The default matches the address used by
      the ADV7535 when it is initially configured. Set this property to a
      non-conflicting address when 0x00 cannot be used on the I2C bus.

  data-lanes:
    type: array
    required: true
    enum:
      - 2
      - 3
      - 4
    description:
      Number of data lanes. ADV7535 supports from 2 to 4 DSI data lanes.
      This impacts what resolutions and refresh rates will be achievable.

  pixel-format:
    type: int
    required: true
    const: 0 # MIPI_DSI_PIXFMT_RGB888 = 0
    description:
      MIPI DSI pixel format. ADV7535 supports only MIPI_DSI_PIXFMT_RGB888.

  i2c:
    type: phandle
    required: true
    description:
      I2C controller used to access the bridge registers.

  i2c-addr:
    type: int
    required: true
    enum:
      - 0x39
      - 0x3d
    description: |
      Main register map I2C address. The address is 0x39 when PD/AD is pulled
      low and 0x3d when PD/AD is pulled high as power is applied.

  hactive:
    type: int
    required: true
    description: Horizontal active video area in pixels.

  hsync:
    type: int
    required: true
    description: Horizontal sync pulse width in pixels.

  hfp:
    type: int
    required: true
    description: Horizontal front porch width in pixels.

  hbp:
    type: int
    required: true
    description: Horizontal back porch width in pixels.

  vactive:
    type: int
    required: true
    description: Vertical active video area in lines.

  vsync:
    type: int
    required: true
    description: Vertical sync pulse width in lines.

  vfp:
    type: int
    required: true
    description: Vertical front porch height in lines.

  vbp:
    type: int
    required: true
    description: Vertical back porch height in lines.

  pd-gpios:
    type: phandle-array
    description: |
      GPIO connected to the PD/AD power-down pin. The pin level when the
      ADV7535 power supplies are applied selects both the main I2C address and
      the power-down polarity. A low level selects address 0x39 and active-high
      power-down, while a high level selects address 0x3d and active-low
      power-down. The GPIO flags must match the selected power-down polarity.
      Although this GPIO is optional, connecting it is strongly recommended
      because toggling the PD/AD pin resets more registers than a
      register-based reset. The I2C address and power-down polarity are sampled
      when power is applied. To change either setting, set the pin to the
      desired level and power-cycle the board.

  int-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt pin of ADV7535. Must be configured as active-low and pulled up.

  test-pattern:
    type: int
    enum:
      - 0
      - 1
    description: |
      Show test patterns generated by ADV7535.
      Available test patterns:
      0 : Vertical color bars
      1 : Grayscale gradient
