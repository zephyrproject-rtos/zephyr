description: |
   Shared properties for ILI98XX display controllers on MIPI DSI interfaces

include: [mipi-dsi-device.yaml, display-controller.yaml]

properties:
  reset-gpios:
    type: phandle-array
    description: |
      The RESETn pin is asserted to disable the sensor causing a hard
      reset.  The sensor receives this as an active-low signal.

  bl-gpios:
    type: phandle-array
    description: |
      The BLn pin is asserted to control the backlight of the panel.
      The sensor receives this as an active-high signal.

  hp-mode:
    type: boolean
    description: |
      Set to attach to the MIPI-DSI host in high power mode. If not present,
      the host will attach in low power mode.

  burst-mode:
    type: boolean
    description: |
      Set to enable burst mode for the MIPI-DSI interface. If not present,
      burst mode will be disabled.

  init-seq-name:
    type: string
    required: true
    description: |
      The name of the initialization sequence to be used for the display panel.
      A function with the signature
      int <init-seq-name>_dsi_regs_init(const struct device *dev); should be
      implemented to match this property.
