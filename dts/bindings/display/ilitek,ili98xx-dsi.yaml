description: |
   Shared properties for ILI98XX display controllers on MIPI DSI interfaces

include: [mipi-dsi-device.yaml, display-controller.yaml]

properties:
  reset-gpios:
    type: phandle-array
    description: |
      The RESETn pin is asserted to disable the sensor causing a hard
      reset.  The sensor receives this as an active-low signal.

  bl-gpios:
    type: phandle-array
    description: |
      The BLn pin is asserted to control the backlight of the panel.
      The sensor receives this as an active-high signal.

  hp-mode:
    type: boolean
    description: |
      Set to attach to the MIPI-DSI host in high power mode. If not present,
      the host will attach in low power mode.

  burst-mode:
    type: boolean
    description: |
      Set to enable burst mode for the MIPI-DSI interface. If not present,
      burst mode will be disabled.

  init-seq:
    type: uint8-array
    required: true
    description: |
      Initialization sequence for the display panel. This should be an array of
      bytes encoded like so:
      - The first byte is the register address.
      - The second byte is the length of the command data.
      - The following bytes are the command data itself.
      For example, an initialization sequence with two commands might look like:
      [01 00 11 02 01 22 33]
      Here, 0x01 is the first register, 0x00 is the length of its command data (none),
      followed by 0x11 as the next register, 0x02 as the length of its command data,
      and 0x22, 0x33 as the command data itself.
