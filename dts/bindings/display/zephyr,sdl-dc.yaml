description: SDL based emulated display controller

compatible: "zephyr,sdl-dc"

include: display-controller.yaml

properties:
  title:
    type: string
    description: |
      Name of graphical window

  pixel-format:
    type: int
    required: true
    description: |
      Initial Pixel format of this controller's output data.
    enum:
      - 0x33524742 # PANEL_PIXEL_FORMAT_RGB_888
      - 0x3130434d # PANEL_PIXEL_FORMAT_MONO01
      - 0x3031434d # PANEL_PIXEL_FORMAT_MONO10
      - 0x34325241 # PANEL_PIXEL_FORMAT_ARGB_8888
      - 0x50424752 # PANEL_PIXEL_FORMAT_RGB_565
      - 0x52424752 # PANEL_PIXEL_FORMAT_RGB_565X
      - 0x59455247 # PANEL_PIXEL_FORMAT_L_8
      - 0x38384c41 # PANEL_PIXEL_FORMAT_AL_88
      - 0x34325258 # PANEL_PIXEL_FORMAT_XRGB_8888
      - 0x33424752 # PANEL_PIXEL_FORMAT_BGR_888
      - 0x34324241 # PANEL_PIXEL_FORMAT_ABGR_8888
      - 0x34324152 # PANEL_PIXEL_FORMAT_RGBA_8888
      - 0x34324142 # PANEL_PIXEL_FORMAT_BGRA_8888
      - 0x20343449 # PANEL_PIXEL_FORMAT_I_4

examples:
  - |
    #include <zephyr/dt-bindings/display/panel.h>

    sdl_dc: sdl_dc {
      /* ... */

      pixel-format = <PANEL_PIXEL_FORMAT_ABGR_8888>;
    };
