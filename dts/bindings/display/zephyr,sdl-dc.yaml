description: SDL based emulated display controller

compatible: "zephyr,sdl-dc"

include: display-controller.yaml

properties:
  title:
    type: string
    description: |
      Name of graphical window

  pixel-format:
    type: string
    required: true
    description: |
      Initial Pixel format of this controller's output data.
    enum:
      - "bgr24"
      - "mono01"
      - "mono10"
      - "bgra32"
      - "rgb565"
      - "rgb565x"
      - "grey"
      - "al88"
      - "bgrx32"
      - "rgb24"
      - "rgba32"
      - "abgr32"
      - "argb32"
      - "i4"

examples:
  - |
    sdl_dc: sdl_dc {
      /* ... */

      pixel-format = "rgba32";
    };
