description: |
  EK79007 MIPI DSI display panel controller

compatible: "fitipower,ek79007"

include: [mipi-dsi-device.yaml, display-controller.yaml]

properties:
  reset-gpios:
    type: phandle-array
    description: |
      Reset GPIO pin (active low).

  bl-gpios:
    type: phandle-array
    description: |
      Backlight control GPIO pin (active high).
