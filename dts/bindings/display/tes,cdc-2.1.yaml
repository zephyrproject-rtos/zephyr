description: TES CDC200 controller

compatible: "tes,cdc-2.1"

include: [display-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true

  enable-l1:
    type: boolean
    description:
      Enable layer 1.

  enable-l2:
    type: boolean
    description:
      Enable layer 2.

  pixel-fmt-l1:
    type: string
    description: Pixel format for Layer 1. Must be set if layer 1 is enabled.
    enum:
      - "argb-8888"
      - "rgb-888"
      - "rgb-565"
      - "rgba-8888"
      - "al-44"
      - "l-8"
      - "argb-1555"
      - "argb-4444"
      - "undefined"

  pixel-fmt-l2:
    type: string
    description: Pixel format for Layer 2. Must be set if layer 2 is enabled.
    enum:
      - "argb-8888"
      - "rgb-888"
      - "rgb-565"
      - "rgba-8888"
      - "al-44"
      - "l-8"
      - "argb-1555"
      - "argb-4444"
      - "undefined"

  def-back-color-l1:
    type: int
    description: Default display background color - layer 1.

  def-back-color-l2:
    type: int
    description: Default display background color - layer 2.

  bg-color:
    type: int
    default: 0x0
    description: |
      RGB value of the default display background color.
      Default is the reset value of black


  win-x0-l1:
    type: int
    description: Window X0 for Layer 1.

  win-y0-l1:
    type: int
    description: Window Y0 for Layer 1.

  win-x1-l1:
    type: int
    description: Window X1 for Layer 1.

  win-y1-l1:
    type: int
    description: Window Y1 for Layer 1.

  win-x0-l2:
    type: int
    description: Window X0 for Layer 2.

  win-y0-l2:
    type: int
    description: Window Y0 for Layer 2.

  win-x1-l2:
    type: int
    description: Window X1 for Layer 2.

  win-y1-l2:
    type: int
    description: Window Y1 for Layer 2.

  blend-factor1-l1:
    type: int
    default: 6
    description: |
      Blend factor 1 for current layer color to be used for blending algorithm
      for layer 1. Default is reset value of register.
    enum:
      - 4
      - 6

  blend-factor2-l1:
    type: int
    default: 7
    description: |
      Blend factor 2 for subjacent layer color to be used for blending algorithm
      for layer 1. Default is reset value of register.
    enum:
      - 5
      - 7

  blend-factor1-l2:
    type: int
    default: 6
    description: |
      Blend factor 1 for current layer color to be used for blending algorithm for layer 2.
      Default is reset value of register.
    enum:
      - 4
      - 6

  blend-factor2-l2:
    type: int
    default: 7
    description: |
      Blend factor 2 for subjacent layer color to be used for blending algorithm for layer 2.
      Default is reset value of register.
    enum:
      - 5
      - 7

  const-alpha-l1:
    type: int
    default: 0xff
    description: |
      Constant alpha to be used for layer 1. Default is reset value of register.

  const-alpha-l2:
    type: int
    default: 0xff
    description: |
      Constant alpha to be used for layer 2. Default is reset value of register.

  panel-dev:
    type: phandle
    required: true
    description: Reference to the display panel node.
