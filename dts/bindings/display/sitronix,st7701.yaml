title: Sitronix ST7701 display controller

description: |
    The Sitronix ST7701 is a 16.7M colors TFT-LCD controller
    with a maximum 480RGBx864 resolution.

compatible: "sitronix,st7701"

include: [mipi-dsi-device.yaml, display-controller.yaml]

properties:
  reset-gpios:
    type: phandle-array
    description: |
      The RESETn pin is asserted to disable the sensor causing a hard
      reset.  The sensor receives this as an active-low signal.

  bl-gpios:
    type: phandle-array
    description: |
      The BLn pin is asserted to control the backlight of the panel.
      The sensor receives this as an active-high signal.

  rotation:
    type: int
    default: 0
    enum:
      - 0
      - 90
      - 180
      - 270
    description: |
      Display rotation (CW) in degrees. Defaults to 0, display default.

  inversion-on:
    type: boolean
    description: |
      Enable display inversion mode (DCS INVON). The inversion state is
      always programmed explicitly (INVON when present, INVOFF when
      absent), as the power-on state of some panels is not deterministic.

  bk3-ef:
    type: uint8-array
    description: |
      Command2 BK3 setting at address 0xEF, including the command byte.
      Written (preceded by the BK3 selection) at the start of the init
      sequence when present.

  lneset:
    type: uint8-array
    description: |
      Display line setting at address 0xC0, including the command byte.
      Overrides the value computed from the panel height when present.

  porctrl:
    type: uint8-array
    description: |
      Porch control setting at address 0xC1, including the command byte.
      Overrides the value derived from the display timings when present.

  cc-control:
    type: uint8-array
    description: |
      Setting at address 0xCC, including the command byte. Defaults to
      [CC 18] when absent.

  invsel:
    type: uint8-array
    description: |
      Inversion selection and minimum line period setting at address 0xC2,
      including the command byte. Defaults to [C2 01 08] when absent.

  vrhs:
    type: int
    default: 0x65
    description: Vop amplitude setting (Command2 BK1, 0xB0).

  vcom:
    type: int
    default: 0x34
    description: VCOM amplitude setting (Command2 BK1, 0xB1).

  vghss:
    type: int
    default: 0x87
    description: VGH voltage setting (Command2 BK1, 0xB2).

  vgls:
    type: int
    default: 0x49
    description: VGL voltage setting (Command2 BK1, 0xB5).

  pwctlr1:
    type: int
    default: 0x85
    description: Power control 1 (Command2 BK1, 0xB7).

  pwctlr2:
    type: int
    default: 0x20
    description: Power control 2 (Command2 BK1, 0xB8).

  spd1:
    type: int
    default: 0x78
    description: Source pre-drive timing set 1 (Command2 BK1, 0xC1).

  spd2:
    type: int
    default: 0x78
    description: Source EQ2 setting (Command2 BK1, 0xC2).

  mipiset1:
    type: int
    default: 0x88
    description: MIPI setting 1 (Command2 BK1, 0xD0).

  b9:
    type: int
    description: |
      Command2 BK1 setting at address 0xB9. Written only when present.

  gip-e0:
    type: uint8-array
    description: GIP setting at address 0xE0.

  gip-e1:
    type: uint8-array
    description: GIP setting at address 0xE1.

  gip-e2:
    type: uint8-array
    description: GIP setting at address 0xE2.

  gip-e3:
    type: uint8-array
    description: GIP setting at address 0xE3.

  gip-e4:
    type: uint8-array
    description: GIP setting at address 0xE4.

  gip-e5:
    type: uint8-array
    description: GIP setting at address 0xE5.

  gip-e6:
    type: uint8-array
    description: GIP setting at address 0xE6.

  gip-e7:
    type: uint8-array
    description: GIP setting at address 0xE7.

  gip-e8:
    type: uint8-array
    description: GIP setting at address 0xE8.

  gip-e9:
    type: uint8-array
    description: GIP setting at address 0xE9.

  gip-eb:
    type: uint8-array
    description: GIP setting at address 0xEB.

  gip-ec:
    type: uint8-array
    description: GIP setting at address 0xEC.

  gip-ed:
    type: uint8-array
    description: GIP setting at address 0xED.

  gip-ef:
    type: uint8-array
    description: Command2 BK1 setting at address 0xEF.

  pvgamctrl:
    type: uint8-array
    description: Positive voltage gamma control.

  nvgamctrl:
    type: uint8-array
    description: Negative voltage gamma control.
