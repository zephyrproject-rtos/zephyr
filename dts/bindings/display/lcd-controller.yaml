# Common fields for LCD controllers driving a panel.

include: display-controller.yaml

properties:
  pixel-format:
    type: string
    required: true
    description: |
      Initial Pixel format of this controller's output data, which is sent
      to a panel directly or to an adapter.
      Use the lowercase suffix of a PIX_FMT_* definition from
      zephyr/dt-bindings/media/pixel_format.h, for example "bgr24".
