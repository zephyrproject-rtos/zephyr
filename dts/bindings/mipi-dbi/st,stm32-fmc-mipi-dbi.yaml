description: |
  STM32 Flexible Memory Controller (FMC) display controller supporting
  parallel MIPI-DBI interfaces in both 8-bit and 16-bit configurations.
  The hardware bus width is configured in the parent NOR/PSRAM memory controller
  bank node (st,control property MWID field).

compatible: "st,stm32-fmc-mipi-dbi"

include: ["mipi-dbi-controller.yaml"]

properties:
  bank-address:
    type: int
    description: |
      Optional property to provide FMC Bank address.

  reset-gpios:
    type: phandle-array
    description: |
      Reset GPIO pin. Set high to reset the display

  power-gpios:
    type: phandle-array
    description: |
      Power GPIO pin. Set high to power the display.

  register-select-pin:
    type: int
    required: true
    description: |
      Address pin used as Register Select for the display controller.
      In 16-bit bus mode, pin FMC_Ax is driven by internal address line HADDR[x + 1].
      In 8-bit bus mode, pin FMC_Ax is driven by internal address line HADDR[x].
