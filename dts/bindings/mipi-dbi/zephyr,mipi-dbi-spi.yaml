description: |
  MIPI-DBI Mode C compatible SPI controller. This driver emulates MIPI DBI
  mode C using a SPI controller and GPIO pins
compatible: "zephyr,mipi-dbi-spi"

include: ["mipi-dbi-controller.yaml", "pinctrl-device.yaml"]

properties:
  spi-dev:
    type: phandle
    required: true
    description: |
      SPI device to use for data transfers with MIPI DBI commands. This SPI
      device should be connected to the MIPI DBI display.

  dc-gpios:
    type: phandle-array
    description: |
      Data/command gpio pin. Required when using 4 wire SPI mode (Mode C1).
      Set to low when sending a command, or high when sending data.

  dc-gpios-shared:
    type: boolean
    description: |
      Set this property if the data/command pin is physically shared with
      another function of the SPI bus, such as a controller MISO line that
      pinctrl also assigns to the same pad. When set, the driver takes
      ownership of the bus, drives the pin only for the duration of a
      transfer, and then re-applies the default pin control state of the bus
      before dropping that ownership, which hands the pad back so another
      device can use it while the display is idle. The bus must therefore be
      described with pin control.

      A pin shared with the MISO line cannot carry a 4 wire read, and a read
      of any mode would hand the bus over while the pad is still muxed away
      from it, so reads are refused on a shared pin and the controllers on
      such a bus have to be write-only.

  te-gpios:
    type: phandle-array
    description: |
      Tearing Effect GPIO pin. Set to high when the display is blanking
      (i.e., not actively reading pixels from its RAM).

  reset-gpios:
    type: phandle-array
    description: |
      Reset GPIO pin. Set high to reset the display

  xfr-min-bits:
    type: string
    default: "MIPI_DBI_SPI_XFR_8BIT"
    description:
      On rare types of SPI interfaces, discrete shift registers can be found
      whose task is to convert the serial SPI bit stream to the parallel MCU
      interface with clock and bit accuracy. Typically, these are 16 bits wide.
      These definitions should match those in dt-bindings/mipi_dbi/mipi_dbi.h
    enum:
      - "MIPI_DBI_SPI_XFR_8BIT"
      - "MIPI_DBI_SPI_XFR_16BIT"

  write-only:
    type: boolean
    description: |
      Only writes to display controller, do not perform reads.
      If all controllers are write-only, read functions will be
      optimized out for size.
      It can also be used as an alternative to half duplex when
      only one data line is connected.
