description: Texas Instruments Unified Communication Peripheral

compatible: "ti,unicomm"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  unicomm-fixed-mode:
    type: boolean
    description: |
      Guards against an invalid write to IPMODE on UNICOMMs that have only one mode.
