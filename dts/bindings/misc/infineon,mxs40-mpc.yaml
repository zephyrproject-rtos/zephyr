title: Infineon MXS40 Memory Protection Controller (MPC)

description: |
  Infineon MXS40 MPC hardware block. Each instance controls access to
  a specific memory region (RRAM, SRAM, SoC memory, or external flash).

  Memory regions governed by this MPC are described as child nodes. Each
  child defines an (offset, size) range within the controlled memory and
  the protection-context (PC) configuration that grants access to it.

  Example (RAMC0 MPC, granting M33-S and M33-NS access to separate SRAM
  slices):

    mpc_ramc0: mpc@52234000 {
        compatible = "infineon,mxs40-mpc";
        reg = <0x52234000 0x1000>;
        violation-response = "bus-error";
        #address-cells = <1>;
        #size-cells = <1>;
        status = "okay";

        /* M33 Secure domain: PC2 and PC7, Secure RW */
        region@1000 {
            reg = <0x00001000 0x00057000>;
            pc-configs = <2 0 3  7 0 3>;
        };
    };

  pc-configs is a flat array of 3-tuples:
    (pc_index, secure, access)
    pc_index : 2, 5, 6, or 7
    secure   : 0 = Secure, 1 = Non-Secure  (cy_en_mpc_sec_attr_t)
    access   : 1 = Read-only, 3 = Read-Write  (cy_en_mpc_access_attr_t)

include: arm,mpc-base.yaml

compatible: "infineon,mxs40-mpc"

properties:
  skip-auto-config:
    type: boolean
    description: |
      When set, the driver skips automatic region configuration for this MPC.
      Required for RRAMC0 whose block-level programming must go through SROM.

  infineon,enable-socmem:
    type: boolean
    description: |
      When set, the driver calls Cy_SysEnableSOCMEM() before configuring
      this MPC. Required for the SOCMEM SRAM MPC.

child-binding:
  description: |
    A single MPC-controlled memory region. The reg property encodes the
    byte offset and size of the region within the memory controlled by
    the parent MPC instance.

  properties:
    reg:
      type: array
      required: true
      description: "<offset size> within the MPC-controlled memory, in bytes."

    pc-configs:
      type: array
      required: true
      description: |
        Flat array of (pc, secure, access) 3-tuples that configure which
        protection contexts may access this region.
        pc     : Protection context index (2, 5, 6, or 7)
        secure : 0 = Secure bus attribute,  1 = Non-Secure bus attribute
        access : 1 = Read-only,  3 = Read-Write

    bus-nonsecure:
      type: boolean
      description: |
        When set, the driver also marks this region Non-Secure in the MPC's
        non-ROT (bus) security-attribute LUT via Cy_Mpc_ConfigMpcStruct(),
        in addition to the per-PC ROT configuration from pc-configs. This is
        the security attribute the IDAU / BXNS check consults, so it is
        required for a Non-Secure code region (e.g. the NS image in external
        flash) to be reachable from the Non-Secure world.
