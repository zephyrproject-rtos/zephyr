description: |
  Texas Instruments K3 Error Signaling Module (ESM).

  Aggregates SoC error/event inputs and can raise high/low/config priority
  interrupts to a CPU (and optionally drive an external ERROR pin). Compatible
  with the U-Boot / Linux "ti,j721e-esm" register layout.

  Optional ti,esm-pins lists events to enable at init (high priority + pin +
  interrupt). Runtime control is through the ti_k3_esm driver API.

compatible: "ti,k3-esm"

include: [base.yaml]

properties:
  reg:
    required: true

  interrupts:
    description: |
      Optional CPU interrupts for the ESM. When three are present the expected
      order is config, high-priority, low-priority. Without interrupts the
      driver still supports enable/clear/pending polling.

  interrupt-names:
    type: string-array
    description: |
      Optional names "cfg", "hi", "low" matching the interrupts property.

  ti,esm-pins:
    type: array
    description: |
      Event numbers to enable at probe time (high priority). See
      <zephyr/dt-bindings/misc/ti-k3-esm.h>.

  max-events:
    type: int
    default: 1024
    description: |
      Highest valid event index + 1 for this ESM instance.
