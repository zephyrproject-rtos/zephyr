description: |
  Infineon MXCORDIC hardware math accelerator.

  The MXCORDIC IP block is a CORDIC (COordinate Rotation DIgital Computer)
  engine found on PSOC Control C3 (PSC3) devices. It supports circular and
  hyperbolic operating modes and is used to accelerate trigonometric,
  hyperbolic and square-root computations.

compatible: "infineon,mxcordic"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true
