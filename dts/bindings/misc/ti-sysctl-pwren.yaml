# Common SYSCTL PWREN consumer property for AM13E peripherals.

properties:
  ti,pwren:
    type: phandle-array
    specifier-space: pwren
    description: |
      Power-enable this peripheral via SYSCTL.PWREN_*.
      Format: <&sysctl offset bit>.
