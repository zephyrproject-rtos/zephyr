description: |
  Nordic external analog input (AIN) to GPIO pin mapping

  Describes which GPIO pin is connected to each external analog input of the
  SoC. The mapping is shared by all analog peripherals that use AIN inputs
  (SAADC, COMP and LPCOMP).

  Entry index is the AIN number, so the n-th entry describes AINn. AIN inputs
  that do not exist on the SoC are described with an empty entry (<0>).
  Internal inputs (for example VDD) are not listed.

  Example for a SoC with only AIN2 (P0.04) and AIN3 (P0.05):

    nrf_ain: analog-inputs {
            compatible = "nordic,nrf-ain";
            ain-gpios = <0>, <0>, <&gpio0 4 0>, <&gpio0 5 0>;
    };

  The mapping mirrors the *_EXTERNAL_AIN_PSELS tables provided by nrfx, which
  remain the source of truth. Consistency between this node and nrfx is
  verified at build time.

compatible: "nordic,nrf-ain"

properties:
  ain-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO pin connected to each external analog input, indexed by AIN number.
      Use <0> for AIN inputs that are not available on the SoC.
