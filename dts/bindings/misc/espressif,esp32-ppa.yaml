description: |
  Espressif pixel processing accelerator.

  The accelerator scales, rotates, mirrors and blends blocks of pixels, and
  moves them with its own 2D DMA. It is driven from graphics code rather than
  through a Zephyr device, so this node describes the registers and the
  transfer completion interrupt it needs.

compatible: "espressif,esp32-ppa"

include: base.yaml

properties:
  reg:
    required: true

  reg-names:
    required: true

  interrupts:
    required: true
