description: |
  Espressif pixel processing accelerator.

  The accelerator scales, rotates, mirrors and blends blocks of pixels, and
  moves them with its own 2D DMA.

  This binding only describes the registers and the transfer completion
  interrupt.

compatible: "espressif,esp32-ppa"

include: base.yaml

properties:
  reg:
    required: true

  reg-names:
    required: true
    description: |
      Two entries, "ppa" for the accelerator and "dma2d" for the 2D DMA
      that moves the pixels for it.

  interrupts:
    required: true
