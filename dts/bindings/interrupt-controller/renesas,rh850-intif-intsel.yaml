description: Renesas RH850 Interrupt selection
compatible: "renesas,rh850-intif-intsel"

include: [interrupt-controller.yaml, base.yaml]

properties:
  "#interrupt-cells":
    const: 0

  channel:
    type: int
    required: true
    description: |
      Indicates the number of interrupt selection
