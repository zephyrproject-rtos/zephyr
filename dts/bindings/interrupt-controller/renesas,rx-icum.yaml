description: Renesas ICUM Interrupt controller
compatible: "renesas,rx-icum"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  "#interrupt-cells":
    const: 2

interrupt-cells:
  - irq
  - priority
