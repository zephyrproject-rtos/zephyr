description: |
  One ESP32 CPU interrupt line that carries several interrupt matrix sources.

  An interrupt nexus, not an interrupt controller, so it adds no interrupt
  level. A consumer names only its matrix source; the map turns that into the
  <line flags irq> specifier of the espressif,esp32-intmux node:

      interrupt-parent = <&cpu_interrupt_5>;
      interrupts = <UART0_INTR_SOURCE>;

  resolves to intmux <5 0 UART0_INTR_SOURCE>, the 0 being the line's flags.

  The line's flags are given once, in ESP_CPU_INTERRUPT(n, flags), and are 0
  or ESP_INTR_FLAG_IRAM: every handler on the line, and everything it calls,
  runs with the flash cache off. A line without it is masked while the flash
  cache is off, and an interrupt raised meanwhile is taken when the line is
  unmasked.

  Write the node with ESP_CPU_INTERRUPT(n, flags) from
  <zephyr/dt-bindings/interrupt-controller/espressif-intmux-common.h>, so that
  "cpu-line" and the line in "interrupt-map" are written once.

compatible: "espressif,esp32-cpu-interrupt"

include: [interrupt-nexus.yaml, base.yaml]

properties:
  "#interrupt-cells":
    const: 1

  "#address-cells":
    const: 0

  cpu-line:
    type: int
    required: true
    description: CPU interrupt line this node stands for.

  interrupt-map-mask:
    required: true

  interrupt-map-pass-thru:
    required: true
