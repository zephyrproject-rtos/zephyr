description: |
  Renesas RH850 PE-local interrupt controller (INTC1).
  One instance per processor element (PE).

compatible: "renesas,rh850-intc1"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  "#interrupt-cells":
    const: 2

  num-lines:
    type: int
    required: true
    description: Number of interrupt lines handled by this INTC1 instance.

  renesas,pe-id:
    type: int
    required: true
    description: Hardware PEID of the processor element owning this INTC1 instance.

interrupt-cells:
  - irq
  - priority
