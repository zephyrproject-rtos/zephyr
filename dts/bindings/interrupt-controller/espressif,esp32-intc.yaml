description: |
  ESP32 interrupt controller: the CPU interrupt lines (level 1).

  A consumer that has a CPU line to itself points here directly and names the
  line and the interrupt matrix source routed to it:

      interrupt-parent = <&intc>;
      interrupts = <10 SYSTIMER_TARGET2_EDGE_INTR_SOURCE 0>;

  Consumers that share a line point at an espressif,esp32-cpu-interrupt node
  instead, which maps them onto the espressif,esp32-intmux aggregator.

  reg carries the INTMUX register bases the dispatcher reads, per core: the
  MAP (per-source routing) base then the pending-STATUS base. Single-core
  parts provide one pair (map0, status0); dual-core parts add a second pair
  (map1, status1). The STATUS entry size determines the number of
  pending-status words (size / 4).

compatible: "espressif,esp32-intc"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#interrupt-cells":
    const: 3

  reserved-lines:
    type: array
    description: |
      CPU interrupt lines kept for users that connect at run time with
      irq_connect_dynamic(), such as the Wi-Fi library, whose handler is not
      known at build time. No devicetree consumer and no
      espressif,esp32-cpu-interrupt node may use a listed line.

interrupt-cells:
  - irq
  - source
  - flags
