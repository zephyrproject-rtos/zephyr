description: |
  Texas Instruments K3 Interrupt Router managed via TISCI.

  The Interrupt Router muxes M interrupt inputs to N outputs. Configuration of
  the per-output MUXCNTL registers is performed by System Firmware through the
  TISCI resource-management IRQ set/release messages.

  This node is a container for host IR output children (`ti,sci-intr-out`).
  Each child has reg = output index and interrupts = parent VIM/GIC line.
  Peripherals set interrupt parent to that child and pass only the IR input
  number.

compatible: "ti,sci-intr"

include: base.yaml

properties:
  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  ti,sci:
    type: phandle
    required: true
    description: Phandle to the TISCI system controller node.

  ti,sci-dev-id:
    type: int
    required: true
    description: TISCI device ID of this interrupt router instance.

examples:
  - |
    main_gpio_intr: interrupt-router {
        compatible = "ti,sci-intr";
        #address-cells = <1>;
        #size-cells = <0>;
        ti,sci = <&dmsc>;
        ti,sci-dev-id = <3>;

        main_gpio_intr_16: interrupt-controller@10 {
            compatible = "ti,sci-intr-out";
            reg = <16>;
            interrupt-controller;
            #interrupt-cells = <2>;
            interrupt-parent = <&vim>;
            interrupts = <0 104 IRQ_TYPE_LEVEL IRQ_DEFAULT_PRIORITY>;
        };
    };

    main_i2c4: i2c@fe80000 {
        interrupt-parent = <&main_gpio_intr_16>;
        interrupts = <178 0>;   /* IR input 178; L2 priority cell must be 0 */
    };
