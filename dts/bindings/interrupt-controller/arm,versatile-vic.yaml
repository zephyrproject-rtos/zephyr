description: ARM PL190 Vectored Interrupt Controller

compatible: "arm,versatile-vic"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#interrupt-cells":
    const: 2

interrupt-cells:
  - irq
  - priority
