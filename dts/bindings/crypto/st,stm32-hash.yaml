title: STM32 HASH Processor

description: |
  STM32 hardware hash accelerator supporting SHA-224, SHA-256
  and optionally SHA-384, SHA-512, and SHA-3 hashing algorithms.

compatible: "st,stm32-hash"

include: [base.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  resets:
    required: true

  st,has-sha384-algorithm:
    type: boolean
    description: |
      Support SHA384 algorithm.

  st,has-sha512-algorithm:
    type: boolean
    description: |
      Support SHA512 algorithm.

  st,has-sha3-algorithm:
    type: boolean
    description: |
      Support SHA3-224, SHA3-256, SHA3-384, and SHA3-512 algorithms.
      Currently supported by the STM32MP13 HASH peripheral.
