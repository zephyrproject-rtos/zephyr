description: |
  Andes Data Local Memory dedicated address spaces that is independent of
  the memory subsystem. Accesses to DLM bypass the cache and memory
  subsystems to achieve minimal latency.

  DLM supports load/store data accesses. When the DLM address range overlaps
  with system bus (AHB/AXI) address spaces, these accesses are serviced by
  DLM with higher priority than the corresponding system bus accesses.

compatible: "andestech,dlm"

include: base.yaml

properties:
  reg:
    required: true
