# SPDX-License-Identifier: Apache-2.0

description: |
    The TI CC35XX pin controller is a singleton node responsible for controlling
    pin function selection and pin properties. For example, you can
    use this node to route UART0 RX to pin 55 and enable the pull-up resistor
    on the pin.

compatible: "ti,cc35xx-pinctrl"

include: base.yaml

child-binding:
  child-binding:
    include:
      - name: pincfg-node.yaml
        property-allowlist:
          - drive-push-pull
          - drive-open-drain
          - bias-disable
          - bias-pull-down
          - bias-pull-up
          - drive-strength

    properties:
      pinmux:
        required: true
        type: array
        description: |
          An array of pins sharing the same group properties. The pins should
          be defined using pre-defined macros or, alternatively, using the
          TI_CC35XX_PINMUX helper macro.
