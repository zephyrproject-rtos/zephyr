title: Microchip PIO pin controller (group g1)

description: |
  Microchip PIO pin controller (group g1).

  The pin controller is a singleton node, labeled 'pinctrl', that contains the
  PIO GPIO controllers as child nodes and the pin configurations used by
  devices. Pins are selected with the MCHP_PINMUX macros of the SoC pinctrl
  header, for example:

    #include <dt-bindings/pic32c/pic32cz_ca/pic32cz_ca70/pic32cz2051ca70144-pinctrl.h>

    &pinctrl {
      uart1_default: uart1_default {
        group1 {
          pinmux = <PA5C_UART1_URXD1>, <PA6C_UART1_UTXD1>;
          bias-pull-up;
        };
      };
    };

  Peripheral functions A to D are routed through PIO_ABCDSR. GPIO entries hand
  the pin to the PIO. Extra functions (analog inputs, wake-up inputs, crystal
  and debug pins) are left to the peripheral that owns them; for PB4 to PB7
  and PB12 they also restore the system function selected by CCFG_SYSIO.

  Group g1 PIO PINCTRL driver supports following hardware peripherals:
    - module name="PIO" id="11004" version="V"

compatible: "microchip,pio-g1-pinctrl"

include: base.yaml

properties:
  "#address-cells":
    required: true
    const: 1
  "#size-cells":
    required: true
    const: 1

child-binding:
  description: |
    Each child node defines the configuration for a particular state.
  child-binding:
    description: |
      The grandchild nodes group pins that share the same pin configuration.

    include:
      - name: pincfg-node.yaml
        property-allowlist:
          - bias-pull-up
          - bias-pull-down
          - drive-open-drain
          - input-enable
          - output-enable

    properties:
      pinmux:
        required: true
        type: array
        description: |
          An array of pins sharing the same group properties, defined with the
          macros of the SoC pinctrl header.

      slew-rate:
        type: string
        default: "fast"
        enum:
          - "fast"
        description: |
          The PIO has no slew rate control. This property exists for the
          shared PIC32CZ CA pin configuration encoding and only accepts its
          default value.
