description: ADI MAX32 compatible Counter RTC

compatible: "adi,max32-rtc-counter"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  sqw-frequency:
    type: int
    description: |
      Square wave output frequency value in Hz. Default is 0, which means that
      the square wave output is disabled.
    default: 0
    enum:
      - 0
      - 1
      - 512
      - 4096
      - 32768

examples:
  - |
    /*
     * Enable 32kHz square wave output on P3.1.
     */
    &rtc_counter {
        status = "okay";
        pinctrl-0 = <&sqwout_p3_1>;
        pinctrl-names = "default";
        sqw-frequency = <32768>;
    };

  - |
    /* Use INRO as clock source */
    &clk_32k {
            status = "okay";
            clocks = <&clk_inro>;
    };

  - |
    /* Use RTC_CLK_IN as clock source */
    &clk_rtc_in {
      status = "okay";
      pinctrl-0 = <&rtc_clk_in_p0_12>;
      pinctrl-names = "default";
    };

    &clk_32k {
      status = "okay";
      clocks = <&clk_rtc_in>;
    };

    &rtc_counter {
      status = "okay";
    };
