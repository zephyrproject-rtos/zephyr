description: |
  NXP LPC Repetitive Interrupt Timer: a 48 bit up-counter with one compare
  register, a compare mask and clear-on-match.

compatible: "nxp,lpc-rit"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
