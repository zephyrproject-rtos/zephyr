description: Nordic nRF family SPIM (SPI controller with EasyDMA)

compatible: "nordic,nrf-spim"

include: ["nordic,nrf-spi-common.yaml", "memory-region.yaml"]

properties:
  dmm-buffer-size:
    type: int
    description: |
      Maximum transfer chunk size in bytes for this controller when the
      Nordic DMM buffer path is enabled. Must be between 1 and 65535.
      If absent, CONFIG_SPI_NRFX_DMM_BUFFER_SIZE supplies the limit.
      The EasyDMA MAXCNT limit also applies.

      This limit also applies to DMA-accessible buffers, which do not need
      a bounce allocation. For inaccessible buffers, full-duplex transfers
      can allocate twice the chunk size from the controller's DMA region.
      Allow space for those allocations and other users of the region.
      This property has no effect on the non-DMM RAM buffer path.

  rx-delay-supported:
    type: boolean
    description: |
      Indicates if the SPIM instance has the capability of delaying SDI
      sampling. This property needs to be defined at SoC level DTS files.

  rx-delay:
    type: int
    enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
    description: |
      Number of 64 MHz clock cycles (15.625 ns) delay from the sampling edge
      of SCK (leading or trailing, depending on the CPHA setting used) until
      the input serial data on SDI is actually sampled. This property does
      not have any effect if the rx-delay-supported property is not set.
