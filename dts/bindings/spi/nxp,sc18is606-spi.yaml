description: |
  SPI controller behind an NXP SC18IS606 I2C to SPI bridge.

  Deprecated in favor of nxp,sc18is60x-spi. Kept so existing
  overlays continue to build.

compatible: "nxp,sc18is606-spi"
include: spi-controller.yaml
on-bus: nxp,sc18is60x

properties:
  frequency:
    type: int
    deprecated: true
    default: 1875
    enum:
      - 1875
      - 455
      - 115
      - 58
    description: |
      Ignored. Clock rate is the frequency field of the spi_config passed
      to spi_transceive(), normally spi-max-frequency on the SPI child.

  spi-mode:
    type: int
    deprecated: true
    default: 0
    enum:
      - 0
      - 1
      - 2
      - 3
    description: |
      Ignored. CPOL and CPHA come from the operation field of that
      spi_config, normally spi-cpol and spi-cpha on the SPI child.
