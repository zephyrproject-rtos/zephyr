description: TI SimpleLink CC23x0_CC27xx SPI node

compatible: "ti,cc23x0-cc27xx-spi"

include: [spi-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clock-id:
    type: int
    required: true
    description: |
      CLKCTL peripheral clock gate ID for this SPI instance.
      Use CLKCTL_SPI0 (0x400) for SPI instance 0 or CLKCTL_SPI1 (0x800)
      for SPI instance 1.

  dmas:
    description: |
      Optional TX & RX DMA specifiers. Each specifier will have a phandle
      reference to the DMA controller, the channel number, and the peripheral
      trigger source.

      Example for channels 0/1 with spi0txtrg/spi0rxtrg trigger sources:
        dmas = <&dma 0 0>, <&dma 1 1>;

  dma-names:
    description: |
      Required if the dmas property exists. This should be "tx" and "rx"
      to match the dmas property.

      Example:
        dma-names = "tx", "rx";
