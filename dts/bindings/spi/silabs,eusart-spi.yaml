title: |
  Silicon Labs Series 2 EUSART (Enhanced Universal Synchronous/Asynchronous Receiver/Transmitter)

description: |
  EUSART (Enhanced Universal Synchronous/Asynchronous Receiver/Transmitter) peripheral for
  Silicon Labs Series 2 SoCs used in SPI mode.

  The TX signal is SDO in controller mode and SDI in peripheral mode, while the RX signal is SDI in
  controller mode and SDO in peripheral mode. The CS signal may be configured in pinctrl or as a
  GPIO pin in controller mode. It must be configured in pinctrl in peripheral mode.

examples:
  - |
    /* Controller mode with GPIO CS and DMA */
    &pinctrl {
            eusart1_default: eusart1_default {
                    group0 {
                            pins = <EUSART1_TX_PC1>, <EUSART1_SCLK_PC3>;
                            drive-push-pull;
                            output-high;
                    };

                    group1 {
                            pins = <EUSART1_RX_PC2>;
                            input-enable;
                    };
            };
    };

    &eusart1 {
            compatible = "silabs,eusart-spi";
            #address-cells = <1>;
            #size-cells = <0>;
            pinctrl-0 = <&eusart1_default>;
            pinctrl-names = "default";
            cs-gpios = <&gpioc 0 GPIO_ACTIVE_LOW>;
            dmas = <&dma0 DMA_REQSEL_EUSART1TXFL>, <&dma0 DMA_REQSEL_EUSART1RXFL>;
            dma-names = "tx", "rx";
            status = "okay";

            sensor@0 {
                    compatible = "vnd,spi-device";
                    reg = <0>;
                    spi-max-frequency = <DT_FREQ_M(1)>;
            };
    };

  - |
    /* Peripheral mode with CS through pinctrl, TX is SDI, RX is SDO */
    &pinctrl {
            eusart1_default: eusart1_default {
                    group0 {
                            pins = <EUSART1_RX_PC0>;
                            drive-push-pull;
                            output-high;
                    };

                    group1 {
                            pins = <EUSART1_TX_PC1>, <EUSART1_SCLK_PC3>, <EUSART1_CS_PC2>;
                            input-enable;
                    };
            };
    };

    &eusart1 {
            compatible = "silabs,eusart-spi";
            pinctrl-0 = <&eusart1_default>;
            pinctrl-names = "default";
            dmas = <&dma0 DMA_REQSEL_EUSART1TXFL>, <&dma0 DMA_REQSEL_EUSART1RXFL>;
            dma-names = "tx", "rx";
            status = "okay";
    };

compatible: "silabs,eusart-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true
