description: K3 Watchdog timer (RTI module) available in the K3 generation of processors.

compatible: "ti,j7-rti-wdt"

include: base.yaml

properties:
  reg:
    required: true

  clock-frequency:
    type: int
    required: true
    description:
      Functional clock rate in Hz. Used when the node has no clocks
      property; otherwise the rate is read from the clock controller.

  assigned-clocks:
    type: phandle-array
    specifier-space: clock
    description:
      Clock whose parent is selected at init. Only the first entry is
      used, and it must belong to the controller named by clocks.

  assigned-clock-parents:
    type: phandle-array
    specifier-space: clock
    description:
      Parent selected for the first assigned-clocks entry at init. K3 SCMI
      firmware lets an agent select the parent of the RTI clock but not set
      its rate, and only a slow parent gives timeouts above about 1.3 s.

  interrupts:
    description:
      Watchdog interrupt line, if present NMI mode is supported.

  reset-capable:
    type: boolean
    description:
      Indicates reset mode is supported by hardware.
      If set, watchdog timeout will trigger a reset.
      The SoC can only be configured for either NMI
      or Reset mode at a time. Support for NMI or Reset is SoC
      specific.
