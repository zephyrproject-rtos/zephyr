description: |
  Texas Instruments MSPM0 Independent Watchdog Timer (IWDT)

  A free-running watchdog counter clocked by LFOSC, independent of the
  main system clock. No windowing, no interrupt, no callback - feed it
  any time before it expires or it resets the device. Only present on
  LFSS-equipped MSPM0 families.

compatible: "ti,mspm0-iwdt"

include: base.yaml

properties:
  reg:
    required: true
