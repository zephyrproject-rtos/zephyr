description: |
  OpenTitan Always-On Timer, version 1.0.

  Use lowrisc,opentitan-aontimer-2.0.0 for version 2.0.0 and later, which
  have a different register map.

compatible: "lowrisc,opentitan-aontimer"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clock-frequency:
    type: int
    description: AON-Timer frequency
    required: true

  wdog-lock:
    type: boolean
    description: |
      When set, lock watchdog configuration after setup until the next
      reset.
