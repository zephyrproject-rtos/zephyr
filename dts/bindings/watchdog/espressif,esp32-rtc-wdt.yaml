description: |
  ESP32 RTC watchdog timer (RWDT).

  The RTC watchdog runs from the RTC slow clock in the low-power domain.

compatible: "espressif,esp32-rtc-wdt"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
