description: |
  Texas Instruments K3 reset source register.

  Must be a child of a syscon node. The hwinfo reset-cause backend reads and
  clears the register through the parent syscon.

compatible: "ti,k3-rst-src"

include: base.yaml

properties:
  reg:
    required: true
