description: |
  ST STM32 Ethernet MAC, a child node of the Ethernet controller.

compatible: "st,stm32-ethernet"

include: [ethernet-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true
  clocks:
    required: true
  clock-names:
    required: true
  interrupts:
    required: true
  pinctrl-0:
    required: true
  pinctrl-names:
    required: true
  phy-connection-type:
    required: true
  phy-handle:
    required: true
