description: Realtek RTL8211F Ethernet PHY device

compatible: "realtek,rtl8211f"

include: ethernet-phy-common.yaml

properties:
  reset-gpios:
    type: phandle-array
    description: GPIO connected to PHY reset signal pin. Reset is active low.
  int-gpios:
    type: phandle-array
    description: GPIO for interrupt signal indicating PHY state change.
  realtek,rgmii-delay:
    type: string
    description: |
      Configure RTL8211F internal RGMII clock delay mode.

      This property is only applicable when the PHY is connected using an
      RGMII interface.

      - "none": no internal delay
      - "id": enable RX and TX delay
      - "rxid": enable RX delay only
      - "txid": enable TX delay only
    enum:
      - "none"
      - "id"
      - "rxid"
      - "txid"
    default: "id"
  default-speeds:
    default: ["10BASE Half-Duplex", "10BASE Full-Duplex", "100BASE Half-Duplex",
              "100BASE Full-Duplex", "1000BASE Half-Duplex", "1000BASE Full-Duplex"]
  realtek,clkout-disable:
    type: boolean
    description:
      Disable CLKOUT clock, CLKOUT clock default is enabled after hardware reset.
  realtek,clkout-ssc-enable:
    type: boolean
    description:
      Enable CLKOUT SSC mode, CLKOUT SSC mode default is disabled after hardware reset.
  realtek,rxc-ssc-enable:
    type: boolean
    description:
      Enable RXC SSC mode, RXC SSC mode default is disabled after hardware reset.
  realtek,sysclk-ssc-enable:
    type: boolean
    description:
      Enable SYSCLK SSC mode, SYSCLK SSC mode default is disabled after hardware reset.
