description: Realtek RTL8211F Ethernet PHY device

compatible: "realtek,rtl8211f"

include: ethernet-phy-common.yaml

properties:
  reset-gpios:
    type: phandle-array
    description: GPIO connected to PHY reset signal pin. Reset is active low.
  int-gpios:
    type: phandle-array
    description: GPIO for interrupt signal indicating PHY state change.
  realtek,rgmii-delay:
    type: string
    description: |
      Configure RTL8211F internal RGMII clock delay mode.

      This property is only applicable when the PHY is connected using an
      RGMII interface.

      - "none": no internal delay
      - "id": enable RX and TX delay
      - "rxid": enable RX delay only
      - "txid": enable TX delay only
    enum:
      - "none"
      - "id"
      - "rxid"
      - "txid"
    default: "id"
  default-speeds:
    default: ["10BASE Half-Duplex", "10BASE Full-Duplex", "100BASE Half-Duplex",
              "100BASE Full-Duplex", "1000BASE Half-Duplex", "1000BASE Full-Duplex"]
  timing-role:
    type: string
    description: |
      1000BASE-T master/slave role. Omit for IEEE auto resolution (default).

      - "forced-master"    - manual MS enable, MS=1
      - "forced-slave"     - manual MS enable, MS=0
      - "preferred-master" - auto resolution, prefer MS=1
      - "preferred-slave"  - auto resolution, prefer MS=0

      Use "forced-master" on a direct point-to-point link to a PC/RPi NIC
      if the link flaps or caps at 100 Mb (auto master/slave never agrees
      with some NICs). Never force the same role on both ends.
    enum:
      - "forced-master"
      - "forced-slave"
      - "preferred-master"
      - "preferred-slave"