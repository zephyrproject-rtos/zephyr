# Common reset gpio properties for MIIPHY devices

properties:
  reset-gpios:
    type: phandle-array
    description: |
      Optional GPIO used to reset the PHY
  reset-assert-us:
    type: int
    description: |
      Time in microseconds to hold the reset-gpios pin asserted.
  reset-deassert-us:
    type: int
    description: |
      Time in microseconds to wait after deasserting the reset-gpios pin.
