# Common fields for MIIPHY devices

include:
  - name: phy.yaml
  - name: ethernet-phy-default-speeds.yaml

properties:
  reg:
    required: true
    description: PHY address

  rx-internal-delay-ps:
    type: int
    description: |
      Specifies the internal delay of the receive path in picoseconds.
      Only for RGMII interfaces. Applied by the PHY.

  tx-internal-delay-ps:
    type: int
    description: |
      Specifies the internal delay of the transmit path in picoseconds.
      Only for RGMII interfaces. Applied by the PHY.
