description: |
  Cadence GEM in the Xilinx Zynq-7000 processing system.

  The second register range is the GEMx_CLK_CTRL register of the SLCR,
  through which the driver provides the transmit clock of the MAC itself
  and retunes it to the link speed.
  The MAC does not support half duplex at 1000 Mbit/s; restrict the PHY
  with its default-speeds property if that matters.

compatible: "xlnx,zynq-gem"

include: cdns,gem.yaml

properties:
  reg-names:
    required: true
    description: |
      Names of the register ranges: "mac" for the GEM itself and "clkc"
      for its clock control register in the SLCR.

  clock-names:
    description: |
      Names of the clocks. "pclk", "hclk" and "tsu_clk" are described in
      the binding of the MAC, the peripheral clock is CPU_1x. In place
      of "tx_clk", which the driver provides, there is

      - "pll": the PLL supplying the GEM TX clock, by default the IO PLL,
        required. The GEM TX clock is derived from it through the two
        dividers of the clock control register.
