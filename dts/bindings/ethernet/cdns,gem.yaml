description: |
  Cadence GEM (Gigabit Ethernet MAC), also known as MACB.

  This is the generic binding for the MAC, SoC integrations add a more
  specific compatible in front of it, for example:

    gem0: ethernet@e000b000 {
      compatible = "xlnx,zynq-gem", "cdns,gem";
      reg = <0xe000b000 0x1000>, <0xf8000140 0x4>;
      reg-names = "mac", "clkc";
      interrupts = <GIC_SPI 22 IRQ_TYPE_LEVEL IRQ_DEFAULT_PRIORITY>;
      phy-handle = <&gem0_phy>;
      phy-connection-type = "rgmii";

      mdio {
        compatible = "cdns,macb-mdio";
        #address-cells = <1>;
        #size-cells = <0>;

        gem0_phy: phy@0 {
          compatible = "ethernet-phy";
          reg = <0>;
        };
      };
    };

  The MAC configuration is derived from the design configuration registers
  of the core; the phy-connection-type property selects the PHY interface,
  MII when it is absent.

compatible: "cdns,gem"

include: ethernet-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  phy-handle:
    required: true
