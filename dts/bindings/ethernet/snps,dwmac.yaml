title: Synopsys DesignWare MAC

description: |
  Synopsys DesignWare MAC (DW MAC) is a highly configurable, high-performance
  Ethernet Media Access Controller (MAC) IP core, that is used by many SoC vendors.
  This binding is derived from the matching Linux kernel binding.

compatible: "snps,dwmac"

include: ethernet-controller.yaml

properties:
  snps,clk-csr:
    type: int
    description: |
      Value programmed into the MAC MDIO Address CR field.
      When present, this fixed value is used directly instead of deriving
      the MDIO clock range from the MAC clock rate.
