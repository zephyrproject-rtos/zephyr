description: |
  OpenCores ethmac MDIO controller

  This node must be a child of the "opencores,ethoc" MAC node, whose
  registers it uses.

compatible: "opencores,ethoc-mdio"

include: mdio-controller.yaml

examples:
  - |
    ethernet@92000000 {
        compatible = "opencores,ethoc";
        reg = <0x92000000 0x800>;
        interrupts = <4>;
        phy-handle = <&phy>;

        mdio {
            compatible = "opencores,ethoc-mdio";
            #address-cells = <1>;
            #size-cells = <0>;

            phy: ethernet-phy@1 {
                compatible = "ethernet-phy";
                reg = <1>;
            };
        };
    };
