description: |
  Cadence GEM in the Xilinx ZynqMP processing system.

  The second register range is the GEMx_REF_CTRL register of the CRL_APB,
  through which the driver provides the transmit clock of the MAC itself
  and retunes it to the link speed. The driver lifts the CRL_APB write
  protection for that write, which needs the CRL_APB registers to be
  accessible at their physical address.

compatible: "xlnx,zynqmp-gem"

include: cdns,gem.yaml

properties:
  reg-names:
    required: true
    description: |
      Names of the register ranges: "mac" for the GEM itself and "clkc"
      for its reference clock control register in the CRL_APB.

  clock-names:
    description: |
      Names of the clocks. "pclk", "hclk", "rx_clk" and "tsu_clk" are
      described in the binding of the MAC, the peripheral clock is
      LPD_LSBUS. In place of "tx_clk", which the driver provides, there is

      - "pll": the PLL supplying the GEM reference clock, by default the
        IO PLL, required. The GEM TX clock is derived from it through the
        two dividers of the reference clock control register.
