# Common fields for Ethernet devices

include:
  - name: base.yaml
  - name: ethernet-mac-address.yaml

properties:
  max-speed:
    type: int
    description: |
      Specifies the maximum supported speed of the Ethernet controller in Mbit/s.

  phy-handle:
    type: phandle
    dependency-mode: ignore
    description: |
      Specifies a reference to a node representing a PHY device.

  phy-connection-type:
    type: string
    description: |
      Specifies the interface connection type between ethernet MAC and PHY.
    enum:
      - "mii"
      - "rmii"
      - "gmii"
      - "rgmii"
      - "rgmii-id"
      - "rgmii-txid"
      - "rgmii-rxid"
      - "tbi"
      - "rtbi"
      - "smii"
      - "sgmii"
      - "rev-mii"
      - "xgmii"
      - "moca"
      - "qsgmii"
      - "trgmii"
      - "internal"

  pcs-handle:
    type: phandles
    dependency-mode: ignore
    description: |
      Physical coding sublayer (PCS) devices used by this Ethernet controller,
      for example on an MDIO bus. An external PHY behind the PCS is described
      by phy-handle.

  pcs-handle-names:
    type: string-array
    description: |
      Names for the pcs-handle entries, in the same order.

  ptp-clock:
    type: phandle
    description: |
      Corresponding ptp clock device.

  rx-fifo-depth:
    type: int
    description: |
      Specifies the depth of the receive FIFO buffer.

  tx-fifo-depth:
    type: int
    description: |
      Specifies the depth of the transmit FIFO buffer.

  rx-internal-delay-ps:
    type: int
    description: |
      Specifies the internal delay of the receive path in picoseconds.
      Only for RGMII interfaces. Applied by the MAC.

  tx-internal-delay-ps:
    type: int
    description: |
      Specifies the internal delay of the transmit path in picoseconds.
      Only for RGMII interfaces. Applied by the MAC.
