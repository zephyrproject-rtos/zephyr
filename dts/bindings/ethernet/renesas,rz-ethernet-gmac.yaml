description: Renesas RZ Ethernet GMAC

compatible: "renesas,rz-ethernet-gmac"

include:
  - name: snps,dwmac.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  interrupt-names:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  phy-connection-type:
    required: true

  phy-handle:
    required: true
