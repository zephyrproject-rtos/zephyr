description: |
  Cadence GEM in the SiFive FU540.

  The second register range is the GEMGXL management register, through
  which the driver provides the transmit clock of the MAC itself and
  switches it between the gigabit and the slower rates to follow the link
  speed. The clocks are "pclk" and "hclk", both the GEMGXL PLL.

compatible: "sifive,fu540-c000-gem"

include: cdns,gem.yaml

properties:
  reg-names:
    required: true
    description: |
      Names of the register ranges: "mac" for the GEM itself and "mgmt"
      for the GEMGXL management register.
