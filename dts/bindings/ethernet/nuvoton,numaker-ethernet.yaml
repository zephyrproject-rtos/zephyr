title: Nuvoton, NuMaker Ethernet controller

compatible: "nuvoton,numaker-ethernet"

include:
  - name: snps,dwmac.yaml
  - name: reset-device.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  resets:
    required: true

  clocks:
    required: true

  phy-addr:
    type: int
    description: Address of the phy controller
    required: true

  ptp-clock:
    type: phandle
    description: |
      IEEE 1588 timestamp clock inside this MAC. When present the driver reports
      ETHERNET_PTP, returns this device from get_ptp_clock(), and enables per-frame
      timestamp snapshotting; the referenced driver owns the timebase itself.
