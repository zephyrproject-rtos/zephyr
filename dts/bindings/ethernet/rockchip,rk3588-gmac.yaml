title: Rockchip RK3588 GMAC

description: |
  Rockchip RK3588 Gigabit Ethernet MAC based on Synopsys DesignWare MAC.

compatible: "rockchip,rk3588-gmac"

include:
  - name: snps,dwmac.yaml
  - name: reset-device.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
    type: phandle-array
    description: |
      CRU clock phandles. See include/zephyr/dt-bindings/clock/rk3588-cru.h
      for clock IDs. Typical clocks are CLK_GMAC_125M, CLK_GMAC_50M,
      PCLK_GMACn, ACLK_GMACn, and CLK_GMACn_PTP_REF.

  clock-names:
    type: string-array
    description: |
      Names for clocks listed in the clocks property. Typical names are
      "stmmaceth", "clk_mac_ref", "pclk_mac", "aclk_mac", and "ptp_ref".

  resets:
    required: true

  clock-in-out:
    type: string
    enum:
      - "input"
      - "output"
    default: "input"
    description: |
      RGMII clock direction. "input" means the 125 MHz RGMII reference
      clock comes from the PHY. "output" means the SoC provides the
      reference clock. RMII uses the same values for the 50 MHz clock.

  rockchip,grf:
    type: phandle
    required: true
    description: |
      Phandle to the system GRF syscon, which holds the RGMII clock delay
      configuration.

  rockchip,php-grf:
    type: phandle
    required: true
    description: |
      Phandle to the PHP GRF syscon, which holds the RGMII interface select
      and the transmit clock divider.

  tx-delay:
    type: int
    default: 0x30
    min: 0
    max: 0x7f
    description: TX RGMII delay value programmed in sys-GRF.

  rx-delay:
    type: int
    default: 0x10
    min: 0
    max: 0x7f
    description: RX RGMII delay value programmed in sys-GRF.
