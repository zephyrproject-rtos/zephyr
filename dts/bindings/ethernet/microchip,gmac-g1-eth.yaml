title: Microchip G1 GMAC Ethernet Controller

description: |
  Microchip GMAC Ethernet

  Group G1 Ethernet device supports following hardware peripherals:
    - module name="GMAC" id="U2005" version="1.0.0"

  The MDIO bus is provided by this device and is used to communicate
  with Ethernet PHY.

compatible: "microchip,gmac-g1-eth"

include:
  - name: ethernet-controller.yaml
  - name: pinctrl-device.yaml

properties:
  phy-handle:
    required: true

  num-queues:
    type: int
    required: true
    description: |
      Number of hardware TX and RX queues.
      Range: 1 - 8

  max-frame-size:
    type: int
    default: 1518
    description: |
      Maximum ethernet frame size.

      The current ethernet frame sizes supported by hardware are 1518,
      1536 and 10240 (jumbo frames).  This means that normally gmac
      will reject any frame above max-frame-size value. The default
      value is 1518, which represents an usual IEEE 802.3 ethernet frame:

      Ethernet Frame [ 14 MAC HEADER | 1500 MTU | 4 FCS ] = 1518 bytes

      When using value 1536 it is possible extend ethernet MAC HEADER up
      to 32 bytes.  The hardware have support to jumbo frames and it can be
      enabled by selecting the value 10240.

  max-speed:
    type: int
    default: 100
    description: |
      Maximum speed in Mbit/s supported by the device.

      The gmac driver supports 10Mbit/s and 100Mbit/s.  Using 100, as default
      value, enables driver to configure 10 and 100Mbit/s speeds.

  mac-eeprom:
    type: phandle
    description: phandle to I2C eeprom device node.

  phy-connection-type:
    default: "rmii"

  clocks:
    type: phandle-array

examples:
  - |
    &gmac {
      compatible = "microchip,gmac-g1-eth";
      interrupts = <84 0>;
      interrupt-names = "gmac";
      num-queues = <1>;
    };
