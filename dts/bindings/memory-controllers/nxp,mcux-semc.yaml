description: NXP Smart External Memory Controller (SEMC)

compatible: "nxp,mcux-semc"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  nxp,cmd-timeout-cycles:
    type: int
    default: -1
    description: |
      SEMC command execution timeout in cycles. -1 keeps the MCUX HAL
      default.

  nxp,bus-timeout-cycles:
    type: int
    default: -1
    description: |
      SEMC AXI bus timeout in cycles. -1 keeps the MCUX HAL default.

  nxp,dqs-pad-loopback:
    type: boolean
    description: |
      Use the DQS pad loopback as the dummy read strobe source.
