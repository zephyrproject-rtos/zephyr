description: |
  NXP AHB SRAM Controller (AHB_SRAMC).

  Controller for external asynchronous parallel SRAM (or SRAM-like FPGA)
  devices.

  This node describes the controller only. The settings the hardware keeps in
  MCR -- data-port width, address mode, ADV# polarity, AHB bus timeout and
  internal clock gating -- are shared by every chip select. Each external
  device attached to one of the chip selects is described by a separate
  "nxp,ahb-sramc-sram" child node, which carries that device's bus timings,
  wait configuration and memory window.

compatible: "nxp,ahb-sramc"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true
    description: |
      The controller's functional clock (hclk). Every timing field of every
      chip select is counted in its rate.

  "#address-cells":
    required: true
    const: 1

  "#size-cells":
    required: true
    const: 1

  port-size:
    type: int
    required: true
    enum: [8, 16]
    description: |
      External data-port width in bits, shared by every chip select
      (MCR[PS]). Must match the data width of the connected SRAM.

  address-mode:
    type: string
    required: true
    enum:
      - "admux"
      - "non-admux"
    description: |
      Whether the low address bits are multiplexed onto the data lines
      (MCR[AM]). In admux mode ADDR[15:0] ride SRAMC_DA[15:0], while
      ADDR[16] stays on its dedicated SRAMC_ADDR[16] pin.

  adv-polarity:
    type: string
    default: "active-low"
    enum:
      - "active-low"
      - "active-high"
    description: |
      Polarity of the ADV# address-valid strobe (MCR[ADVP]), used in admux
      mode only.

  bus-timeout:
    type: int
    default: 0
    min: 0
    max: 255
    description: |
      AHB bus timeout, in units of 1024 hclk cycles (MCR[BTO]). An AHB access
      that is not granted within that many cycles completes with a bus error.
      Zero disables the timeout counter.

  function-clock-always-on:
    type: boolean
    description: |
      Disable the controller's internal clock gating, so its functional clock
      runs even when no access is in flight (MCR[CG_DIS]). Omit it to leave
      gating enabled.

examples:
  - |
    &sramc {
        pinctrl-0 = <&pinmux_sramc>;
        pinctrl-names = "default";
        port-size = <16>;
        address-mode = "admux";
        status = "okay";

        ext_sram0: sram@25000000 {
            compatible = "nxp,ahb-sramc-sram";
            reg = <0x25000000 DT_SIZE_K(128)>;
            cs = <0>;

            ce-setup-time-ns = <0>;
            ce-hold-time-ns = <0>;
            address-setup-time-ns = <10>;
            address-hold-time-ns = <5>;
            turnaround-time-ns = <10>;
            write-enable-low-time-ns = <45>;
            write-enable-high-time-ns = <10>;
            read-enable-low-time-ns = <55>;
            read-enable-high-time-ns = <10>;
        };
    };
