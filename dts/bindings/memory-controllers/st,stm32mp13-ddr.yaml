description: STM32MP13 DDR (Double Data Rate) controller and PHY (Physical Interface)

compatible: "st,stm32mp13-ddr"

include: base.yaml

properties:
  reg:
    required: true

  reg-names:
    required: true

  memory-region:
    type: phandle
    required: true
    description: Memory region containing the base address of the DDR device

  st,mem-size:
    type: int
    required: true
    enum:
      - 0x20000000
      - 0x40000000
    description: |
      DDR capacity in bytes. The capacity selects the corresponding STM32 HAL
      DDR3 configuration.
