title: Microchip Parallel Input/Output Controller (PIO)

description: |
  SAM PIO4 GPIO PORT

  This driver supports following hardware peripherals:
    <module name="PIO" id="11264" version="K">
    <module name="PIO" id="11264" version="204">

compatible: "microchip,sam-pio4"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
