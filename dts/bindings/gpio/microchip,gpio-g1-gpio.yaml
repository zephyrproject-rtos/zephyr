title: Microchip GPIO G1 GPIO

description: |
  GPIO controller for the Microchip GPIO Group 1 (G1)

  GPIO driver for GPIO Group g1 supports following hardware peripherals:
    - module name="GPIO" id="02467" version="1.0"

compatible: "microchip,gpio-g1-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
