description: |
  GPIO Controller part for the SC18IS606 bridge.
  Any compatible node shall be a child of an nxp,sc18is60x family node.
  Deprecated in favor of nxp,sc18is60x-gpio.

compatible: "nxp,sc18is606-gpio"

on-bus: nxp,sc18is60x

include: gpio-controller.yaml

properties:
  "#gpio-cells":
    required: true
    const: 2

  ngpios:
    const: 3

gpio-cells:
  - pin
  - flags
