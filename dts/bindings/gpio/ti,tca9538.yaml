description: |
  TCA9538 GPIO

  The TCA9536 has the same registers with four pins and is described with
  this compatible and ngpios = <4>.

compatible: "ti,tca9538"

include: [i2c-device.yaml, gpio-controller.yaml]

properties:
  "#gpio-cells":
    const: 2

  ngpios:
    enum:
      - 4
      - 8
    description: |
      Number of GPIOs available on port expander: 8 for the TCA9538, 4 for
      the TCA9536.

  nint-gpios:
    type: phandle-array
    description: |
      Connection for the NINT signal. This signal is active-low when
      produced by tca9538 GPIO node.

  input-latch:
    type: int
    description: |
      Input latch register bit is 0 by default and the input pin state
      is not latched. When input latch register bit is 1 and the input
      pin state is latched.

  interrupt-mask:
    type: int
    description: |
      Interrupt mask register is set to logic 1 by default without
      enabling interrupts. Setting corresponding mask bits to logic
      0 to enable the interrupts.

  has-pud:
    type: boolean
    description: Supports pull-up/pull-down resistors

gpio-cells:
  - pin
  - flags
