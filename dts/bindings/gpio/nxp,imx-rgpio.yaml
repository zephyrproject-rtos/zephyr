description: i.MX RGPIO

compatible: "nxp,imx-rgpio"

include: [gpio-controller.yaml, base.yaml, "nxp,rdc-policy.yaml"]

properties:
  reg:
    required: true

  clocks:
    description: |
      Clock gate for this port, when the SoC has one that software must open.

      Optional: on SoCs where the RGPIO block is permanently clocked from its
      subsystem bus clock, leave it out and the driver makes no clock call. On
      SoCs that gate it -- the i.MX RT266x parts, for example, come out of reset
      with the RGPIO gate closed -- the driver opens the gate during init, so it
      must be given here rather than opened from board code.

  pinmux:
    type: phandles
    description: |
      IMX pin selection peripheral does not follow specific
      pattern for which GPIO port uses which pinmux. Use this property to specify
      pinctrl nodes to use for the gpio port when CONFIG_PINCTRL=y. Note that
      the order of the nodes matters. The first node for gpio1 will be used
      as the pinmux for gpio0, port 0.

  "#gpio-cells":
    const: 2

  irq-output-select:
    type: int
    default: 0
    description: |
      Select which IRQ line the GPIO controller outputs to.
      0 = First IRQ line (default)
      1 = Second IRQ line
    enum:
      - 0
      - 1

gpio-cells:
  - pin
  - flags
