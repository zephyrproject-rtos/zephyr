description: Efinix Sapphire GPIO

compatible: "efinix,sapphire-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  ngpios:
    required: true
    enum:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
