description: |
  ABOV32 Port Control Unit (PCU) GPIO port. Each PCU port (A..G) is exposed
  as one gpio-controller node.

compatible: "abov,abov32-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
