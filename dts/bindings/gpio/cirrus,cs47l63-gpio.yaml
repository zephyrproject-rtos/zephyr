title: Cirrus Logic CS47L63 GPIO controller

description: |
  GPIO1 to GPIO12 of a Cirrus Logic CS47L63 audio codec. A child node of the
  cirrus,cs47l63 node. Pin 0 is GPIO1 and pin 11 is GPIO12. GPIO1 to GPIO4
  double as the ASP1 pins and GPIO5 to GPIO8 as the ASP2 pins.

compatible: "cirrus,cs47l63-gpio"

include: gpio-controller.yaml

properties:
  "#gpio-cells":
    const: 2

  ngpios:
    const: 12

gpio-cells:
  - pin
  - flags

examples:
  - |
    #include <zephyr/dt-bindings/gpio/gpio.h>

    &spi1 {
        codec@2 {
            compatible = "cirrus,cs47l63";
            reg = <2>;
            spi-max-frequency = <8000000>;
            reset-gpios = <&gpio0 18 GPIO_ACTIVE_LOW>;

            cs47l63_gpio: gpio {
                compatible = "cirrus,cs47l63-gpio";
                gpio-controller;
                #gpio-cells = <2>;
                ngpios = <12>;
            };
        };
    };
