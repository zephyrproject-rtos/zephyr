description: |
  TI TCA9536 4-bit I2C GPIO expander

  The internal pull-up resistors are left enabled, their power-up default,
  and P3 is not configured as the interrupt output.

compatible: "ti,tca9536"

include: [gpio-controller.yaml, i2c-device.yaml]

properties:
  "#gpio-cells":
    const: 2

  ngpios:
    required: true
    const: 4

gpio-cells:
  - pin
  - flags
