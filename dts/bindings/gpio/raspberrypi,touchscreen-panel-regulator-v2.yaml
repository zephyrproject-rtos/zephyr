description: |
  Raspberry Pi Touch Display 2 panel-regulator/GPIO board (v2).

  This chip sits on I2C and exposes GPIO-like control lines used by the
  official 7-inch DSI touchscreen daughter card:
    pin 0 - panel reset / backlight enable
    pin 1 - touch controller AVDD28 power-cycle (acts as the touch IC's
            reset, per the upstream vc4-kms-dsi-ili9881-7inch-overlay.dts)

compatible: "raspberrypi,touchscreen-panel-regulator-v2"

include: [i2c-device.yaml, gpio-controller.yaml]

properties:
  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
