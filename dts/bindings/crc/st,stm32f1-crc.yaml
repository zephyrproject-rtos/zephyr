title: STM32 CRC calculation unit

description: |
  Cyclic Redundancy Check (CRC) calculation unit with
  fix parameters, capable of CRC32-IEEE and CRC32-MPEG2

compatible: "st,stm32f1-crc"

include: [base.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true
