title: Texas Instruments MSPM0 CRC Accelerator

description: |
  Texas Instruments MSPM0 Cyclic Redundancy Check (CRC) Engine.
  This accelerator generates signature for a given data sequence
  based on the CRC16-CCITT polynomial or the CRC32-ISO3309
  polynomial.

compatible: "ti,mspm0-crc"

include: base.yaml

properties:
  reg:
    required: true
