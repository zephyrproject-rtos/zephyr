description: |
  OpenTitan I2C controller, IP version 2.0.0.

  The IP version is separate from the chip release version. The OpenTitan
  earlgrey_1.0.0 release has I2C IP version 2.0.0. Version 1.0 has a
  different register map and does not use this binding.

compatible: "lowrisc,opentitan-i2c-2.0.0"

include: i2c-controller.yaml

properties:
  reg:
    description: Base address and size of the I2C registers.
    required: true
  clocks:
    description: Input clock for the I2C controller.
    required: true
