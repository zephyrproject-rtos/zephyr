description: TI OMAP I2C Controller
compatible: "ti,omap-i2c"
include: [i2c-controller.yaml, pinctrl-device.yaml]
properties:
  reg:
    description: Base address and size of the I2C registers.
    required: true
  interrupts:
    description: Interrupt specifier for the I2C controller.
    required: true
  clocks:
    description: |
      Module functional/input clock (I2Ci_SYS_CLK) used for PSC/SCLL/SCLH.
      Not the I2C bus bitrate — that is clock-frequency.
      When omitted, the driver assumes 96 MHz (TRM example rate).
  pinctrl-0:
    description: Pin control groups for this I2C instance.
    required: true
  pinctrl-names:
    description: Names for the pin control groups.
    required: true
  clock-frequency:
    description: I2C bus bitrate in Hz (e.g. I2C_BITRATE_STANDARD).
    required: true
