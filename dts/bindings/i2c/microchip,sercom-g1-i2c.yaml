title: Microchip SERCOM G1 I2C driver

description: |
  Microchip SERCOM I2C driver bindings.

  Group g1 SERCOM I2C driver supports following hardware peripherals:
    - module name="SERCOM"
          id="U2201" version="3.1.1","5.0.0"
          id="03715" name2="com_sercom_u2201_v6" version="6b0","6c0"

compatible: "microchip,sercom-g1-i2c"

include:
  - name: i2c-controller.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-names:
    required: true

  scl-gpios:
    type: phandle-array
    description: |
      GPIO of the SCL pin, used for bus recovery only. The driver drives the
      line low or releases it as an input, so the bus needs external pull-ups.
      Requires CONFIG_I2C_MCHP_SERCOM_G1_BUS_RECOVERY.

  sda-gpios:
    type: phandle-array
    description: |
      GPIO of the SDA pin, used for bus recovery only. The driver drives the
      line low or releases it as an input, so the bus needs external pull-ups.
      Requires CONFIG_I2C_MCHP_SERCOM_G1_BUS_RECOVERY.

  recover-bus-on-init:
    type: boolean
    description: |
      Recover the I2C bus during driver initialization, in case a target
      still holds SDA low, for example a battery-backed RTC after a reset
      of the SoC in the middle of a read. Requires scl-gpios and sda-gpios.

  run-in-standby-en:
    type: int
    enum:
      - 0
      - 1
    default: 1
    description: |
      Enable (1) or disable (0) runstandby mode for SERCOM I2C.

  dmas:
    description: |
      Optional TX & RX dma specifiers.  Each specifier will have a phandle
      reference to the dmac controller, the channel number, and peripheral
      trigger source.

      For example dmas for TX, RX on SERCOM3
         dmas = <&dmac 0 0xb>, <&dmac 0 0xa>;

  dma-names:
    description: |
      Required if the dmas property exists.  This should be "tx" and "rx"
      to match the dmas property.

      For example
         dma-names = "tx", "rx";
