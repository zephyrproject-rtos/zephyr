description: TI UNICOMM I2C Controller/Target (combined)

compatible: "ti,unicomm-i2c"

include: [base.yaml, pinctrl-device.yaml]

bus: i2c

properties:
  reg:
    required: true

  reg-names:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  rxfifo-threshold:
    type: int
    description: |
      Trigger level for the RX FIFO. Default is FIFO length, i.e. 16 bytes.

  txfifo-threshold:
    type: int
    description: |
      Trigger level for the TX FIFO. Default is FIFO length, i.e. 16 bytes.

  unicomm-advanced-i2c:
    type: boolean
    description: |
      Whether or not the UNICOMM instance supports automatic
      STOP generation for I2C among other things (refer to TRM).
