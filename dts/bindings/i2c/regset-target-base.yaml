include: [base.yaml, i2c-device.yaml]

properties:
  size:
    type: int
    description: Total register size in bytes

  address-width:
    type: int
    enum: [8, 16]
    description: |
      Number of address bits used to address the EEPROM. If not specified
      the EEPROM is assumed to have a 8-bit address.
