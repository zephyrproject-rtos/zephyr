description: |
  Microchip XEC I2Cv3 I2C driver using byte mode

compatible: "microchip,xec-i2c-v3-bm"

include: base.yaml

properties:
  reg:
    required: true
    description: MMIO Base address register mapping.

  interrupts:
    required: true
    description: Hardware interrupt vector assignment.

  girqs:
    type: array
    required: true
    description: |
      Hardware GIRQ encoded interrupt routing. Each peripheral
      interrupt line is routed to a GIRQ bit in the XEC ECIA.
      The GIRQ result bits which are bitwise AND of GIRQ enable
      and status are routed to the peripheral's NVIC input.
      The value is the encoded GIRQ number and bit position
      for this peripheral instance. The first encoded value is the
      runtime girq and the second is the wake from deep sleep girq.

  pcr-scr:
    type: int
    required: true
    description: |
      Each peripheral instance has sleep enable, clock required, and
      reset bits in the PCR block. The value is the encoded PCR register
      index and bit position for the peripheral instance.

  default-port:
    type: phandle
    # The port node already points back here via its "controller" phandle, so
    # a normal dependency edge from this reference would form a cycle that
    # gen_defines.py rejects. "ignore" drops the edge: this is a pure
    # boot-routing hint consumed via DT macros at the port node, not a device
    # handle, so it implies no init-order dependency. Controller-before-port
    # ordering is still guaranteed by init priorities and the port's own
    # "controller" edge.
    dependency-mode: "ignore"
    description: |
      Phandle to one of this controller's port nodes whose pin routing is
      applied at boot, before the first transfer. Optional: if omitted, no
      port is pre-routed and the first transfer lazily applies its own
      port's routing. The referenced port's "controller" phandle must point
      back to this node (enforced by a build assertion). Replaces the former
      per-port "default-port" boolean, so exactly one boot port per
      controller can be named, unambiguously.

  target-buffer-size:
    type: int
    default: 256
    description: |
      Size in bytes of the per-controller staging buffer used for I2C
      target (peripheral) receive when CONFIG_I2C_TARGET_BUFFER_MODE is
      enabled. Bytes an external host writes to a registered target are
      accumulated here and delivered to buf_write_received() in one call
      at STOP, so this must be at least the largest write the host will
      issue. Unused when CONFIG_I2C_TARGET_BUFFER_MODE is disabled.
