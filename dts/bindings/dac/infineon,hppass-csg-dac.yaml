description: |
  Infineon HPPASS CSG DAC.

  Represents the 10-bit, 30 Msps DAC inside a single CSG slice.  This node
  must be a child of an "infineon,hppass-csg" CSG MFD parent.

  This DAC has no external output pin.  Its output is wired internally to
  the paired comparator's negative input, and may optionally be
  routed to the SAR ADC for observation through CSG_CTRL.VDAC_OUT_SEL.
  The paired comparator need not be enabled when the DAC is used only
  for SAR observation. On MCPASS v3 (PSC3M6), the CSG parent powers the
  group containing each enabled comparator or DAC.

  Resolution is fixed at 10 bits.  Only direct-write mode is supported
  through the standard Zephyr DAC API.  Advanced modes (buffered, slope,
  LUT) are not yet supported.

compatible: "infineon,hppass-csg-dac"

include: [dac-controller.yaml]

properties:
  reg:
    type: array
    required: true
    description: |
      Register region covering this slice's DAC_CFG, DAC_VAL_A, DAC_VAL_B
      and DAC_VAL within the CSG block.  Slice index is derived at
      compile time from the offset divided by the CSG slice stride.

  interrupts:
    description: |
      DAC interrupt line for this slice.  DAC interrupt only occurs in
      advanced modes: HW start trigger, SLOPE/LUT done, or BUFFERED/HYSTERETIC
      buffer empty.

  deglitch:
    type: int
    default: 0
    min: 0
    max: 7
    description: |
      DAC output deglitch length in HPPASS clock cycles
      (DAC_CFG.DAC_DEGLITCH, 0-7).  Glitches shorter than this width are
      filtered out on the DAC analog output before it is driven into the
      paired comparator's negative input.

  initial-value:
    type: int
    min: 0
    max: 1023
    description: |
      Optional 10-bit value (0..1023) to write into SLICE[s].DAC_VAL at
      driver init, before the HPPASS AC enters its locked state. On MCPASS v3,
      the same value is loaded into DAC_VAL_A before the firmware start.
      When omitted, the initial value is 0
      (~0 V output).  Useful when the paired comparator must see a
      stable mid-rail or other reference before the application has a
      chance to call dac_write_value().

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - output
