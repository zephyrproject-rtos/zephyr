description: |
  Qorvo DW3000 family of IEEE 802.15.4 HRP UWB transceivers (DW3110, DW3120,
  DW3210 and DW3220).

  The parts share one register map and are told apart by their device ID
  register. The SPI clock may run at up to 36 MHz.

  Example:

    &spi3 {
        dw3000@0 {
            compatible = "qorvo,dw3000";
            reg = <0>;
            spi-max-frequency = <8000000>;
            int-gpios = <&gpio1 2 GPIO_ACTIVE_HIGH>;
            reset-gpios = <&gpio0 25 GPIO_ACTIVE_LOW>;
        };
    };

compatible: "qorvo,dw3000"

include: spi-device.yaml

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: |
      IRQ pin. The transceiver drives it high while an enabled event is
      pending.

  reset-gpios:
    type: phandle-array
    required: true
    description: |
      RSTn pin, active low. The transceiver drives this pin itself and it
      must never be driven high, so the driver either pulls it low or
      leaves it floating.

  wakeup-gpios:
    type: phandle-array
    description: |
      WAKEUP pin, active high. Leave this property out when the pin is tied
      to ground on the board.
