description: Cirrus Logic CS47L63 Low-Power Audio DSP

compatible: "cirrus,cs47l63"

include: spi-device.yaml

properties:
  reg:
    required: true

  irq-gpios:
    type: phandle-array
    description:
      Interrupt request (IRQ) output.

  reset-gpios:
    type: phandle-array
    description:
      Digital reset input.

  cirrus,asp:
    type: int
    enum: [1, 2]
    default: 1
    description: |
      Audio serial port the host's I2S is wired to. ASP1 on the
      nRF5340 Audio DK.

  cirrus,gpio-defaults:
    type: array
    description: |
      GPIOn_CTRL1 values, one per codec GPIO starting at GPIO1, written
      as given each time the driver brings the part out of reset. An entry with a reserved
      bit set, conventionally 0xffffffff, or a GPIO past the end of the
      list, is left at its reset value. At most 12 entries. The four
      pads of a serial port the driver uses (GPIO1-4 for ASP1, GPIO5-8
      for ASP2) are driven by the driver and must be 0xffffffff here.

      For example, 0x410001fa as the tenth entry drives GPIO10 as a CMOS
      output of the output signal path status (GPn_FN = 0x1fa).

  gpio1-gpios:
    type: phandle-array
    description:
      GPIO1 input with bus-keeper

  gpio2-gpios:
    type: phandle-array
    description:
      GPIO2 input with bus-keeper

  gpio3-gpios:
    type: phandle-array
    description:
      GPIO3 input with bus-keeper

  gpio4-gpios:
    type: phandle-array
    description:
      GPIO4 input with bus-keeper

  gpio5-gpios:
    type: phandle-array
    description:
      GPIO5 input with bus-keeper

  gpio6-gpios:
    type: phandle-array
    description:
      GPIO6 input with bus-keeper

  gpio7-gpios:
    type: phandle-array
    description:
      GPIO7 input with bus-keeper

  gpio8-gpios:
    type: phandle-array
    description:
      GPIO8 input with bus-keeper

  gpio9-gpios:
    type: phandle-array
    description:
      GPIO9 input with bus-keeper

  gpio10-gpios:
    type: phandle-array
    description:
      GPIO10 input with bus-keeper

  gpio11-gpios:
    type: phandle-array
    description:
      GPIO11 input with bus-keeper

  gpio12-gpios:
    type: phandle-array
    description:
      GPIO12 input with bus-keeper

child-binding:
  description: |
    Second audio serial port of the same CS47L63, exposed as its own
    audio_codec device. Clocks, output volume and mute, and the input
    paths stay with the parent.
  properties:
    cirrus,asp:
      type: int
      required: true
      enum: [1, 2]
      description: Serial port this device drives; must differ from the parent's.
