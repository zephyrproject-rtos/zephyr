title: TI TPS65214 PMIC

description: |
  TI TPS65214 PMIC: three buck converters and two LDOs.

  The regulators are described in a child node with the
  "ti,tps6521x-regulator" compatible.

compatible: "ti,tps65214"

include: i2c-device.yaml

properties:
  int-gpios:
    type: phandle-array
    description: |
      Host GPIO wired to the open-drain nINT output. nINT is active low, so
      the flags must include GPIO_ACTIVE_LOW. Without it the driver has no
      interrupt support and children that need interrupts, such as the power
      button, are not available.
