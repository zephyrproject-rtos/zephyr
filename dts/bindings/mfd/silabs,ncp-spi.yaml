description: |
  Silicon Labs network co-processor (NCP) connected over SPI.

  The NCP runs the Silicon Labs CPC (Co-Processor Communication) protocol in
  the secondary role. This node is the CPC primary. Every radio protocol
  offered by the co-processor (Bluetooth LE, Bluetooth Classic, Wi-Fi,
  802.15.4, ...) is exposed by a child node bound to a CPC endpoint.

  Example:

    &spi0 {
        ncp: ncp@0 {
            compatible = "silabs,ncp";
            reg = <0>;
            spi-max-frequency = <10000000>;
            irq-gpios = <&gpio0 5 GPIO_ACTIVE_LOW>;
            reset-gpios = <&gpio0 6 GPIO_ACTIVE_LOW>;
        };
    };

compatible: "silabs,ncp"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt line driven by the co-processor. It is asserted when the
      co-processor has a frame to send and, after a header exchange, when it
      is ready for the payload exchange. Must be declared GPIO_ACTIVE_LOW.

  wake-gpios:
    type: phandle-array
    description: |
      Optional wake line driven by the host to wake the co-processor from
      sleep before a transaction.

  reset-gpios:
    type: phandle-array
    description: |
      Optional reset line of the co-processor. It is pulsed during
      initialization.
