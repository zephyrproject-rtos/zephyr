description: |
  Infineon HPPASS analog subsystem with the MCPASS v3 register layout
  (PSOC Control C3M6/P6).

  v3 routes 16 triggers rather than 8, which moves the INFRA and MMIO
  trigger registers.  Everything else follows infineon,hppass-analog, which
  must be listed as the fallback compatible so the MFD driver still binds:

    compatible = "infineon,hppass-analog-v3", "infineon,hppass-analog";

compatible: "infineon,hppass-analog-v3"

include: infineon,hppass-analog.yaml
