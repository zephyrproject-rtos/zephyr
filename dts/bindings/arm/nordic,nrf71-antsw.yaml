description: |
  nRF71 antenna switch (ANTSW) select pin, shared between Wi-Fi and BLE.

  The pin is SoC specific and is not meant to be changed at a board level.
  Powering the antenna switch is handled by the pwr_antswc node
  (nordic,nrf-pwr-antswc).

compatible: "nordic,nrf71-antsw"

include: base.yaml

properties:
  sel-gpios:
    type: phandle-array
    required: true
    description: |
      Antenna switch select line (port and pin only).
