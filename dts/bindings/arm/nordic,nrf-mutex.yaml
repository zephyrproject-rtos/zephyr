description: Nordic nRF family MUTEX (Mutual Exclusive Peripheral)

compatible: "nordic,nrf-mutex"

include: base.yaml

properties:
  reg:
    required: true

  "#mutex-cells":
    type: int
    const: 1
    description: |
      Number of cells in a specifier. The single cell is the
      index of the hardware mutex within this MUTEX instance.

  nordic,mutex-count:
    type: int
    required: true
    description: |
      Number of hardware mutexes provided by this MUTEX instance.

mutex-cells:
  - index
