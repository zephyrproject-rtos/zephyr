description: |
  Software loopback remote control device, for testing the remote control
  subsystem without hardware.

compatible: "zephyr,rc-loopback"

include: rc-device.yaml

properties:
  hw-rx-timeout:
    type: boolean
    description: |
      Behave as a driver that detects the receiver timeout in hardware:
      implement set_rx_timeout and report a timeout range in the
      capabilities. Timeout words are then injected by the test.
