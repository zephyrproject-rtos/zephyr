description: Microchip XEC PS/2 controller

compatible: "microchip,xec-ps2"

include: [ps2.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  girqs:
    type: array
    required: true
    description: |
      Array of encoded GIRQ and bit position for each interrupt
      signal the block generates.

  pcr-scr:
    type: int
    required: true
    description: Encoded PS2 PCR register index and bit position

  wakerx-gpios:
    type: phandle-array
    description: GPIO configured as PS2 DAT wake source
