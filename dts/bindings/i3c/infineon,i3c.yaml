description: Infineon I3C controller (Synopsys DW I3C IP with Infineon wrapper)

compatible: "infineon,i3c"

include: snps,designware-i3c.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  target-mode:
    type: boolean
    description: |
      Initialize this I3C instance in target mode instead of controller mode.
      Writes to DEV_OPERATION_MODE do not read back on this integration, so the
      boot role cannot be recovered from that field and is declared here.
