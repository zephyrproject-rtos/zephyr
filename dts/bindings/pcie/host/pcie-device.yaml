# Common fields for PCIe devices

properties:
  pcie-controller:
    type: phandle
    description: |
      Owning PCIe host controller. Nodes on a pcie bus use their bus controller
      when this property is absent; other nodes default to the
      zephyr,pcie-controller chosen node unless this property is specified.
  vendor-id:
    type: int
    description: Vendor ID of the device
  device-id:
    type: int
    description: Device ID of the device
  class-rev:
    type: int
    description: Optional class/revision register filter
  class-rev-mask:
    type: int
    description: Class/revision register mask
