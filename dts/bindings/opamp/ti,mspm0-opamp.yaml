description: |
  Texas Instruments MSPM0 zero-drift, chopper-stabilized Operational Amplifier (OPA).
compatible: "ti,mspm0-opamp"

include:
  - opamp-controller.yaml

properties:
  reg:
    required: true

  ti,psel:
    type: string
    default: "open"
    enum: ["open", "in0p", "in1p", "dac12out", "dac8out", "vref",
           "prev-opa-rtop", "gpamp-out", "vss"]
    description: |
      Selects non inverting terminals input via OPA's internal P-MUX.

  ti,nsel:
    type: string
    default: "open"
    enum: ["open", "in0n", "in1n", "prev-opa-rbot", "rtap", "rtop"]
    description: |
      Selects inverting terminals input via OPA's internal N-MUX.

  ti,msel:
    type: string
    default: "open"
    enum: ["open", "in1n", "gnd", "dac12out", "prev-opa-rtop"]
    description: |
       Selects the input for OPA's internal M-MUX which is connected to the
       programmable gain stage resister ladder.

  ti,chop-mode:
    type: string
    default: "disabled"
    enum: ["disabled", "standard", "adc-assisted"]
    description: |
      Selects the OPAMP's chopping mode.

  ti,gain:
    type: int
    default: 0
    description: |
      Initial value for the gain, set once at boot.
      This is live-changeable afterwards through the driver's gain
      API
        -inverting     - 0=invalid 1=-1x 2=-3x 3=-7x 4=-15x 5=-31x
        -non-inverting - 0=1x 1=2x 2=4x 3=8x 4=16x 5=32x

  ti,outpin-enable:
    type: boolean
    description: |
      When set, the amplifier's output is also driven onto the
      external OPAx_OUT package pin, in addition to staying
      available internally to the ADC/COMP/paired OPA. Leave unset
      for a purely internal signal chain (e.g. buffering a
      reference into the ADC) to save the pin for other uses.

  ti,power-mode:
    type: string
    default: "lp"
    enum: ["lp", "std"]
    description: |
      Selects the opamp power mode.
      LP mode sets the GBW value as 1MHz,
      STD mode sets the GBW value as 6MHz.

  vref:
    type: phandle
    description: |
      Selects vref as the input for non-inverting terminal.
