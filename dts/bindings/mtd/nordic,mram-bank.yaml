description: |
  A single MRAM bank within a Nordic MRAM memory node.

compatible: "nordic,mram-bank"

include: base.yaml

properties:
  reg:
    required: true

  nordic,mutexes:
    type: phandle-array
    specifier-space: mutex
    min-len: 1
    max-len: 1
    description: |
      Hardware mutexes used to serialize MRAM access across CPU domains.
