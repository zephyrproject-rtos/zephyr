title: Generic NAND flash on the SPI bus

description: |
  Serial NAND flash memory on a SPI bus that uses the command set common to
  SPI NAND devices.

  The geometry and the maximum operation durations are not discovered at
  run time and are taken from the device datasheet. During initialization
  the device is reset, its ID is compared with jedec-id, the ONFI parameter
  page is read and all blocks are unlocked. Initialization fails if the ID
  differs or no valid parameter page is found. A geometry that differs from
  the parameter page is reported as a warning.

compatible: "jedec,spi-nand"

include: [spi-device.yaml, "jedec,spi-nand-common.yaml"]
