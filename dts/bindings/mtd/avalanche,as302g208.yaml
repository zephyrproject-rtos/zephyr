description: |
  Avalanche Technology AS302G208 2 Gbit MRAM-based persistent SRAM.

  The device exposes two separately selected QSPI interfaces, each with
  1 Gbit of storage. A node describes one interface and exposes 128 MiB.
  Combining both interfaces in dual-parallel mode is not supported.

compatible: "avalanche,as302g208"

include: avalanche,serial-mram-common.yaml
