description: |
  NXP Always-On Low-Power ADC (AON_LPADC).

compatible: "nxp,aon-lpadc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  voltage-ref:
    type: int
    default: 0
    enum:
      - 0
      - 1
    description: |
      Voltage reference selection (CFG[REFSEL]), applied to the whole converter.
      Which reference each setting selects is SoC specific, see the chip-specific
      LPADC information in the reference manual; on SoCs where both settings
      select the same rail this property has no effect. The default matches the
      register reset value.

  power-level:
    type: int
    default: 0
    enum:
      - 0
      - 1
    description: |
      Converter power configuration (CFG[PWRSEL]). 0 selects power
      Option 1, 1 selects Option 2 (see the chip reference manual). The
      default matches the register reset value.

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
