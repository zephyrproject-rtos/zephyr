title: Microchip ADC G2 Driver

description: |
  Binding for the Microchip ADC driver supporting Group G2 peripherals.

  Group G2 ADC driver supports the following hardware peripheral:
    - module name="ADC" id="44134" version="A03"

examples:
  - |
    Example devicetree configuration:

      &adc {
        pinctrl-names = "default";
        pinctrl-0 = <&pinctrl_mikrobus_an_default>;
        status = "okay";
      };

compatible: "microchip,adc-g2"

include:
  - name: adc-controller.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true
    description: |
      Register base address and size for the ADC peripheral.

  interrupts:
    required: true
    description: |
      Interrupt specifier for the ADC peripheral.

  clocks:
    required: true
    description: |
      Clock phandles used to drive the ADC.

  clock-names:
    required: true
    description: |
      Clock name corresponding to the `clocks` entry.

  assigned-clock-rates:
    type: int
    required: true
    description: |
      The frequency of input GCLK rate.

  num-channels:
    type: int
    required: true
    description: |
      Number of input channels supported by this ADC instance

  "#io-channel-cells":
    const: 1
    description: |
      Specifies that each io-channel uses a single cell (input index).

  min-adc-clock-rates:
    type: int
    required: true
    description: |
      Minimum ADC operating clock rate, in Hz.

  max-adc-clock-rates:
    type: int
    required: true
    description: |
      Maximum ADC operating clock rate, in Hz.

  startup-time-us:
    type: int
    required: true
    description: |
      Startup time expressed in us, refer to tSTART of ADC.

  max-oversampling-ratio:
    type: int
    required: true
    enum:
      - 1
      - 4
      - 16
      - 64
      - 256
    description: |
      Maximum oversampling ratio supported by ADC.

  temperature-startup-us:
    type: int
    description: |
      Temperature sensor startup time expressed in us.
      Refer to tSTART of Temperature Sensor.

  temperature-channel:
    type: int
    enum:
      - 31
    description: |
      Temperature sensor channel index.
      Channel index 31 is used on SAMA7G54 and SAMA7D65.

io-channel-cells:
  - input
