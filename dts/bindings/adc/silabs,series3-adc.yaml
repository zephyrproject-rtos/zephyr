title: Silicon Labs Series 3 ADC (Analog-to-Digital Converter)

description: |
  ADC peripheral for Silicon Labs Series 3 SoCs.

compatible: "silabs,series3-adc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
