description: Texas Instruments LPF3 (CC23X0 & CC27XX) 16-channel ADC

compatible: "ti,lpf3-adc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  "#io-channel-cells":
    const: 1

  dmas:
    description: |
      Optional DMA specifier. The specifier will have a phandle reference to the
      DMA controller, the channel number, and the peripheral trigger source.

      Example for channel 3 with adc0trg trigger source:
        dmas = <&dma 3 5>;

  dma-names:
    description: |
      Required if the dmas property exists. This should be "dma".

      Example:
        dma-names = "dma";

io-channel-cells:
  - input
