description: TI MSP432P4xx ADC14 controller

compatible: "ti,msp432p4xx-adc"

include: adc-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
