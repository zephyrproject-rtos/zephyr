title: STM32F1 ADC

description: |
        This compatible stands for all ADC blocks similar to the one on STM32F1,
        like STM32F37x.
        It is similar to the STM32 ADC described in st,stm32-adc.yaml except that
        it removes the st,adc-clock-source and st,adc-prescaler properties, and
        that the clocks are configured in the child nodes.

compatible: "st,stm32f1-adc"

include:
  - name: st,stm32-adc.yaml
    property-blocklist:
      - clocks
      - clock-names
      - st,adc-clock-source
      - st,adc-prescaler

child-binding:
  properties:
    clocks:
      required: true

    clock-names:
      required: true
      enum:
        - "adcx"
        - "adc_pre"
      description: |
        Expected names are the following:
        - "adcx" for the enabling the register clock (mandatory)
        - "adc_pre" for configuring the prescaler (if applicable)
