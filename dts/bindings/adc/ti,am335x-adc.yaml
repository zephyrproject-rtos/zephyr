description: TI AM335X ADC

compatible: "ti,am335x-adc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  interrupts:
    required: true

  ti,vrefp:
    type: int
    description: Reference Voltage (in mV)

  ti,fifo:
    type: int
    required: true
    enum:
      - 0
      - 1
    description: FIFO for storing conversions

  channel-count:
    type: int
    default: 8
    enum: [1, 2, 3, 4, 5, 6, 7, 8]
    description: |
      Number of analog inputs of this ADC instance. The default is the full
      8-input mux, all bonded out on AM64x; a SoC that bonds out fewer, such
      as AM62L, must set it.

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input

child-binding:
  properties:
    ti,open-delay:
      type: int
      default: 0
      description: Delay before acquisition period

    zephyr,resolution:
      default: 12

    zephyr,oversampling:
      default: 0
