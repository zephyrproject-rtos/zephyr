description: |
  Analog Devices AXI System ID core.

  Exposes an FPGA build-information ROM (board / product / git data) through
  the standard read-only OTP API. The ROM size is auto-detected from the
  core at init.

compatible: "adi,axi-sysid"

include: base.yaml

properties:
  reg:
    required: true
