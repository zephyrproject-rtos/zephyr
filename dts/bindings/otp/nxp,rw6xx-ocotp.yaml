title: NXP RW6xx OCOTP

description: |
  NXP On-Chip OTP (One-Time Programmable) controller for RW610/RW612 SoCs.

  The OCOTP module provides access to on-chip fuse memory used to store
  configuration data, security keys, unique device IDs, and other
  device-specific information.

  The OTP driver API uses byte addressing. The driver handles conversion
  between byte addresses and 32-bit fuse word indices internally.

  The reg property size field specifies the accessible fuse space in bytes.

compatible: "nxp,rw6xx-ocotp"

include: base.yaml

properties:
  reg:
    required: true
    description: |
      Base address and size of the accessible OTP fuse space. The size field
      specifies the accessible fuse space in bytes (must be a multiple of 4).
      The RW610/RW612 OCOTP has 420 shadow registers (0x690 bytes).

  clocks:
    required: true
    description: |
      Clock feeding the OCOTP controller. Fuse access timing depends on its
      rate.
