title: Microchip OTPC G1 Driver

description: |
  Binding for the Microchip OTPC driver supporting Group G1 peripherals.

  Group G1 OTPC driver supports the following hardware peripheral:
    - module name="OTPC" id="44105" version="150"

examples:
  - |
    Example devicetree configuration:

      &otpc {
        status = "okay";
      };

compatible: "microchip,otpc-g1-otp"

include: base.yaml

properties:
  reg:
    required: true
    description: |
      Register base address and size for the OTPC peripheral.

  interrupts:
    required: true
    description: |
      Interrupt specifier for the OTPC peripheral.

  otp-memory-size:
    type: int
    required: true
    description: |
      OTP user area memory size of OTPC, in bytes.

  emul-sram-size:
    type: int
    required: true
    description: |
      Emulation mode sram size of OTPC, in bytes.
