description: |
  GPIO strap board-id device.

  Reads a raw board identity value from a set of GPIO pins wired as straps.
  The value is the concatenation of the pin levels, bit N taken from the
  gpios entry at index N (least significant bit first). Active-low straps
  are handled by GPIO_ACTIVE_LOW in the phandle cell; no separate polarity
  property is needed.

  Example, three straps encoding an identity in the range 0-7:

    board_id: board-id {
            compatible = "zephyr,board-id-gpio";
            gpios = <&gpio0 3 (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>,
                    <&gpio0 4 (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>,
                    <&gpio0 5 (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>;
    };

compatible: "zephyr,board-id-gpio"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: |
      Strap pins, least significant bit first. The read value is the
      concatenation of the pin levels, bit N taken from gpios index N.
      Between 1 and 32 pins are accepted.
