description: |
    InvenSense ICM-20948 Nine-Axis Motion Tracking device. The accelerometer
    and the gyroscope sit behind the primary interface, the AK09916
    magnetometer behind an auxiliary I2C bus the device masters itself.

    In I2C mode the device answers at 0x68, or 0x69 with AD0 pulled high.

compatible: "invensense,icm20948"

include: [sensor-device.yaml, i2c-device.yaml, "invensense,icm20948-common.yaml"]
