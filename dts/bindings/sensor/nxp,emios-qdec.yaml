description: |
  Quadrature decoder using one NXP LCU cell and two externally clocked
  eMIOS MCB counters. The decoder exclusively owns its eMIOS instance;
  that instance cannot also enable a PWM device or another decoder.
  Configure input pad selection and eMIOS input daisy selection with pinctrl,
  and signal routing with mux-states. MCB period interrupts extend the counters
  between application fetches.

compatible: "nxp,emios-qdec"

include: [sensor-device.yaml, pinctrl-device.yaml, mux-consumer.yaml]

properties:
  lcu:
    type: phandle
    required: true
    description: LCU controller.

  lcu-cell:
    type: int
    required: true
    enum: [0, 1, 2]
    description: Exclusively reserved LCU logic cell.

  lcu-inputs:
    type: array
    required: true
    min-len: 2
    max-len: 2
    min: 0
    max: 11
    description: |
      Two LCU instance input indices (0..11), for A and B respectively.
      The cell's other two inputs use internal delayed output feedback.

  emios:
    type: phandle
    required: true
    description: Exclusively owned eMIOS instance.

  emios-channels:
    type: array
    required: true
    min-len: 2
    max-len: 2
    min: 1
    max: 7
    description: |
      Two distinct UC indices for CW and CCW, respectively. Both channels
      must implement MCB with an internal counter and must take their counter
      input from the internal TRGMUX/LCU path, such as  eMIOS_0 UC1..UC7 on MCXE.

  counts-per-revolution:
    type: int
    required: true
    min: 1
    max: 2147483647
    description: |
      Decoded counts per mechanical revolution. Calculate this value from the
      encoder's specifications; it must match the actual counts generated by
      one mechanical revolution. This driver uses x4 quadrature decoding, so
      multiply per-channel pulses per revolution (PPR) by four: 1000 PPR
      requires 4000 counts. If the specification already gives counts after
      x4 decoding, use that value directly without multiplying again.

  feedback-filter:
    type: int
    default: 5
    min: 1
    max: 65535
    description: Rising and falling delay of A/B feedback outputs, in LCU clock cycles.

  pulse-filter:
    type: int
    default: 4
    min: 0
    max: 65535
    description: |
      Rising and falling filter of direction pulse outputs, in LCU clock cycles.
      Must be smaller than feedback-filter so direction pulses are not suppressed.

  reverse-direction:
    type: boolean
    description: Reverse the decoded counting direction.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  mux-states:
    required: true
