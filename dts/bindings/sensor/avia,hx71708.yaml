description: |
  Avia HX71708 sensor

compatible: "avia,hx71708"

include: avia,hx7xx-common.yaml

properties:
  rate-hz:
    type: int
    description: |
      Sensor sample rate in Hz.
      The default of 10 Hz is the vendor power-on rate and the lowest, least noisy
      setting. Select a higher rate only if the application
      needs faster sampling; the rate is set through the communication protocol.
      If CONFIG_PM_DEVICE_RUNTIME = y the rate will not be higher than 2~3Hz due to
      the long wake-up time needed for HX71708.
    default: 10
    enum: [10, 20, 80, 320]
