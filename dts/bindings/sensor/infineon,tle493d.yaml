description: |
  Infineon TLE493D magnetic sensor.

compatible: "infineon,tle493d"

include: [sensor-device.yaml, i2c-device.yaml]

examples:
  - |
    &i2c1 {
        tle493d: tle493d@35 {
            compatible = "infineon,tle493d";
            reg = <0x35>;
        };
    };
