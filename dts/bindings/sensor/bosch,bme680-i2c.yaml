title: Bosch BME680 Environmental Sensor (I2C)

description: |
    The BME680 is an integrated environmental sensor that measures
    temperature, pressure, humidity and air quality. The driver also
    supports the BME688, detected at runtime from the variant ID
    register.

compatible: "bosch,bme680"

include: [sensor-device.yaml, i2c-device.yaml]
