description: |
  Renesas MHU MBOX

  Notes:
  - With Renesas MHU MBOX, both TX and RX functions can be used on a single channel.

compatible: "renesas,rz-mhu-mbox"

include: [base.yaml, mailbox-controller.yaml]

properties:
  unit:
    type: int
    required: true
    description: |
      Index of the underlying MHU hardware channel used by this MBOX controller.
      This value is independent of MBOX channel numbering.

  reg:
    required: true

  interrupts:
    required: true

  channel-mask:
    type: int
    required: true
    description: |
      Bitmask of available valid MBOX channels (bit n enables channel n).

  channels-count:
    type: int
    required: true
    description: |
      Number of channels supported for a MBOX instance.

  shared-memory:
    type: phandle
    description: |
      Reference to the shared memory region that is going
      to be used for the buffer communication between
      MHU units. This property is optional and should not be set
      in most cases.

      When omitted, the driver uses the default shared memory region defined
      by the "zephyr,memory-region" node named "mhu_shmem" in the devicetree.
      Set this property only when this MHU hardware channel requires a dedicated
      shared memory region separate from the default.

mbox-cells:
  - channel
