title: Rockchip RK3588 CRU Reset Controller

description: |
  Reset controller for the Rockchip RK3588 CRU. Reset IDs are defined in
  include/zephyr/dt-bindings/reset/rk3588-cru-reset.h and encoded as
  (SOFTRST_CON register index * 16) + bit within that register.

compatible: "rockchip,rk3588-cru-rst"

include: [reset-controller.yaml, base.yaml]

properties:
  "#reset-cells":
    const: 1

reset-cells:
  - id
