description: |
  STM32 LPTIM PWM

  PWM output of an STM32 low-power timer. The node is a child of an "st,stm32-lptim" node, which
  gives the registers, the reset line, the clocks and the counter prescaler (st,prescaler). The
  second clock of the parent selects the kernel clock. With LSI or LSE the output keeps running
  in the Stop modes where the timer is functional.

  A constant level, 0 % or 100 % duty cycle, is exact while no channel of the timer generates a
  waveform, since the counter is then stopped. On an instance with two channels, while the other
  channel generates a waveform, 0 % becomes one high cycle per period and 100 % one low cycle
  per period, since an exact level would disturb the other channel. A channel with a GPIO in
  channel-gpios holds exact levels in all cases.

  Example for STM32U5, LPTIM3 clocked by LSI, channel 1 on PD14:

    &lptim3 {
      clocks = <&rcc STM32_CLOCK(APB3, 12)>,
               <&rcc STM32_SRC_LSI LPTIM34_SEL(1)>;
      status = "okay";

      lptim3_pwm: pwm {
        pinctrl-0 = <&lptim3_ch1_pd14>;
        pinctrl-names = "default";
        status = "okay";
      };
    };

compatible: "st,stm32-lptim-pwm"

include: [pwm-controller.yaml, base.yaml, pinctrl-device.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  channel-gpios:
    type: phandle-array
    description: |
      GPIO of the output pin of each channel, in channel order, with <0> for a channel without
      one. For 0 % and 100 % duty cycle the pin of a channel with a GPIO is driven as GPIO
      output, which gives exact levels also while the other channel generates a waveform. For a
      waveform the pin goes back to the timer. Each GPIO must be the pin of its channel in
      pinctrl-0. The level is the physical one that the PWM flags select, so GPIO_ACTIVE_LOW has
      no effect. On an instance with a single output, a GPIO also avoids a short low pulse when a
      pulse of a waveform with the regular polarity switches to a high level.

      Example for channel 2 of LPTIM2 on PC7:

        channel-gpios = <0>, <&gpioc 7 GPIO_ACTIVE_HIGH>;

  "#pwm-cells":
    const: 3
    description: |
      Number of items to expect in a PWM
      - channel of the timer used for PWM
      - period to set in ns
      - flags : combination of standard flags like PWM_POLARITY_NORMAL

pwm-cells:
  - channel
  - period
  - flags
