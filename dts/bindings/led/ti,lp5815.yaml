title: Texas Instruments LP5815 3-channel I2C RGB LED driver

description: |
  The LP5815 drives three LED outputs, each with an 8-bit PWM value and an
  8-bit dot current, and has an animation engine that the driver uses to blink
  the LEDs.

  Each child node is an LED. Its index is the first output it uses, and each
  further color of its color-mapping takes the next output. Two LEDs must not
  share an output.

  A blinking LED goes between off and full PWM, on all its colors. The on and
  off times can be 50 ms to 500 ms in steps of 50 ms, or 1, 2, 4, 6 or 8 s.

compatible: "ti,lp5815"

include: ["i2c-device.yaml", "led-controller.yaml"]

properties:
  max-current-51ma:
    type: boolean
    description: |
      Maximum current of every output: 51 mA with this property, 25.5 mA
      without it.

  dot-current:
    type: array
    required: true
    min: 0
    max: 255
    min-len: 3
    max-len: 3
    description: |
      Current of outputs 0, 1 and 2, each as a part of the maximum current
      from 0 to 255 (255 is the maximum current). An output with 0 gives no
      current, so its LED stays dark.

child-binding:
  properties:
    label:
      required: true

    index:
      required: true

    color-mapping:
      required: true

examples:
  - |
    #include <zephyr/dt-bindings/led/led.h>

    lp5815@2d {
      compatible = "ti,lp5815";
      reg = <0x2d>;
      dot-current = <255 255 255>;

      led_0 {
        label = "RGB LED";
        index = <0>;
        color-mapping = <LED_COLOR_ID_RED LED_COLOR_ID_GREEN LED_COLOR_ID_BLUE>;
      };
    };
