description: TI LP5569 LED

compatible: "ti,lp5569"

include: i2c-device.yaml

properties:
  enable-gpios:
    type: phandle-array
    description: |
      GPIO used to enable the lp5569.

  charge-pump-mode:
    type: string
    default: "disabled"
    enum:
      - "disabled"
      - "1x"
      - "1x5"
      - "auto"
    description: |
      If provided, configures the internal charge-pump mode in the MISC
      register. This can be useful to supply a higher voltage to the LEDs, than
      what the lp5569 is being supplied.
      The default corresponds to the reset value of the register.

  int-clk-en:
    type: boolean
    description: |
      Internal 32kHz clock-enable select. Default disabled on reset.
      Disabled: External 32-kHz clock is used from CLK input pin
      Enabled:  Internal 32-kHz oscillator is enabled

  cp-return-1x:
    type: boolean
    description: |
      Charge-pump return to 1× mode select. Default disabled on reset.
      Disabled: Charge-pump mode is not affected during shutdown or power-save entry
      Enabled:  Charge-pump mode is forced to 1x mode during shutdown or power-save entry
