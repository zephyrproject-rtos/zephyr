description: |
  Input driver for STM32 Tocuh Sensing Controller (TSC).

  This node is a st,stm32-tsc grandchild node and applies filters and
  calculations to detect an input event on a group which is the child of
  st,stm32-tsc. For more information see drivers/misc/st,stm32-tsc.yaml

compatible: "tsc-keys"

include:
  - name: base.yaml
    property-allowlist:
      - compatible
      - zephyr,deferred-init
      - label
      - status

properties:
  sampling-interval-ms:
    type: int
    required: true
    description: |
      Sampling interval in milliseconds.
  oversampling:
    type: int
    required: true
    description: |
      Over sampling factor. The driver will take the average of the samples
      taken in the sampling interval and compare it with the previous sample.
      Larger values will reduce the noise but will increase the latency. The
      default value is 10 so the slope will be calculated every
      10 * sampling-interval-ms milliseconds.
  noise-threshold:
    type: int
    required: true
    description: |
      This value will be used to reject the noise for both
      directions of the slope.
  sticky-key-timeout-ms:
    type: int
    required: true
    description: |
      Time in milliseconds to wait before releasing a key. By default a release
      event will be generated after 10 seconds of the last press event if
      the key is still pressed.
  zephyr,code:
    type: int
    required: true
    description: Key code to emit.
  channel-io:
    type: int
    description: |
      Channel I/O within the parent group that this key node owns. Must be a
      single bit also present in the parent group's channel-ios mask.

      When the parent group declares more than one channel I/O (multi-channel
      multiplexing), this property is required so the driver can route the
      acquisition result for each I/O to the correct key. When the parent
      group declares exactly one channel I/O, this property may be omitted and
      the driver derives it from the parent's channel-ios mask.
    enum:
      - 1
      - 2
      - 4
      - 8

examples:
  - |
    #include <zephyr/dt-bindings/input/input-event-codes.h>
    #include <zephyr/dt-bindings/input/stm32-tsc-defines.h>

    /* Single channel I/O per group: channel-io may be omitted. */
    &tsc {
      compatible = "st,stm32-tsc";

      tsc_group6: g6 {
        /* ... */
        ts1 {
          compatible = "tsc-keys";
          sampling-interval-ms = <10>;
          oversampling = <10>;
          noise-threshold = <50>;
          zephyr,code = <INPUT_KEY_0>;
        };
      };
    };

  - |
    #include <zephyr/dt-bindings/input/input-event-codes.h>
    #include <zephyr/dt-bindings/input/stm32-tsc-defines.h>

    /* Multi-channel group: each tsc-keys child owns one channel I/O.
     * The driver multiplexes acquisitions across them.
     */
    &tsc {
      compatible = "st,stm32-tsc";
      st,acquisition-interval-ms = <10>;

      tsc_group2: g2 {
        group = <2>;
        channel-ios = <(TSC_IO2 | TSC_IO3 | TSC_IO4)>;
        sampling-io = <TSC_IO1>;

        ts_a {
          compatible = "tsc-keys";
          channel-io = <TSC_IO2>;
          sampling-interval-ms = <10>;
          oversampling = <10>;
          noise-threshold = <50>;
          zephyr,code = <INPUT_KEY_0>;
        };
        ts_b {
          compatible = "tsc-keys";
          channel-io = <TSC_IO3>;
          sampling-interval-ms = <10>;
          oversampling = <10>;
          noise-threshold = <50>;
          zephyr,code = <INPUT_KEY_1>;
        };
        ts_c {
          compatible = "tsc-keys";
          channel-io = <TSC_IO4>;
          sampling-interval-ms = <10>;
          oversampling = <10>;
          noise-threshold = <50>;
          zephyr,code = <INPUT_KEY_2>;
        };
      };
    };
