description: STM32 Tocuh Sensing Controller (TSC) driver

compatible: "st,stm32-tsc"

include: [base.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true
  clocks:
    required: true
  resets:
    required: true
  interrupts:
    required: true
  pinctrl-0:
    required: true
  pinctrl-names:
    required: true

  st,pulse-generator-prescaler:
    type: int
    required: true
    description: |
      Prescaler for the pulse generator clock (t_pgclk=f_hclk/prescaler).
      The prescaler is used to generate the charge transfer pulse. The final
      prescaled value is 2^N where N is the value of this property.
    enum: [1, 2, 4, 8, 16, 32, 64, 128]

  st,charge-transfer-pulse-high:
    type: int
    required: true
    description: |
      Number of cycles for the high state of the
      charge transfer pulse (1 to 16 cycles of t_pgclk).
    min: 1
    max: 16

  st,charge-transfer-pulse-low:
    type: int
    required: true
    description: |
      Number of cycles for the low state of the
      charge transfer pulse (1 to 16 cycles of t_pgclk).
    min: 1
    max: 16

  st,spread-spectrum:
    type: boolean
    description: Spread spectrum enable

  st,spread-spectrum-prescaler:
    type: int
    required: true
    description: Spread spectrum clock prescaler (t_ssclk)
    enum:
      - 1
      - 2

  st,spread-spectrum-deviation:
    type: int
    required: true
    description: Spread spectrum deviation (1 to 128 cycles of t_ssclk)

  st,max-count-value:
    type: int
    required: true
    description: |
      Max number of charge transfer pulses before max count error is generated.
      The value of the counter is calculated as 256 * 2^max_count_value.
    enum: [255, 511, 1023, 2047, 4095, 8191, 16383, 32767]

  st,synced-acquisition:
    type: boolean
    description: |
      Synchronized acquisition enable.
      Acquisition starts when START bit and signal on sync pin.
      You have to provide a pinctrl for the sync pin.

  st,syncpol-rising:
    type: boolean
    description: Rising synchronization pin polarity, instead of falling

  st,iodef-float:
    type: boolean
    description: |
      Set default state (not acquisition) of all channel I/Os to floating.
      push-pull down by default.

  st,acquisition-interval-ms:
    type: int
    description: |
      Period in milliseconds between successive acquisitions, driven by a
      single timer owned by the TSC peripheral. When set, this is the
      authoritative source of acquisition cadence and per-key
      sampling-interval-ms is ignored for triggering acquisitions.

      Required when more than one tsc-keys child is attached to the same TSC
      (whether across groups or as multiple channel I/Os within a group),
      because the peripheral has a single START bit and per-child timers
      would race. When omitted, each tsc-keys child runs its own timer
      (legacy single-child behaviour).

child-binding:
  description: STM32 TSC group configuration
  properties:
    group:
      type: int
      required: true
      description: Group number (0 to 7)
      min: 0
      max: 7

    channel-ios:
      type: int
      required: true
      description: |
        Bitmask of channel I/Os enabled in this group, formed by ORing TSC_IOn
        defines. The TSC peripheral can only sample a single channel I/O per
        group per acquisition; when more than one bit is set the driver
        multiplexes acquisitions across those I/Os in round-robin order.

        Each enabled channel I/O is exposed via a dedicated tsc-keys child
        node that names the I/O via its channel-io property.
      min: 1
      max: 16

    sampling-io:
      type: int
      required: true
      description: Channel to be selected for sampling
      enum:
        - 1
        - 2
        - 4
        - 8

    st,use-as-shield:
      type: boolean
      description: |
        Use channel as shield. This configures group but
        does not enable it for acquisition. channel-io is used
        as shield pin and can only have values 1, 2, 4 or 8.
