description: |
  NXP Low-Power Analog Comparator (LPACMP)

compatible: "nxp,lpacmp"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
    description: |
      Entry 0 is required and is the AON clock the sampling counter runs on. It
      must resolve to a node carrying a clock-frequency property: the driver
      reads that frequency to derive how long a fresh sample takes, and waits
      that long whenever it resamples the comparator output.

      Entry 1 is optional and is the peripheral clock gate, reached through
      syscon. Where the SoC gates the block (on MCXL255 the CGU
      PER_CLK_EN[COMP_CLK_EN] gate resets to disabled) this entry has to be
      present, or no register in the block responds. Where the block has no
      separate gate, leave it out.

  clock-names:
    type: string-array
    description: |
      Optional names for the clocks entries, for readability. When present, use
      "aon-clk" for the sampling clock and "gate" for the peripheral clock gate.
      The driver addresses both entries by index, so the names are
      documentation only.

  positive-input:
    type: string
    required: true
    enum:
      - "comp_in4"
      - "comp_in5"
      - "comp_in0"
      - "comp_in1"
      - "comp_in2"
      - "comp_in3"
    description: |
      Positive input selection for channel 0 (SEL0[INP_SEL]).

      The list is ordered by the register encoding, not by input number: the
      hardware encodes 0 as comp_in4 and 1 as comp_in5 before continuing with
      comp_in0 through comp_in3. The driver writes the enum index straight into
      SEL0[INP_SEL], so entries must stay in this order and must not be sorted.

  negative-input:
    type: int
    required: true
    min: 0
    max: 15
    description: |
      Negative (reference) input selection for channel 0 (SEL0[INN_SEL]).
      Values 0-13 select an internal reference of (value + 1) x AVDD / 15.
      Value 14 selects external input comp_in4 and value 15 selects external
      input comp_in5.

  sample-delay:
    type: int
    default: 0
    min: 0
    max: 65535
    description: |
      Channel 0 sample delay counter value (DELAY0[DEL]) in AON_CLK cycles.
      The comparator output is sampled every time this counter reaches zero,
      so the value sets the sampling period and must give the output enough
      time to become steady. The default is the register reset value; in the
      Continuous mode used by this driver the comparator is always powered,
      so sampling at every AON_CLK cycle is functional, but a non-zero value
      adds settling margin between samples.
