description: |
  Infineon HPPASS CSG comparator.

  One instance represents the comparator inside a CSG slice.  This
  node must be a child of an "infineon,hppass-csg" CSG MFD parent.

  The comparator's negative input may select either the paired in-slice
  DAC output or an available external analog input path (AIN_NA, AIN_NB):

    - When negative-input = "dac", the paired DAC must also be configured
      and enabled.
    - When negative-input = "ain-na" or "ain-nb", the comparator operates
      as a standalone analog-only comparator and the paired DAC is unused.

  The CSG MFD parent owns the combined comparator interrupt and dispatches
  callbacks. On PSC3M6 it also configures the shared analog route muxes
  through its infineon,aroute-inputs property.

compatible: "infineon,hppass-csg-comp"

include: [base.yaml]

properties:
  reg:
    type: array
    required: true
    description: |
      Register region for this slice's CMP_CFG within the CSG block.
      Slice index is derived at compile time from the offset divided
      by the CSG slice stride.

  positive-input:
    type: string
    required: true
    enum:
      - "ain-pa"
      - "ain-pb"
    description: |
      Selects the comparator's positive input source (CMP_CFG.CMP_POS_SEL):
        - "ain-pa": positive analog input path AIN_PA
        - "ain-pb": positive analog input path AIN_PB

      On PSC3M5 these paths select the fixed external AIN_PA and AIN_PB
      pins. On PSC3M6 the input paths use slice-dependent analog routing,
      including CSG route-mux outputs. AIN_PB on slices 6-8 uses a
      neighboring mux. Configure the mux inputs on the CSG parent with
      infineon,aroute-inputs; enabling a neighboring comparator is not
      required to configure its mux.

  negative-input:
    type: string
    required: true
    enum:
      - "dac"
      - "ain-na"
      - "ain-nb"
    description: |
      Selects the comparator's negative input source (CMP_CFG.CMP_NEG_SEL):
        - "dac":    paired in-slice DAC output (default operating mode)
        - "ain-na": negative analog input path AIN_NA (standalone comparator)
        - "ain-nb": negative analog input path AIN_NB (standalone comparator)

      On PSC3M5 the external negative input paths use fixed pins from
      the next slice. On PSC3M6 slices 0, 1, 3, 4, 6 and 7, the external
      negative input routing includes the next slice's route-mux output.
      The AIN_NA/AIN_NB connections are slice-specific; consult the device
      input-routing table and configure the shared muxes through the CSG
      parent's infineon,aroute-inputs property.

      PSC3M5 slice 4 and PSC3M6 slices 2, 5 and 8 have no external negative
      input. They must select "dac"; "ain-na" and "ain-nb" cause a build
      error on these slices.

  invert-output:
    type: boolean
    description: |
      Invert the digital comparator output before edge detection, blanking
      and status visibility (CMP_CFG.CMP_POLARITY).

  blank-mode:
    type: string
    default: "disabled"
    enum:
      - "disabled"
      - "gate-on-one"
      - "gate-on-zero"
    description: |
      Comparator output blanking mode (CMP_CFG.CMP_BLANK_MODE).

      Blanking gates the comparator output to inactive while a selected
      external trigger is asserted, preventing a trip on a transient condition.

        - "disabled":     no blanking applied
        - "gate-on-one":  comparator output is forced inactive while the
                          selected blanking trigger is high
        - "gate-on-zero": comparator output is forced inactive while the
                          selected blanking trigger is low

  blank-trigger-sel:
    type: string
    default: "disabled"
    enum:
      - "disabled"
      - "tr0"
      - "tr1"
      - "tr2"
      - "tr3"
      - "tr4"
      - "tr5"
      - "tr6"
      - "tr7"
    description: |
      Selects which HPPASS trigger input gates the comparator output when
      blank-mode is enabled (CMP_CFG.CMP_BLANK_TR_SEL).  Trigger sources
      "tr0".."tr7" correspond to the eight HPPASS trigger inputs
      configured on the parent "infineon,hppass-analog" node.
