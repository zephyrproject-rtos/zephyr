description: |
  Raspberry Pi Pico (RP2040/RP2350) PIO-based MSPI controller.

  Implements MSPI_IO_MODE_QUAD_1_4_4: a 1-wire serial instruction byte
  followed by 4-wire quad address, dummy, and data phases.

  The node must be a child of a PIO device node (&pio0 or &pio1).

  The state machine spends four cycles on every SCLK period, so SCLK cannot
  go above clk_sys / 4: 37.5 MHz on the RP2350 and 31.25 MHz on the RP2040.
  clock-frequency, when given, lowers that limit.  The controller rejects a
  device configuration it cannot clock.

  The controller works in controller mode, half duplex, single data rate and
  clock mode 0, without DQS.  It has no hardware chip enable: each device is
  selected through the ce-gpios entry its reg value indexes.  More than one
  device on the bus needs software-multiperipheral, as the controller moves
  between their settings in mspi_dev_config().

  Example:

    &pio0 {
      mspi0: mspi0 {
        compatible = "raspberrypi,pico-mspi-pio";
        clocks = <&clocks RPI_PICO_CLKID_CLK_SYS>;
        #address-cells = <1>;
        #size-cells = <0>;
        pinctrl-0 = <&pio0_qspi_default>;
        pinctrl-names = "default";
        clk-gpios = <&gpio0 17 GPIO_ACTIVE_HIGH>;
        io0-gpios = <&gpio0 18 GPIO_ACTIVE_HIGH>;
        io1-gpios = <&gpio0 19 GPIO_ACTIVE_HIGH>;
        io2-gpios = <&gpio0 20 GPIO_ACTIVE_HIGH>;
        io3-gpios = <&gpio0 21 GPIO_ACTIVE_HIGH>;
        ce-gpios = <&gpio0 16 GPIO_ACTIVE_LOW>;
        dmas = <&dma 0 0 0>, <&dma 1 0 0>;
        dma-names = "tx", "rx";
        op-mode = "MSPI_OP_MODE_CONTROLLER";
        duplex = "MSPI_HALF_DUPLEX";
        status = "okay";

        w6300: w6300@0 {
          compatible = "wiznet,w6300";
          reg = <0>;
          mspi-max-frequency = <33000000>;
          mspi-io-mode = "MSPI_IO_MODE_QUAD_1_4_4";
          mspi-data-rate = "MSPI_DATA_RATE_SINGLE";
          ...
        };
      };
    };

compatible: "raspberrypi,pico-mspi-pio"

include: [mspi-controller.yaml, pinctrl-device.yaml]

properties:
  clk-gpios:
    type: phandle-array
    required: true
    description: SPI clock (SCLK) GPIO.

  io0-gpios:
    type: phandle-array
    required: true
    description: Data line IO0.  Also carries the instruction byte.

  io1-gpios:
    type: phandle-array
    required: true
    description: Data line IO1.  Must be io0 pin + 1.

  io2-gpios:
    type: phandle-array
    required: true
    description: Data line IO2.  Must be io0 pin + 2.

  io3-gpios:
    type: phandle-array
    required: true
    description: Data line IO3.  Must be io0 pin + 3.

  ce-gpios:
    required: true
    description: |
      Chip enable GPIOs, one per device, indexed by the device's reg value.

  clocks:
    required: true
    description: Clock source for computing the PIO clock divider.

  dmas:
    required: true
    description: |
      TX and RX DMA channels used to feed and drain the PIO FIFOs.
      Only the channel cell is used; the data request line is derived at
      runtime from the PIO state machine the driver is given, so the slot
      cell is ignored.

  dma-names:
    required: true
    description: Must be "tx" and "rx".
