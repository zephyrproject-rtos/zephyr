description: STM32 QSPI controller

compatible: "st,stm32-qspi-controller"

include: [base.yaml, pinctrl-device.yaml, mspi-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clock-names:
    required: true

  clocks:
    required: true

  dmas:
    description: |
      Optional DMA channel specifier, required for DMA transactions.
      For example dmas for TX/RX on QSPI
         dmas = <&dma1 5 41 0x10000>;

  dma-names:
    description: |
      DMA channel name. If DMA should be used, expected value is "tx_rx".

      For example
         dma-names = "tx_rx";
    enum:
      - "tx_rx"

  st,ssht-enable:
    type: boolean
    description: |
      Enables Sample Shifting half-cycle.

      It is recommended to be enabled in STR mode and disabled in DTR mode.

  clock-frequency:
    required: true

  st,cs-high-time:
    type: int
    default: 8
    min: 1
    max: 8
    description: |
      Minimum number of QSPI clock cycles the chip select signal must remain
      high between commands issued to the flash memory.

      The minimum acceptable value depends on the flash memory model and the
      QSPI clock frequency. Using a value higher than the minimum required by
      the flash memory does not lead to communication errors, but is
      suboptimal as it reduces the throughput.

      Defaults to 8 clock cycles, which is the maximum supported value.
