description: STM32 memory device on mspi bus

compatible: "st,nor"

include: jedec,nor-mspi.yaml

properties:
  st,mem-type:
    type: string
    enum:
      - "micron"
      - "macronix"
      - "apmem"
      - "macronix_ram"
      - "hyperbus"
      - "apmem_16bits"
    description: |
        Selects the memory type programmed into the controller MTYP field.

        - "micron": Micron memories.
        - "macronix": Macronix memories.
        - "apmem": AP Memory.
        - "macronix_ram": Macronix pseudo-static RAM (PSRAM).
        - "hyperbus": HyperBus/HyperRAM memories.
        - "apmem_16bits": AP Memory memories using the 16-bit variant.
