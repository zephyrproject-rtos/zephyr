title: Bitbang MSPI controller

description: |
  MSPI controller implemented in software on GPIO pins.

  The controller supports synchronous programmed I/O transfers in controller
  mode, half duplex, with all I/O modes up to the number of io-gpios entries,
  all data rates and all clock polarity and phase modes. Transfers run as fast
  as the GPIO accesses allow, at most at the frequency a device requests.

  Limitations:

  - Asynchronous transfers are rejected with -ENOTSUP.

  - The MSPI_DMA and MSPI_MEMMAP transfer modes are rejected with -ENOTSUP.

  - Full duplex and DQS are rejected with -ENOTSUP.

  - Callbacks, memory mapping (XIP), scrambling and timing configuration are
    not implemented.

  - The priority of a transfer and the callback mask of a packet are ignored.

  - The maximum CE active time of a device (time_to_break) is not enforced. CE
    stays asserted for a whole packet; a packet is never interrupted to
    release and reassert CE, however long it takes.

  - The memory boundary of a device (mem_boundary) is not enforced. A packet
    that crosses the boundary is not split, so the device driver has to issue
    one packet per boundary-aligned block itself.

  - With hold_ce set, CE stays asserted between the packets of a transfer and
    after it, and a following transfer on the same CE line continues with CE
    asserted. CE is released by a transfer without hold_ce, by a transfer on
    another CE line, by a transfer that times out, by
    mspi_get_channel_status() and by mspi_config(). While CE is held,
    mspi_dev_config() for the same device from the thread that holds the
    controller is allowed and leaves CE asserted. mspi_dev_config() for
    another device returns -EBUSY as long as the controller has not been
    released.

compatible: "zephyr,mspi-bitbang-controller"

include: mspi-controller.yaml

properties:
  sck-gpios:
    type: phandle-array
    required: true
    description: Serial clock output.

  io-gpios:
    type: phandle-array
    required: true
    description: |
      Data lines, up to sixteen, indexed like the IO0 .. IO15 pins of a
      multi-bit SPI device. In single I/O mode IO0 is the data output and IO1
      the data input; a multi-line phase uses IO0 .. IOn in both directions.

examples:
  - |
    mspi0: mspi-bitbang-controller {
        compatible = "zephyr,mspi-bitbang-controller";
        #address-cells = <1>;
        #size-cells = <0>;
        sck-gpios = <&gpio3 7 GPIO_ACTIVE_HIGH>;
        io-gpios = <&gpio3 8 GPIO_ACTIVE_HIGH>,
                   <&gpio3 9 GPIO_ACTIVE_HIGH>,
                   <&gpio3 10 (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>,
                   <&gpio3 11 (GPIO_ACTIVE_HIGH | GPIO_PULL_UP)>;
        ce-gpios = <&gpio3 0 GPIO_ACTIVE_LOW>;
        clock-frequency = <1000000>;

        flash@0 {
            compatible = "jedec,nor";
            reg = <0>;
            size = <DT_SIZE_M(64)>;
            jedec-id = [ef 40 17];
            mspi-max-frequency = <1000000>;
            mspi-io-mode = "MSPI_IO_MODE_QUAD_1_1_4";
            mspi-data-rate = "MSPI_DATA_RATE_SINGLE";
            mspi-cpp-mode = "MSPI_CPP_MODE_0";
            mspi-endian = "MSPI_BIG_ENDIAN";
            mspi-ce-polarity = "MSPI_CE_ACTIVE_LOW";
        };
    };
