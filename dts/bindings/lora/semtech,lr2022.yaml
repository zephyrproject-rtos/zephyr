title: Semtech LR2022 LoRa Modem

description: |
  Semtech LR2022 LoRa Modem.
  It supports 150-960MHz sub-GHz ISM bands, 1.9-2.1GHz Satellite bands, and the 2.4GHz ISM band.
  It has continuous spectrum coverage over 150-960MHz and 1500-2500MHz ranges.
  LR2022 loses FLRC, O-QPSK, and Z-Wave support compared to LR2021.

compatible: "semtech,lr2022"

include: semtech,lr20xx-base.yaml

properties:
  reset-gpios:
    required: true
  busy-gpios:
    required: true
  irq-gpios:
    required: true
  dio-functions:
    required: true
  dio-sleep-pulls:
    required: true
