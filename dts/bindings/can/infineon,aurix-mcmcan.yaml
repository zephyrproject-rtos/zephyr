description: |
  Infineon AURIX MCMCAN module, with up to four infineon,aurix-mcmcan-node
  child nodes sharing one message RAM.

compatible: "infineon,aurix-mcmcan"

include: base.yaml

properties:
  reg:
    required: true

  clocks:
    required: true
    description: fMCAN (CAN clock) and fMCANH (host clock).

  clock-names:
    required: true
    description: Must be "mcan" and "mcanh".
