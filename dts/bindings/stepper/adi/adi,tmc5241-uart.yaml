description: |
  ADI/Trinamic TMC5241 Stepper Motor Controller (UART single-wire mode)

  This binding supports the single-wire UART mode where:
  - DIAG1/SW is connected to the MCU's UART TX/RX pin (TX through a series
    resistor, as on the TMC5241-EVKIT, so the host can read back its own bytes)
  - UART_EN must be HIGH (either via GPIO control or hardwired)

compatible: "adi,tmc5241"

include: [uart-device.yaml, "adi,tmc5241-base.yaml"]

properties:
  uart-en-gpios:
    type: phandle-array
    description: |
      GPIO connected to the UART_EN pin of TMC5241. Driven high at init to
      select the single-wire UART interface (low selects SPI).
      If not provided, it's assumed UART_EN is hardwired high.

  uart-device-addr:
    type: int
    description: |
      UART device address for TMC5241 in UART mode.
    min: 0
    max: 253

examples:
  - |
    &uart2 {
        current-speed = <115200>;
        status = "okay";

        tmc5241: tmc5241 {
            compatible = "adi,tmc5241";
            uart-en-gpios = <&gpiob 0x01 GPIO_ACTIVE_HIGH>;

            /* Common settings from base binding */
            clock-frequency = <DT_FREQ_M(12)>;
            en-pwm-mode;
            shaft;

            tmc5241_stepper_driver: stepper-driver {
                compatible = "adi,tmc5241-stepper-driver";
                micro-step-res = <256>;

                /* ADI TMC stallguard settings specific to TMC5241 */
                stallguard2-threshold = <9>;
            };

            tmc5241_stepper_ctrl: stepper-ctrl {
              compatible = "adi,tmc5241-stepper-ctrl";

              /* ADI TMC ramp generator as well as current settings */
              vstart = <10>;
              a1 = <20>;
              v1 = <30>;
              d1 = <40>;
              vmax = <50>;
              amax = <60>;
              dmax = <70>;
              tzerowait = <80>;
              thigh = <90>;
              tcoolthrs = <100>;
              tpwmthrs = <110>;
              tpowerdown = <120>;
              ihold = <1>;
              irun = <2>;
              iholddelay = <3>;
            };
        };
    };
