CONFIG_GPIO=y
CONFIG_MFD=y
# CPC core runs on CMSIS RTOS v2: one thread per silabs,ncp bus, mutexes and
# semaphores for each bus and endpoint
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_CMSIS_V2_THREAD_DYNAMIC_MAX_COUNT=1
CONFIG_CMSIS_V2_THREAD_DYNAMIC_STACK_SIZE=2048
CONFIG_CMSIS_V2_THREAD_MAX_STACK_SIZE=2048
CONFIG_CMSIS_V2_MUTEX_MAX_COUNT=16
CONFIG_CMSIS_V2_SEMAPHORE_MAX_COUNT=16
CONFIG_SDHC=y
CONFIG_SDHC_STM32_SDMMC=y
CONFIG_SDIO_STACK=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
