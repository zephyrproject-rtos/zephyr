# NXP Wi-Fi Configuration

# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_ETH_DRIVER=n
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NXP_WIFI_SOFTAP_SUPPORT=y

# NET
CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4_FRAGMENT=y
CONFIG_NET_IPV6_FRAGMENT=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n
# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=20

# DNS
CONFIG_DNS_RESOLVER=y

# Wi-Fi Shell
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# OS
CONFIG_SYS_HEAP_AUTO=y
CONFIG_SCHED_MULTIQ=y

# Make sure there is enough resources
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_SHELL_STACK_SIZE=6144

CONFIG_NET_PKT_RX_COUNT=36
CONFIG_NET_PKT_TX_COUNT=36
CONFIG_NET_BUF_RX_COUNT=40
CONFIG_NET_BUF_TX_COUNT=40
