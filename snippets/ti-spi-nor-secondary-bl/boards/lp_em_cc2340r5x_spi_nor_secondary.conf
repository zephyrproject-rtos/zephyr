CONFIG_SPI_NOR=y
# The external flash's sector size is 4kB
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_BOOT_UPGRADE_ONLY=y
# The max mcuboot slot size is 0x72000, this value is calculated by
# (max_mcuboot_slot_size / min(internal_flash_sector_size, external_flash_sector_size))
# 0x72000 / 0x800 = 0x344
CONFIG_BOOT_MAX_IMG_SECTORS=228
