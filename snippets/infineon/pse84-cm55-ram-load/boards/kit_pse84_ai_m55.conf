CONFIG_SOC_PSE84_M55_DISABLE_SMIF_XIP=y

# zephyr,flash points at a plain SoCMEM node (kit_pse84_ai_m55.overlay), not
# a flash-controller-plus-offset structure the way real NOR flash has, and
# the overlay deletes zephyr,code-partition rather than also pointing it
# there. CONFIG_USE_DT_CODE_PARTITION=y's default would otherwise still try
# to resolve CONFIG_FLASH_LOAD_OFFSET from that deleted chosen property.
# Turning it off here leaves FLASH_LOAD_OFFSET/FLASH_LOAD_SIZE at their own
# defaults (0 and "the rest of zephyr,flash"), which is already correct for
# a single flat RAM region with no header to skip.
CONFIG_USE_DT_CODE_PARTITION=n
