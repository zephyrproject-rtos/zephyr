CONFIG_SOC_PSE84_M55_DISABLE_SMIF_XIP=y

# zephyr,flash is deleted (kit_pse84_ai_m55.overlay) rather than pointed at
# the plain SoCMEM node m33 copies this image into, since Zephyr's
# zephyr,flash chosen property is documented project-wide as non-volatile
# code storage and this region is SoCMEM, not non-volatile.
# CONFIG_FLASH_BASE_ADDRESS/CONFIG_FLASH_SIZE would otherwise default from
# that chosen node (arch/Kconfig); with it gone, they are supplied
# directly here instead, matching snippet_pse84_cm55_ram_load_dst's own
# reg (kit_pse84_ai_common.overlay: 0x26200000, DT_SIZE_M(1)).
CONFIG_FLASH_BASE_ADDRESS=0x26200000
CONFIG_FLASH_SIZE=1024

# The overlay also deletes zephyr,code-partition rather than pointing it
# at the same node. CONFIG_USE_DT_CODE_PARTITION=y's default would
# otherwise still try to resolve CONFIG_FLASH_LOAD_OFFSET from that
# deleted chosen property. Turning it off here leaves
# FLASH_LOAD_OFFSET/FLASH_LOAD_SIZE at their own defaults (0 each, the
# second meaning "occupy up to the end of flash," i.e. CONFIG_FLASH_SIZE
# above), which is already correct for a single flat RAM region with no
# header to skip.
CONFIG_USE_DT_CODE_PARTITION=n
