description: Property var-uint64 type test

compatible: "vnd,var-uint64-test"

properties:
  val-32:
    type: var-uint64
    description: 1-cell (32-bit) var-uint64 value

  val-64:
    type: var-uint64
    description: 2-cell (64-bit) var-uint64 value

  val-with-min:
    type: var-uint64
    min: 100

  val-with-max:
    type: var-uint64
    max: 0xFFFFFFFF

  val-with-default:
    type: var-uint64
    default: 42

  val-const:
    type: var-uint64
    const: 999
