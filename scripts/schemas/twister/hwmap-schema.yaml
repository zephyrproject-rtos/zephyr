$schema: "https://json-schema.org/draft/2020-12/schema"
$defs:
  line_state:
    type: object
    properties:
      dtr:
        type: boolean
      rts:
        type: boolean
    additionalProperties: false
  serial_lines:
    type: object
    properties:
      dtr:
        type: boolean
      rts:
        type: boolean
      delay_ms:
        type: integer
        minimum: 0
    additionalProperties: false
  post_connect_reset:
    type: object
    properties:
      method:
        type: string
        enum:
          - serial
          - west
          - none
      open_state:
        $ref: "#/$defs/line_state"
      sequence:
        type: array
        items:
          $ref: "#/$defs/serial_lines"
      timeout:
        type: integer
        minimum: 1
    required:
      - method
    allOf:
      - if:
          properties:
            method:
              const: serial
        then:
          required:
            - sequence
    additionalProperties: false
type: array
items:
  type: object
  properties:
    available:
      type: boolean
    connected:
      type: boolean
    id:
      type: string
    notes:
      type: string
    platform: {}
    probe_id:
      type: string
    product:
      type: string
    runner:
      type: string
    base_params:
      type: array
      items:
        type: string
    runner_params:
      type: array
      items:
        type: string
    serial_pty:
      type: string
    serial:
      type: string
    baud:
      type: integer
    serial_baud:
      type: integer
    post_script:
      type: string
    post_flash_script:
      type: string
    pre_script:
      type: string
    fixtures:
      type: array
      items:
        type: string
    run_with_fixture_only:
      type: boolean
    flash_timeout:
      type: integer
    flash_with_test:
      type: boolean
    flash_before:
      type: boolean
    post_connect_reset:
      $ref: "#/$defs/post_connect_reset"
    script_param:
      type: object
      properties:
        pre_script_timeout:
          type: integer
        post_script_timeout:
          type: integer
        post_flash_timeout:
          type: integer
      additionalProperties: false
    west_flash_cmd:
      type: string
  required:
    - connected
    - id
    - platform
    - product
    - runner
  additionalProperties: false
