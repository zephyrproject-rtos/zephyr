#
# Schema to validate a YAML file describing a Zephyr test platform
#
$schema: "https://json-schema.org/draft/2020-12/schema"
$defs:
  line_state:
    type: object
    properties:
      dtr:
        type: boolean
      rts:
        type: boolean
    additionalProperties: false
  serial_lines:
    type: object
    properties:
      dtr:
        type: boolean
      rts:
        type: boolean
      delay_ms:
        type: integer
        minimum: 0
    additionalProperties: false
  post_connect_reset:
    type: object
    properties:
      method:
        type: string
        enum:
          - serial
          - west
          - none
      open_state:
        $ref: "#/$defs/line_state"
      sequence:
        type: array
        items:
          $ref: "#/$defs/serial_lines"
      timeout:
        type: integer
        minimum: 1
    required:
      - method
    allOf:
      - if:
          properties:
            method:
              const: serial
        then:
          required:
            - sequence
    additionalProperties: false
  platform:
    type: object
    properties:
      variants:
        type: object
        patternProperties:
          "[a-zA-Z0-9_]+":
            $ref: "#/$defs/platform"
        additionalProperties: false
      identifier:
        type: string
      maintainers:
        type: array
        items:
          type: string
      name:
        type: string
      type:
        type: string
        enum: ["mcu", "qemu", "sim", "unit", "native"]
      simulation:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
              enum:
                - qemu
                - simics
                - xt-sim
                - renode
                - nsim
                - mdb-nsim
                - tsim
                - armfvp
                - native
                - custom
                - whisper
            exec:
              type: string
          required:
            - name
          additionalProperties: false
      arch:
        type: string
        enum:
          - arc
          - arm
          - arm64
          - hexagon
          - mips
          - nios2
          - openrisc
          - posix
          - riscv
          - rx
          - sparc
          - tricore
          - x86
          - xtensa
          - unit
      vendor:
        type: string
      tier:
        type: integer
      preferred_toolchain:
        type: string
      build_toolchains:
        type: array
        items:
          type: string
      toolchain:
        type: array
        items:
          type: string
      sysbuild:
        type: boolean
      env:
        type: array
        items:
          type: string
      ram:
        type: integer
      flash:
        type: integer
      twister:
        type: boolean
      supported:
        type: array
        items:
          type: string
      testing:
        type: object
        properties:
          timeout_multiplier:
            type: number
          default:
            type: boolean
          flash_before:
            type: boolean
          post_connect_reset:
            $ref: "#/$defs/post_connect_reset"
          binaries:
            type: array
            items:
              type: string
          only_tags:
            type: array
            items:
              type: string
          ignore_tags:
            type: array
            items:
              type: string
          renode:
            type: object
            properties:
              uart:
                type: string
              resc:
                type: string
            additionalProperties: false
        additionalProperties: false
    additionalProperties: false
$ref: "#/$defs/platform"
