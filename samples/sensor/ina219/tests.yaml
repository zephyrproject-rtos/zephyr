sample:
  name: TI INA219 power/current monitor
  description: Demonstration of the INA219 I2C power/current monitor
tests:
  sample.sensor.ina219:
    build_only: true
    platform_allow:
      - blackpill_f411ce
      - adafruit_qt_py_rp2040/rp2040
    extra_args:
      - platform:adafruit_qt_py_rp2040/rp2040:SHIELD="adafruit_ina219"
    tags: sensors
  sample.sensor.ina219.rakwireless_rak16000:
    tags: sensors
    build_only: true
    extra_args: SHIELD="rakwireless_rak16000"
    platform_allow:
      - rak4631/nrf52840
    integration_platforms:
      - rak4631/nrf52840
