sample:
  name: Distance measurement sample
common:
  tags: sensors
  harness: console
  harness_config:
    type: one_line
    regex:
      - "^[a-zA-Z0-9_,+-.]*: [0-9\\.]+m$"
tests:
  sample.sensor.distance_polling:
    filter: dt_alias_exists("distance0")
    integration_platforms:
      - arduino_nicla_vision/stm32h747xx/m7     # vl53l1x
  sample.sensor.distance_polling.rakwireless_rak12014_sensor_c:
    harness: none
    extra_args: SHIELD="rakwireless_rak19007;rakwireless_rak12014_sensor_c"
    platform_allow:
      - rak4631/nrf52840
    integration_platforms:
      - rak4631/nrf52840
    build_only: true
