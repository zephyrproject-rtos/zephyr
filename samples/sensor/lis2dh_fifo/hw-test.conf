CONFIG_LIS2DH_FIFO_HW_TEST=y
# INT1 is routed to P2.00 on HOLYIOT-25008 and port P2 has no GPIOTE, so the
# FIFO has to be drained by polling instead of the INT1 interrupt.
CONFIG_LIS2DH_FIFO_POLL=y
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=4096
