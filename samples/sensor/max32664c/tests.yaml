sample:
  name: MAX32664C heart rate monitor sample
tests:
  sample.sensor.max32664c:
    harness: sensor
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - sensors
      - heart_rate
    filter: dt_compat_enabled("maxim,max32664c")
    depends_on:
      - i2c
  sample.sensor.max32664c.interrupt:
    build_only: true
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - sensors
      - heart_rate
    filter: dt_compat_enabled("maxim,max32664c")
    depends_on:
      - i2c
      - gpio
    extra_configs:
      - CONFIG_MAX32664C_USE_INTERRUPT=y
      - CONFIG_GPIO=y
