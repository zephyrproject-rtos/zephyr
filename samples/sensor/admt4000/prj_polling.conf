# Polling (synchronous) variant of the ADMT4000 sample. This intentionally
# leaves CONFIG_SENSOR_ASYNC_API disabled so the sensor_sample_fetch() /
# sensor_channel_get() code path is build-verified in CI.

CONFIG_STDOUT_CONSOLE=y
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_ADMT4000=y
CONFIG_CBPRINTF_FP_SUPPORT=y
