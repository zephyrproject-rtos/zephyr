# MIMXRT1060-EVK Rev-C with an IW612/IW610 M.2 module: OpenThread shell
# using the IW61x 802.15.4 radio as an RCP over SPI (HDLC). Use together
# with prj-ot-host.conf and iw612.conf or iw610.conf.

# The NXP Wi-Fi driver loads the IW61x firmware and is required. The
# Wi-Fi interface is not used by this sample and is left down.
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_ETH_NET_IF_NO_AUTO_START=y
CONFIG_ETH_DRIVER=n
# One IPv6 config per interface: OpenThread and Wi-Fi
CONFIG_NET_IF_MAX_IPV6_COUNT=2

# OpenThread RCP host interface
CONFIG_HDLC_RCP_IF=y
CONFIG_OPENTHREAD_RCP_RESTORATION_MAX_COUNT=10

# IW612/IW610 M.2: disable RW610 specific options
CONFIG_NXP_RW610=n
CONFIG_NXP_RF_IMU=n
CONFIG_NXP_FW_LOADER=n
CONFIG_NXP_WIFI_IND_DNLD=n

# Disable conflicting options
CONFIG_IEEE802154=n
CONFIG_STACK_SENTINEL=n
CONFIG_DISPLAY=n
CONFIG_LVGL=n
CONFIG_OPENTHREAD_INTERFACE_EARLY_UP=n
CONFIG_SPI_INIT_PRIORITY=50

# Shell. The IEEE 802.15.4 L2 shell from prj-ot-host.conf needs
# CONFIG_IEEE802154, which is disabled here.
CONFIG_NET_L2_IEEE802154_SHELL=n
CONFIG_SHELL_STACK_SIZE=5120
CONFIG_SHELL_PRINTF_BUFF_SIZE=512

# Stacks: net_mgmt event handlers of the Wi-Fi driver and OpenThread L2
# overflow the default 800 bytes when the OpenThread interface goes up.
# Values aligned with the border_router sample.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=5120

# Memory: the RCP path over SPI needs more buffers than an integrated radio
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48

# Settings backend
CONFIG_NVS=y

CONFIG_LOG=y
