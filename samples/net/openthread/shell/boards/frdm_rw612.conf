#shell
CONFIG_SHELL_STACK_SIZE=5120
# OT CLI commands can be ~300 characters (e.g. dataset commands with hex
# TLVs). Make the UART RX ring buffer hold a full command line, so no
# character is dropped while the shell thread is busy (e.g. printing a log).
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512

# IMU & FW loader
CONFIG_NXP_RF_IMU=y
CONFIG_NXP_FW_LOADER=y

# Enable Openthread RCP host interface
CONFIG_HDLC_RCP_IF=y

#PSA related
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y

CONFIG_NVS_INIT_BAD_MEMORY_REGION=y
