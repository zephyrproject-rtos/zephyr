# OS
CONFIG_HEAP_MEM_POOL_SIZE=4096

#shell
CONFIG_SHELL_STACK_SIZE=4096

# Logging
CONFIG_LOG=n
CONFIG_NET_LOG=n

# Enabling the IEEE802154 CSL endpoint and OpenThread CSL receiver.
# The CSL receiver (OPENTHREAD_CONFIG_MAC_CSL_RECEIVER_ENABLE) is a Thread 1.2
# feature and fails to build against Thread 1.1 (sub_mac.hpp #error). Select
# Thread 1.2 explicitly so the version matches the CSL requirement; this also
# auto-enables OPENTHREAD_PLATFORM_USEC_TIMER (required for the CSL RX timing).
CONFIG_OPENTHREAD_THREAD_VERSION_1_2=y
CONFIG_IEEE802154_CSL_ENDPOINT=y
CONFIG_OPENTHREAD_CSL_RECEIVER=y


# Secure storage
CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_KEY_PROVIDER_ENTRY_UID_HASH=y

# NVMEM write support: persist the IEEE 802.15.4 EUI-64 on boards
# that do not ship with a factory-programmed address.
CONFIG_NVMEM_FLASH_WRITE=y

# OpenThread worker thread stack (THREADIP-5758).
# During Thread commissioning the EC-JPAKE (P-256) DTLS handshake and the PSA
# SGI/PKC crypto path run on the OpenThread work-queue thread. With the default
# 6144 B this thread overflowed and triggered a USAGE FAULT (Zephyr fatal error
# 2, UFSR STKOF) that was caught by the MPU stack guard. Size it for the crypto
# path. Measured high-water mark was climbing past 6144 at the handshake.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=10240

# MPU hardware stack protection: trap any future stack overrun precisely at the
# thread boundary instead of silently corrupting adjacent RAM. Cheap to keep on.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# HW crypto Flash trim (THREADIP-5758, Step 4).
# The SGI/PKC HW accelerator driver does not declare any MBEDTLS_PSA_ACCEL_*
# macros, so TF-PSA-Crypto still compiles the mbedTLS SW builtins alongside the
# HW path; the PSA_WANT_* algorithm symbols cannot simply be dropped because
# they are all genuinely used (GCM by the secure-storage ITS AEAD transform,
# CCM/CMAC/SHA-256/ECDSA/EC-JPAKE by OpenThread). The one HW CLIB component that
# Thread never exercises is RSA: Thread only uses ECC P-256 (ECDSA and
# EC-JPAKE), so the mcuxClRsa sources can be excluded from the build to reclaim
# Flash without affecting any validated crypto operation.
CONFIG_SGI_PKC_RSA=n
