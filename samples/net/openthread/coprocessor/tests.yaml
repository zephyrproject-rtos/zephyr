common:
  harness: net
  tags:
    - net
    - openthread
  depends_on: openthread
  min_flash: 140
sample:
  description: Runs the OpenThread stack as NCP BR
  name: OpenThread Network Co-Processor
tests:
  sample.net.openthread.coprocessor:
    build_only: true
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf52833dk/nrf52833
      - tlsr9518adk80d
      - nucleo_wba55cg
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_args:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
  sample.net.openthread.coprocessor.usb:
    build_only: true
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf52833dk/nrf52833
    integration_platforms:
      - nrf52840dk/nrf52840
    tags: ci_build
    extra_args:
      - EXTRA_CONF_FILE=overlay-usb-nrf-br.conf
      - DTC_OVERLAY_FILE="usb.overlay"
  sample.net.openthread.coprocessor.rcp:
    build_only: true
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf52833dk/nrf52833
      - tlsr9518adk80d
      - nucleo_wba55cg
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_args:
      - EXTRA_CONF_FILE=overlay-rcp.conf
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
  sample.net.openthread.coprocessor.rcp.thread_1_4:
    build_only: true
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf52833dk/nrf52833
      - tlsr9518adk80d
      - nucleo_wba55cg
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_args:
      - EXTRA_CONF_FILE=overlay-rcp.conf
      - CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
  sample.net.openthread.coprocessor.debug:
    build_only: true
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf52833dk/nrf52833
      - tlsr9518adk80d
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_args: EXTRA_CONF_FILE=debug.conf
