# RT1060 EVKC — IW612/IW610 M.2 OpenThread Border Router
# Generic Ethernet options
CONFIG_ETH_DRIVER=y
CONFIG_NET_DHCPV4=y
CONFIG_ZVFS_EVENTFD_MAX=2
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_IEEE802154_NET_IF_NO_AUTO_START=y

# Ethernet L2 ifaces are started by iw61x_init.c once OpenThread L2 is initialized
CONFIG_ETH_NET_IF_NO_AUTO_START=y
CONFIG_NET_IF_MAX_IPV4_COUNT=3
