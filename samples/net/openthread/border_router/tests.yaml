common:
  harness: net
  tags:
    - net
    - openthread
  depends_on: openthread
sample:
  description: Test Wi-Fi and IEEE 802.15.4 using the OpenThread Border Router
  name: OpenThread Border Router
tests:
  sample.net.openthread.border_router.rw612_openthread_rcp_host:
    build_only: true
    extra_args:
      # Disabling monolithic since CI environment doesn't use blobs
      - CONFIG_NXP_MONOLITHIC_NBU=n
      - CONFIG_NXP_MONOLITHIC_WIFI=n
      - EXTRA_CONF_FILE="ot-rcp-host-wifi-nxp.conf"
    platform_allow:
      - frdm_rw612
      - rd_rw612_bga
  sample.net.openthread.border_router.rw612_openthread_rcp_host_webserver:
    build_only: true
    extra_args:
      # Disabling monolithic since CI environment doesn't use blobs
      - CONFIG_NXP_MONOLITHIC_NBU=n
      - CONFIG_NXP_MONOLITHIC_WIFI=n
      - EXTRA_CONF_FILE="ot-rcp-host-wifi-nxp.conf webserver.conf"
    platform_allow:
      - frdm_rw612
      - rd_rw612_bga
  sample.net.openthread.border_router.esp_rcp_host_wifi:
    build_only: true
    extra_args:
      - EXTRA_CONF_FILE="ot-rcp-host-wifi-esp.conf"
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
      - esp_threadbr/esp32s3/procpu
  sample.net.openthread.border_router.esp_rcp_host_eth.esp_devkits:
    build_only: true
    extra_args:
      - EXTRA_CONF_FILE="ot-rcp-host-eth-esp.conf"
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
  sample.net.openthread.border_router.esp_rcp_host_eth.esp_threadbr:
    build_only: true
    extra_args:
      - EXTRA_CONF_FILE="ot-rcp-host-eth-esp.conf"
    platform_allow:
      - esp_threadbr/esp32s3/procpu/ethernet
  sample.net.openthread.border_router.rt1060_evkc_iw612_wifi:
    build_only: true
    extra_args:
      - SHIELD="nxp_m2_2ll_wifi_bt nxp_m2_2el_2ll_ieee802154"
      - EXTRA_CONF_FILE="boards/mimxrt1060_evk_mimxrt1062_qspi_C/mimxrt1060_evk_mimxrt1062_qspi_C.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/wifi.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/iw612.conf"
    platform_allow:
      - mimxrt1060_evk@C/mimxrt1062/qspi
  sample.net.openthread.border_router.rt1060_evkc_iw612_eth:
    build_only: true
    extra_args:
      - SHIELD="nxp_m2_2ll_wifi_bt nxp_m2_2el_2ll_ieee802154"
      - EXTRA_CONF_FILE="boards/mimxrt1060_evk_mimxrt1062_qspi_C/mimxrt1060_evk_mimxrt1062_qspi_C.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/eth.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/iw612.conf"
    platform_allow:
      - mimxrt1060_evk@C/mimxrt1062/qspi
  sample.net.openthread.border_router.rt1060_evkc_iw610_wifi:
    build_only: true
    extra_args:
      - SHIELD="nxp_m2_2ll_wifi_bt nxp_m2_2el_2ll_ieee802154"
      - EXTRA_CONF_FILE="boards/mimxrt1060_evk_mimxrt1062_qspi_C/mimxrt1060_evk_mimxrt1062_qspi_C.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/wifi.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/iw610.conf"
    platform_allow:
      - mimxrt1060_evk@C/mimxrt1062/qspi
  sample.net.openthread.border_router.rt1060_evkc_iw610_eth:
    build_only: true
    extra_args:
      - SHIELD="nxp_m2_2ll_wifi_bt nxp_m2_2el_2ll_ieee802154"
      - EXTRA_CONF_FILE="boards/mimxrt1060_evk_mimxrt1062_qspi_C/mimxrt1060_evk_mimxrt1062_qspi_C.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/eth.conf
        boards/mimxrt1060_evk_mimxrt1062_qspi_C/iw610.conf"
    platform_allow:
      - mimxrt1060_evk@C/mimxrt1062/qspi
