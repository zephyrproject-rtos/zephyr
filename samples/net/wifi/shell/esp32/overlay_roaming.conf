# Enable ESP32 native 802.11k/v/r and MBO support for the Wi-Fi shell sample.
# This makes the "wifi 11k", "wifi 11k_neighbor_request" and "wifi 11v_btm_query"
# commands work against an access point that supports network assisted roaming.
CONFIG_ESP32_WIFI_11KV_SUPPORT=y
CONFIG_ESP32_WIFI_MBO_SUPPORT=y
CONFIG_ESP32_WIFI_11R_SUPPORT=y
CONFIG_ESP32_WIFI_SIGNAL_CHANGE_EVENT=y
