# Enable ESP32 native 802.11k/v/r and MBO support for the Wi-Fi shell sample.
# This makes the "wifi 11k" and "wifi 11v_btm_query" commands work against an
# access point that supports network assisted roaming. "wifi
# 11k_neighbor_request" is not supported: the library does not hand the report
# back in a form that reaches the application.
# The signal change event is only raised here: the shell acts on it solely with
# the hostap wpa_supplicant roaming support, which this configuration does not
# support. A transition the access point asks for is separate and still happens.
# MBO is enabled for the capability advertisement. Reporting non-preferred
# channels is not functional in this port.
CONFIG_ESP32_WIFI_11KV_SUPPORT=y
CONFIG_ESP32_WIFI_MBO_SUPPORT=y
CONFIG_ESP32_WIFI_11R_SUPPORT=y
CONFIG_ESP32_WIFI_SIGNAL_CHANGE_EVENT=y
