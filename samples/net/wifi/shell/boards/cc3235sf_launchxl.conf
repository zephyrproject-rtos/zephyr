# Conf file to test the net_wifi shell module with the cc3235sf WiFi driver
# cmake .. -DBOARD=cc3235sf_launchxl
CONFIG_WIFI_SIMPLELINK=y
# The SimpleLink driver is deprecated, keep the build going until it is removed
CONFIG_WARN_DEPRECATED=n
# Debugging
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_DEBUG=y
CONFIG_CC3235SF_DEBUG=y
