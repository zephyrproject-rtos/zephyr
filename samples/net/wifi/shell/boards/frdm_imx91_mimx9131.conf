#
# Enable NXP Wi-Fi
#
CONFIG_WIFI_NXP=y

#firmware
CONFIG_NXP_MONOLITHIC_WIFI=y

# Wi-Fi driver task priority
CONFIG_NXP_WIFI_TX_TASK_PRIO=3

# Net thread priorities
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TCP_WORKER_PRIO=-16
CONFIG_NET_TC_TX_THREAD_BASE_PRIO=3
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=3
CONFIG_ZPERF_WORK_Q_STACK_SIZE=8192
CONFIG_ZPERF_WORK_Q_THREAD_PRIORITY=3
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=3
CONFIG_NET_CONTEXT_PRIORITY=y
CONFIG_NET_MGMT_THREAD_PRIO_CUSTOM=y
CONFIG_NET_MGMT_THREAD_PRIORITY=3

# Network buffer tuning for TCP throughput (zperf)
CONFIG_NET_BUF_DATA_SIZE=1600

# Stack sizes
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NXP_WIFI_TX_TASK_STACK_SIZE=8192
CONFIG_NXP_WIFI_CORE_TASK_STACK_SIZE=16384
CONFIG_NXP_WIFI_SCAN_TASK_STACK_SIZE=8192
CONFIG_NXP_WIFI_MON_TASK_STACK_SIZE=8192
CONFIG_NXP_WIFI_POWERSAVE_TASK_STACK_SIZE=4096
CONFIG_NXP_WIFI_DRIVER_TASK_STACK_SIZE=8192
CONFIG_NXP_WIFI_WLCMGR_TASK_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=16384
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=16384
CONFIG_NET_RX_STACK_SIZE=16384

# Speed optimization
CONFIG_SPEED_OPTIMIZATIONS=y
