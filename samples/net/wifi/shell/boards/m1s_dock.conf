# BL808 WiFi driver overlay for the wifi shell sample.

# The supplicant allocates scan results/BSS entries from the system heap (MM_DRAM)
# and mbedTLS from the libc arena (PSRAM).
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# Driver buffer trims for the RAM budget.
CONFIG_WIFI_BFLB_WIFI4_SCAN_AP_MAX=16

# The TX path needs 8 KB of shell stack, the sample's prj.conf sets 5200.
CONFIG_SHELL_STACK_SIZE=8192

# Full-MTU net buffers and 64 KB TCP windows; the buffers live in PSRAM.
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535
