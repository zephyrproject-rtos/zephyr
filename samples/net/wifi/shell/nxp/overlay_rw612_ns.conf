# This conf is used for adding TFM for wifi example in non-secure world

# TF-M S Part
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_NXP_WIFI_TFM_MBEDTLS_USER_CONFIG_FILE="modules/lib/hostap/port/mbedtls/wpa_supp_mbedtls_psa_tfm_config.h"

# TF-M IPC
CONFIG_TFM_IPC=y
CONFIG_TFM_ISOLATION_LEVEL=2

# TF-M NS
CONFIG_HWINFO=y
CONFIG_SRAM_SIZE=960
CONFIG_SRAM_BASE_ADDRESS=0x20040000
