# USB Ethernet adapters (CDC-ECM) on the USB Type-A connectors
CONFIG_USB_HOST_STACK=y
CONFIG_USBH_CDC_ECM_CLASS=y
CONFIG_UHC_BUF_POOL_SIZE=4096

# Two on-board Ethernet interfaces and the USB Ethernet interface
CONFIG_NET_IF_MAX_IPV4_COUNT=3

# zperf for throughput measurements over the USB Ethernet interface
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_ZVFS_POLL_MAX=15
