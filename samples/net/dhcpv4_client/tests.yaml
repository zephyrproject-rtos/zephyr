sample:
  name: DHCP Client
tests:
  sample.net.dhcpv4_client:
    harness: net
    depends_on: netif
    tags:
      - net
      - http
  sample.net.dhcpv4_client.rak13800:
    harness: net
    platform_allow: rak4631/nrf52840
    extra_args: SHIELD="rakwireless_rak19007;rakwireless_rak13800"
    tags:
      - shield
      - net
  sample.net.dhcpv4_client.qemu:
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "Run dhcpv4 client"
        - "Address\\[[0-9]+\\]: 10\\.0\\.2\\."
    platform_allow:
      - qemu_riscv32
      - qemu_riscv32e
      - qemu_riscv64
    extra_configs:
      - CONFIG_NET_QEMU_USER=y
