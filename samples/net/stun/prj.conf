# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# The address of the device and its DNS servers come from DHCP, and the sample
# waits until the network is up.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_DNS_RESOLVER=y

# STUN: the client, and the "net stun" shell commands to ask other servers
CONFIG_STUN=y
CONFIG_STUN_CLIENT=y
CONFIG_NET_SHELL=y
CONFIG_STUN_SHELL=y

# A query takes some 2.5 KB of the stack of the thread that makes it.
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_NET_LOG=y
