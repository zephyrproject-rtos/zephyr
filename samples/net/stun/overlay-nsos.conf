# native_sim with the sockets of the host: no network interface to set up, the
# sample talks through the network connection the host has.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# The host has the address and resolves the names.
CONFIG_NET_DHCPV4=n
CONFIG_NET_IPV6_DAD=n
