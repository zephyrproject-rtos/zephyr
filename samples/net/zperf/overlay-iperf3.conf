# Speak iperf3 instead of iperf2. The zperf commands stay the same, and
# the default port becomes 5201.
CONFIG_NET_ZPERF_IPERF3=y

# An iperf3 test takes a control connection and a data stream on each
# end, on top of the server's listening sockets, and closed connections
# linger in TIME_WAIT for a while after each test.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
