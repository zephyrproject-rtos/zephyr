CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_LOOPBACK_MTU=1100
# Enable for testing TX only
#CONFIG_NET_LOOPBACK_SIMULATE_PACKET_DROP=y
#CONFIG_NET_ZPERF_UDP_REPORT_RETANSMISSION_COUNT=0

# A multiple of 8, so that every buffer of the fixed size pool starts 8 byte
# aligned on 64-bit targets. With an odd multiple of 4 every other buffer is
# misaligned, and copies within a buffer (for example the memmove that removes
# the IPv6 fragment header) cost more depending on which buffer is used.
CONFIG_NET_BUF_DATA_SIZE=1104
# Optimized networking settings for performance
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=96
