CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_L2_WIFI_SHELL=y

CONFIG_NET_DHCPV4=y
# Needed for the zperf download server
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_ZVFS_POLL_MAX=10

CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=6000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=32

# Needed for SoftAP
CONFIG_WIFI_SHELL_MAX_AP_STA=4
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
