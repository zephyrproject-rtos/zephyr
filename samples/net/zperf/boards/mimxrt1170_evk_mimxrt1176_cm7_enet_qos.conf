# Run the network path from ITCM instead of FlexSPI NOR.
CONFIG_NET_SAMPLE_CODE_RELOCATE=y
CONFIG_NET_SAMPLE_CODE_RAM_NAME="ITCM"

# The RX buffer size is NET_BUF_DATA_SIZE: one frame per descriptor, and a
# multiple of the 32-byte cache line.
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=1536

# A 16-entry RX ring overruns within about 200 us at 1 Gbit.
CONFIG_DWMAC_NB_RX_DESCS=128
CONFIG_DWMAC_NB_TX_DESCS=64

# The RX ring holds one net_buf per descriptor; the pool must exceed it.
CONFIG_NET_BUF_RX_COUNT=384
CONFIG_NET_BUF_TX_COUNT=192
CONFIG_NET_PKT_RX_COUNT=192
CONFIG_NET_PKT_TX_COUNT=96

# A 1470-byte payload plus the iperf header exceeds the default.
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1600

CONFIG_NET_RX_STACK_SIZE=4096
