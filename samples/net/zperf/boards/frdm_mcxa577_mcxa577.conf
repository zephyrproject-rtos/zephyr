# 10BASE-T1S (PLCA) throughput tuning for zperf on FRDM-MCXA577.
#
# Without these, high-rate UDP upload (~8.9 Mbps, near the PLCA ceiling)
# exhausts the TX net_buf pool under normal scheduling jitter, so the ENET
# QoS driver returns -EBUSY and drops ~25% of packets. See the board
# documentation for the PLCA cycle analysis, the measured results, and further
# optional driver/application tuning.

# Raise net_buf size: 1042-byte frame needs 3 bufs (was 5 with 256-byte bufs)
CONFIG_NET_BUF_DATA_SIZE=512

# Deeper packet/buf pools to absorb bursts
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96

# Larger stacks for 512-byte net_buf chain processing
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
