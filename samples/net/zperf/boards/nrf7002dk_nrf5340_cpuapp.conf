# Optimized networking settings for performance

# Packet and buffer pools for 32 KB TCP windows in both directions
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=30
CONFIG_NET_BUF_RX_COUNT=54
CONFIG_NET_BUF_TX_COUNT=60
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=50000
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=45000
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768

# nRF70 RX buffers and TX aggregation. The driver heap is sized for the
# copy-based TX path.
CONFIG_NRF_WIFI_ZERO_COPY_TX=n
CONFIG_NRF70_RX_NUM_BUFS=48
CONFIG_NRF70_MAX_TX_AGGREGATION=9
CONFIG_NRF70_MAX_TX_TOKENS=12
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=150000
CONFIG_NRF70_QSPI_LOW_POWER=n

# Full-sized TCP segments for zperf uploads
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1460

# Consumes more memory
CONFIG_WIFI_CREDENTIALS=n
CONFIG_FLASH=n
CONFIG_NVS=n
CONFIG_SETTINGS=n

# Debugging
CONFIG_NRF70_UTIL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y
