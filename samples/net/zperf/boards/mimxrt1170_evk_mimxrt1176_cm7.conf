# Note: HW acceleration does not support IPV6
CONFIG_ETH_NXP_ENET_HW_ACCELERATION=y
CONFIG_NET_SAMPLE_CODE_RELOCATE=y
CONFIG_NET_SAMPLE_CODE_RAM_NAME="ITCM"

# Align fragments to the 32-byte cache line so DMA needs no partial-line
# maintenance.
CONFIG_NET_BUF_ALIGNMENT=32

CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128

# A 1-deep TX ring serializes transmit on the TX-done interrupt, which starves
# the net_buf pool at gigabit rates.
CONFIG_ETH_NXP_ENET_TX_BUFFERS=16
CONFIG_ETH_NXP_ENET_RX_BUFFERS=16

CONFIG_ETH_NXP_ENET_RX_THREAD_PREEMPTIVE=y
CONFIG_ETH_NXP_ENET_RX_THREAD_PRIORITY=1

# A 1470-byte payload plus the 40-byte iperf header exceeds the 1064 default.
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1600

# The UDP uploader paces with k_sleep(), so the tick period is the smallest
# inter-packet gap it can produce; 10 us lets it track gigabit rates.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000
