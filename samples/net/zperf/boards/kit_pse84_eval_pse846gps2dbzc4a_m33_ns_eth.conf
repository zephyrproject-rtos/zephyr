# Network buffer sizing and TCP window tuning for Fast Ethernet throughput
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=24576
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=24576
CONFIG_NET_BUF_RX_COUNT=200
CONFIG_NET_BUF_TX_COUNT=200
CONFIG_NET_PKT_RX_COUNT=80
CONFIG_NET_PKT_TX_COUNT=80

# Use DHCP to get an address on the host subnet (avoids static 192.0.2.1 routing)
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
