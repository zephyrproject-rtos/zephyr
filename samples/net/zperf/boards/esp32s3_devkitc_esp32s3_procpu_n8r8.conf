# High-throughput Wi-Fi TCP configuration for ESP32-S3-DevKitC-1 with an
# N8R8 module (8 MB quad-SPI flash, 8 MB octal PSRAM). Used in place of
# esp32s3_devkitc_esp32s3_procpu.conf when building with
# -DFILE_SUFFIX=n8r8.

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_DHCPV4=y

# Wi-Fi hot paths in IRAM
CONFIG_ESP32_WIFI_IRAM_OPT=y
CONFIG_ESP32_WIFI_RX_IRAM_OPT=y

# Network buffers in PSRAM, so the larger pools below fit
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# Code fetch: faster flash and larger instruction cache
CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y

# TCP windows and the buffers backing them (each 1460 B segment uses six
# 256 B net_bufs)
CONFIG_NET_BUF_RX_COUNT=400
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=600
CONFIG_NET_PKT_TX_COUNT=96
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535

# Wi-Fi aggregation and buffers, as in the ESP-IDF iperf example. The
# blob allocates its frame buffers from the system heap.
CONFIG_ESP32_WIFI_TX_BA_WIN=32
CONFIG_ESP32_WIFI_RX_BA_WIN=32
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=64
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=64
CONFIG_HEAP_MEM_POOL_SIZE=128000
