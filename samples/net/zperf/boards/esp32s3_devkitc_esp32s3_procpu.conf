CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_DHCPV4=y

# Measured on real hardware (TCP download, single stream): 2.94 -> 4.0-4.75
# Mbps, run-to-run variance from real RF conditions, with a healthy ~32 KB
# DRAM margin left over.
#
# CONFIG_ESP32_WIFI_IRAM_OPT moves the driver's hot RX/TX paths into
# IRAM instead of flash, avoiding flash-cache-miss stalls on every
# packet; it already exists and is already safe, it is just off by
# default. CONFIG_NET_BUF_RX_COUNT backs a correspondingly bigger TCP
# receive window: tcp_rx_window is derived as (NET_BUF_RX_COUNT *
# NET_BUF_DATA_SIZE) / 3, so the stock RX_COUNT=160 caps the window at
# ~13.6 KB versus lwIP/ESP-IDF's fixed 64 KB, and the sender spends
# nearly all its time blocked on the receiver's advertised window
# rather than on congestion control. Raising only RX_COUNT (not
# NET_BUF_DATA_SIZE, which also sizes the TX pool) grows the window to
# ~32 KB for a fraction of the RAM cost.
CONFIG_ESP32_WIFI_IRAM_OPT=y
CONFIG_NET_BUF_RX_COUNT=384
