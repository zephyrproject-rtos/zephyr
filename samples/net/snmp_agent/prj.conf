# Networking
CONFIG_NETWORKING=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=8

# Boards without an entropy driver, such as mps2/an385, need the test generator
CONFIG_TEST_RANDOM_GENERATOR=y

# Static addresses of the sample, see doc/connectivity/networking/qemu_setup.rst
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"

# SNMP agent with writable objects
CONFIG_SNMP=y
CONFIG_SNMP_SET_ENABLE=y
CONFIG_SNMP_SYS_NAME="zephyr"
CONFIG_SNMP_SYS_CONTACT="admin@example.com"
CONFIG_SNMP_SYS_LOCATION="Sample board"

# Logging and shell
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

CONFIG_MAIN_STACK_SIZE=2048
