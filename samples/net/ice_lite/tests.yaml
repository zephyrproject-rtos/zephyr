sample:
  description: Answer the connectivity checks of a full ICE agent
  name: ICE-lite agent
common:
  harness: net
  tags:
    - net
    - ice
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
tests:
  sample.net.ice_lite: {}
  sample.net.ice_lite.nsos:
    extra_configs:
      - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
    extra_args:
      - EXTRA_CONF_FILE="nsos.conf"
