# RT1170-EVKB physical Ethernet, audio, camera, and display endpoint. Override
# ZEPHYRTC_SIGNALING_URL at configure time with the Linux answerer's LAN address.
CONFIG_ZEPHYRTC_MODE_EXTERNAL=y
CONFIG_ZEPHYRTC_AUDIO_RT1170=y
CONFIG_ZEPHYRTC_VIDEO_H264=y
CONFIG_ZEPHYRTC_SIGNALING_URL="http://192.0.2.2:8080/offer"
CONFIG_ZEPHYRTC_EXTERNAL_RUN_MS=12000

CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

CONFIG_NET_LOOPBACK=n
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8

CONFIG_I2S=y
CONFIG_I2S_TX_BLOCK_COUNT=16
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_DMIC_NXP_MICFIL_QUEUE_SIZE=16
CONFIG_AUDIO_CODEC=y
CONFIG_I3C=y

CONFIG_VIDEO=y
CONFIG_DISPLAY=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=256
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_MCUX_ELCDIF_FB_SIZE=1843200

CONFIG_MAIN_THREAD_PRIORITY=7

# The media workers report heap use in their periodic statistics.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
