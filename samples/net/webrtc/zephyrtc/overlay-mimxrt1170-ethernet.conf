# RT1170-EVKB Ethernet bring-up. Override ZEPHYRTC_SIGNALING_URL at configure
# time with the Linux answerer's LAN IPv4 address.
CONFIG_ZEPHYRTC_MODE_EXTERNAL=y
CONFIG_ZEPHYRTC_AUDIO_RT1170=y
CONFIG_ZEPHYRTC_SIGNALING_URL="http://192.0.2.2:8080/offer"
CONFIG_ZEPHYRTC_EXTERNAL_RUN_MS=12000

CONFIG_NET_LOOPBACK=n
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8

CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_CODEC=y
CONFIG_I3C=y
