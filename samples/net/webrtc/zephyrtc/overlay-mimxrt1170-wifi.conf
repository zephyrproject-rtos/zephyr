# MIMXRT1170-EVKB Embedded Artists 2EL (NXP IW612) Wi-Fi transport.
# Use it on top of overlay-mimxrt1170-av.conf. The Wi-Fi credentials belong in
# a mode-0600 EXTRA_CONF_FILE outside the source tree.
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_IW61X=y
CONFIG_NXP_IW612_MURATA_2EL_M2=y
CONFIG_NXP_WIFI_STA_RECONNECT=y
CONFIG_NXP_WIFI_AUTO_POWER_SAVE=n

# The NXP Wi-Fi driver presents an Ethernet-compatible L2 interface. Disable
# the wired MAC driver so the Wi-Fi interface is the default interface.
CONFIG_ETH_DRIVER=n
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# A browser H.264 IDR picture can arrive as twelve full-size FU-A RTP packets.
# Each 1300-byte packet consumes about eleven 128-byte net_buf fragments, so the
# inherited 64-fragment pool drops the IDR before libpeer can reassemble it.
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=256

# The IW612 driver and firmware loader allocate from the system heap.
CONFIG_HEAP_MEM_POOL_SIZE=262144

# NXP association callbacks perform SDIO transfers on Zephyr's network
# management work queue. Use the stack size from NXP Wi-Fi board samples.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
