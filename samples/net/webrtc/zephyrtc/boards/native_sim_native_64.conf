# Software-board testing only. Physical boards must use a cryptographic entropy
# driver.
CONFIG_TEST_RANDOM_GENERATOR=y

# libpeer gathers ICE host candidates from the default interface's global
# IPv4 address, and Zephyr does not treat 127/8 as global. Give the loopback
# interface a documentation-range address for the in-process tests.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
