# Run the bounded HTTP signaling client against the in-process mock answerer.
# Build with: -DEXTRA_CONF_FILE=overlay-http-signaling.conf
CONFIG_ZEPHYRTC_MODE_HTTP_SIGNALING=y

# The failure matrix opens many short-lived loopback connections. Each case holds a listener, a
# client, and an accepted context, and the closing side lingers in TIME_WAIT.
CONFIG_NET_TCP_TIME_WAIT_DELAY=50
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12

# The client accepts bounded SDP bodies up to 8095 bytes and 4096-byte header blocks, so the
# simulator needs packet buffers for several full TCP windows rather than the 2 KiB default.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96
