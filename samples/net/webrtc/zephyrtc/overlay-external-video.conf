# Cross-process native_sim H.264/PCMU test over host-offloaded BSD sockets.
CONFIG_ZEPHYRTC_MODE_EXTERNAL=y
CONFIG_ZEPHYRTC_VIDEO_H264=y
CONFIG_ZEPHYRTC_SIGNALING_URL="http://127.0.0.1:18080/offer"
CONFIG_ZEPHYRTC_EXTERNAL_RUN_MS=12000

CONFIG_NET_LOOPBACK=n
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_HOST_IF_NAME="d0"
CONFIG_NET_IPV6=n
CONFIG_NET_IPV6_DAD=n
