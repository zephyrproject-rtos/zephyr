CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONTEXT_TIMESTAMPING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=n

CONFIG_PTP_CLOCK=y
CONFIG_PTP=y
CONFIG_PTP_ORDINARY_CLOCK=y
CONFIG_PTP_TIME_RECEIVER_ONLY=y
CONFIG_PTP_IEEE_802_3_PROTOCOL=y
CONFIG_PTP_DELAY_MECHANISM_P2P=y

CONFIG_PRECISION_TIMING=y
CONFIG_PRECISION_CLOCK_OUTPUT=y
CONFIG_PRECISION_PPS_OUTPUT=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_NET_SHELL=y
CONFIG_NET_SHELL_PTP_SUPPORTED=y
CONFIG_PTP_CLOCK_SHELL=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_ASSERT=y
