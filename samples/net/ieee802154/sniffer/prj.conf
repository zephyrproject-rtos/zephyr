CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_NETWORKING=y

CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y

# The capture line carries the PSDU without an FCS and the host tool appends a
# recomputed one. The radio has already dropped the frames whose checksum was
# wrong, and some radios, the ESP32 among them, overwrite the two FCS bytes with
# RSSI and LQI, so what the driver would hand up is not a checksum at all.
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# The console stays at the board's rate for the shell, and the host tool raises
# it for the duration of a capture.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Keep buffers small but sufficient for sniffing
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=256

# Channel the radio is tuned to at boot; the host tool retunes it.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_IEEE802154_CHANNEL=20
