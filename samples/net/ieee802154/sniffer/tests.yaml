sample:
  name: ieee802154_sniffer
  description: IEEE 802.15.4 frame sniffer feeding Wireshark over the console UART
common:
  tags:
    - ieee802154
  filter: dt_chosen_enabled("zephyr,ieee802154")
tests:
  sample.net.ieee802154.sniffer:
    extra_args:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
    build_only: true
    platform_allow:
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32h2_devkitm
      - esp32c5_devkitc/esp32c5/hpcore
