sample:
  name: Native Tailscale client
  description: Join a tailnet and exchange TCP and UDP traffic
tests:
  sample.net.tailscale:
    build_only: true
    extra_args:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
    platform_allow:
      - weact_esp32s3_mini/esp32s3/procpu
    tags:
      - net
      - tailscale
