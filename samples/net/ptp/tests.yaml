common:
  harness: net
  tags:
    - net
    - ptp
sample:
  description: Test PTP functionality
  name: PTP sample app
tests:
  sample.net.ptp:
    depends_on:
      - eth
      - ptp_clock
    integration_platforms:
      - nucleo_h563zi

  sample.net.ptp.dwmac:
    extra_configs:
      - CONFIG_ETH_STM32_HAL=n
      - CONFIG_ETH_ESP32=n
      - CONFIG_ETH_NXP_ENET_QOS=n
    depends_on:
      - eth
      - ptp_clock
    platform_allow:
      - stm32h735g_disco
      - nucleo_h753zi
      - nucleo_f429zi
      - nucleo_f767zi
      - stm32h7s78_dk/stm32h7s7xx/ext_flash_app
      - stm32h573i_dk
      - esp32p4x_function_ev_board/esp32p4/hpcore
      - frdm_mcxe31b
      - frdm_mcxn947/mcxn947/cpu0
