CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# IPv6 DAD requires lower level network interface access, below exposed socket-level access
CONFIG_NET_IPV6_DAD=n

# Sockets are offloaded to the host, so there is no L2 to run DHCP on, no
# address for net_config to wait for and no connectivity state for the
# connection manager to report.
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONNECTION_MANAGER=n

# Note that the host refuses to bind the SNTP port to an unprivileged process,
# so the server side of this sample only builds here, it does not serve.
