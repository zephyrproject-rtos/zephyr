sample:
  description: SNTP server sample
  name: sntp_server
common:
  harness: net
  tags: net
  extra_configs:
    - CONFIG_NET_SAMPLE_SNTP_UPSTREAM_ADDRESS="pool.ntp.org"
tests:
  sample.net.sockets.sntp_server:
    platform_allow:
      - qemu_x86
      - native_sim
  sample.net.sockets.sntp_server.native:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
    extra_args:
      - EXTRA_CONF_FILE="overlay-nsos.conf"
