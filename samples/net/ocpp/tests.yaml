sample:
  description: OCPP sample application
  name: OCPP charge point
tests:
  sample.net.ocpp:
    harness: net
    depends_on: netif
    tags:
      - net
      - ocpp

  sample.net.ocpp.basic_auth:
    harness: net
    depends_on: netif
    extra_configs:
      - CONFIG_OCPP_BASIC_AUTH=y
      - CONFIG_NET_SAMPLE_OCPP_AUTH_PASSWORD="zephyr-ocpp-sample-1"
    tags:
      - net
      - ocpp
    platform_allow:
      - qemu_x86
      - native_sim

  sample.net.ocpp.tls:
    harness: net
    depends_on: netif
    extra_args:
      - EXTRA_CONF_FILE="overlay-tls13.conf"
      - USE_DUMMY_CREDS=1
    tags:
      - net
      - ocpp
      - tls
    platform_allow:
      - qemu_x86
      - native_sim
