# Disable persistent storage to reduce RAM on cc2340r5
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
CONFIG_BT_SETTINGS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_NVS=n
CONFIG_SETTINGS=n

# ATT prepare write not needed without persistent storage; 2 bufs sufficient for basic writes
CONFIG_BT_ATT_PREPARE_COUNT=2

# GATT cache is volatile without BT_SETTINGS (lost on reset), so caching provides no benefit
CONFIG_BT_GATT_CACHING=n
