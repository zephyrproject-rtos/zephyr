CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="Zephyr HOGP Mouse"
# HID Mouse, as assigned by the Bluetooth SIG
CONFIG_BT_DEVICE_APPEARANCE=962

# The HID Device role is a composition of the HID Service, the Battery Service
# and the Device Information Service, whose PnP ID characteristic the profile
# makes mandatory as well.
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REPORT_COUNT=1
# A mouse has to have the Boot Mouse Input Report characteristic, which brings
# the Protocol Mode characteristic with it.
CONFIG_BT_HIDS_BOOT_MOUSE=y
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
# Vendor ID assigned by the Bluetooth SIG. 0xFFFF is the value reserved for
# internal and interoperability testing, which is what a sample needs.
CONFIG_BT_DIS_PNP_VID_SRC=1
CONFIG_BT_DIS_PNP_VID=0xFFFF
CONFIG_BT_DIS_PNP_PID=0xFFFF

# The profile requires the HID Device to be bondable, and the bond has to
# survive a reboot for the Host to reconnect without pairing again.
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Increased stack due to settings API usage
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Board buttons drive the mouse Input Report
CONFIG_INPUT=y
CONFIG_GPIO=y

CONFIG_LOG=y
