# MCXW7x unused-SRAM shutdown demonstration.
#
# CONFIG_SOC_SERIES_MCXW7XX_SHUTDOWN_UNUSED_RAM powers off, in all modes via the CMC
# SRAMDIS register, every SRAM bank that no kept memory region overlaps (the
# chosen zephyr,sram node, the chosen flash node when on-chip, and any
# zephyr,memory-region). By default zephyr,sram spans the whole system SRAM, so
# only the unused Code-TCM banks are powered off. The accompanying board overlay
# (frdm_mcxw72.overlay) shrinks zephyr,sram so the unused high system banks are
# powered off too.
CONFIG_PM=y
CONFIG_SOC_SERIES_MCXW7XX_SHUTDOWN_UNUSED_RAM=y
