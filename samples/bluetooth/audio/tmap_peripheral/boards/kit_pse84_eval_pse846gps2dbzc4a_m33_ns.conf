CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_LIBLC3=y
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

CONFIG_SAMPLE_BT_AUDIO_PLAYBACK_MCLK_FREQUENCY=12288000
CONFIG_SAMPLE_BT_AUDIO_PLAYBACK_CODEC_VOL_MIN=-127
CONFIG_SAMPLE_BT_AUDIO_PLAYBACK_CODEC_VOL_MAX=0

CONFIG_TMAP_PERIPHERAL_STEREO=y
CONFIG_TMAP_PERIPHERAL_ROLE_CT=n
CONFIG_TMAP_PERIPHERAL_AUTO_CTRL=n
CONFIG_BT_ISO_RX_MTU=310
CONFIG_BT_RX_STACK_SIZE=4096
