# Enable Multimedia Pipeline (mpipe) framework on RT1060 EVKC only
CONFIG_MPIPE=y

# liblc3 provides the LC3 decoder and its headers (LC3_MAX_NUM_SAMPLES_MONO,
# LC3_DECODER_MEM_SIZE, etc.) used by the mpipe audio transform.
CONFIG_LIBLC3=y


# mpipe uses zbus message subscribers for the pipeline bus/observer
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# Number of net_buf pools mpipe may register for negotiated buffer pools
CONFIG_MPIPE_NET_BUF_POOL_COUNT=3

# The mpipe streaming thread runs the LC3 decode (lc3_decode) in the transform
# chain function. LC3 decoding needs far more stack than the 1024-byte default,
# so raise the streaming thread stack to avoid a pipeline-thread stack overflow.
CONFIG_MPIPE_THREAD_STACK_SIZE=8192


# Audio output path: I2S/SAI -> hardware codec (WM8962)
CONFIG_I2S=y
# The MCUX SAI driver's TX in_queue/out_queue depth is sized by
# CONFIG_I2S_TX_BLOCK_COUNT: the number of blocks that can be in flight inside
# the SAI DMA queue. With the free-running playback thread the SAI is always
# fed (real PCM or silence), so a small in-flight depth is sufficient.
CONFIG_I2S_TX_BLOCK_COUNT=6

# Output latency budget for the PCM playback path, in LC3 frame blocks
# (10 ms each for this configuration):
#  - prebuffer 4 blocks (~40 ms) is the cushion that absorbs arrival jitter and
#    the drift between the broadcaster clock and the SAI sample clock; it sets
#    the nominal latency.
#  - the ring caps the worst case at 12 blocks (~120 ms) before the oldest
#    block is dropped.
CONFIG_BAP_BROADCAST_SINK_PCM_PREBUFFER_COUNT=4
CONFIG_BAP_BROADCAST_SINK_PCM_BUFFER_PLAY_COUNT=12

# Prime 2 silence blocks into the SAI DMA before starting it, so the frame clock
# is running before the first decoded PCM arrives.
CONFIG_BAP_BROADCAST_SINK_PCM_BUFFER_PRELOAD_COUNT=2

CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_USE_CODEC_AUDIO_OUTPUT=y
CONFIG_USE_I2S_CODEC_TRANSPORT=y
CONFIG_BT_ISO_RX_BUF_COUNT=20
