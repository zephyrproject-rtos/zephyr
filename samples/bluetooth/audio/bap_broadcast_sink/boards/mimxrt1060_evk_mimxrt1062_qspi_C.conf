# Enable I2S based audio playback path.
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_USE_CODEC_AUDIO_OUTPUT=y

# BAP broadcast sink needs more RX buffering and heap than the defaults.
CONFIG_BT_ISO_RX_BUF_COUNT=40
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
