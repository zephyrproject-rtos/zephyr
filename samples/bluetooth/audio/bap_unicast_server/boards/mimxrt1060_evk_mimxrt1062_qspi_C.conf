# Enable I2S based audio playback path.
CONFIG_I2S=y
CONFIG_LIBLC3=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

# LE Audio RX needs more ISO buffering and heap than the defaults.
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# LE Audio unicast RX at 100 Hz (10 ms SDUs) plus the source ASE TX and CIS
# open/close needs more HCI RX headroom than the Kconfig defaults; otherwise
# the H:4 driver keeps deferring packets to bt_rx_thread ("Failed to allocate,
# deferring to rx_thread") and playback stalls. These are the proven values
# from the tmap_peripheral sample, which runs the same bidirectional workload.
CONFIG_BT_ISO_RX_BUF_COUNT=12
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=6
CONFIG_BT_BUF_EVT_RX_COUNT=16

# Sink-only (unidirectional) topology: this build only plays audio out to the
# I2S/codec, it never captures audio to send back. Disable the Source PAC and
# zero the source ASE count so the server advertises only sink capabilities.
# The client's discover_sources() step then returns "no source ASEs" and it
# will only bring up sink CIS(es), avoiding the 3-CIS bidirectional ISO load
# that the controller cannot sustain on this platform (manifested as
# "Failed to allocate, deferring to rx_thread" cascades and eventual stall).
CONFIG_BT_PAC_SRC=n
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=0

# Align host TX buffer counts with the controller so the host can keep the
# controller's TX pipeline full and does not throttle the bidirectional ISO
# path. The controller reports 8 ACL and 15 ISO TX packets on this platform;
# match them here. Mismatch shows up as the boot-time warnings:
#   "Num of Controller's ACL packets != ACL bt_conn_tx contexts"
#   "Num of Controller's ISO packets != ISO bt_conn_tx contexts"
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_ISO_TX_BUF_COUNT=15

# Silence the periodic "Incoming audio on stream ..." INFO printk emitted from
# stream_recv_lc3_codec(). A synchronous printk on the BT RX thread at the
# ISO cadence can starve the HCI RX pool and cause audible glitches; there is
# no runtime need for the heartbeat log now that the pipeline is stable.
CONFIG_INFO_REPORTING_INTERVAL=0
