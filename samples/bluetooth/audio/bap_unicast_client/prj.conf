CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_SMP=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_CLIENT=y
CONFIG_BT_ISO_TX_BUF_COUNT=15
# Align host ACL TX buffer count with the controller (8 packets on this
# platform) so the boot-time warning
#   "Num of Controller's ACL packets != ACL bt_conn_tx contexts"
# goes away and the host does not artificially throttle ACL TX.
CONFIG_BT_BUF_ACL_TX_COUNT=8
# Support an ISO channel per ASE
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_STREAM_COUNT=4
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=2

CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

CONFIG_BT_EXT_ADV=y

# LE Audio RX needs more ISO buffering and heap than the defaults.
CONFIG_BT_ISO_RX_BUF_COUNT=40
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# The controller streams ISO SDUs (sink) while we also TX (source) at a 10 ms
# interval. The default HCI RX buffer pools get starved under this sustained
# bidirectional load, which shows up as "Failed to allocate, deferring to
# rx_thread" and audible gaps. Give the host more HCI RX headroom so the RX
# path never blocks on buffer allocation.
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=8
CONFIG_BT_BUF_ACL_RX_SIZE=255

CONFIG_BT_BUF_SYNC_EVT_POOL_COUNT=4

# Silence the periodic "Sent NNNN total SDUs" / "Incoming audio" INFO printk
# emitted by stream_tx.c / stream_rx.c. With the default value of 1000, each
# stream logs once every ~10 s, and that synchronous printk stalls the BT RX
# thread long enough (~1 s) to starve the HCI RX buffer pool. The result is
# a burst of "Failed to allocate, deferring to rx_thread" warnings and an
# audible dropout roughly once every 10 s per stream. Disabling the report
# removes the periodic stall; the topology already works, we just do not need
# the heartbeat log at run time.
CONFIG_INFO_REPORTING_INTERVAL=0

# Extra HCI RX headroom (belt-and-braces). The client receives a Number-of-
# Completed-Packets event for every ISO SDU it TXes on each of the 2 CIS,
# i.e. ~200 events/s steady state. Enlarge the RX ACL pool so a transient
# stall in the host cannot drain it.
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=6
