CONFIG_MAIN_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_BAP_BROADCAST_SOURCE=y

# Allow simultaneous connectable advertising so that a remote central can
# connect while the broadcast source keeps streaming LE Audio. Three
# advertising sets run in parallel: the non-connectable extended broadcast
# audio set, a connectable extended set, and a connectable legacy set.
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3

# Host ACL buffers to match the Controller maximum data length
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251

CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=2
# Two streams in one subgroup (stereo)
CONFIG_BT_BAP_BROADCAST_SRC_SUBGROUP_COUNT=1

# Uncomment below to use Broadcast ISO interleaved packing
# CONFIG_ISO_PACKING_INTERLEAVED=y

CONFIG_BT_ISO_TX_BUF_COUNT=6
CONFIG_BT_ISO_TX_MTU=155

CONFIG_BT_DEVICE_NAME="Broadcast Audio Source"

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
