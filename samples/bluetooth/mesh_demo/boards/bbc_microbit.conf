CONFIG_ISR_STACK_SIZE=768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_MICROBIT_DISPLAY=y
CONFIG_PWM=y

# The demo does not use the accelerometer, which is built in as soon as the
# sensor subsystem is on, which the clock calibration turns on, and brings the
# I2C driver with it.
CONFIG_FXOS8700=n

CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_BT_EXT_ADV=n
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=4

# Advertising reports arrive in the discardable buffers above and command
# responses in a buffer of their own. No other event is expected in this
# build, so the general event pool is at its minimum, which is one buffer
# more than there are ACL TX buffers. Those are not used at all.
CONFIG_BT_BUF_EVT_RX_COUNT=2
CONFIG_BT_BUF_ACL_TX_COUNT=1

CONFIG_BT_MESH_SEG_BUFS=6
CONFIG_BT_MESH_ADV_BUF_COUNT=3
CONFIG_BT_MESH_RELAY_BUF_COUNT=2
CONFIG_BT_MESH_MSG_CACHE_SIZE=2
CONFIG_BT_MESH_BEACON_ENABLED=n
CONFIG_BT_MESH_LABEL_COUNT=1

CONFIG_BT_MESH_SETTINGS_WORKQ=n
CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG=n
