# Adjust Stack Sizes for reduce RAM usage
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=128
# Extended scanning exercises deep controller ISR paths. 960 bytes keeps
# margin for them while making room for the host lock state in RAM.
CONFIG_ISR_STACK_SIZE=960
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=448

CONFIG_BT_RX_STACK_SIZE=892

# The observer does not use the accelerometer, which is built in as soon as
# the sensor subsystem is on, which the clock calibration turns on, and brings
# the I2C driver with it.
CONFIG_FXOS8700=n

# The scenario of this board enables the thread analyzer, and with it thread
# names. Every thread object has room for the longest name: 16 bytes hold the
# names in this build.
CONFIG_THREAD_MAX_NAME_LEN=16

# Enable Extended Scanning
# CONFIG_BT_EXT_ADV=y

# Set maximum scan data length for Extended Scanning
CONFIG_BT_EXT_SCAN_BUF_SIZE=192

# Zephyr Bluetooth LE Controller needs 16 event buffers to generate Extended
# Advertising Report for receiving the complete 1650 bytes of data.
# Use 4 to be able to receive a minimal extended advertising with chains.
CONFIG_BT_BUF_EVT_RX_COUNT=4

# With the scan data length limited to 192 bytes below, the controller puts at
# most that much, after 26 bytes of report header, into one event.
CONFIG_BT_BUF_EVT_RX_SIZE=218

# What the controller receives with extended scanning it reports in buffers of
# the pool above. Nothing in this build produces discardable events, so their
# pool is as small as it can be.
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=58

# Use Zephyr Bluetooth Low Energy Controller implementation
CONFIG_BT_LL_SW_SPLIT=y

# Set maximum scan data length for Extended Scanning in Bluetooth LE Controller.
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=192

# Increase Zephyr Bluetooth LE Controller Rx buffer to receive complete chain
# of PDUs. Need 9 for maximum of 1650 bytes, but we use 3 as minimum to receive
# at least a primary PDU, an auxiliary PDU and a chain PDU.
CONFIG_BT_CTLR_RX_BUFFERS=3

# Use link time optimization for code size reduction
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# Generate .lst file, to find HCI h/w error event given PC
CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_DISASSEMBLY_WITH_SOURCE=y
