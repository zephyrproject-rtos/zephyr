# frdm_mcxw23 has 112 KB SRAM. The generic sample requests 61 simultaneous
# connections/identities, whose per-connection ATT/GATT/L2CAP pools overflow
# RAM on this board. The exact count is arbitrary (it only needs to
# demonstrate "many identities"), so cap it to a value that fits this board.
CONFIG_BT_MAX_CONN=58
CONFIG_BT_ID_MAX=58
