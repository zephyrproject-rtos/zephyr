# This sample allocates one connection per identity (CONFIG_BT_MAX_CONN), which
# leaves no room for the eight outgoing ACL buffers the MCXW2XX SoC selects by
# default in the 112 KB SRAM of this board. Fall back to the generic Zephyr
# default so the sample keeps all its identities and connections.
CONFIG_BT_BUF_ACL_TX_COUNT=3
