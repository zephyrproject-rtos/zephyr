# Common Bluetooth configuration
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="TPUT"
CONFIG_BT_DEVICE_APPEARANCE=0

# Default role: peripheral (GATT server; works with the tput_client Python
# client or any GATT client such as nRF Connect).
# Build the central image with: -DEXTRA_CONF_FILE=overlay-central.conf
CONFIG_APP_ROLE_PERIPHERAL=y
CONFIG_BT_PERIPHERAL=y

# Throughput-oriented link tuning: 2M PHY + Data Length Extension + large MTU
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=255

# More in-flight TX buffers for higher throughput. BT_BUF_ACL_TX_COUNT sizes the
# host's per-packet completion contexts (and must match the controller's ACL
# buffer count); its default of 3 caps the real HCI pipeline depth.
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_ATT_TX_COUNT=8

# Logging
CONFIG_LOG=y
