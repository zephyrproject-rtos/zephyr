# Central role overlay:
#   west build -b <board> samples/bluetooth/gatt_tput \
#       -- -DEXTRA_CONF_FILE=overlay-central.conf

# Switch role to central
CONFIG_APP_ROLE_CENTRAL=y

# Central needs scanning + connecting + GATT client; drop peripheral role
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_PERIPHERAL=n

# Interactive control shell (start/stop notify|write|both, throttle, status)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
