CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PAN=y
CONFIG_BT_PAN_PANU=y
CONFIG_BT_PAN_NET=y
CONFIG_BT_DEVICE_NAME="pan-panu"
CONFIG_BT_COD=0x020104
CONFIG_BT_BUF_ACL_RX_SIZE=1700
CONFIG_BT_BUF_ACL_TX_SIZE=1700

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_CONFIG_SETTINGS=y
# The address is obtained via DHCPv4 once the PAN link is up, so there is no
# need for the net_config helper to wait for the interface at startup.
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.44.1"

CONFIG_LOG=y
CONFIG_PRINTK=y
