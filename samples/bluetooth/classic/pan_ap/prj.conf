CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_PAN=y
CONFIG_BT_PAN_NAP=y
CONFIG_BT_PAN_NET=y
CONFIG_BT_DEVICE_NAME="pan-ap"
CONFIG_BT_COD=0x020300
CONFIG_BT_BUF_ACL_RX_SIZE=1700
CONFIG_BT_BUF_ACL_TX_SIZE=1700

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_CONFIG_SETTINGS=y
# The PAN interface has no carrier until a PANU connects, so the application
# configures the addresses itself instead of waiting for the net_config helper.
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.44.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.44.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.44.1"

CONFIG_LOG=y
CONFIG_PRINTK=y
