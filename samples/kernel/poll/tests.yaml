sample:
  description: Handle multiple kernel event sources from one dispatcher thread
  name: Kernel event dispatcher
common:
  tags:
    - kernel
    - poll
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "sample 0: value=20"
      - "housekeeping [1-9][0-9]*"
      - "control request handled"
      - "shutdown requested: result=0"
      - "dispatcher complete: samples=4 control=1 timeouts=[1-9][0-9]* dropped=0"
tests:
  sample.kernel.poll:
    integration_platforms:
      - qemu_cortex_m3
