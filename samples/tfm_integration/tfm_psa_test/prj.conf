CONFIG_PSA_CRYPTO=y
CONFIG_TFM_PROFILE_TYPE_LARGE=y
CONFIG_TFM_USE_NS_APP=y
CONFIG_QEMU_ICOUNT_SHIFT=1

# CONFIG_PSA_CSPRNG_GENERATOR gets automatically enabled due to CONFIG_PSA_CRYPTO
# (needed to enable the Crypto partition), but compilation of random_psa.c fails
# because TF-M doesn't expose the psa/crypto.h header when CONFIG_TFM_USE_NS_APP.
# Work around this by enabling the test CSPRNG to allow the discarded NS app to build.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TEST_CSPRNG_GENERATOR=y
