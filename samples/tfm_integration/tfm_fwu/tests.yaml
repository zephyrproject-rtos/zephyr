sample:
  description: This sample demonstrates firmware update using the PSA Firmware
    Update API with TF-M on the secure side and Zephyr on the non-secure side.
  name: TF-M FWU sample
common:
  sysbuild: true
  tags:
    - trusted-firmware-m
    - mcuboot
  filter: CONFIG_TFM_PARTITION_FIRMWARE_UPDATE
  integration_platforms:
    - mps2/an521/cpu0/ns
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "TF-M FWU on .*"
      - "FWU installed, .*"
      - "Swapped application booted on .*"
      - "FWU completed successfully"
tests:
  sample.tfm.fwu: {}
