sample:
  description: This sample demonstrates firmware update using the PSA Firmware
    Update API with TF-M on the secure side and Zephyr on the non-secure side.
  name: TF-M FWU sample
common:
  sysbuild: true
  tags:
    - trusted-firmware-m
    - mcuboot
  filter: CONFIG_TFM_PARTITION_FIRMWARE_UPDATE and CONFIG_TFM_BL2
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "TF-M FWU on .*"
      - "FWU installed, .*"
      - "Swapped application booted on .*"
      - "FWU completed successfully"
tests:
  sample.tfm.fwu:
    integration_platforms:
      - mps2/an521/cpu0/ns
    extra_args:
      - SB_CONFIG_SAMPLE_TFM_MCUBOOT_ENCRYPTION_NONE=y
  sample.tfm.fwu.enc.rsa2048.aes128:
    platform_exclude:
      # RNG is required for RSA-OAEP encryption
      # exclude platforms without RNG support in TF-M/BL2
      - mps2/an521/cpu0/ns
    integration_platforms:
      - stm32h573i_dk/stm32h573xx/ns
    extra_args:
      - SB_CONFIG_SAMPLE_TFM_MCUBOOT_SIGNATURE_TYPE="RSA-2048"
      - SB_CONFIG_SAMPLE_TFM_MCUBOOT_ENCRYPTION_RSA_OAEP=y
      - SB_CONFIG_SAMPLE_TFM_MCUBOOT_ENCRYPTION_KEY_LEN_128=y
  sample.tfm.fwu.enc.rsa2048.aes256:
    platform_exclude:
      # RNG is required for RSA-OAEP encryption
      # exclude platforms without RNG support in TF-M/BL2
      - mps2/an521/cpu0/ns
    integration_platforms:
      - stm32h573i_dk/stm32h573xx/ns
    extra_args:
      - SB_CONFIG_SAMPLE_TFM_MCUBOOT_SIGNATURE_TYPE="RSA-2048"
      - SB_CONFIG_SAMPLE_TFM_MCUBOOT_ENCRYPTION_RSA_OAEP=y
      - SB_CONFIG_SAMPLE_TFM_MCUBOOT_ENCRYPTION_KEY_LEN_256=y
