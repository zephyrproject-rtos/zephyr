CONFIG_POWEROFF=y
CONFIG_WUC=y
CONFIG_COUNTER=y
CONFIG_COUNTER_MCUX_LPTMR_ALARM=y

# Reset the cycle counter when hwinfo reports no low-power wakeup; otherwise,
# continue counting system-off cycles.
CONFIG_HWINFO=y
