sample:
  name: Suspend-to-RAM for NXP MCX

common:
  tags:
    - power
    - pm
  harness: console
  harness_config:
    type: one_line
    regex:
      - "suspend-to-RAM demo"

tests:
  sample.boards.nxp.mcxn_a.s2ram.timer.mcxn:
    timeout: 120
    integration_platforms:
      - frdm_mcxn947/mcxn947/cpu0
    platform_allow:
      - frdm_mcxn947/mcxn947/cpu0
      - mcx_n5xx_evk/mcxn547/cpu0
      - mcx_n9xx_evk/mcxn947/cpu0
      - frdm_mcxn236
    extra_dtc_overlay_files:
      - mcxn.overlay
    harness_config:
      type: one_line
      regex:
        - "Completed 10 suspend-to-RAM cycles"
    extra_configs:
      - CONFIG_SAMPLE_S2RAM_WAKEUP_TIMER=y
  sample.boards.nxp.mcxn_a.s2ram.timer.mcxa:
    timeout: 120
    integration_platforms:
      - frdm_mcxa156
    platform_allow:
      - frdm_mcxa153
      - frdm_mcxa156
      - frdm_mcxa344
      - frdm_mcxa266
      - frdm_mcxa346
      - frdm_mcxa366
    extra_dtc_overlay_files:
      - mcxa.overlay
    harness_config:
      type: one_line
      regex:
        - "Completed 10 suspend-to-RAM cycles"
    extra_configs:
      - CONFIG_SAMPLE_S2RAM_WAKEUP_TIMER=y
  sample.boards.nxp.mcxn_a.s2ram.timer.mcxa577:
    timeout: 120
    platform_allow:
      - frdm_mcxa577
    harness_config:
      type: one_line
      regex:
        - "Completed 10 suspend-to-RAM cycles"
    extra_configs:
      - CONFIG_SAMPLE_S2RAM_WAKEUP_TIMER=y
  sample.boards.nxp.mcxn_a.s2ram.button.mcxn:
    integration_platforms:
      - frdm_mcxn947/mcxn947/cpu0
    platform_allow:
      - frdm_mcxn947/mcxn947/cpu0
      - mcx_n5xx_evk/mcxn547/cpu0
      - mcx_n9xx_evk/mcxn947/cpu0
      - frdm_mcxn236
    extra_dtc_overlay_files:
      - mcxn.overlay
    extra_configs:
      - CONFIG_SAMPLE_S2RAM_WAKEUP_BUTTON=y
  sample.boards.nxp.mcxn_a.s2ram.button.mcxa:
    integration_platforms:
      - frdm_mcxa156
    platform_allow:
      - frdm_mcxa153
      - frdm_mcxa156
      - frdm_mcxa344
      - frdm_mcxa266
      - frdm_mcxa346
      - frdm_mcxa366
    extra_dtc_overlay_files:
      - mcxa.overlay
    extra_configs:
      - CONFIG_SAMPLE_S2RAM_WAKEUP_BUTTON=y
  sample.boards.nxp.mcxn_a.s2ram.button.mcxa577:
    platform_allow:
      - frdm_mcxa577
    extra_configs:
      - CONFIG_SAMPLE_S2RAM_WAKEUP_BUTTON=y
