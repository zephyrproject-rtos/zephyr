# C++ support with full standard library (required for TFLM STL headers)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y

# TensorFlow Lite Micro
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# NXP NEUTRON NPU support with TFLM integration
# This will select NXP_NEUTRON automatically
CONFIG_TFLM_NXP_NEUTRON=y

# Enable float printf for confidence scores
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Use picolibc for embedded platforms (recommended for TFLM)
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y

# Enable logging (optional)
CONFIG_LOG=y

# Enable FPU for floating point operations
CONFIG_FPU=y

# Optimize for speed (like the MCUXpresso SDK examples). TFLM's Invoke() runs a
# lot of CPU-side framework/quantization code around the NPU calls; the default
# -Os is noticeably slower than -O2 here.
CONFIG_SPEED_OPTIMIZATIONS=y

# TFLM inference (Invoke) uses several KB of stack; the 1 KB default main stack
# overflows during interpreter setup/run.
CONFIG_MAIN_STACK_SIZE=16384

# A timer interrupt taken during the float-heavy results output stacks an
# extended (FP) exception frame on the interrupt stack; the 2 KB default
# overflows (SP runs off the end into the idle stack). Give it headroom.
CONFIG_ISR_STACK_SIZE=3072

# Timing functions (DWT cycle counter at the real CPU core clock) for
# measuring inference time.
CONFIG_TIMING_FUNCTIONS=y
