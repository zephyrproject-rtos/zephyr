# Board-specific Kconfig for MIMXRT2660-EVK tflm_neutron sample.

# The Neutron NPU DMAs into the tensor arena and the driver's own DMA-shared
# data. Enable Zephyr's non-cacheable memory support so the overlay's
# non-cacheable SRAM01_NPU region is backed by a non-cacheable MPU region.
CONFIG_NOCACHE_MEMORY=y

# TFLM's C++ runtime and interpreter allocate from the system heap.
# SRAM2 (256 KB) holds the model (~93 KB), the libc malloc arena and this
# k_heap pool; keep the total under 256 KB. 48 KB here plus the 96 KB arena
# below leaves the model and the sys_heap control blocks room.
CONFIG_HEAP_MEM_POOL_SIZE=49152

# The libc malloc arena and the k_heap pool keep their default board placement
# (relocated into the cacheable SRAM2 region by the board CMakeLists); the
# system heap is not NPU-shared, so it does not need to be non-cacheable. Pin
# the arena to a fixed size both so it is a real object the relocation can place
# and so model + arena + k_heap fit in SRAM2's 256 KB.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=98304

# The sample enables CONFIG_LOG=y but only uses printk(). Use immediate log
# mode so printk()/fault output reaches the console synchronously.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_THREAD_NAME=y
