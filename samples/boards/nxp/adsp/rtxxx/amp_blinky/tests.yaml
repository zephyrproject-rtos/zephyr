sample:
  name: i.MX RTxxx AMP blinky sample
  description:
    LED blinking application using the i.MX RTxxx devices as AMP systems.
common:
  sysbuild: true
  platform_allow:
    - mimxrt685_evk/mimxrt685s/cm33
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Hello World! (.*)"
tests:
  sample.nxp.adsp.amp_blinky:
    tags: tests
