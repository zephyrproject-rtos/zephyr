# Single-core (CM33) DUT configuration for the low-power modes sample on the
# PSC3M5 EVK.  The PSC3M5 is a single-core part that owns all the
# power-management registers directly.
CONFIG_COUNTER=y

# PWM LED on P4.0 for a visual indication of the active/asleep state (see the
# board overlay).  The PWM stops while the SoC is in DeepSleep and resumes on
# wake through the PWM driver's pm_action.
CONFIG_PWM=y

# Let the PM subsystem run each peripheral's SUSPEND/RESUME pm_action around a
# regular DeepSleep so the free-running counter is torn down and rebuilt across
# the low-power transition.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

# With system-managed device PM the peripheral SUSPEND/RESUME runs on the idle
# thread; enlarge its stack so a driver re-init that runs there does not overflow
# the default 320-byte idle stack.
CONFIG_IDLE_STACK_SIZE=2048

# Run the DeepSleep-RAM, DeepSleep-OFF and Hibernate phases in addition to
# regular DeepSleep.  Enabling the DeepSleep-RAM devicetree state (see the board
# overlay) auto-selects CONFIG_PM_S2RAM because the state is named
# "suspend-to-ram"; on this part the SoC power.c warm-resumes in place through
# the reset handler.
CONFIG_APP_DEEP_MODES=y
