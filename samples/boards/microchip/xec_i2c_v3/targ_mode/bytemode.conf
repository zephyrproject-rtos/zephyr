# Byte-granular I2C target callbacks (write_requested/write_received/
# read_requested/read_processed/stop) instead of whole-buffer callbacks.
#
# This combination (CONFIG_I2C_TARGET=y, CONFIG_I2C_TARGET_BUFFER_MODE=n)
# only applies to the byte-mode driver (microchip,xec-i2c-v3): the NL
# driver's target_register requires buf_write_received. Build BM (qsz) only:
#
#   west build -b mec_assy6941/mec1753_qsz \
#     zephyr/samples/boards/microchip/xec_i2c_v3/targ_mode \
#     -p always -- -DEXTRA_CONF_FILE=bytemode.conf
#
# Merged after prj.conf, so this overrides its CONFIG_I2C_TARGET_BUFFER_MODE=y.
CONFIG_I2C_TARGET_BUFFER_MODE=n
