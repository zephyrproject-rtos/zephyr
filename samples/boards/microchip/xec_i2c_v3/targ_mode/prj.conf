# Enable config log
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8096

CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_TARGET_BUFFER_MODE=y

# Intentionally above the 256-byte default so buffer-fill tests exercise the
# non-default staging-buffer size.
CONFIG_I2C_MCHP_XEC_V3_BM_TARGET_BUFFER_SIZE=260
