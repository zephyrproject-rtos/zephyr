# Enable config log
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8096

CONFIG_I2C=y

# PCA9555 GPIO expander @0x26 is a real on-bus child of i2c-port0. Because the
# two-tier model makes the *port* the I2C bus (init prio 51, one above the
# controller at 50), the expander must init AFTER the port. The PCA driver's
# default init prio is I2C_INIT_PRIORITY (50), which would run before the port
# bus is ready -> device_is_ready(bus) fails -> -ENODEV. Raise it above 51.
CONFIG_GPIO=y
CONFIG_GPIO_PCA_SERIES_INIT_PRIORITY=60

# use pseudo-random data for non-cryptographic test patterns
CONFIG_TEST_RANDOM_GENERATOR=y
