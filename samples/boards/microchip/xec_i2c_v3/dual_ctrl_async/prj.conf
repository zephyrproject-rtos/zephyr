# Enable config log
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8096

CONFIG_I2C=y
CONFIG_I2C_CALLBACK=y

# Two application threads (one per controller) drive the async transfers.
# No GPIO/PCA driver is pulled in: the PCA9555 is accessed via raw I2C, so
# the DT expander node is a plain placeholder and there is no on-bus child
# init-priority concern.

# use pseudo-random data for non-cryptographic test patterns
CONFIG_TEST_RANDOM_GENERATOR=y
