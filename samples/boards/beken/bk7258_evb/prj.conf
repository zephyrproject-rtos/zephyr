# Configuration for the board bring-up self test.
#
# Goal: characters out, characters in, and k_sleep timing correct. So it is
# deliberately minimal: console only, no shell and no logging (one less
# layer that can be misconfigured).

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# The self test uses k_sleep to verify SysTick timing
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# No logging subsystem (less console noise, one less class of config error)
CONFIG_LOG=n

# Zephyr has no SMP support for this architecture
CONFIG_SMP=n
