CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_NETWORKING=y

CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y

# The ESP32 radio replaces the two FCS bytes of a received frame with RSSI and
# LQI, so keeping them would append metadata where a checksum is expected. Bad
# checksums are already dropped in hardware.
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Keep buffers small but sufficient for sniffing
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=256

# Channel the radio is tuned to at boot; the host tool retunes it.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_IEEE802154_CHANNEL=20
