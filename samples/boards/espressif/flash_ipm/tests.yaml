sample:
  name: ESP32 Flash IPM Sample
tests:
  sample.boards.esp32.flash_ipm:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    tags:
      - samples
      - ipm
    sysbuild: true
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Flash IPM sample program \\(remote CPU\\)"
        - "Erasing first [0-9]+ bytes of partition.. OK"
        - "Verifying page erased.. OK"
        - "Write ascii pattern..OK"
        - "Verifying pattern.. OK"
