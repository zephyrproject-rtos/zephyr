sample:
  name: ESP32-C6 LP_CORE Interrupt Sample
tests:
  sample.boards.esp32.ulp.lp_core.interrupt_ulp:
    platform_allow:
      - esp32c6_devkitc/esp32c6/hpcore
    tags:
      - samples
    sysbuild: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Triggering ULP interrupt"
