sample:
  name: nrfx use example
tests:
  sample.boards.nrf.nrfx:
    qualifiers_allow:
      - nrf52840
      - nrf9160
    integration_platforms:
      - nrf52840dk/nrf52840
    tags: board
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "nrfx_gpiote initialized"
        - "\\(D\\)PPI configured, leaving main()"
