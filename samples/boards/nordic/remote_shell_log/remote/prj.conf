CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

CONFIG_SHELL=y
CONFIG_SHELL_REMOTE_CLI=y
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_LOG=y
CONFIG_LOG_FRONTEND=y
CONFIG_LOG_FRONTEND_ONLY=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_CMDS=y

CONFIG_GPIO=n
#CONFIG_BOOT_BANNER=n
#CONFIG_SERIAL=n
#CONFIG_CONSOLE=n
#CONFIG_UART_CONSOLE=n
#CONFIG_PRINTK=n
CONFIG_LOG_PRINTK=n

# Use kernel shell commands
CONFIG_KERNEL_SHELL=y
# Use ICBMsg shell commands to get IPC statistics
CONFIG_IPC_SERVICE_BACKEND_ICBMSG_SHELL=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
