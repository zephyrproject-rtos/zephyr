sample:
  description: AD5592R NPN and AD5593R PNP curve tracer demo for the ADALM-LSMSPG shield
  name: adi_lsmspg curve tracer

tests:
  sample.shields.adi_lsmspg.curve_tracer:
    depends_on:
      - feather_spi
      - feather_i2c
    platform_allow: max32666fthr/max32666/cpu0
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Type 'pnp_curvetrace' to run the PNP curve trace"
    tags: shield
