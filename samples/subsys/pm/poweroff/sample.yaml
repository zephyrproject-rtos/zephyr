sample:
  description: perform soc Power off and wake it using an RTC alarm or GPIO
  name: Soc power off with RTC and GPIO wakeup

common:
  tags:
    - power
    - rtc
    - poweroff
    - gpio
  platform_allow:
    - siwx917_rb4338a
  filter: >
    dt_alias_exists("button") and
    dt_alias_exists("rtc")
  depends_on:
    - gpio
    - rtc

tests:
  sample.subsys.pm.poweroff:
    build_only: true
    integration_platforms:
      - siwx917_rb4338a
