sample:
  name: CDC ACM USB bridge
tests:
  sample.usb.cdc-acm-bridge.arduino_serial:
    tags: usb
    build_only: true
    depends_on: usbd arduino_serial
  sample.usb.cdc-acm-bridge.two_devices:
    tags: usb
    build_only: true
    platform_allow:
      - rpi_pico
  sample.usb.cdc-acm-bridge.reset_lines:
    tags: usb
    build_only: true
    platform_allow:
      - nucleo_u575zi_q
      - arduino_portenta_c33
