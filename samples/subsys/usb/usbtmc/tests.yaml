sample:
  name: USBTMC device class sample
tests:
  sample.usb.usb_device_next.usbtmc:
    depends_on: usbd
    tags: usb
    integration_platforms:
      - frdm_k64f                       # Full-Speed, udc_kinetis
      - mimxrt1060_evk/mimxrt1062/qspi  # High-Speed, udc_mcux_ehci
    harness: console
    harness_config:
      type: one_line
      regex:
        - "usbtmc_sample: USB device support enabled"
