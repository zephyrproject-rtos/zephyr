# Merged when building usb_host_msc for in-tree board versal_apu.
#
# Build (from zephyr/):
#   west build -p always -b versal_apu samples/subsys/usb/host_msc -- \
#     -DDTC_OVERLAY_FILE=boards/versal_apu.overlay
#
# Flash (PDI from your Vivado/Vitis design — not bundled with the board):
#   west flash --runner xsdb --pdi /path/to/your.pdi
#
# Plug USB stick, wait for "USB MSC ready", then:
#   msc mount USB
#   msc mount USB1    (second stick — both stay mounted)
#   fs ls /USB:
#   fs ls /USB1:

CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_USB_HOST_STACK=y
CONFIG_USBH_USB2_ENUM_SCHEME=y
CONFIG_USBH_HUB=y
CONFIG_USBH_MSC=y
CONFIG_USBH_MSC_CLASS=y
CONFIG_USBH_MSC_STRICT_PROBE=y
# Sample main() drives MSC bringup after CONFIGURED (same as verified lab flow).
CONFIG_USBH_MSC_AUTO_BRINGUP=n
CONFIG_USBH_USB_DEVICE_HEAP=8192
CONFIG_USBH_STACK_SIZE=4096

CONFIG_UHC_DRIVER=y
CONFIG_UHC_BUF_POOL_SIZE=8192
CONFIG_UHC_DWC3=y

CONFIG_USBH_USB_DEVICE_MAX=4
CONFIG_USBH_MSC_LUN_SLOTS=4

CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SCSI=y
CONFIG_DISK_DRIVER_SCSI=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=4
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="USB,USB1,USB2,USB3"
CONFIG_FS_FATFS_NUM_FILES=4
CONFIG_FS_FATFS_NUM_DIRS=4
CONFIG_FS_FATFS_MAX_SS=512
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y

CONFIG_USBH_MSC_DISK=y
CONFIG_USBH_MSC_DISK_NAME="USB"
CONFIG_USBH_MSC_DISK_AUTO_ATTACH=y
CONFIG_USBH_MSC_DISK_PARTITION=y

CONFIG_USB_HOST_MSC_SAMPLE_FAT_FILE_DEMO=y
CONFIG_USB_HOST_MSC_SAMPLE_FS_SHELL=y
CONFIG_USB_HOST_MSC_SAMPLE_FAT_AUTO_DEMO=n
CONFIG_USB_HOST_MSC_SAMPLE_FAT_MKFS_ON_FAIL=n
CONFIG_USB_HOST_MSC_SAMPLE_FAT_READBACK_VERIFY=n
CONFIG_USB_HOST_MSC_SAMPLE_FAT_RELIST_AFTER_WRITE=n
CONFIG_USB_HOST_MSC_SAMPLE_QUIET=n
CONFIG_USB_HOST_MSC_SAMPLE_TIMER_SELFTEST=n

CONFIG_USBH_SHELL=y
CONFIG_USBH_LOG_LEVEL_INF=y
CONFIG_UHC_DRIVER_LOG_LEVEL_INF=y
CONFIG_USBH_MSC_LOG_PROBE=y
CONFIG_USBH_MSC_FLOW_LOG=y

CONFIG_NET_BUF_ALIGNMENT=64
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_ARGC_MAX=12
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=512

CONFIG_FILE_SYSTEM_SHELL_MOUNT_COMMAND=y
CONFIG_FILE_SYSTEM_SHELL_LS_SIZE=y
