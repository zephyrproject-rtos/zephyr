# SPDX-License-Identifier: Apache-2.0
#
# USB host MSC sample. Board-specific USB/MSC options are in boards/*.conf.
#
# Build example (versal_apu):
#   west build -p always -b versal_apu samples/subsys/usb/host_msc -- \
#     -DDTC_OVERLAY_FILE=boards/versal_apu.overlay

CONFIG_POLL=y
CONFIG_THREAD_NAME=y

CONFIG_PRINTK=y
CONFIG_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_OVERRIDE_LEVEL=0
CONFIG_KERNEL_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
