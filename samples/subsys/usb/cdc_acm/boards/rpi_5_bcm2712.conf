#
# BCM2712 Type-C peripheral mode. Buffer DMA is not validated on this
# controller, and the USB device stack needs more stack than the defaults on
# this SoC when descriptors are built at the default log level.

CONFIG_UDC_DWC2_DMA=n
CONFIG_UDC_DWC2_STACK_SIZE=8192
CONFIG_USBD_THREAD_STACK_SIZE=8192

# No hwinfo driver exists for BCM2712, so the serial-number descriptor cannot
# be generated.
CONFIG_HWINFO=n
