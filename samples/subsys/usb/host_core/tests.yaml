sample:
  description: Bounded USB host configuration descriptor helpers
  name: USB host core (descriptor walk)
common:
  tags:
    - usb
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "USB host core sample"
      - "Host descriptor helpers OK"
tests:
  sample.subsys.usb.host_core:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
