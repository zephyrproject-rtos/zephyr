CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSG_DEFERRED_MODE=n
CONFIG_USBD_VREQ_SUPPORT=n
CONFIG_USBD_BOS_SUPPORT=n

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_REBOOT=y
CONFIG_GPIO=y

# Link the bootloader into the code partition of the overlay
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_TIMESLICING=n

# Boards with an SD card slot would otherwise pull in the SD card stack
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_SDHC=n
CONFIG_SPI=n

CONFIG_SIZE_OPTIMIZATIONS=y

CONFIG_SAMPLE_USBD_PID=0x0015
CONFIG_SAMPLE_USBD_PRODUCT="USBD UF2 sample"
CONFIG_MAIN_STACK_SIZE=2048
