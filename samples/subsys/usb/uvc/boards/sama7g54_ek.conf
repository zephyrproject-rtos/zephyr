# The camera module streams raw Bayer, which the Image Sensor Controller
# converts into YUYV, the only format it and USB Video have in common. The
# sample finds it among the capabilities and offers the host that alone.

# Two buffers at 1280x720, the largest frame a high-speed bulk endpoint carries
# at a useful rate, plus room for the heap itself. The sample skips any format
# whose frames do not fit half the pool, so this also caps the resolutions the
# host is offered.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=3932160

# The controller crops rather than scales, so it inherits the resolution range
# of the sensor and the sample walks the range from the bottom. The default
# stops at VGA; go far enough down the list to reach 720p.
CONFIG_APP_VIDEO_MAX_RESOLUTIONS=7
