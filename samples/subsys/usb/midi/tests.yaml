sample:
  name: USB MIDI 2.0 device class sample
tests:
  sample.usb.usb_device_next.midi:
    depends_on: usbd
    tags: usb
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf54h20dk/nrf54h20/cpuapp
      - frdm_k64f
      - nucleo_f429zi
      - stm32f723e_disco
      - nucleo_f413zh
      - mimxrt685_evk/mimxrt685s/cm33
      - mimxrt1060_evk/mimxrt1062/qspi
    integration_platforms:
      - nrf52840dk/nrf52840
    harness: console
    harness_config:
      type: one_line
      regex:
        - "USB device support enabled"
