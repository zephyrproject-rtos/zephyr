sample:
  name: USB host video sample
tests:
  sample.usb.host.uvc.camera:
    tags:
      - video
      - usbh
      - samples
    extra_configs:
      - CONFIG_FPU=y
    platform_allow:
      - pic32cz_ca80_cult
      - rd_rw612_bga/rw612
    integration_platforms:
      - pic32cz_ca80_cult
      - rd_rw612_bga/rw612
    timeout: 30
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Video device connected!"
        - "Capture started"
        - "Received \\d+ frames"
