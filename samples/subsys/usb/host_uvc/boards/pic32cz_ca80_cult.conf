# PIC32CZ CA80 - Basic UVC streaming demo

CONFIG_APP_VIDEO_PIXEL_FORMAT="JPEG"
CONFIG_APP_VIDEO_FRAME_WIDTH=320
CONFIG_APP_VIDEO_FRAME_HEIGHT=240

# Video buffer: 320x240x2 = 153600 bytes per buffer
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=320000

# System heap
CONFIG_HEAP_MEM_POOL_SIZE=32768

# USB host buffers
CONFIG_USBH_VIDEO_CONCURRENT_TRANSFERS=2

# Each in-flight isochronous transfer allocates one full service interval
# (wMaxPacketSize * mult) from the shared UHC buffer pool. High-speed cameras
# select high-bandwidth alternate settings for MJPEG (up to 3 x 1024 = 3072
# bytes per transfer), so the pool must hold
# CONCURRENT_TRANSFERS * 3072 bytes plus headroom for control transfers and
# heap/alignment overhead. The 4096-byte default from prj.conf only fits one.
CONFIG_UHC_BUF_POOL_SIZE=12288

# Reduce logging noise
CONFIG_UHC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBH_LOG_LEVEL_WRN=y
