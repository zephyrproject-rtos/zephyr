sample:
  name: Assert sample
tests:
  sample.debug.assert:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    tags: debug assert
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "MYMODULE assert level        = 2"
        - "Passed module ZASSERT\\(1 == 1\\)"
        - "ASSERTION FAIL \\[x == 3\\]"
