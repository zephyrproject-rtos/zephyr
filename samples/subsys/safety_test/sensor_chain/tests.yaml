sample:
  name: Safety Test Sensor Chain
  description: safety_test subsystem exercised at all five init levels, ending
    at the on-board P3T1755 temperature sensor
common:
  tags:
    - safety_test
    - sensors
  filter: dt_alias_exists("ambient-temp0") and dt_alias_exists("clock-ref")
  platform_allow:
    - frdm_mcxa156
  integration_platforms:
    - frdm_mcxa156
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "safety_test sensor chain sample"
      - "cycle 1:"
tests:
  sample.subsys.safety_test.sensor_chain: {}
  sample.subsys.safety_test.sensor_chain.strict:
    extra_args: EXTRA_CONF_FILE=strict.conf
