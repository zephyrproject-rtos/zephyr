CONFIG_SAFETY_TEST=y
CONFIG_SAFETY_TEST_EARLY_TESTS=y
CONFIG_SAFETY_TEST_STRICT_CRITICAL=n

CONFIG_SENSOR=y
CONFIG_COUNTER=y
CONFIG_GPIO=y

# flash_integrity (src/tests_platform.c) calls crc32_ieee().
CONFIG_CRC=y

# Force the software CRC. The board sets /chosen zephyr,crc, which makes
# CRC_HW_HANDLER default y, and subsys/crc/crc_hardware.c then provides strong
# crc32_ieee() symbols that override the __weak software ones. Those route
# through the CRC peripheral, a POST_KERNEL device -- but flash_integrity runs
# at PRE_KERNEL_2, before it exists.
CONFIG_CRC_HW_HANDLER=n

CONFIG_LOG=y
CONFIG_PRINTK=y
