common:
  harness: display
  tags: display
sample:
  description: Character framebuffer shell test
  name: cfb shell sample
tests:
  sample.display.cfb_shell.ssd1306:
    platform_allow: frdm_k64f
    extra_args: SHIELD=ssd1306_128x32
    tags: shield
  sample.display.cfb_shell.ssd16xx:
    platform_allow: reel_board
    harness: shell
    harness_config:
      shell_commands:
        - command: "cfb get_param all"
          expected: ".*Failed to get parameter height: -19.*"
        - command: "cfb init"
          expected: ".*Framebuffer initialized: ssd16xxfb@0.*"
        - command: "cfb init"
          expected: ".*Framebuffer initialization failed: -120.*"
        - command: "cfb get_param all"
          expected: ".*param: cols=250.*"
