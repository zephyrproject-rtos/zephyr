sample:
  name: Applet loader shell
  description: >
    Load LLEXT-backed applets from the shell and run them. Each extension is
    wrapped in an applet, so the applet subsystem handles the thread, the
    memory domain and (with CONFIG_USERSPACE) the privilege level.

common:
  tags:
    - shell
    - applet
    - llext
  arch_allow:
    - riscv
    - arm
    - arm64
    - arc
    - x86
    - xtensa
  platform_exclude:
    # platforms with active LLEXT issues
    - apollo4p_evb            # See #73443
    - apollo4p_blue_kxr_evb   # See #73443
    - numaker_pfm_m487        # See #63167
    - s32z2xxdc2/s32z270/rtu0 # See commit 18a0660
    - s32z2xxdc2/s32z270/rtu1 # See commit 18a0660

tests:
  sample.applet.shell:
    harness: keyboard
    filter: not CONFIG_MPU and not CONFIG_MMU and not CONFIG_SOC_SERIES_S32ZE
      and not CONFIG_SOC_SERIES_RZA2M
    extra_configs:
      - arch:arm:CONFIG_ARM_MPU=n
      - arch:arm:CONFIG_ARM_AARCH32_MMU=n
  sample.applet.shell.userspace:
    harness: keyboard
    filter: not CONFIG_SOC_SERIES_S32ZE and not CONFIG_RISCV_PMP
    tags:
      - userspace
    # Every applet needs one memory domain partition per extension section,
    # plus the ones the sample and the subsystem hand out. Keep this list to
    # platforms known to have enough of them.
    platform_allow:
      - mps2/an385
      - mps2/an521/cpu0
    extra_configs:
      - CONFIG_USERSPACE=y
