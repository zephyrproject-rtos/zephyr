CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# Applets run unprivileged under CONFIG_USERSPACE, where printk() may not go
# through the logging subsystem.
CONFIG_LOG_PRINTK=n

CONFIG_SHELL=y
CONFIG_SHELL_CMD_BUFF_SIZE=8192
CONFIG_SHELL_LOG_LEVEL_INF=y
CONFIG_SHELL_STACK_SIZE=4096
# Long hex payloads are pasted in one go, so the RX ring buffer must hold them.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=8192

CONFIG_LLEXT=y
CONFIG_LLEXT_LOG_LEVEL_INF=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=y
CONFIG_LLEXT_HEAP_SIZE=32

CONFIG_APPLET=y
CONFIG_APPLET_LLEXT=y
CONFIG_APPLET_LOG_LEVEL_INF=y
CONFIG_APPLET_HEAP_SIZE=2048

CONFIG_HEAP_MEM_POOL_SIZE=8192
# Must fit one ELF load buffer per concurrently loaded applet, plus overhead.
# CONFIG_USERSPACE maps the arena with the MPU, so keep it a power of two.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
