common:
  tags:
    - applet
    - llext
    - userspace
  depends_on: []
  min_ram: 64
  min_flash: 128
  platform_allow:
    - native_sim
    - qemu_cortex_a9
    - qemu_cortex_r5
    - qemu_cortex_a53
    - mps2/an385
    - mps2/an521/cpu0
    - qemu_x86/atom/virt
    - qemu_xtensa/dc233c
    - qemu_arc/qemu_arc_em
    - qemu_riscv32/qemu_virt_riscv32
  integration_platforms:
    - qemu_x86/atom/virt
    - qemu_arc/qemu_arc_em
    - qemu_xtensa/dc233c
    - mps2/an385
    - qemu_cortex_a53

sample:
  name: Applet - Hello World
  description:  Demonstrates applet subsystem

tests:
  sample.applet.hello_world:
    integration_platforms:
      - native_sim
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Hello world from applet 'hello world' \\(arg=42\\)"
  sample.applet.hello_world.llext:
    arch_allow:
      - riscv
      - arm
      - arm64
      - arc
      - x86
      - xtensa
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Hello world from applet 'hello world' \\(arg=42\\)"
    extra_configs:
      - CONFIG_LLEXT=y
      - CONFIG_APPLET_LLEXT=y
      - CONFIG_LLEXT_HEAP_SIZE=64
      # RISC-V runs the loaded code from RAM in machine mode. DEP installs a
      # locked catch-all PMP entry that makes all RAM non-executable, with no
      # way to mark the region executable. Setting an unknown symbol to 'n' is
      # a no-op, so this is safe on the other arches.
      - CONFIG_PMP_DATA_EXECUTION_PREVENTION=n
      # LLEXT does not round region sizes to CONFIG_PMP_GRANULARITY, so the
      # PMP entry for .text is truncated and the tail of the extension is not
      # executable from user mode. Run applet in supervisor mode instead.
      - arch:riscv:CONFIG_USERSPACE=n
