CONFIG_RPMSG_SERVICE=y
CONFIG_RPMSG_SERVICE_MODE_REMOTE=y
CONFIG_UART_RPMSG=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Create the uart_rpmsg endpoint before RPMsg service init runs.
CONFIG_RPMSG_SERVICE_INIT_PRIORITY=55

# Build the interrupt-driven shell backend so this config exercises that path.
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
