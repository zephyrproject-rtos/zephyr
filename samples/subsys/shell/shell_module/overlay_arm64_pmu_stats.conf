#
# ARM64 PMU perf + SMP scheduler stats + PMU overflow sampling for shell_module.
#
# Build (from $ZEPHYR_BASE):
#
#   west build -p always -b versalnet_apu samples/subsys/shell/shell_module \
#     -- -DEXTRA_CONF_FILE=overlay_arm64_pmu_stats.conf
#
# Shell commands:
#   sched cpus | sched threads | sched top [-c cpu] [-d] [-i ms]
#   perf list | perf start [-e ev] | perf stop | perf report
#   perf record start [-e ev] [-f Hz] [-t sec] | stop | dump | export | clear

CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096

# Prevent deferred log messages from crashing the logging thread via the
# shell log backend's cbprintf path on SMP.  With LOG_MODE_DEFERRED (the
# default) and SHELL_LOG_BACKEND, the logging thread can corrupt its own
# saved LR with the uart device's .rodata address when processing messages
# that include 64-bit format args.  Immediate mode prints synchronously on
# the calling thread and avoids the logging thread entirely.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_ARM64_PMUV3=y
CONFIG_PERF_SHELL=y

CONFIG_PROFILING=y
CONFIG_PROFILING_PMU_SAMPLING=y

CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
CONFIG_SCHED_THREAD_USAGE_AUTO_ENABLE=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_SCHED_STATS_SHELL=y

CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
