sample:
  name: CANopen node
tests:
  sample.canbus.canopen:
    tags:
      - can
      - canopen
    depends_on: can
    filter: dt_chosen_enabled("zephyr,canbus")
    integration_platforms:
      - native_sim/native/64
    harness: console
    harness_config:
      type: one_line
      regex:
        - "CANopen node 0x10 started at 500000 bit/s"
  sample.canbus.canopen.master:
    tags:
      - can
      - canopen
    depends_on: can
    filter: dt_chosen_enabled("zephyr,canbus")
    integration_platforms:
      - native_sim/native/64
    build_only: true
    extra_configs:
      - CONFIG_SAMPLE_MASTER=y
  sample.canbus.canopen.shell:
    tags:
      - can
      - canopen
    depends_on: can
    filter: dt_chosen_enabled("zephyr,canbus")
    integration_platforms:
      - native_sim/native/64
    build_only: true
    extra_args:
      - EXTRA_CONF_FILE=shell.conf
