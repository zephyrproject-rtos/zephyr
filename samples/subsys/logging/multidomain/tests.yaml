sample:
  name: Logging in multi-domain environment
common:
  sysbuild: true
  tags: ipc
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "Hello World!"
      - "app: Multidomain logging HOST demo started"
      - "app: loop: 0"
      - "app: wait for bound"
      - "app: bounded"
      - "app: REMOTE \\[1\\]: 0"
      - "app: HOST \\[1\\]: 1"
      - "app: Multidomain logging HOST demo ended."
tests:
  sample.logging.multidomain.rx_hold:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
  sample.logging.multidomain.mpsc_buffer:
    platform_allow:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp
      - nrf5340bsim/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    extra_configs:
      - CONFIG_LOG_LINK_IPC_SERVICE_RX_HOLD=n
