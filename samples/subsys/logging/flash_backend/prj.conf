# The logging sample's own configuration.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PRINTK=y
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=0
CONFIG_COVERAGE=n
CONFIG_LOG_TAG_MAX_LEN=8

# Additional options for the flash backend
CONFIG_FLASH=y
CONFIG_LOG_BACKEND_FLASH=y
CONFIG_LOG_BACKEND_FLASH_SHELL=y
CONFIG_SHELL=y

# The sample has no version of its own to identify a build by, so the Zephyr
# one stands in. An application that has a version string of its own should
# name that instead.
CONFIG_LOG_BACKEND_FLASH_BUILD_ID="STRINGIFY(BUILD_VERSION)"
CONFIG_LOG_BACKEND_FLASH_BUILD_ID_HEADER="zephyr/version.h"
