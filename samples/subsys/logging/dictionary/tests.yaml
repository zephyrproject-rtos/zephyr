sample:
  description: Dictionary-based Logging Sample Application
  name: logging_dictionary
common:
  tags: logging
  platform_exclude:
    - pocketbeagle_2/am6232/m4
    - pocketbeagle_2/am6254/m4
    - pocketbeagle_2_industrial/am6254/m4
    - beagleplay/am6254/m4
tests:
  sample.logging.basic.dictionary:
    filter: CONFIG_SERIAL
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_dictionary_uart.py"
    platform_allow:
      - qemu_x86
      - qemu_x86_64
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - qemu_x86
      - nrf54l15dk/nrf54l15/cpuapp
  sample.logging.basic.dictionary.fpu:
    filter: CONFIG_SERIAL and CONFIG_CPU_HAS_FPU
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_dictionary_uart.py"
    platform_allow:
      - qemu_x86
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - qemu_x86
      - qemu_x86_64
      - nrf54l15dk/nrf54l15/cpuapp
    extra_configs:
      - CONFIG_FPU=y
  sample.logging.basic.dictionary.fpu.long_double:
    # The long double is a 80-bit number on x86, which is not supported by the log parser, so
    # the output cannot be verified. Only build it.
    build_only: true
    filter: CONFIG_QEMU_TARGET and CONFIG_CPU_HAS_FPU
    extra_configs:
      - CONFIG_FPU=y
      - CONFIG_CBPRINTF_PACKAGE_LONGDOUBLE=y
    integration_platforms:
      - qemu_x86
      - qemu_x86_64
  sample.logging.basic.dictionary.uart_async_frontend:
    filter: CONFIG_SERIAL and CONFIG_SERIAL_SUPPORT_ASYNC
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_dictionary_uart.py"
    integration_platforms:
      - qemu_cortex_m0
      - nrf54l15dk/nrf54l15/cpuapp
    extra_configs:
      - CONFIG_LOG_BACKEND_UART=n
      - CONFIG_LOG_BACKEND_RTT=n
      - CONFIG_UART_ASYNC_API=y
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_LOG_FRONTEND=y
      - CONFIG_LOG_FRONTEND_ONLY=y
      - CONFIG_LOG_FRONTEND_DICT_UART=y
  sample.logging.basic.dictionary.uart_int_frontend:
    filter: CONFIG_SERIAL_SUPPORT_INTERRUPT and CONFIG_SERIAL
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_dictionary_uart.py"
    integration_platforms:
      - qemu_x86
      - qemu_x86_64
      - nrf54l15dk/nrf54l15/cpuapp
    extra_configs:
      - CONFIG_LOG_BACKEND_UART=n
      - CONFIG_LOG_BACKEND_RTT=n
      - CONFIG_UART_INTERRUPT_DRIVEN=y
      - CONFIG_UART_ASYNC_API=n
      - CONFIG_LOG_FRONTEND=y
      - CONFIG_LOG_FRONTEND_ONLY=y
      - CONFIG_LOG_FRONTEND_DICT_UART=y
