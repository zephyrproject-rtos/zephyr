# Two 320x240 YUYV buffers in PSRAM exceed the 256 KiB heap of small heaps
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=327680
CONFIG_SYS_HEAP_AUTO=y

# Capture
CONFIG_VIDEO_PIXEL_FORMAT="YUYV"
CONFIG_VIDEO_FRAME_WIDTH=320
CONFIG_VIDEO_FRAME_HEIGHT=240

# Wi-Fi station with DHCPv4, connect with the "wifi connect" shell command
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# Network buffers
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
