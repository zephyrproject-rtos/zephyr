# IMX219 behind the GMSL2 bridge: the sensor streams 1600x960 RAW10 and the
# DCMIPP scales and converts it to the sample's capture format.
CONFIG_VIDEO_STM32_DCMIPP_SENSOR_WIDTH=1600
CONFIG_VIDEO_STM32_DCMIPP_SENSOR_HEIGHT=960

# The controls listed at boot overflow the default log buffer.
CONFIG_LOG_BUFFER_SIZE=4096
