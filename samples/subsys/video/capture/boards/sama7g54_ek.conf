# The Image Sensor Controller converts the raw Bayer frames of the camera
# module into RGB565.
CONFIG_VIDEO_PIXEL_FORMAT="RGBP"
CONFIG_VIDEO_FRAME_WIDTH=640
CONFIG_VIDEO_FRAME_HEIGHT=480

# The camera module can be cropped up to 3280x2464, and the shell sizes its
# buffers from the format in use, so the pool is dimensioned for the largest
# resolution worth capturing rather than for the default above: two 1920x1080
# frames at two bytes per pixel need 8 MiB, and the heap needs some room of its
# own on top of that. It is carved out of the 512 MiB of DDR on this board.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=8650752

# The pool lands in the image itself, and the image has to fit in the kernel
# address space, which the whole of it is mapped into at boot. The default 8 MiB
# is not enough for the pool above, and overrunning it corrupts memory during
# the early mapping rather than failing the build, so grow it to 16 MiB. That
# leaves the runtime mapping region above the image about as large as it was.
CONFIG_KERNEL_VM_SIZE=0x1000000
