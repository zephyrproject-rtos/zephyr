# The Image Sensor Controller converts the raw Bayer frames of the camera
# module into RGB565, two 640x480 frames fit in the buffer pool below.
CONFIG_VIDEO_PIXEL_FORMAT="RGBP"
CONFIG_VIDEO_FRAME_WIDTH=640
CONFIG_VIDEO_FRAME_HEIGHT=480
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1310720
