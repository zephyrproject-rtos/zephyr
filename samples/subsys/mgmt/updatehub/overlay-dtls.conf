CONFIG_UPDATEHUB_DTLS=y

# UpdateHub Cloud uses DTLS 1.2 with ECDSA P-256 certificates
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_MBEDTLS_SSL_EXTENDED_MASTER_SECRET=y
# The root CA file is a PEM bundle
CONFIG_MBEDTLS_PEM_PARSE_C=y

# A handshake peaks around 10 KiB in use, but the first-fit allocator
# fragments: 16 KiB already failed with both roots on a 64-bit target
CONFIG_MBEDTLS_HEAP_SIZE=24576
CONFIG_NET_BUF_RX_COUNT=50
