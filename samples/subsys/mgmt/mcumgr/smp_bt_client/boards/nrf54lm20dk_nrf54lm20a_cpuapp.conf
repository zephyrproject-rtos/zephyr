CONFIG_SPI=y

# Read the flash parameters from the devicetree JESD216 table
CONFIG_SPI_NOR_SFDP_DEVICETREE=y

# littlefs needs 4 KiB blocks; the default layout page is 64 KiB
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
