CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

# Large ATT MTU and data length, matching smp_svr's bt.conf
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# smp_svr does not initiate the ATT MTU exchange, so the client has to
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y

# One ATT buffer per transmit credit, plus headroom
CONFIG_BT_ATT_TX_COUNT=4

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_SMP_CLIENT=y
CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y

# Must not exceed the peer's value, which is 2475 in smp_svr's bt.conf
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048

CONFIG_MCUMGR_GRP_IMG_CLIENT=y
CONFIG_MCUMGR_GRP_OS_CLIENT=y

# For the MCUboot image header of the placeholder image
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
