# Enable the raw Ethernet MCUmgr transport.
CONFIG_MCUMGR_TRANSPORT_ETHERNET=y

# Size the MCUmgr buffer to fit a full Ethernet frame, and let a client query
# that size instead of falling back to its own smaller default.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1500
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y

# Network settings
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_NATIVE=y
