# Enable both MCUmgr UART transports, on the UARTs selected in dual-uart.overlay: SMP over
# console on the console UART and raw on USB CDC ACM.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_RAW_UART=y
CONFIG_MCUMGR_TRANSPORT_RAW_UART_INPUT_TIMEOUT=y

# Enable USB subsystem
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
