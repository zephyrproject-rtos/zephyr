# TI LPF3 Bluetooth DFU Additions
#
# This overlay is applied AFTER overlay-bt.conf
# It contains only TI-specific configs and size optimizations
# All Bluetooth and MCUmgr transport configs come from overlay-bt.conf
#
# Supported platforms: CC2340R5, CC2340R53, CC2745R10_Q1, CC2755R10

# TI-specific DFU bundle
# Automatically enables: NET_BUF, ZCBOR, CRC, MCUMGR, IMG_MANAGER, etc.
CONFIG_TI_MCUMGR_BT_OTA_DFU=y

# TI controller doesn't support packets larger than 254 bytes, so set L2CAP MTU accordingly
CONFIG_BT_L2CAP_TX_MTU=254

# MCUboot bootloader for DFU support
CONFIG_BOOTLOADER_MCUBOOT=y

# Disable shell support to save space (DFU testing uses Bluetooth only)
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_MCUMGR_TRANSPORT_SHELL=n

# Disable filesystem features to reduce binary size
# overlay-bt.conf enables these for full-featured example
# Disable for minimal DFU-focused image (~30KB+ savings)
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_GRP_ZBASIC=n
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
