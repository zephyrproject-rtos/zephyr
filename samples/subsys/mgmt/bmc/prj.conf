CONFIG_BMC=y
CONFIG_BMC_NTP=n
CONFIG_BMC_HTTPS=n

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# The BMC shell, reachable over the serial console and, for the dashboard,
# over a websocket at /console/bmc. The BMC authenticates the websocket client
# before it hands the session to the shell.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_WEBSOCKET=y
CONFIG_SHELL_WEBSOCKET_PROMPT="bmc:~$ "

# Let the websocket shell print the log messages itself, the way the serial
# shell does, instead of handing the socket to the websocket log backend.
CONFIG_LOG_BACKEND_WS=n

# Persist the runtime configuration. The BMC only asks for the settings
# subsystem, so the backend is the application's choice; here it is NVS on the
# board's storage partition.
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_GPIO=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_AUTO_INIT=n

CONFIG_POSIX_API=y
CONFIG_EVENTFD=y

# Networking resources the BMC services need. These live in the application
# rather than in the subsystem Kconfig, because the right numbers depend on how
# many clients a product expects.
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_ZVFS_EVENTFD_MAX=10
CONFIG_ZVFS_POLL_MAX=32
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32

# The dashboard holds a websocket open for the host console and one for the
# shell, and still needs slots for its Redfish requests.
CONFIG_WEBSOCKET_MAX_CONTEXTS=3
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_RETRY_COUNT=3
CONFIG_NET_TCP_INIT_RETRANSMISSION_TIMEOUT=120
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=20480

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_HTTP_SERVER_STACK_SIZE=4096

# Long enough for a Basic authentication header.
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=64

CONFIG_BMC_DEFAULT_ADMIN_PASSWORD="admin"

# Network address config
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
