CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_SAMPLE_USBD_PID=0x0012

CONFIG_FIDO2=y
CONFIG_FIDO2_TRANSPORT_USB_HID=y
CONFIG_FIDO2_TRANSPORT_BLE=y
CONFIG_FIDO2_LOG_LEVEL_INF=y

# BLE support
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="Zephyr FIDO2 BLE"

# Device Information Service values exposed by the BLE transport.
CONFIG_BT_DIS_MANUF_NAME_STR="Zephyr Project"
CONFIG_BT_DIS_MODEL_NUMBER_STR="FIDO2 BLE Sample"
CONFIG_BT_DIS_FW_REV_STR="0.1"

# zephyrFido2SAMPL
CONFIG_FIDO2_AAGUID="7a65706879724669646f3253414d504c"

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_LOG=y
CONFIG_GPIO=y
CONFIG_INPUT=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_FIDO2_BLE_RX_WORKQ_STACK_SIZE=1024
CONFIG_FIDO2_THREAD_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
