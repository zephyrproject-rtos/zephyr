CONFIG_MBOX=y
CONFIG_MBOX_SUNXI_MSGBOX=y
CONFIG_IPM=y

# The E907 has no UART console in this configuration; printk goes to the
# RAM console so the sample does not depend on a serial console.
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
