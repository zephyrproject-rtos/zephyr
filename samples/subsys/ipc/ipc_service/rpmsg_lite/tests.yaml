sample:
  name: IPC Service example integration (RPMsg-Lite backend)
tests:
  sample.ipc.rpmsg_lite:
    platform_allow:
      - mimxrt1170_evk@B/mimxrt1176/cm7
      - mimxrt1170_evk/mimxrt1176/cm7
      - mimxrt1160_evk/mimxrt1166/cm7
      - lpcxpresso55s69/lpc55s69/cpu0
      - mimxrt700_evk/mimxrt798s/cm33_cpu0
    integration_platforms:
      - mimxrt1170_evk@B/mimxrt1176/cm7
    tags: ipc
    sysbuild: true
    harness: console
    harness_config:
      type: multi_line
      ordered: false
      regex:
        - "IPC-service HOST \\[INST 0\\] demo started"
        - "HOST \\[0\\]: 1"
        - "HOST \\[0\\]: 3"
        - "IPC-service HOST \\[INST 0\\] demo ended\\."
        - "IPC-service HOST \\[INST 1\\] demo ended\\."
        - "IPC-service HOST \\[INST 2\\] demo ended\\."
