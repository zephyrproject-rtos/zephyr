sample:
  name: IPC Service example integration (RPMsg-Lite backend)
tests:
  sample.ipc.rpmsg_lite:
    platform_allow:
      - mimxrt1170_evk@B/mimxrt1176/cm7
      - mimxrt1170_evk/mimxrt1176/cm7
      - mimxrt1160_evk/mimxrt1166/cm7
      - lpcxpresso55s69/lpc55s69/cpu0
      - mimxrt700_evk/mimxrt798s/cm33_cpu0
      - frdm_imxrt1186/mimxrt1186/cm33
    integration_platforms:
      - mimxrt1170_evk@B/mimxrt1176/cm7
      - frdm_imxrt1186/mimxrt1186/cm33
    tags: ipc
    sysbuild: true
    harness: remote

  sample.ipc.rpmsg_lite.frdm_imxrt1186.flash:
    platform_allow:
      - frdm_imxrt1186/mimxrt1186/cm33
    integration_platforms:
      - frdm_imxrt1186/mimxrt1186/cm33
    tags: ipc
    sysbuild: true
    harness: remote
    extra_args:
      - remote_EXTRA_DTC_OVERLAY_FILE="boards/frdm_imxrt1186_mimxrt1186_cm7_flash.overlay"
      - CONFIG_CM7_BOOT_FROM_FLASH=y
      - remote_CONFIG_CM7_BOOT_FROM_FLASH=y

  sample.ipc.rpmsg_lite.frdm_imxrt1186.hyperram:
    platform_allow:
      - frdm_imxrt1186/mimxrt1186/cm33
    integration_platforms:
      - frdm_imxrt1186/mimxrt1186/cm33
    tags: ipc
    sysbuild: true
    harness: remote
    extra_args:
      - remote_EXTRA_DTC_OVERLAY_FILE="boards/frdm_imxrt1186_mimxrt1186_cm7_hyperram.overlay"
      - remote_EXTRA_CONF_FILE="boards/frdm_imxrt1186_mimxrt1186_cm7_hyperram.conf"
      - EXTRA_DTC_OVERLAY_FILE="boards/frdm_imxrt1186_mimxrt1186_cm33_hyperram.overlay"
      - CONFIG_CM7_BOOT_FROM_FLASH=y
