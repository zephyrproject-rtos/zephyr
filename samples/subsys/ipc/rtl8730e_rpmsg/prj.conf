CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_IPC_SERVICE_LOG_LEVEL_INF=y

CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_OPENAMP=y

# Shared memory survives warm reset, so each core zeroes its vdev status at init.
# Otherwise a remote reads stale DRIVER_OK and its NS announcement is lost when
# the host reinitializes the vrings; the remotes boot long before the CA32 host,
# so the remote reset is safe. Each option only affects instances of its role.
CONFIG_IPC_SERVICE_BACKEND_RPMSG_SHMEM_RESET=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG_SHMEM_RESET_REMOTE=y

# CONFIG_OPENAMP_WITH_DCACHE stays off: no core caches the vrings. CA32 maps
# them via REGION_KM*_VRING, KM4 via zephyr,memory-attr, and KM0 has no D-cache.
