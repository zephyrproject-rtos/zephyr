# The vendor IMG1 stays the bootloader. With no sysbuild bootloader the CA32
# build runs handle_amebasmart, folding the KM4/KM0 image2 into app.bin.
SB_CONFIG_BOOTLOADER_NONE=y

# Build the KM4 and KM0 remotes from this sample. Sysbuild orders them before the
# CA32 image so their image2 exists at combine time.
SB_CONFIG_RTL8730E_BUILD_KM4_APP=y
SB_CONFIG_RTL8730E_KM4_APP_SOURCE_DIR="."
SB_CONFIG_RTL8730E_BUILD_KM0_APP=y
SB_CONFIG_RTL8730E_KM0_APP_SOURCE_DIR="."
