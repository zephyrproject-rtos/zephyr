sample:
  description: Sample, that can be used for testing profiling perf tool
  name: perf sample

tests:
  sample.perf:
    tags:
      - perf
      - profiling
    extra_configs:
      - CONFIG_PROFILING_PERF_BUFFER_SIZE=256
    filter: CONFIG_PROFILING_PERF_HAS_BACKEND
    integration_platforms:
      - qemu_cortex_m3
      - qemu_riscv64
      - qemu_riscv32
      - qemu_x86_64
      - qemu_x86
    harness: pytest
  sample.perf.arm64:
    tags:
      - perf
      - profiling
      - pmu
    extra_configs:
      - CONFIG_ARM64_PMUV3=y
      - CONFIG_NUM_METAIRQ_PRIORITIES=1
      - CONFIG_PROFILING_PERF_EVENT_PROVIDER_CPU=y
    platform_allow:
      - fvp_base_revc_2xaem/v8a
    integration_platforms:
      - fvp_base_revc_2xaem/v8a
    harness: pytest
    timeout: 120
