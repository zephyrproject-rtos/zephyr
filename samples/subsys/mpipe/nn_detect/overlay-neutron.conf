# The eIQ Neutron NPU of the i.MX RT700: the model must have been compiled
# by the Neutron converter matching the hal_nxp driver blobs, which west
# blobs fetch hal_nxp provides
CONFIG_TFLM_NXP_NEUTRON=y
# The Neutron driver blobs use the hard-float ABI
CONFIG_FPU=y
# The 320x240 Ultraface model on the NPU, its scratch buffer included
CONFIG_SAMPLE_NN_ARENA_SIZE=1277952
