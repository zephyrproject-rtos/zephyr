sample:
  name: Live detection sample

tests:
  sample.mpipe.nn_detect.fake:
    tags:
    - mpipe
    - video
    - samples
    platform_allow:
    - native_sim/native/64
    integration_platforms:
    - native_sim/native/64
    extra_args:
    - platform:native_sim/native/64:SNIPPET="video-sw-generator"
    extra_configs:
    - CONFIG_TEST=y
    harness: console
    harness_config:
      type: one_line
      regex:
      - "end of stream"
  sample.mpipe.nn_detect.fake.build:
    tags:
    - mpipe
    - video
    - samples
    build_only: true
    platform_allow:
    - mimxrt1170_evk@B/mimxrt1176/cm7
    - mimxrt700_evk/mimxrt798s/cm33_cpu0
    extra_args:
    - platform:mimxrt1170_evk@B/mimxrt1176/cm7:SHIELD="nxp_btb44_ov5640;rk055hdmipi4ma0"
    - platform:mimxrt700_evk/mimxrt798s/cm33_cpu0:SHIELD="dvp_20pin_ov7670;rk055hdmipi4ma0"
