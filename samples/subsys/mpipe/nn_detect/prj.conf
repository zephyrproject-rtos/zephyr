CONFIG_LOG=y

CONFIG_MPIPE=y
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_BASE_QUEUE=y
CONFIG_MPIPE_BASE_TEE=y
CONFIG_MPIPE_BASE_APP_SINK=y
CONFIG_MPIPE_VID=y
CONFIG_MPIPE_VID_OVERLAY=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_PLAYER=y
CONFIG_MPIPE_NN=y
CONFIG_MPIPE_NN_CONVERTER=y
CONFIG_MPIPE_NN_RUNNER=y
CONFIG_MPIPE_NN_DECODER=y
# The pipeline thread, the display queue, the frame queue and the tensor queue
CONFIG_MPIPE_THREADS_NUM=4
# One tensor being written, one waiting in the tensor queue, one in the runner
CONFIG_MPIPE_NN_CONVERTER_POOL_NUM=3
# Thirteen elements with a hardware video transform
CONFIG_MPIPE_BIN_MAX_CHILDREN=16
# The camera pool and the overlay pool both wrap driver buffers in net_bufs
# drawn from the shared header pool
CONFIG_MPIPE_NET_BUF_POOL_COUNT=8

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
