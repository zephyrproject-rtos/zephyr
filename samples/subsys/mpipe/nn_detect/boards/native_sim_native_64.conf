CONFIG_VIDEO_FRAME_WIDTH=320
CONFIG_VIDEO_FRAME_HEIGHT=240
CONFIG_PROP_NUM_BUFS=10

# The generator's one, two held in queue_d, one kept on screen, the overlay's copy, slack
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=8

# The shell reads the p/s/r/q commands from the launching terminal
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Log to stdout from boot, and not a second time through the shell backend
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_SHELL_LOG_BACKEND=n

# Threads on native_sim run on host stacks, so this size only reserves memory
CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=64
