# The camera's own queue, the frames held in the two queues, the overlay's copy,
# the PXP's output and the frame kept on screen, slack: 640x480 BGRX32 frames
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=10
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=12582912
CONFIG_VIDEO_ROTATION_ANGLE=270
# The 4:3 frame the face detectors were trained on
CONFIG_VIDEO_FRAME_WIDTH=640
CONFIG_VIDEO_FRAME_HEIGHT=480

# Optimized int8 kernels for the Cortex-M7
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# Thirteen elements negotiate on the player worker
CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=8192
CONFIG_MPIPE_THREAD_STACK_SIZE=8192
