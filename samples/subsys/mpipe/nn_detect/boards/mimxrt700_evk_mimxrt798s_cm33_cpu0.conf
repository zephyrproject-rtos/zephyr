# The camera DMA and the NPU share buffers with the CPU without cache
# maintenance
CONFIG_DCACHE=n

# The camera delivers the 320x240 RGB565 frames the face detector was trained
# on; no scaling, no rotation
CONFIG_VIDEO_FRAME_WIDTH=320
CONFIG_VIDEO_FRAME_HEIGHT=240
CONFIG_VIDEO_PIXEL_FORMAT="RGBP"

# Video buffers of every pool in the image, in the on-chip SRAM partition the
# board overlay declares: the camera's own two plus the frames held in the two
# queues, the overlay's copy and the frame kept on screen; 153600 bytes each
# plus the heap's overhead
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=6
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=987136
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM_SHARED0"

# The 512 KB main SRAM holds one 320x240x3 tensor and one output buffer: the
# converter drops the frames that arrive while the runner holds the tensor
CONFIG_MPIPE_NN_CONVERTER_POOL_NUM=1
CONFIG_MPIPE_NN_RUNNER_POOL_NUM=1

CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=8192
CONFIG_MPIPE_THREAD_STACK_SIZE=8192
