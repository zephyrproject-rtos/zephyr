CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_MPIPE_NN_BACKEND_TFLM=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MPIPE_THREAD_STACK_SIZE=8192
CONFIG_MPIPE_PLAYER_WORKER_STACK_SIZE=8192

# Sized for either Ultraface face detector of the NXP eIQ Model Zoo: a
# 320x240x3 int8 input tensor at most, one 4420x6 output tensor at most, and
# the arena of the 320x240 model on the CPU; the 128x128 model needs less
CONFIG_MPIPE_NN_CONVERTER_MAX_TENSOR_SIZE=230400
CONFIG_MPIPE_NN_RUNNER_MAX_OUT_SIZE=32768
CONFIG_SAMPLE_NN_ARENA_SIZE=1400000
