CONFIG_LOG=y

CONFIG_MPIPE=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=3
# Pipeline thread + 2 queue threads
CONFIG_MPIPE_THREADS_NUM=3
CONFIG_MPIPE_BASE=y
CONFIG_MPIPE_BASE_CAPS_FILTER=y
CONFIG_MPIPE_BASE_QUEUE=y
CONFIG_MPIPE_BASE_TEE=y
CONFIG_MPIPE_FS=y
CONFIG_MPIPE_IMG=y
CONFIG_MPIPE_DISP=y
CONFIG_MPIPE_PLAYER=y
# 2 in each queue + 1 partial + 1 in-flight = 6.
CONFIG_MPIPE_NET_BUF_POOL_COUNT=6
CONFIG_MPIPE_IMG_JPEG_PARSER_POOL_NUM=6
# Largest estimated size for 320x240 JPEG image
CONFIG_MPIPE_IMG_JPEG_PARSER_MAX_FRAME_SIZE=153600

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y

# The source reads the input file on the pipeline thread while the file_sink
# writes on a queue thread, both on the same FAT volume. FatFs shares one
# sector window per volume, so concurrent access needs the re-entrancy option.
# Re-entrancy cannot use the LFN buffer in BSS; the stack mode costs
# (MAX_LFN + 1) * 2 bytes on the stack of every thread entering the filesystem.
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y

# The bus carries end-of-stream and errors, never data: it needs neither
# zbus priority boost nor zbus logging of its own.
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
