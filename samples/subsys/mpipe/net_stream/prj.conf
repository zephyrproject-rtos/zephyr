CONFIG_LOG=y

CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

CONFIG_MPIPE=y
CONFIG_MPIPE_FS=y
CONFIG_MPIPE_NET=y
CONFIG_MPIPE_STRUCTURE_MAX_FIELDS=1
CONFIG_ZBUS_MSG_SUBSCRIBER=y

# The bus only carries end-of-stream and errors
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_LOG_LEVEL_ERR=y
