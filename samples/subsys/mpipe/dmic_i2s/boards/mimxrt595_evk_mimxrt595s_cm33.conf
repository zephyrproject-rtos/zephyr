CONFIG_I3C=y
CONFIG_AUDIO_CODEC=y

# The DMIC holds CONFIG_DMIC_MCUX_DMA_BUFFERS=2 blocks for its DMA ring, a full
# CONFIG_DMIC_MCUX_QUEUE_SIZE=8 receive queue alongside them and one more while it
# rotates. The I2S sink primes three, and one more is in transit on the pipeline
# thread - 15 in all.
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=4096
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=15

CONFIG_USE_I2S_TARGET_CODEC_CONTROLLER=y

# The I2S codec sink primes AUD_I2S_SINK_START_PRIME (3) writes into the I2S TX
# queue before issuing I2S_TRIGGER_START. The TX in_queue must therefore be able
# to hold at least that many buffers, otherwise the priming writes block on a
# full queue, START never fires, and the shared buffer pool drains.
CONFIG_I2S_MCUX_FLEXCOMM_TX_BLOCK_COUNT=4
