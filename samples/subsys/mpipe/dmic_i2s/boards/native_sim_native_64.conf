CONFIG_AUDIO_CODEC=y
CONFIG_AUDIO_CODEC_DUMMY=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NATIVE_SIM=y
CONFIG_I2S=y
CONFIG_I2S_NATIVE_SIM=y

# Both emulated devices queue eight blocks (CONFIG_AUDIO_DMIC_NATIVE_SIM_QUEUE_SIZE=8):
# the microphone holds its queue plus the one it is filling, the I2S sink holds its queue,
# and one more is in transit on the pipeline thread - 18 in all.
CONFIG_MPIPE_AUD_BUFFER_POOL_NUM_MAX=18
CONFIG_MPIPE_AUD_BUFFER_POOL_SZ_MAX=4096

CONFIG_I2S_NATIVE_SIM_TX_FILE_PATH="build/native_sim_audio_pipeline_tx.pcm"
