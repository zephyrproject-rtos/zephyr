sample:
  name: Audio loopback pipeline sample

tests:
  sample.mpipe.audio_loopback:
    tags:
      - mpipe
      - audio
      - samples
    platform_allow:
      - mimxrt685_evk/mimxrt685s/cm33
      - mimxrt1170_evk@B/mimxrt1176/cm7
      - mimxrt595_evk/mimxrt595s/cm33
      - mcx_n5xx_evk/mcxn547/cpu0
      - native_sim/native/64
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Capture started"
  sample.mpipe.audio_loopback.i2s_src:
    tags:
      - mpipe
      - audio
      - samples
    platform_allow:
      - mimxrt685_evk/mimxrt685s/cm33
      - mimxrt1170_evk@B/mimxrt1176/cm7
      - mimxrt595_evk/mimxrt595s/cm33
      - mcx_n5xx_evk/mcxn547/cpu0
      - native_sim/native/64
    extra_configs:
      - CONFIG_SAMPLE_AUDIO_SOURCE_I2S=y
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Capture started"
