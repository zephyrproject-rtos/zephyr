sample:
  name: IPC Forwarder
  description: Sample application demonstrating Zbus IPC forwarder functionality.
common:
  tags:
    - zbus
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - ".* ZBUS Proxy agent IPC Forwarder Sample Application"
      - ".* Requesting on channel request_channel, listening on channel response_channel"
      - ".* Published on channel request_channel. Test Value=1"
      - ".* Received message on channel response_channel. Test Value=2"

tests:
  sample.zbus.proxy_agent_ipc:
    sysbuild: true
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s3_devkitc/esp32s3/procpu
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf5340dk/nrf5340/cpuapp
    integration_platforms:
      - esp32_devkitc/esp32/procpu
      - nrf54l15dk/nrf54l15/cpuapp
    extra_args:
      - platform:nrf54l15dk/nrf54l15/cpuapp:proxy_agent_ipc_SNIPPET=nordic-flpr
      - platform:nrf54lm20dk/nrf54lm20a/cpuapp:proxy_agent_ipc_SNIPPET=nordic-flpr
