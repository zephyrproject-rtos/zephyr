# The benchmark demo builds far more widgets than the sample default covers,
# and runs out of objects part way through the scene list.
CONFIG_LV_Z_MEM_POOL_SIZE=262144

# Flushing a frame is a copy this panel cannot do inside the render loop, so
# it runs on its own thread.
CONFIG_LV_Z_FLUSH_THREAD=y

# Rendering a demo scene keeps the CPU busy for long stretches, and the input
# thread runs at the lowest priority by default, so it does not get to drain
# the queue until the frame is done and the touches are dropped by then.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64
