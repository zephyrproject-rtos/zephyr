CONFIG_LV_Z_DEMO_BENCHMARK=y
CONFIG_LV_USE_PERF_MONITOR=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_USER=y

CONFIG_MAIN_STACK_SIZE=16384

# Render at the panel's native RGB888 straight into the host framebuffers,
# so presenting a frame swaps a buffer instead of copying one.
CONFIG_LV_COLOR_DEPTH_24=y
CONFIG_LV_Z_BUFFER_ALLOC_DISPLAY=y

# Redraw only the areas that changed into the whole screen buffers, which the
# driver still presents whole, so no partial presentation is needed.
CONFIG_LV_Z_DIRECT_RENDERING=y

# The pool is linked into .lvgl_heap, which the SoC linker script places in
# external RAM, so it is not bound by internal SRAM. At 1024x600 the software
# renderer allocates sizeable intermediate buffers for the transform and arc
# paths the PPA cannot take, and exhausting the pool faults inside them.
CONFIG_LV_Z_MEMORY_POOL_CUSTOM_SECTION=y
CONFIG_LV_Z_MEM_POOL_SIZE=2097152

# Flush from the LVGL thread. The flush thread hands the buffer to the driver
# from a second thread and never calls lv_display_flush_ready(), so LVGL is
# free to render the next frame into a buffer the driver has not finished
# presenting, which shows as whole-screen flicker on this panel.
CONFIG_LV_Z_FLUSH_THREAD=n

# Layer chunks are drawn in software, so an undersized buffer splits every
# layered draw into many passes. LVGL asks for about a twentieth of the
# screen; the default 24 KB is a seventy-fifth of this 1024x600 RGB888 panel.
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=98304

# Offload LVGL fill/image-blend to the P4 PPA 2D engine. The PPA reads/writes
# the draw buffers via 2D-DMA, so they must be L2-cache-line (64B) aligned.
# The render buffers are the host framebuffers, which the MIPI-DSI driver
# already allocates 64-byte aligned, so only the draw-buffer alignment that
# LVGL applies itself needs setting here.
CONFIG_LV_Z_DRAW_PPA_ESP32=y
CONFIG_LV_DRAW_BUF_ALIGN=128

# The framebuffers live in external RAM, so every rendered pixel crosses the
# PSRAM bus. The largest L2 cache keeps far more of that traffic on chip and
# is worth well over a quarter of the frame rate here. It is carved out of
# internal SRAM, which is why the system heap below is smaller than the
# default would be. A 512 KB cache uses 128-byte lines, and the PPA requires
# the draw buffer alignment to match the line size.
CONFIG_ESP32_CACHE_L2_512KB=y

# Rendering a demo scene keeps the CPU busy for long stretches, and the input
# thread runs at the lowest priority by default, so it does not get to drain
# the queue until the frame is done and the touches are dropped by then.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=-1
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64

CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=y

# Expose the PPA-accelerated ceiling: shorter refresh period
CONFIG_LV_DEF_REFR_PERIOD=16

# Real CPU-load measurement so the perf monitor CPU% is meaningful
CONFIG_CPU_LOAD=y
