CONFIG_LOG=y
CONFIG_ESPI_VIRTUAL_WIRE_TIMEOUT=30000
CONFIG_ESPI_PERIPHERAL_DEBUG_PORT_80=y
CONFIG_ESPI_PERIPHERAL_HOST_IO=y
CONFIG_ESPI_OOB_CHANNEL=y

# eSPI depends on the flash device (flash-dev). The RAM flash simulator inits
# at CONFIG_FLASH_INIT_PRIORITY (POST_KERNEL+50), so eSPI must init after it.
CONFIG_ESPI_INIT_PRIORITY=60
