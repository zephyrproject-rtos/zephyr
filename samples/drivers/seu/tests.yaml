sample:
  description: SEU driver sample application
  name: seu
tests:
  sample.drivers.seu:
    platform_allow:
      - intel_socfpga_agilex5_socdk
    integration_platforms:
      - intel_socfpga_agilex5_socdk
    tags:
      - seu
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "SEU Test Started"
        - "The Client No is 0x[0-9a-fA-F]+"
        - "The Client No is 0x[0-9a-fA-F]+"
        - "SEU Safe Error Insert Test Started"
        - "The SEU Error Type: [0-9]+:"
        - "The Sector Address: [0-9]+"
        - "The Correction status: [0-9]+"
        - "The row frame index: [0-9]+"
        - "The bit position: [0-9]+"
        - "SEU Safe Error Insert Test Completed"
        - "Read SEU Statistics Test Started"
        - "The value of t_seu_cycle : 0x[0-9a-fA-F]+"
        - "The value of t_seu_detect : 0x[0-9a-fA-F]+"
        - "The value of t_seu_correct : 0x[0-9a-fA-F]+"
        - "The value of t_seu_inject_detect : 0x[0-9a-fA-F]+"
        - "The value of t_sdm_seu_poll_interval : 0x[0-9a-fA-F]+"
        - "The value of t_sdm_seu_pin_toggle_overhead : 0x[0-9a-fA-F]+"
        - "Read SEU Statistics Test Completed"
        - "Read ECC Error Test Started"
        - "The (SEU|ECC) Error Type: [0-9]+:"
        - "The Sector Address: [0-9]+"
        - "The Correction status: [0-9]+"
        - "(The row frame index: [0-9]+|Ram Id: [0-9]+)"
        - "Read ECC Error Test Completed"
        - "SEU Test Completed"
