# The sample draws into a buffer it allocates from the system heap, which is
# a full 1024 pixel row band on this panel.
CONFIG_HEAP_MEM_POOL_SIZE=393216

# The scanout DMA reads the framebuffer, so writes to it have to land on
# whole cache lines.
CONFIG_SAMPLE_BUFFER_ADDR_ALIGN=128
