sample:
  name: MSPI Throughput Sample
common:
  tags:
    - mspi
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "=== MSPI Throughput Test Complete ==="
tests:
  sample.drivers.mspi.throughput:
    platform_allow:
      - nrf7120dk/nrf7120/cpuapp
      - nrf7120dk/nrf7120e/cpuapp
  sample.drivers.mspi.throughput.bitbang:
    filter: dt_compat_enabled("zephyr,mspi-bitbang-controller")
    platform_allow:
      - stm32h573i_dk
    extra_args:
      - FILE_SUFFIX="bitbang"
