sample:
  name: SFP pluggable module
tests:
  sample.drivers.sfp:
    tags:
      - sfp
      - drivers
    platform_allow:
      - native_sim
      - native_sim/native/64
      - qemu_cortex_m3
    integration_platforms:
      - native_sim
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Vendor     : ACME PHOTONICS"
        - "Temperature: 45.500 C"
        - "Done"
