sample:
  description: Demonstration of the PWM LED driver
  name: PWM LED sample
common:
  tags: LED
  depends_on: pwm
  timeout: 60
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "Testing LED \\d+"
      - "Turned on"
      - "Turned off"
      - "Increasing brightness gradually"
      - "Decreasing brightness gradually"
      - "Blinking on: ([0-9]+) msec, off: ([0-9]+) msec"
      - "(Blinking on: ([0-9]+) msec, off: ([0-9]+) msec|Cycle period not supported)"
      - "Turned off, loop end"
tests:
  sample.drivers.led.led_pwm:
    filter: dt_compat_enabled("pwm-leds")
    platform_exclude: reel_board
    integration_platforms:
      - frdm_k22f
  sample.drivers.led.led_pwm.stm32_lptim:
    filter: dt_compat_enabled("st,stm32-lptim-pwm")
    platform_allow: nucleo_u575zi_q
    integration_platforms:
      - nucleo_u575zi_q
    extra_args: EXTRA_DTC_OVERLAY_FILE="boards/nucleo_u575zi_q_lptim.overlay"
