# Logging
CONFIG_LOG=y
# Dry run spits out a lot of messages - avoid dropping any due to buffering
CONFIG_LOG_MODE_IMMEDIATE=y

# Required drivers
CONFIG_CHARGER=y
CONFIG_MFD=y
CONFIG_OTP=y
CONFIG_SENSOR=y

CONFIG_OTP_PROGRAM=y
# Dry run programming by default for safety - change at your own risk
CONFIG_OTP_NPM10XX_DRY_RUN=y
