# ADC resolution for conversions.
# Supported ADC resolutions are 8, 10 and 12 bits.
CONFIG_SEQUENCE_RESOLUTION=12

# Number of samples in an ADC sequence.
CONFIG_SEQUENCE_SAMPLES=4

# Enable DMA support.
CONFIG_ADC_LPF3_DMA_DRIVEN=y

CONFIG_DEBUG=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PRINTK=y
CONFIG_THREAD_NAME=y

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

CONFIG_IDLE_STACK_SIZE=4096
