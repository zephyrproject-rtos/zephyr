sample:
  name: ESP32 IPM Sample
tests:
  sample.drivers.ipm.ipm_esp32:
    platform_allow:
      - esp32_devkitc/esp32/procpu
    tags:
      - samples
      - ipm
    sysbuild: true
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "PRO_CPU is sending a request, waiting remote response"
        - "PRO_CPU received a message from APP_CPU : APP_CPU uptime ticks [0-9]+"
