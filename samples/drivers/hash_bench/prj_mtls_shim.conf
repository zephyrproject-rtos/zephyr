CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=2048

# Default CONFIG_MAIN_STACK_SIZE (1024) is too small for mbedTLS SHA-3
# (Keccak) hashing and silently overflows, corrupting the stack below
# main()'s own return address; the corruption only faults once main()
# actually returns, well after every BENCH line has printed correctly.
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_CRYPTO_MBEDTLS_SHIM=y
