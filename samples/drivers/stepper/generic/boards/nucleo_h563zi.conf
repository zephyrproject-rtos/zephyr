# Default CONFIG_STEP_INTERVAL_NS (1ms/microstep) turns the motor far too
# slowly for StallGuard's back-EMF-based load estimate to produce a meaningful
# signal. 50us/microstep, together with the 16 microsteps/step set in the
# overlay, was measured on hardware to give a usable signal (TSTEP 400 fCLK
# cycles at 16 MHz).
CONFIG_STEP_INTERVAL_NS=50000
