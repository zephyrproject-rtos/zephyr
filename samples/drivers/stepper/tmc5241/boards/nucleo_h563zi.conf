# Arm the StallGuard stall stop above this velocity, in the chip's velocity
# units (v[Hz] = v * fCLK / 2^24, so 85000 is about 81k microsteps/s with a
# 16 MHz clock). It must be below the cruise speed of vmax = 100000 and above
# the acceleration phase, where the chip's stall output is disabled anyway
# (tcoolthrs = 200 enables it above about 84000).
CONFIG_STALLGUARD_THRESHOLD_VELOCITY=85000
