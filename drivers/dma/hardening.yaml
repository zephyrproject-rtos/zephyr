# Security hardening database fragment for DMA drivers.

rules:
  DMA_INTEL_ADSP_GPDMA_DEBUG:
    value: n
    profiles: [strict]
    rationale: |
      Extra DMA driver debug output discloses internal transfer state and addresses.
    references: [CWE-200]
