# Security hardening database fragment for eSPI drivers.

rules:
  ESPI_PERIPHERAL_DEBUG_PORT_80:
    value: n
    rationale: |
      Exposes the host's POST-code debug port through the eSPI peripheral, giving an observer a side
      channel into host boot progress.
    references: [CWE-200]
