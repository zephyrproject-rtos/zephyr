# Security hardening database fragment for the Arm architecture.

rules:
  CORTEX_M_DEBUG_MONITOR_HOOK:
    value: n
    rationale: |
      Enables monitor-mode debugging: breakpoints raise a lowest-priority interrupt instead of
      faulting and halting the core, so the image ships with a handler that lets a debug probe
      inspect and step through the program while it runs.
    references: [CWE-1244]

  FAULT_DUMP:
    value: 0
    profiles: [strict]
    rationale: |
      Prints registers and fault state to the console when a fatal error occurs, exposing internal
      state to anyone with console access; level 0 suppresses the dump entirely.
    references: [CWE-209]

  MPU_ALLOW_FLASH_WRITE:
    value: n
    rationale: |
      Maps the flash region writable as well as executable in the MPU, so a stray or
      attacker-directed store into code memory no longer faults. On ARMv8 MPUs the write permission
      also extends to unprivileged threads.
    references: [CWE-119]
