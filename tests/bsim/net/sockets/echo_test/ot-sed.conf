# Applied on top of overlay-ot.conf: run the echo client as a Thread
# Sleepy End Device, so its radio sleeps between transmissions.

CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=50

# A child can register only one mesh-local address with its parent, its
# ML-EID. The static address of overlay-ot.conf is in the mesh-local prefix,
# so the parent would reject it and not forward the echo replies to it.
CONFIG_NET_CONFIG_MY_IPV6_ADDR=""
