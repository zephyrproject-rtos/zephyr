CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="HOGP tester"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# HID Device side
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_OUTPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_FEATURE_REPORT_COUNT=2
CONFIG_BT_HIDS_MAX_REPORT_LEN=256

# HID Host side
CONFIG_BT_HOGP_HOST=y
# Exactly the long Feature Report, which takes a Read Long
CONFIG_BT_HOGP_HOST_MAX_REPORT_LEN=200

CONFIG_BT_MAX_PAIRED=2

CONFIG_BT_L2CAP_TX_MTU=140
CONFIG_BT_BUF_ACL_TX_SIZE=144
CONFIG_BT_BUF_ACL_RX_SIZE=144

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_BT_HOGP_HOST_LOG_LEVEL_DBG=y
