CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="bsim_test_frame_space"
CONFIG_BT_GATT_CLIENT=y

# PHY and connection parameter updates are initiated by the test
CONFIG_BT_USER_PHY_UPDATE=y
