common:
  tags:
    - bluetooth
  depends_on: bsim
  harness: bsim

tests:
  bluetooth.controller.frame_space:
    platform_allow:
      - nrf52_bsim
      - nrf5340bsim/nrf5340/cpunet
      - nrf54l15bsim/nrf54l15/cpuapp
    harness_config:
      fixture: bsim_multi_test
      bsim_exe_name: tests_bsim_bluetooth_ll_frame_space_prj_conf
      tests_scripts:
        - tests_scripts/frame_space.sh

  bluetooth.controller.frame_space.tifs_hw:
    platform_allow:
      - nrf52_bsim
      - nrf5340bsim/nrf5340/cpunet
      - nrf54l15bsim/nrf54l15/cpuapp
    extra_overlay_confs:
      - overlay-tifs_hw.conf
    harness_config:
      fixture: bsim_multi_test
      bsim_exe_name: tests_bsim_bluetooth_ll_frame_space_prj_conf_overlay-tifs_hw_conf
      tests_scripts:
        - tests_scripts/frame_space_tifs_hw.sh

  bluetooth.controller.frame_space.pllen:
    platform_allow:
      - nrf54l15bsim/nrf54l15/cpuapp
    extra_overlay_confs:
      - overlay-pllen.conf
    harness_config:
      fixture: bsim_multi_test
      bsim_exe_name: tests_bsim_bluetooth_ll_frame_space_prj_conf_overlay-pllen_conf
      tests_scripts:
        - tests_scripts/frame_space_pllen.sh
