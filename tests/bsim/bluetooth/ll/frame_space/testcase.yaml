common:
  build_only: true
  tags:
    - bluetooth
    - bsim_multi
  platform_allow:
    - nrf52_bsim/native
    - nrf5340bsim/nrf5340/cpunet
    - nrf54l15bsim/nrf54l15/cpuapp
  integration_platforms:
    - nrf52_bsim/native
  harness: bsim

tests:
  bluetooth.ll.frame_space:
    harness_config:
      bsim_exe_name: tests_bsim_bluetooth_ll_frame_space_prj_conf
  bluetooth.ll.frame_space.tifs_hw:
    extra_args: EXTRA_CONF_FILE=overlay-tifs_hw.conf
    harness_config:
      bsim_exe_name: tests_bsim_bluetooth_ll_frame_space_prj_conf_overlay-tifs_hw_conf
