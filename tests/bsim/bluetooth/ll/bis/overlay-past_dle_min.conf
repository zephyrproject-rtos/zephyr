# PAST at the minimum data length: no Data Length Extension (DLE) beyond the
# default 27 octets, so LL_PERIODIC_SYNC_IND (35 octets) does not fit a single
# PDU on this link. Undoes prj_past.conf's 251-octet buffers and data length.
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27
