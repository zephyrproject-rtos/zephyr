# Connected ISO on the PAST sender only. Its control PDU maximum is then that of
# cis_req (36 octets), which holds LL_PERIODIC_SYNC_IND (35) whether or not the
# maximum covers it, so the sender sends the PDU whole. The receiver is built
# without it, so past_dle_min_rx.sh tests the receive maximum on its own.
CONFIG_BT_ISO_CENTRAL=y
