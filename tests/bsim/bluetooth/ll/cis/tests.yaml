common:
  timeout: 300
  tags:
    - bluetooth
  depends_on: bsim
  harness: bsim
  platform_allow:
    - nrf52_bsim/native
    - nrf5340bsim/nrf5340/cpunet

tests:
  bluetooth.ll.cis.sequential:
    extra_overlay_confs:
      - overlay-sequential.conf
    harness_config:
      fixture: bsim_multi_test
      bsim_exe_name: tests_bsim_bluetooth_ll_cis_prj_conf_overlay-sequential_conf
      tests_scripts:
        - tests_scripts/connected_iso_sequential.sh

