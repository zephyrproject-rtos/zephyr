CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="LL ext adv"
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_CTLR_SCAN_REQ_NOTIFY=y
CONFIG_ASSERT=y

# With a single buffer, setting the scan response data of a scannable
# extended advertising set waits for a free PDU buffer that never comes
CONFIG_BT_CTLR_ADV_DATA_BUF_MAX=2
