# Test-only entropy shim (zephyrproject-rtos/zephyr#126663):
# the first get_entropy_isr() call without ENTROPY_BUSYWAIT delivers half the
# requested bytes; subsequent calls are served from a refilled pool.
# The vendor LLL shall not select the nRF RNG driver for the shim node.
CONFIG_BT_CTLR_ENTROPY=n
CONFIG_BT_CTLR_TEST_ENTROPY_SHIM=y
CONFIG_BT_CTLR_TEST_ENTROPY_SHIM_ISR_SHORT_READ=y
