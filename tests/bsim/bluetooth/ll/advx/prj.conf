CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="AdvX"
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=y

CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_PER_ADV_SYNC=y

CONFIG_BT_ID_MAX=2
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_PER_ADV_SYNC_MAX=2

CONFIG_BT_CTLR_PRIVACY=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_PERIODIC=y
CONFIG_BT_CTLR_SYNC_PERIODIC=y

CONFIG_ASSERT=y

# The scan requests come from the identity address that the directed
# advertising of the scan request test is sent to
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_SCAN_EXT_FILTER_POLICY=y
CONFIG_BT_CTLR_SCAN_REQ_NOTIFY=y
CONFIG_BT_FILTER_ACCEPT_LIST=y

# With a single buffer, setting the scan response data of a scannable
# extended advertising set waits for a free PDU buffer that never comes
CONFIG_BT_CTLR_ADV_DATA_BUF_MAX=2
