CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="HIDS tester"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y

CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_OUTPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_FEATURE_REPORT_COUNT=2
# Holds the long Feature Report the Read Long tests use
CONFIG_BT_HIDS_MAX_REPORT_LEN=256
# The Device is both a boot keyboard and a boot mouse, so it has all three Boot
# Report characteristics. They select the Protocol Mode characteristic, which
# the test discovers and exercises.
CONFIG_BT_HIDS_BOOT_KEYBOARD=y
CONFIG_BT_HIDS_BOOT_MOUSE=y

CONFIG_BT_MAX_PAIRED=2

# The Report Map is read in a single ATT read
CONFIG_BT_L2CAP_TX_MTU=140
CONFIG_BT_BUF_ACL_TX_SIZE=144
CONFIG_BT_BUF_ACL_RX_SIZE=144

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_ASSERT=y
CONFIG_LOG=y
