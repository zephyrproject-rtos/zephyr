CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y

# Dependency of testlib/adv and testlib/scan.
CONFIG_BT_EXT_ADV=y

# The server takes two clients, and the shared prepare write pool gives each
# of them CONFIG_BT_ATT_PREPARE_COUNT / CONFIG_BT_MAX_CONN buffers, unless an
# overlay sets CONFIG_BT_ATT_PREPARE_COUNT_PER_CONN.
CONFIG_BT_MAX_CONN=2
CONFIG_BT_ATT_PREPARE_COUNT=6

CONFIG_LOG=y
CONFIG_ASSERT=y
