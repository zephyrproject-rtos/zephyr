CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="HOGP tester"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SMP=y
CONFIG_BT_HOGP_DEVICE=y
# The Battery Service, the Device Information Service and its PnP ID
# characteristic are selected by CONFIG_BT_HOGP_DEVICE
CONFIG_BT_HIDS_INPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_OUTPUT_REPORT_COUNT=1
CONFIG_BT_HIDS_FEATURE_REPORT_COUNT=1
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x2717
CONFIG_BT_DIS_PNP_PID=0x0001
CONFIG_BT_DIS_PNP_VER=0x0100
CONFIG_BT_MAX_PAIRED=2

# The Report Map is read in a single ATT read
CONFIG_BT_L2CAP_TX_MTU=98
CONFIG_BT_BUF_ACL_TX_SIZE=102
CONFIG_BT_BUF_ACL_RX_SIZE=102

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_BT_TESTING=y
