common:
  tags:
    - bluetooth
  depends_on: bsim
  platform_allow:
    - nrf52_bsim
    - nrf5340bsim/nrf5340/cpuapp
    - nrf54l15bsim/nrf54l15/cpuapp
  sysbuild: true
  build_only: true
  harness: bsim
  extra_args:
    - CONF_FILE=${ZEPHYR_BASE}/samples/bluetooth/audio/cap_handover/prj.conf
    - EXTRA_CONF_FILE="${ZEPHYR_BASE}/samples/bluetooth/audio/cap_handover/overlay-bt_ll_sw_split.conf"
    - platform:nrf5340bsim/nrf5340/cpuapp:EXTRA_CONF_FILE="${ZEPHYR_BASE}/samples/bluetooth/audio/cap_handover/boards/nrf5340_audio_dk_nrf5340_cpuapp.conf"
    # Note the last provided EXTRA_CONF_FILE definition will be used by cmake

tests:
  bluetooth.audio_samples.bsim.cap.handover.build:
    harness_config:
      bsim_exe_name: tests_bsim_bluetooth_audio_samples_cap_handover_prj_conf
