CONFIG_ZTEST=y
CONFIG_MP_MAX_NUM_CPUS=1

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_IRQ_STORM_DETECTION=y
CONFIG_IRQ_STORM_THRESHOLD=100
CONFIG_IRQ_STORM_WINDOW_MS=1000

# Needed by the PLIC-triggered storm test: it drives a real level-2
# interrupt (uart0's TX-holding-register-empty line) through the PLIC
# aggregator instead of the level-1 CLINT software interrupt.
CONFIG_UART_INTERRUPT_DRIVEN=y
