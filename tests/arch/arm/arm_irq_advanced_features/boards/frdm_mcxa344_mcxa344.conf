# The dynamic direct test uses TEST_DIRECT_IRQ_MAX - 1; its default selects
# reserved IRQ 121 on MCXA344, so can't use this default one.
# If use IRQ 120 for dynamic direct test, then zero-latency test
# will downward scan, to use the IRQ 119 (RTC), but the RTC time invalid
# interrupt is pending by default (TIF=1, TIIE=1, TCE=0), this will
# results in endless interrupt.
# Here use SMARTDMA (IRQ 108) instead for dynamic direct test. And leave
# IRQ 120 for zero latency test.
CONFIG_TEST_DIRECT_IRQ_MAX=109
