common:
  platform_allow: qemu_cortex_m3
  integration_platforms:
    - qemu_cortex_m3
  toolchain_allow: zephyr/gnu
  tags:
    - arm
    - devicetree
    - linker
tests:
  arch.arm.mapped_partition.execution:
    extra_args: DTC_OVERLAY_FILE=execution.overlay
  arch.arm.mapped_partition.execution.linker_generator:
    extra_args: DTC_OVERLAY_FILE=execution.overlay
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
  arch.arm.mapped_partition.unnamed:
    extra_args: DTC_OVERLAY_FILE=unnamed.overlay
  arch.arm.mapped_partition.unnamed.linker_generator:
    extra_args: DTC_OVERLAY_FILE=unnamed.overlay
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
  arch.arm.mapped_partition.named_storage:
    extra_args: DTC_OVERLAY_FILE=named_storage.overlay
  arch.arm.mapped_partition.named_storage.linker_generator:
    extra_args: DTC_OVERLAY_FILE=named_storage.overlay
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
