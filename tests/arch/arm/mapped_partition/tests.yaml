common:
  platform_allow: qemu_cortex_m3
  integration_platforms:
    - qemu_cortex_m3
  toolchain_allow: zephyr/gnu
  tags:
    - arm
    - devicetree
    - linker
tests:
  arch.arm.mapped_partition.execution:
    extra_args: DTC_OVERLAY_FILE=execution.overlay
  arch.arm.mapped_partition.execution.linker_generator:
    extra_args: DTC_OVERLAY_FILE=execution.overlay
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
  arch.arm.mapped_partition.execution.devnull:
    extra_args: DTC_OVERLAY_FILE=execution.overlay
    extra_configs:
      - CONFIG_LINKER_DEVNULL_MEMORY=y
  arch.arm.mapped_partition.unnamed:
    extra_args: DTC_OVERLAY_FILE=unnamed.overlay
  arch.arm.mapped_partition.unnamed.linker_generator:
    extra_args: DTC_OVERLAY_FILE=unnamed.overlay
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
  arch.arm.mapped_partition.larger_execution:
    extra_args: DTC_OVERLAY_FILE=larger_execution.overlay
  arch.arm.mapped_partition.larger_execution.linker_generator:
    extra_args: DTC_OVERLAY_FILE=larger_execution.overlay
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
  arch.arm.mapped_partition.storage_overflow:
    harness: ctest
    timeout: 120
    extra_args:
      - DTC_OVERLAY_FILE=larger_execution.overlay
      - TEST_OVERFLOW_CHECK=ON
  arch.arm.mapped_partition.storage_overflow.linker_generator:
    harness: ctest
    timeout: 120
    extra_args:
      - DTC_OVERLAY_FILE=larger_execution.overlay
      - TEST_OVERFLOW_CHECK=ON
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
  arch.arm.mapped_partition.swapped_names:
    harness: ctest
    timeout: 120
    extra_args:
      - DTC_OVERLAY_FILE=execution.overlay
      - TEST_ORDER_CHECK=ON
  arch.arm.mapped_partition.swapped_names.linker_generator:
    harness: ctest
    timeout: 120
    extra_args:
      - DTC_OVERLAY_FILE=execution.overlay
      - TEST_ORDER_CHECK=ON
    extra_configs:
      - CONFIG_CMAKE_LINKER_GENERATOR=y
