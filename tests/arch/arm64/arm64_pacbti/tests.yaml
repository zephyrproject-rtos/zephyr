common:
  tags:
    - arm64
    - pacbti
    - security
  timeout: 30
  # Pointer authentication and BTI violations are provoked on purpose.
  ignore_faults: true
  filter: CONFIG_ARMV9_A
  arch_allow:
    - arm64
tests:
  arch.arm64.pacbti:
    integration_platforms:
      - fvp_base_revc_2xaem/v9a
  arch.arm64.pacbti.user:
    integration_platforms:
      - fvp_base_revc_2xaem/v9a
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
