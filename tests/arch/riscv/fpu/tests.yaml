common:
  arch_allow: riscv
  tags:
    - arch
    - fpu
  filter: CONFIG_RISCV_ISA_EXT_ZFINX and CONFIG_FPU
  integration_platforms:
    - qemu_riscv32/qemu_virt_riscv32/zfinx
tests:
  arch.riscv.fpu: {}
  arch.riscv.fpu.sharing:
    extra_configs:
      - CONFIG_FPU_SHARING=y
  arch.riscv.fpu.sharing.ecall:
    extra_configs:
      - CONFIG_FPU_SHARING=y
      - CONFIG_RISCV_ALWAYS_SWITCH_THROUGH_ECALL=y
