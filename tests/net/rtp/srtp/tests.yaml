common:
  depends_on: netif
  tags:
    - net
    - rtp
    - psa
  platform_allow:
    - native_sim
    - native_sim/native/64

tests:
  net.rtp.srtp:
    extra_configs:
      - CONFIG_SRTP_REPLAY_WINDOW_SIZE=128
  net.rtp.srtp.small_window:
    extra_configs:
      - CONFIG_SRTP_REPLAY_WINDOW_SIZE=64
  # The malformed packet tests feed lengths read from untrusted headers;
  # check the parsing paths for out-of-bounds accesses.
  net.rtp.srtp.asan:
    extra_configs:
      - CONFIG_ASAN=y
