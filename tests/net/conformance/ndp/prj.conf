CONFIG_NETWORKING=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6=y
CONFIG_NET_SOCKETS=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_IPV6_DAD=y

# Room for a third address, and for the group that goes with it. The defaults
# leave none, so an address configured from an advertised prefix would have
# nowhere to go and the suite would see it silently not happen.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=4
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=5

# The neighbour cache is left at its default. Sending a solicitation takes a
# cache entry even when the address being asked about is the interface's own,
# so a small cache stops duplicate address detection from being sent at all.

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"
CONFIG_NET_CONFIG_NEED_IPV6_ROUTER=n

CONFIG_LOG=y
CONFIG_NET_LOG=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
