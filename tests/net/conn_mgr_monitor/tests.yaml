common:
  min_ram: 16
  depends_on: netif
  tags:
    - net
    - iface
tests:
  net.conn_mgr.nodad:
    extra_configs:
      - CONFIG_NET_IPV6_DAD=n
  net.conn_mgr.dad:
    extra_configs:
      - CONFIG_NET_IPV6_DAD=y
  net.conn_mgr.dns:
    extra_configs:
      - CONFIG_NET_IPV6_DAD=n
      - CONFIG_DNS_RESOLVER=y
      - CONFIG_DNS_RESOLVER_MAX_SERVERS=2
      - CONFIG_NET_MAX_CONTEXTS=8
  net.conn_mgr.dns.direct:
    extra_configs:
      - CONFIG_NET_IPV6_DAD=n
      - CONFIG_DNS_RESOLVER=y
      - CONFIG_DNS_RESOLVER_MAX_SERVERS=2
      - CONFIG_NET_MAX_CONTEXTS=8
      - CONFIG_NET_MGMT_EVENT_DIRECT=y
