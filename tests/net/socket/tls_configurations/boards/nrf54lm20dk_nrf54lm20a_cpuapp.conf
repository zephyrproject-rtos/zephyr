# Ethernet over USB (CDC NCM)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y

# Static address on the same subnet as the host side of the USB link
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.2"

CONFIG_SERVER_ADDR="192.0.2.1"

# The CDC NCM interface reports carrier as soon as it starts, before the host
# has enumerated the device and configured its side of the link, so connect()
# starts right after boot. The first ARP request for the server is lost, and
# SYN retransmissions are only queued behind it until the pending request
# expires after 2 seconds. The next SYN, about 3 seconds after connect()
# started, triggers a new ARP request that the host answers, but this races
# with the default 3 seconds connect timeout. Allow more time so that this
# SYN reliably completes the connection.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=6000
