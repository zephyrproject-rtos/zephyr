# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y

# Sockets
CONFIG_NET_SOCKETS=y

# Network driver config
CONFIG_TEST_RANDOM_GENERATOR=y

# Network address config
CONFIG_NET_CONFIG_SETTINGS=n

# HTTP & Websocket
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y

# websocket_connect() derives its key with PSA_ALG_SHA_1 but WEBSOCKET_CLIENT
# only selects PSA_WANT_ALG_SHA_256, so the handshake fails before the request
# is sent unless SHA-1 is asked for here.
CONFIG_PSA_WANT_ALG_SHA_1=y

# Each handshake test uses a listening, a client and an accepted socket, and
# they linger in TIME_WAIT afterwards, so the default pool of six contexts runs
# out part way through the suite.
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# Network debug config
CONFIG_NET_LOG=y
#CONFIG_NET_WEBSOCKET_LOG_LEVEL_DBG=y

# Generic options
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1500

# Test options
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=2048
