# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y

# Sockets
CONFIG_NET_SOCKETS=y

# Network driver config
CONFIG_TEST_RANDOM_GENERATOR=y

# Network address config
CONFIG_NET_CONFIG_SETTINGS=n

# HTTP & Websocket
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y

# Each handshake test uses a listening, a client and an accepted socket, and
# they linger in TIME_WAIT afterwards, so the default pool of six contexts runs
# out part way through the suite.
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

# TCP on this branch clones a queued segment each time it sends it, so a
# client and a server talking over loopback in one image need more packets
# than the default four.
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32

# Network debug config
CONFIG_NET_LOG=y
#CONFIG_NET_WEBSOCKET_LOG_LEVEL_DBG=y

# Generic options
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1500

# Test options
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=2048
