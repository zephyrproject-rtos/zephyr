CONFIG_ZTEST=y
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NATIVE_TAP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_IF_MAX_IPV4_COUNT=5
CONFIG_NET_IF_MAX_IPV6_COUNT=5
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=4
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_TC_TX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_WIREGUARD=y
CONFIG_WIREGUARD_MULTI_PEER=y
CONFIG_WIREGUARD_MAX_PEER=3
CONFIG_WIREGUARD_MAX_INTERFACES=1
CONFIG_WIREGUARD_MAX_SRC_IPS=2
CONFIG_WIREGUARD_BUF_COUNT=4
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=24576
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=48
CONFIG_MAIN_STACK_SIZE=4096
