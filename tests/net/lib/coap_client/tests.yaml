common:
  depends_on: netif
tests:
  net.coap.client:
    platform_allow:
      - native_sim
      - native_sim/native/64
    tags:
      - coap
      - net
  net.coap.client.no_multicast:
    platform_allow:
      - native_sim
    extra_args:
      - COAP_CLIENT_NO_MULTICAST=y
    tags:
      - coap
      - net
  net.coap.client.large_message:
    platform_allow:
      - native_sim
    extra_args:
      - COAP_CLIENT_MESSAGE_SIZE=512
    tags:
      - coap
      - net
