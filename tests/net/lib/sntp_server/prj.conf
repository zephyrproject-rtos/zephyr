CONFIG_ZTEST=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_ZVFS_POLL_MAX=8
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=8

# The server must build and work without the SNTP client
CONFIG_SNTP=n
CONFIG_SNTP_SERVER=y

CONFIG_NET_LOG=y
CONFIG_LOG=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
