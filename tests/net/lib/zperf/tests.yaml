common:
  depends_on: netif
  tags:
    - net
    - zperf
  platform_allow:
    - native_sim
    - native_sim/native/64
tests:
  net.zperf: {}
  net.zperf.iperf3:
    extra_configs:
      - CONFIG_NET_ZPERF_IPERF3=y
      # Short, so that the idle client test is quick, but longer than a
      # client is quiet during a test: at a coarse tick rate the UDP rate
      # control sends in bursts with long waits between them.
      - CONFIG_NET_ZPERF_IPERF3_IDLE_TIMEOUT=3
      # Each test opens a control and a data connection on both ends. Keep
      # closed ones from lingering in TIME_WAIT into the tests that follow.
      - CONFIG_NET_TCP_TIME_WAIT_DELAY=0
      - CONFIG_NET_MAX_CONTEXTS=16
      - CONFIG_NET_MAX_CONN=16
