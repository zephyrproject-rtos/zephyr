CONFIG_ZTEST=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# Bounds the test server's wait for a request.
CONFIG_NET_CONTEXT_RCVTIMEO=y

# sntp_simple() resolves the server name through getaddrinfo(), which is
# only built with the resolver. No DNS server is needed, the names
# under test are numeric.
CONFIG_DNS_RESOLVER=y

# Keeps QEMU boards on loopback instead of the SLIP driver, which needs
# a host socket no test runner provides.
CONFIG_NET_TEST=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_L2_ETHERNET=n

CONFIG_SNTP=y

CONFIG_NET_CONFIG_SETTINGS=y
# The tests drive net_config_init_clock_via_sntp() themselves.
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONFIG_CLOCK_SNTP_INIT=y
CONFIG_NET_CONFIG_SNTP_INIT_SERVER_RUNTIME=y
# Short enough that a test can exceed it without an unwieldy literal.
CONFIG_NET_CONFIG_SNTP_INIT_SERVER_MAX_LEN=16
# A name, not an address: the loopback driver answers a datagram whatever
# it is addressed to, so only a server that cannot be resolved at all is
# reliably distinguishable from the served one. No DNS server is
# configured, so resolving this fails.
CONFIG_NET_CONFIG_SNTP_INIT_SERVER="bad.invalid"
CONFIG_NET_CONFIG_SNTP_INIT_TIMEOUT=300
# Keeps the periodic work out of the way of the tests.
CONFIG_NET_CONFIG_SNTP_INIT_RESYNC=n

# Deliver the datagram in the sending context.
CONFIG_NET_TC_RX_COUNT=0

CONFIG_NET_UDP_CHECKSUM=n

CONFIG_MAIN_STACK_SIZE=3072
CONFIG_ZTEST_STACK_SIZE=3072
