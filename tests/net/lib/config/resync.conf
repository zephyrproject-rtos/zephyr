# Overlay for the resync scenario. The periodic resync is what is under test
# here, so unlike the base configuration it stays on.
CONFIG_NET_CONFIG_SNTP_INIT_RESYNC=y

# The shortest intervals the options allow: one test has to sit out a whole
# interval to see the resync come back on its own.
CONFIG_NET_CONFIG_SNTP_INIT_RESYNC_INTERVAL=15
CONFIG_NET_CONFIG_SNTP_INIT_RESYNC_ON_FAILURE_INTERVAL=15

# Wide enough that a test can reliably get a second request in while a
# silenced query is still waiting on this timeout.
CONFIG_NET_CONFIG_SNTP_INIT_TIMEOUT=500

# The resync runs DNS and socket work on these two threads instead of on the
# test thread, and neither default stack is sized for it.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048

# The tests raise no L4 events, so nothing would ever enable the resync.
CONFIG_NET_CONFIG_SNTP_INIT_USE_CONNECTION_MANAGER=n
