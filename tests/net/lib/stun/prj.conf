CONFIG_ZTEST=y
# The tests keep whole messages on the stack: a test and the helper it calls
# hold a 1200-byte buffer each, and the HMAC runs under them. About 4 KB at
# the deepest.
CONFIG_ZTEST_STACK_SIZE=8192
# Zephyr calls psa_crypto_init() at boot on the main thread. On a board without
# an entropy driver Mbed TLS seeds its random generator there, and the default
# stack is too small for that.
CONFIG_MAIN_STACK_SIZE=2048

# The library is a network library, but it needs no interface and no driver.
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# Nothing else is asked for: the library enables the PSA algorithms and the
# CRC it needs.
CONFIG_STUN=y
