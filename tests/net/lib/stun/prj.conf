CONFIG_ZTEST=y
# The tests keep whole messages on the stack, and so does the HMAC under them.
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192

# The library is a network library, but it needs no interface and no driver.
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# Nothing else is asked for: the library selects the PSA algorithms and the
# CRC it needs.
CONFIG_STUN=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
