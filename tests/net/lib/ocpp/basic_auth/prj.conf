CONFIG_ZTEST=y

# The OCPP library needs the websocket client and its network stack to build.
# The test calls the header builder only and does not use the network.
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_HTTP_CLIENT=y
CONFIG_WEBSOCKET_CLIENT=y
CONFIG_JSON_LIBRARY=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_OCPP=y
CONFIG_OCPP_BASIC_AUTH=y
