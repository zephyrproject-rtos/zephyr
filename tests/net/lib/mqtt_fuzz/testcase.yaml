common:
  tags:
    - net
    - mqtt
    - fuzz
  depends_on: netif
tests:
  net.mqtt.fuzz:
    toolchain_allow: llvm
    platform_allow: native_sim/native/64
    harness: console
    harness_config:
      type: one_line
      # The harness prints this banner from main() once the simulated OS
      # has booted, which is enough to confirm the fuzz target links and
      # starts.  Actual crash detection is libFuzzer's job, not twister's.
      regex:
        - "MQTT fuzzer starting"
