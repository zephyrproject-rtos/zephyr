CONFIG_ARCH_POSIX_LIBFUZZER=y

CONFIG_NET_SOCKETS=y
# Enable network stack
CONFIG_NETWORKING=y

# Keep the console quiet.  Malformed input is the norm rather than the
# exception here, so the MQTT receive path logs a warning or error for
# nearly every fuzz case.  Left enabled, a one minute run emits roughly
# two million lines, which buries libFuzzer's own output and costs about
# half the achievable execution rate.
CONFIG_LOG=n

# Enable IPv4
CONFIG_NET_IPV4=y

# Enable IPv6
CONFIG_NET_IPV6=y

# Enable TCP
CONFIG_NET_TCP=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_CUSTOM_TRANSPORT=y
CONFIG_MQTT_VERSION_5_0=y