# Setup for self-contained net testing without requiring a SLIP driver
CONFIG_NET_TEST=y

CONFIG_REQUIRES_FULL_LIBC=y

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_ND=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8

# The code under test
CONFIG_SOCKS=y
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Network driver config
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Keep the failure paths quick and make sure a closed port is reusable
CONFIG_NET_TCP_RETRY_COUNT=3
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=500
CONFIG_NET_TCP_TIME_WAIT_DELAY=250

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=2048

# If you want to debug the tests, you can get logging using these statements
#CONFIG_LOG=y
#CONFIG_LOG_MODE_IMMEDIATE=y
#CONFIG_NET_LOG=y
#CONFIG_SOCKS_LOG_LEVEL_DBG=y
