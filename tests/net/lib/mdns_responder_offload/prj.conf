# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y

# Use the host network stack through offloaded sockets (NSOS) instead of the
# native TAP driver. The mDNS responder then binds host sockets and joins the
# mDNS multicast group on the host, so a host-side query can reach it.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=10

# mDNS responder with a DNS-SD service, answering for "zephyr.local".
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="zephyr"
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y

# Logging (the ready marker printed by the app).
CONFIG_LOG=y
