common:
  tags:
    - net
    - mqtt
  depends_on: netif
  min_ram: 16
tests:
  net.mqtt.client:
    extra_configs:
      - CONFIG_NET_TC_THREAD_COOPERATIVE=y
  net.mqtt.client.preempt:
    extra_configs:
      - CONFIG_NET_TC_THREAD_PREEMPTIVE=y
  net.mqtt.client.mqtt_5_0:
    extra_configs:
      - CONFIG_MQTT_VERSION_5_0=y
  net.mqtt.client.tls:
    min_ram: 64
    platform_allow:
      - native_sim
      - qemu_x86
    integration_platforms:
      - native_sim
    extra_conf_files:
      - tls.conf
