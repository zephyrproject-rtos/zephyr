# Names are resolved by the server of the test, over the loopback interface.
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="127.0.0.1:15353"

# The server of the test polls four sockets: STUN over IPv4 and IPv6, the other
# port and DNS.
CONFIG_ZVFS_POLL_MAX=4

# The resolver and the DNS port of the server take network contexts too.
CONFIG_NET_MAX_CONTEXTS=8
