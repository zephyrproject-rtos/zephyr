CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_ZVFS_EVENTFD=y
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_LWM2M=y
# Two pendings in total, so a third separate response cannot be sent
CONFIG_LWM2M_ENGINE_MAX_PENDING=1
CONFIG_LWM2M_TICKLESS=y
CONFIG_LWM2M_COAP_DEDUP_CACHE_SIZE=2
# Gateway callback: the only way to get a large response for a non-read
CONFIG_LWM2M_GATEWAY_OBJ_SUPPORT=y
CONFIG_LWM2M_COAP_DEDUP_LIFETIME=5
