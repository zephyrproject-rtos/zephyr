common:
  depends_on: netif
  min_ram: 256
  tags:
    - net
    - udp
    - gso
tests:
  net.gso: {}
  net.gso.variable_bufs:
    extra_configs:
      - CONFIG_NET_BUF_VARIABLE_DATA_SIZE=y
      - CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=65536
      - CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=32768
  net.gso.rejected_options:
    extra_configs:
      - CONFIG_NET_UDP_OPTIONS=y
      - CONFIG_NET_PKT_TIMESTAMP=y
      - CONFIG_NET_CONTEXT_TIMESTAMPING=y
