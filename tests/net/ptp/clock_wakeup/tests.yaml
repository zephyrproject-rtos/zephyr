common:
  tags:
    - net
    - ptp
    - unit
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  depends_on: netif
tests:
  net.ptp.clock_wakeup: {}
  net.ptp.clock_wakeup.outlier_threshold:
    extra_configs:
      - CONFIG_PTP_SERVO_OUTLIER_THRESHOLD_MS=60
  net.ptp.clock_wakeup.scaled_gains:
    extra_configs:
      - CONFIG_PTP_SERVO_SCALE_GAINS_BY_SYNC_INTERVAL=y
