common:
  depends_on: netif
tests:
  net.shell:
    min_ram: 20
    tags:
      - net
      - net-shell
  net.shell.http_client:
    min_ram: 32
    tags:
      - net
      - net-shell
    extra_configs:
      - CONFIG_HTTP_CLIENT=y
      - CONFIG_NET_SOCKETS=y
      - CONFIG_ZTEST_STACK_SIZE=4096
      # The shell would treat the '?' of a URL query as a wildcard.
      - CONFIG_SHELL_WILDCARD=n
