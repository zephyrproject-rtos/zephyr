common:
  depends_on: netif
  tags:
    - net
    - cpp
  integration_platforms:
    - native_sim
    - qemu_x86
tests:
  net.cpp.headers: {}
  # The C++ standard variants only need to compile, the headers they parse are
  # the same ones the default variant already runs.
  net.cpp.headers.cpp17:
    build_only: true
    extra_configs:
      - CONFIG_STD_CPP17=y
  net.cpp.headers.cpp20:
    build_only: true
    extra_configs:
      - CONFIG_STD_CPP20=y
