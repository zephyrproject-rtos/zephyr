CONFIG_ARCH_POSIX_LIBFUZZER=y

CONFIG_ASAN=y
CONFIG_ASAN_RECOVER=n
CONFIG_UBSAN=y

CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_L2_DUMMY=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y

# Register callbacks so the option-callback decode surface (a second
# path into the parser, distinct from the switch-based one) is fuzzed
# too.
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS_VENDOR_SPECIFIC=y
CONFIG_NET_BUF=y
CONFIG_NET_PKT_RX_COUNT=5
CONFIG_NET_PKT_TX_COUNT=5
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# net_recv_data() hands the packet to a receive thread unless there are
# no receive queues at all. A case parsed after the harness has moved on
# would be attributed to whichever input libFuzzer executed next, and a
# crash found that way would not replay, so the packet is processed in
# the caller's context instead.
CONFIG_NET_TC_RX_COUNT=0

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Turn off UDP checksum checking, same as the ztest client harness: the
# checksum is not part of what the parser under fuzz decodes.
CONFIG_NET_UDP_CHECKSUM=n

# A case is bounded by a fixed window of simulated time, so nothing in
# it may be deferred to a logging thread and land in the next case.
CONFIG_LOG=n

CONFIG_MAIN_STACK_SIZE=3072
