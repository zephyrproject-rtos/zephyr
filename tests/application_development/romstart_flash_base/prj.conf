CONFIG_ZTEST=y

# Link the application image into the code partition and keep the boot
# vectors at the base of zephyr,flash
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_ROMSTART_RELOCATION_ROM=y
CONFIG_ROMSTART_REGION_AT_FLASH_BASE=y

# Exercise a settings backend on the storage partition placed between
# the vector table and the application image
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
