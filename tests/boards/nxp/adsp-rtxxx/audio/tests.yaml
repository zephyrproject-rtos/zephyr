common:
  sysbuild: true
  harness: ztest
  min_ram: 1024
  min_flash: 1024
  platform_allow:
    - mimxrt685_evk/mimxrt685s/cm33
    - mimxrt700_evk/mimxrt798s/cm33_cpu0
  # The DSP performs 1000 I2S transactions at 48 kHz plus setup/drain; give the
  # ztest run a generous wall-clock backstop in case the DSP never completes.
  timeout: 120
tests:
  boards.nxp.adsp.rtxxx.audio:
    tags:
      - audio
      - i2s
      - amp
      - dsp
