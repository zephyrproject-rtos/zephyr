common:
  sysbuild: true
  harness: ztest
  min_ram: 1024
  min_flash: 1024
  platform_allow:
    - mimxrt685_evk/mimxrt685s/cm33
    - mimxrt700_evk/mimxrt798s/cm33_cpu0
  # Backstop should the DSP never respond and the ztest waits get stuck.
  timeout: 60
tests:
  boards.nxp.adsp.rtxxx.mbox:
    tags:
      - mbox
      - amp
      - dsp
