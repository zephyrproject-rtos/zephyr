common:
  tags:
    - drivers
    - interrupt
  integration_platforms:
    - esp32s3_devkitc/esp32s3/procpu
tests:
  # Hardware-executed. mli_encoding and mli_dispatch run on every platform;
  # esp_noniram needs one enabled timer group counter, and esp_interrupt
  # (nested ISRs) needs three, so it runs on esp32, esp32s2 and esp32s3 only.
  boards.esp32.interrupts:
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32h2_devkitm

  # Compile-only sweep across every SoC that carries the interrupt code.
  boards.esp32.interrupts.build:
    build_only: true
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp8684_devkitm
      - esp32c3_devkitm
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32c61_devkitc
      - esp32h2_devkitm
      - esp32p4_function_ev_board/esp32p4/hpcore
