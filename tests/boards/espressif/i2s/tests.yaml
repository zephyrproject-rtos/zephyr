tests:
  boards.esp32.i2s.gpio_loopback:
    depends_on:
      - i2s
      - gpio
    tags:
      - drivers
      - userspace
    filter: CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    harness: ztest
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
    harness_config:
      fixture: gpio_loopback
  boards.esp32.i2s.gpio_loopback.pm:
    depends_on:
      - i2s
      - gpio
    tags:
      - drivers
    filter: CONFIG_I2S_TEST_USE_GPIO_LOOPBACK
    harness: ztest
    harness_config:
      fixture: gpio_loopback
    extra_args:
      - SNIPPET=espressif-pm
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
