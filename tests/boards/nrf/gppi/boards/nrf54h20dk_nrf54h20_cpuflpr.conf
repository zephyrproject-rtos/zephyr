CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# Reduce RAM use on FLPR when nordic-log-stm is enabled (STM logging frontend).
CONFIG_ISR_STACK_SIZE=512
CONFIG_TEST_EXTRA_STACK_SIZE=512
CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_ENABLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_IPC_SERVICE_LOG_LEVEL_OFF=y
