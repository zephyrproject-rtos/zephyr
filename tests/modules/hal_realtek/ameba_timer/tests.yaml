common:
  tags:
    - timer
    - realtek
  modules:
    - hal_realtek
  integration_platforms:
    - qemu_cortex_m3
  platform_allow:
    - qemu_cortex_m3
    - native_sim
    - native_sim/native/64
  timeout: 30
tests:
