common:
  ignore_faults: true
  tags:
    - os
    - timer
tests:
  libraries.sys_timer:
    integration_platforms:
      - native_sim
      - qemu_x86
      - qemu_cortex_m3
  libraries.sys_timer.static_only:
    integration_platforms:
      - native_sim
      - qemu_x86
    extra_configs:
      - CONFIG_SYS_TIMER_MAX=2
  libraries.sys_timer.userspace:
    filter: CONFIG_ARCH_HAS_USERSPACE
    integration_platforms:
      - qemu_x86
      - qemu_cortex_m3
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_ZTEST_FATAL_HOOK=y
