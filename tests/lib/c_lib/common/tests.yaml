common:
  tags:
    - clib
  ignore_faults: true
  integration_platforms:
    - mps2/an385
tests:
  libraries.libc.common: {}
  libraries.libc.common.minimal:
    filter: CONFIG_MINIMAL_LIBC_SUPPORTED
    tags: minimal_libc
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
      - CONFIG_MINIMAL_LIBC_NON_REENTRANT_FUNCTIONS=y
      - CONFIG_MINIMAL_LIBC_RAND=y
  libraries.libc.common.minimal.long_double:
    filter: CONFIG_MINIMAL_LIBC_SUPPORTED and CONFIG_CPU_HAS_FPU
    tags: minimal_libc
    extra_args: EXTRA_CPPFLAGS=-DTEST_LONG_DOUBLE
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
      - CONFIG_MINIMAL_LIBC_NON_REENTRANT_FUNCTIONS=y
      - CONFIG_MINIMAL_LIBC_RAND=y
      - CONFIG_FPU=y
    integration_platforms:
      - native_sim/native/64
      - qemu_x86/atom
  libraries.libc.common.newlib:
    toolchain_exclude:
      - zephyr/gnu
      - zephyr/llvm
    filter: CONFIG_NEWLIB_LIBC_SUPPORTED
    min_ram: 32
    tags: newlib
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
  libraries.libc.common.newlib_nano:
    toolchain_exclude:
      - zephyr/gnu
      - zephyr/llvm
    filter: CONFIG_NEWLIB_LIBC_SUPPORTED and CONFIG_HAS_NEWLIB_LIBC_NANO
    tags: newlib
    extra_configs:
      - CONFIG_NEWLIB_LIBC=y
      - CONFIG_NEWLIB_LIBC_NANO=y
  libraries.libc.common.picolibc:
    filter: CONFIG_PICOLIBC_SUPPORTED
    tags: picolibc
    extra_configs:
      - CONFIG_PICOLIBC=y
  libraries.libc.common.picolibc.module:
    filter: CONFIG_ZEPHYR_PICOLIBC_MODULE
    tags: picolibc
    extra_configs:
      - CONFIG_PICOLIBC=y
      - CONFIG_PICOLIBC_USE_MODULE=y
  libraries.libc.common.picolibc.notls:
    filter: CONFIG_ZEPHYR_PICOLIBC_MODULE
    tags: picolibc
    extra_configs:
      - CONFIG_PICOLIBC=y
      - CONFIG_PICOLIBC_USE_MODULE=y
      - CONFIG_THREAD_LOCAL_STORAGE=n
