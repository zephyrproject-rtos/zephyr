common:
  ignore_faults: true
  tags:
    - zvfs
    - fatfs
  modules:
    - fatfs
  min_ram: 128
  platform_key:
    - arch
    - simulation
tests:
  libraries.zvfs_mmap: {}
  libraries.zvfs_mmap.userspace:
    filter: CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    platform_exclude:
      # 8-region MPU: one domain slot is left for mappings, the suite holds several at once
      - mps2/an385
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
