common:
  tags: memref

tests:
  libraries.memref:
    integration_platforms:
      - native_sim
  libraries.memref.no_destroy_cb:
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_MEMREF_DESTROY_CB=n
  libraries.memref.no_assert:
    build_only: true
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_ASSERT=n
      - CONFIG_MEMREF_DEBUG=n
  libraries.memref.no_debug:
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_MEMREF_DEBUG=n
