common:
  tags: heaptrace
  integration_platforms:
    - qemu_x86

tests:
  libraries.heaptrace: {}
  libraries.heaptrace.add_size:
    extra_configs:
      - CONFIG_ZBUS=y
      - CONFIG_HEAP_MEM_POOL_SIZE=0
      - CONFIG_HEAP_MEM_POOL_ADD_SIZE_ZBUS=4096
  libraries.heaptrace.no_sys_heap:
    # Regression: with SYS_HEAP_LISTENER=y and K_HEAP_MEM_POOL_SIZE == 0
    # the system heap does not exist; heaptrace.c must still link.
    extra_configs:
      - CONFIG_HEAP_MEM_POOL_SIZE=0
