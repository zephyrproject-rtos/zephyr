description: |
  A DAC output wired to an ADC input, named dac1 and adc1 in the io-channels
  of the zephyr,user node, with the channel of each configured on its
  controller. The wire may be inside the SoC, where the ADC can sample the
  DAC output directly.
node: /zephyr,user
property: io-channel-names
