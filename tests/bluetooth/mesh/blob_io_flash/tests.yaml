tests:
  bluetooth.mesh.blob_io_flash:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="test.overlay"
    platform_allow:
      - native_sim
    tags:
      - bluetooth
      - mesh
    integration_platforms:
      - native_sim
  bluetooth.mesh.blob_io_flash.block_cache:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="test.overlay"
      - CONFIG_BT_MESH_BLOB_IO_FLASH_BLOCK_CACHE=y
      # Disable the simulator's double-write tolerance so that any second
      # program to a write block (the bug this variant guards) fails the test.
      - CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=n
    platform_allow:
      - native_sim
    tags:
      - bluetooth
      - mesh
    integration_platforms:
      - native_sim
