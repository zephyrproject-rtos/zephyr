common:
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
  tags:
    - bluetooth
    - host
tests:
  bluetooth.host_disconnected_handles: {}
  bluetooth.host_disconnected_handles.multiple_sets:
    extra_configs:
      - CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
  bluetooth.host_disconnected_handles.sync:
    extra_configs:
      - CONFIG_BT_OBSERVER=y
      - CONFIG_BT_PER_ADV_SYNC=y
      - CONFIG_BT_PER_ADV_SYNC_RSP=y
