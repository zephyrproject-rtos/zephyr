common:
  extra_args:
    - EXTRA_DTC_OVERLAY_FILE="app.overlay"
  platform_allow:
    - native_sim
    - native_sim/native/64
    - qemu_x86
  integration_platforms:
    - native_sim
    - qemu_x86
  tags:
    - bluetooth
    - classic
tests:
  bluetooth.classic.static_linkage: {}
  bluetooth.classic.static_linkage.all_features_debug:
    extra_configs:
      - CONFIG_BT_CONN_LOG_LEVEL_DBG=y
      - CONFIG_BT_L2CAP_LOG_LEVEL_DBG=y
      - CONFIG_BT_HFP_HF_CODEC_NEG=y
      - CONFIG_BT_HFP_HF_ECNR=y
      - CONFIG_BT_HFP_HF_3WAY_CALL=y
      - CONFIG_BT_HFP_HF_VOICE_RECG_TEXT=y
      - CONFIG_BT_HFP_HF_HF_INDICATORS=y
      - CONFIG_BT_HFP_AG_CODEC_NEG=y
      - CONFIG_BT_HFP_AG_ECNR=y
      - CONFIG_BT_HFP_AG_3WAY_CALL=y
      - CONFIG_BT_HFP_AG_VOICE_RECG_TEXT=y
      - CONFIG_BT_HFP_AG_VOICE_TAG=y
      - CONFIG_BT_HFP_AG_HF_INDICATORS=y
  bluetooth.classic.static_linkage.minimal_features:
    extra_configs:
      - CONFIG_BT_CONN_LOG_LEVEL_OFF=y
      - CONFIG_BT_L2CAP_LOG_LEVEL_OFF=y
      - CONFIG_BT_HFP_HF_CLI=n
      - CONFIG_BT_HFP_HF_VOLUME=n
      - CONFIG_BT_HFP_HF_CODEC_NEG=n
      - CONFIG_BT_HFP_HF_ECNR=n
      - CONFIG_BT_HFP_HF_3WAY_CALL=n
      - CONFIG_BT_HFP_HF_ECS=n
      - CONFIG_BT_HFP_HF_ECC=n
      - CONFIG_BT_HFP_HF_VOICE_RECG=n
      - CONFIG_BT_HFP_HF_ENH_VOICE_RECG=n
      - CONFIG_BT_HFP_HF_VOICE_RECG_TEXT=n
      - CONFIG_BT_HFP_HF_HF_INDICATORS=n
      - CONFIG_BT_HFP_AG_CODEC_NEG=n
      - CONFIG_BT_HFP_AG_ECNR=n
      - CONFIG_BT_HFP_AG_3WAY_CALL=n
      - CONFIG_BT_HFP_AG_ECS=n
      - CONFIG_BT_HFP_AG_ECC=n
      - CONFIG_BT_HFP_AG_VOICE_RECG=n
      - CONFIG_BT_HFP_AG_ENH_VOICE_RECG=n
      - CONFIG_BT_HFP_AG_VOICE_RECG_TEXT=n
      - CONFIG_BT_HFP_AG_VOICE_TAG=n
      - CONFIG_BT_HFP_AG_HF_INDICATORS=n
