tests:
  bluetooth.classic.bip_client_b2b:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    tags:
      - bluetooth
      - bip
    harness: pytest
    harness_config:
      pytest_dut_scope: session
      fixture: usb_hci
    timeout: 5400
  bluetooth.classic.bip_client_b2b.no_blobs:
    platform_allow:
      - mimxrt1170_evk@B/mimxrt1176/cm7
    tags:
      - bluetooth
      - bip
    extra_args:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
    timeout: 5400
    build_only: true
