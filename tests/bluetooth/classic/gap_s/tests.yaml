tests:
  bluetooth.classic.gap.server:
    platform_allow:
    - native_sim
    integration_platforms:
    - native_sim
    tags:
    - bluetooth
    - gap
    harness: pytest
    harness_config:
      pytest_dut_scope: session
      fixture: usb_hci
    timeout: 600
  bluetooth.classic.gap.server.bumble:
    platform_allow:
    - native_sim
    tags:
    - bluetooth
    harness: pytest
    harness_config:
      pytest_dut_scope: session
    sidecar: bumble
    sidecar_config:
      bumble:
        addresses:
        - "C0:00:00:00:00:01"
        - "F0:F1:F2:F3:F4:F5"
        pytest_args:
        - '--hci-transport=tcp-client:{ctrl1}'
    timeout: 600
  bluetooth.classic.gap.server.no_blobs:
    platform_allow:
    - mimxrt1170_evk@B/mimxrt1176/cm7
    tags:
    - bluetooth
    - gap
    extra_args:
    - CONFIG_BUILD_ONLY_NO_BLOBS=y
    timeout: 600
    build_only: true
