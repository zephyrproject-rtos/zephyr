tests:
  bluetooth.classic.hid_host:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    tags:
      - bluetooth
      - hid
    harness: pytest
    harness_config:
      pytest_dut_scope: session
      fixture: usb_hci
    extra_args:
      - CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
    timeout: 600
