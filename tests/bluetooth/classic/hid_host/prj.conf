CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_SHELL=y
CONFIG_LOG=y
CONFIG_ZTEST=y

# No ZTEST cases of our own: run the ztest shell so the image blocks on the
# shell instead of exiting, and bind the shell UART to stdin/stdout so the
# twister pytest harness can drive it.
CONFIG_ZTEST_SHELL=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

CONFIG_BT_HID_HOST=y

CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

CONFIG_BT_DEVICE_NAME="hid_host"

CONFIG_BT_CREATE_CONN_TIMEOUT=30
CONFIG_BT_PAGE_TIMEOUT=0xFFFF

CONFIG_MINIMAL_LIBC_STRING_ERROR_TABLE=n
