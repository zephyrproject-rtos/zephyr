tests:
  bluetooth.classic.a2dp_source:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    tags:
      - bluetooth
      - sdp
      - a2dp
    harness: pytest
    harness_config:
      pytest_dut_scope: session
      fixture: usb_hci
    timeout: 180
  bluetooth.classic.a2dp_source.flushable:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    tags:
      - bluetooth
      - a2dp
    extra_configs:
      - CONFIG_BT_L2CAP_TX_FLUSH_TO=20
    build_only: true
  bluetooth.classic.a2dp_source.no_blobs:
    platform_allow:
      - mimxrt1170_evk@B/mimxrt1176/cm7
    tags:
      - bluetooth
      - sdp
      - a2dp
    extra_args:
      - CONFIG_BUILD_ONLY_NO_BLOBS=y
    timeout: 180
    build_only: true
