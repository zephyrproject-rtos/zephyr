CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n

# Builds the OBEX layer. The test drives it through a fake transport, so the
# GOEP transports and the controller are not used.
CONFIG_BT_GOEP=y

# Leak checks of the test buffer pools.
CONFIG_NET_BUF_POOL_USAGE=y
