CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_SHELL=y
# Keep long command echoes on one line for the twister shell helper
CONFIG_SHELL_DEFAULT_TERMINAL_WIDTH=256
CONFIG_LOG=n
CONFIG_ZTEST=y

CONFIG_BT_MAP_MCE=y
CONFIG_BT_MAP_MSE=y
CONFIG_BT_OEBX_RSP_CODE_TO_STR=y
CONFIG_BT_BUF_ACL_RX_SIZE=265
CONFIG_BT_DEVICE_NAME="map"

CONFIG_BT_CREATE_CONN_TIMEOUT=30
CONFIG_BT_PAGE_TIMEOUT=0xFFFF
