CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_L2CAP_CONNLESS=y
# The signalling pool has a buffer per connection. Nothing sends here, so the
# two Information Requests and the Connection Request of the setup keep theirs
# and leave the pool exhausted.
CONFIG_BT_MAX_CONN=3
