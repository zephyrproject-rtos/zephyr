CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_HOST_CRYPTO_PRNG=y

# A known, small TX PDU pool so the test can exhaust it deterministically.
CONFIG_BT_L2CAP_TX_BUF_COUNT=3

CONFIG_LOG=y
