common:
  extra_args:
    - EXTRA_DTC_OVERLAY_FILE="test.overlay"
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
  tags:
    - bluetooth
    - host

tests:
  bluetooth.host_smp_pairing_race:
    {}
  # Without Secure Connections, security level 4 cannot be reached.
  bluetooth.host_smp_pairing_race.legacy:
    extra_configs:
      - CONFIG_BT_SMP_SC_PAIR_ONLY=n
      - CONFIG_BT_TESTING=y
      - CONFIG_BT_SMP_LEGACY_PAIR_ONLY=y
