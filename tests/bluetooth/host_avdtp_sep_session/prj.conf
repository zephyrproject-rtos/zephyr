CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_AVDTP=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n

# Bluetooth is not enabled, so the AVDTP responses stay queued and hold their
# buffers. The AVDTP pool has two buffers per connection, enough for every
# response of the suite with this many connections.
CONFIG_BT_MAX_CONN=8
