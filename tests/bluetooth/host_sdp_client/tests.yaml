common:
  extra_args:
    - EXTRA_DTC_OVERLAY_FILE="test.overlay"
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
  tags:
    - bluetooth
    - host

tests:
  bluetooth.host_sdp_client:
    {}
  # The arguments of the debug logs of the client are evaluated only at this level
  bluetooth.host_sdp_client.log_dbg:
    extra_configs:
      - CONFIG_BT_SDP_LOG_LEVEL_DBG=y
