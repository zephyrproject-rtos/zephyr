CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n

# GATT stores its state on pairing complete only with settings
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS_NONE=y

# For the settings hooks, which record what GATT stores
CONFIG_BT_TESTING=y

# One BR/EDR and one LE connection object
CONFIG_BT_MAX_CONN=2
