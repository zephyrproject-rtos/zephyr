CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_AVRCP=y
CONFIG_BT_AVRCP_CONTROLLER=y
CONFIG_BT_AVRCP_BROWSING=y

# Lets the test take all signaling buffers by keeping one packet from the Host, which goes on
# sending with the second connection's fragment.
CONFIG_BT_L2CAP_SIG_TX_BUF_COUNT=1
CONFIG_BT_MAX_CONN=2

CONFIG_LOG=y
