common:
  extra_args:
    - EXTRA_DTC_OVERLAY_FILE="test.overlay"
  tags:
    - bluetooth
    - host
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim

tests:
  bluetooth.host.adv.bt_le_ext_adv_foreach.legacy: {}
  bluetooth.host.adv.bt_le_ext_adv_foreach:
    extra_configs:
      - CONFIG_BT_EXT_ADV=y
      - CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
