CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_ENH_RET=y
# Room for an I-frame after the one in transmission
CONFIG_BT_L2CAP_MAX_WINDOW_SIZE=2

# The test checks that buffers are given back
CONFIG_NET_BUF_POOL_USAGE=y

# Each frame from the peer waits a tick for the Host to handle it
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
