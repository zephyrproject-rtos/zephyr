common:
  extra_args:
    - EXTRA_DTC_OVERLAY_FILE="test.overlay"
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
  tags:
    - bluetooth
    - host

tests:
  bluetooth.host_keys:
    {}
  bluetooth.host_keys.host_resolving:
    extra_configs:
      - CONFIG_TEST_RL_SIZE=0
