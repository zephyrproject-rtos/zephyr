# Board-specific overrides for BTP tester on TI LPF3 devices
#
# The board defconfig enables PM and console; both must be disabled
# for reliable BTP communication over the single UART.

# Disable power management — PM can suspend the UART during idle,
# causing BTP timeouts.
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# The board defconfig enables console; force it off here so the
# overlay's uart-pipe has exclusive ownership of uart0.
CONFIG_CONSOLE=n

# Required by uart-pipe
CONFIG_UART_INTERRUPT_DRIVEN=y

# Required by uart-pipe on LPF3 (not set in prj.conf)
CONFIG_SERIAL=y

# LPF3 does not support signing or OTS — override prj.conf defaults
CONFIG_BT_SIGNING=n
CONFIG_BT_OTS=n
CONFIG_BT_OTS_DIR_LIST_OBJ=n
CONFIG_BT_OTS_OBJ_NAME_WRITE_SUPPORT=n
CONFIG_BT_OTS_OACP_WRITE_SUPPORT=n
CONFIG_BT_OTS_OACP_PATCH_SUPPORT=n
CONFIG_BT_OTS_OACP_CREATE_SUPPORT=n
CONFIG_BT_OTS_OACP_DELETE_SUPPORT=n
CONFIG_BT_OTS_OACP_CHECKSUM_SUPPORT=n

# Disable every form of console output — the single UART is reserved
# for BTP and any stray text will corrupt the binary protocol.
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n

CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n

# --- Logging / Debug ---
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n

# --- System ---
CONFIG_TEST_RANDOM_GENERATOR=y


# During PTS test we only connect to one device
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
