CONFIG_ZTEST=y
CONFIG_ASSERT=y

# Preemptible, so that the Host has handled what the test hands it before the
# test goes on
CONFIG_ZTEST_THREAD_PRIORITY=1

CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# Nothing but what the tests send goes over the connection
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# For the counts of free buffers in each pool
CONFIG_NET_BUF_POOL_USAGE=y

# The ATT timeout of a test is 30 seconds of simulated time
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
