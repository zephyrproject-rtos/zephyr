# Common config for all TI SimpleLink platforms (CC23xx, CC27xx, etc.)
#
# CONFIG_SPIN_VALIDATE adds a uintptr_t field to struct k_spinlock for runtime
# deadlock detection. When enabled, sizeof(struct k_heap) = 24 bytes.
# When disabled, struct k_spinlock has no members and sizeof(struct k_heap) = 20 bytes.
#
# Problem: ble_controller.a defines K_HEAP_DEFINE(worker_resource_pool) in
# icall_POSIX.c and was compiled WITHOUT SPIN_VALIDATE -> struct k_heap = 20 bytes.
# On TI boards with flash > 32 KB, Zephyr auto-enables SPIN_VALIDATE -> struct k_heap
# = 24 bytes in the application. This mismatch causes STRUCT_SECTION_FOREACH(k_heap)
# to crash at boot with a boundary assertion.
CONFIG_SPIN_VALIDATE=n

# BT_LONG_WQ is not auto-selected on TI platforms because they use an external HCI
# controller (BT_CTLR=n). Without BT_CTLR, BT_TINYCRYPT_ECC is not auto-enabled,
# so BT_LONG_WQ is never selected. However, hci_ecc.c still references
# bt_long_wq_submit() causing a linker error. Must be explicitly enabled.
CONFIG_BT_LONG_WQ=y
