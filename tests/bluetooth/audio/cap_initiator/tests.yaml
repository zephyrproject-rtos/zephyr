common:
  tags:
    - bluetooth
    - bluetooth_audio
  platform_allow:
    - native_sim
  integration_platforms:
    - native_sim

tests:
  bluetooth.audio.cap_initiator.test_default: {}
  bluetooth.audio.cap_initiator.test_sink_only:
    extra_configs:
      - CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=0
  bluetooth.audio.cap_initiator.test_source_only:
    extra_configs:
      - CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=0
