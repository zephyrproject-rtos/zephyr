CONFIG_ZTEST=y
CONFIG_BT=y
CONFIG_SERIAL=y
CONFIG_BT_DEBUG_MONITOR_UART=y
CONFIG_BT_DEBUG_MONITOR_UART_INTERRUPT_DRIVEN=y
CONFIG_BT_DEBUG_MONITOR_UART_BUFFER_SIZE=128
# Tests default to minimal logging, which the interrupt-driven monitor
# does not support (no panic hook). Use the full log backend instead.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_BOOT_BANNER=n
# The emulated vnd,serial device initializes at POST_KERNEL, after the
# monitor's PRE_KERNEL_1 init has already run its device_is_ready() assert.
# The emulated UART works regardless (it has no init function), so disable
# asserts rather than reorder initialization for a test.
CONFIG_ASSERT=n
