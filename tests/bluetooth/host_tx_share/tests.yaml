common:
  extra_args:
    - EXTRA_DTC_OVERLAY_FILE="test.overlay"
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
  tags:
    - bluetooth
    - host

tests:
  bluetooth.host_tx_share:
    {}
  bluetooth.host_tx_share.six_buffers:
    extra_configs:
      - CONFIG_TEST_SIX_BUFFERS=y
      - CONFIG_BT_BUF_ACL_TX_COUNT=6
