tests:
  bluetooth.host_long_adv_recv:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="test.overlay"
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags:
      - bluetooth
      - host
  bluetooth.host_long_adv_recv.no_per_adv_reassembly:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="test.overlay"
    extra_configs:
      - CONFIG_BT_PER_ADV_SYNC_BUF_SIZE=0
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags:
      - bluetooth
      - host
  bluetooth.host_long_adv_recv.per_adv_sync_rsp_no_reassembly:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="test.overlay"
    extra_configs:
      - CONFIG_BT_PER_ADV_SYNC_RSP=y
      - CONFIG_BT_PER_ADV_SYNC_BUF_SIZE=0
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    tags:
      - bluetooth
      - host
