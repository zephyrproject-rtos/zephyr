common:
  extra_args:
    - EXTRA_DTC_OVERLAY_FILE="test.overlay"
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
  tags:
    - bluetooth
    - host
tests:
  bluetooth.host_disable: {}
  bluetooth.host_disable.no_close:
    extra_configs:
      - CONFIG_TEST_DRIVER_NO_CLOSE=y
  bluetooth.host_disable.ctlr_stops:
    extra_configs:
      - CONFIG_TEST_CTLR_STOPS=y
    ignore_faults: true
  bluetooth.host_disable.send_blocks:
    extra_configs:
      - CONFIG_TEST_SEND_BLOCKS=y
    ignore_faults: true
  bluetooth.host_disable.conn:
    extra_configs:
      - CONFIG_BT_PERIPHERAL=y
      - CONFIG_BT_GATT_CLIENT=y
      - CONFIG_BT_SMP=y
  bluetooth.host_disable.ext_adv:
    extra_configs:
      - CONFIG_BT_PERIPHERAL=y
      - CONFIG_BT_EXT_ADV=y
      - CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
      # Extended advertising raises the default, and the test with a command
      # response that is too long needs one that does not fit.
      - CONFIG_BT_BUF_CMD_TX_SIZE=65
