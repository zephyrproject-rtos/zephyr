CONFIG_ZTEST=y
CONFIG_ASSERT=y

# Below the Host's threads, so that the Host has processed what a test hands it
# before the test goes on
CONFIG_ZTEST_THREAD_PRIORITY=1

# The tests wait for timeouts of the Host
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n

CONFIG_BT=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_H4=n
CONFIG_BT_PERIPHERAL=y
# The connection of the tests, one that goes and one that comes
CONFIG_BT_MAX_CONN=3
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_ECRED=y
CONFIG_BT_EATT=y
CONFIG_BT_EATT_MAX=2

# The peer opens the enhanced bearers, without encryption
CONFIG_BT_EATT_AUTO_CONNECT=n
CONFIG_BT_TESTING=y
CONFIG_BT_CONN_DISABLE_SECURITY=y

# Nothing but what the tests inject goes over the connection
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_AUTO_UPDATE_MTU=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# One Prepare Write Request
CONFIG_BT_ATT_PREPARE_COUNT=1

# For the counts of free buffers in each pool
CONFIG_NET_BUF_POOL_USAGE=y

CONFIG_LOG=y
