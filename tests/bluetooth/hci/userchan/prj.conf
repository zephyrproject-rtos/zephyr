CONFIG_ZTEST=y

CONFIG_BT=y
CONFIG_LOG=y

# The user channel driver asks for real time, but the HCI command timeout that most cases
# end in is not worth waiting for.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n

# In the working directory, so that parallel runs do not share the socket. See also main.c.
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--bt-dev=/proc/self/cwd/hci.sock"
