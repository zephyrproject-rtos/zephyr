common:
  platform_key:
    - arch
  tags:
    - kernel
    - benchmark
tests:
  benchmark.kernel.latency:
    # FIXME: no DWT and no RTC_TIMER for qemu_cortex_m0
    platform_exclude:
      - qemu_cortex_m0
      - m2gl025_miv
    harness: console
    integration_platforms:
      - qemu_x86
      - qemu_arc/qemu_arc_em
      - qemu_riscv64/qemu_virt_riscv64/smp
    harness_config:
      type: one_line
      record:
        regex:
          - "(?P<metric>.*) - (?P<description>.*):(?P<cycles>.*) cycles ,(?P<nanoseconds>.*) ns"
      regex:
        - "PROJECT EXECUTION SUCCESSFUL"

  # Obtain the benchmark results for various user thread / kernel thread
  # configurations on platforms that support user space.
  benchmark.kernel.latency.userspace:
    filter: CONFIG_ARCH_HAS_USERSPACE
    timeout: 300
    extra_configs:
      - CONFIG_USERSPACE=y
    harness: console
    integration_platforms:
      - qemu_x86
      - qemu_cortex_a53
    harness_config:
      type: one_line
      record:
        regex:
          - "(?P<metric>.*) - (?P<description>.*):(?P<cycles>.*) cycles ,(?P<nanoseconds>.*) ns"
      regex:
        - "PROJECT EXECUTION SUCCESSFUL"

  benchmark.kernel.latency.objcore:
    # FIXME: no DWT and no RTC_TIMER for qemu_cortex_m0
    platform_exclude:
      - qemu_cortex_m0
      - m2gl025_miv
    timeout: 300
    extra_configs:
      - CONFIG_OBJ_CORE=y
      - CONFIG_OBJ_CORE_STATS=y
    harness: console
    integration_platforms:
      - qemu_x86
      - qemu_arc/qemu_arc_em
      - qemu_riscv64/qemu_virt_riscv64/smp
    harness_config:
      type: one_line
      record:
        regex:
          - "(?P<metric>.*) - (?P<description>.*):(?P<cycles>.*) cycles ,(?P<nanoseconds>.*) ns"
      regex:
        - "PROJECT EXECUTION SUCCESSFUL"
