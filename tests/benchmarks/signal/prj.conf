CONFIG_TEST=y

# Disable assertions since they will affect the hot path
CONFIG_ASSERT=n

# Disable HW Stack Protection (see #28664)
CONFIG_HW_STACK_PROTECTION=n
CONFIG_COVERAGE=n

# Disable system power management
CONFIG_PM=n

CONFIG_SIGNAL=y
CONFIG_POLL=y
CONFIG_SIGNAL_SET_SIZE=32
CONFIG_SIGNAL_QUEUE_SIZE=32

CONFIG_TEST_RANDOM_GENERATOR=y
