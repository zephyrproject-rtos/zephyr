CONFIG_ZTEST=y

# The KNX subsystem is deliberately NOT enabled: src/main.c compiles
# layer4_transport.c directly and provides its own stubs for L3, L7 and the
# interface objects.  Enabling CONFIG_KNX_STACK would also pull in knx_core.c,
# whose SYS_INIT starts the L2 threads and resets the transceiver.
# CONFIG_KNX_STACK is not set

# Logging off: layer4_transport.c's LOG_MODULE_REGISTER / LOG_DBG then compile
# away to nothing, so the test needs no logging stubs of its own.
CONFIG_LOG=n
