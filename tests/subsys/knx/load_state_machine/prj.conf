CONFIG_ZTEST=y

# The KNX subsystem is deliberately NOT enabled: src/main.c and CMakeLists.txt
# compile the object_*.c files directly and stub only the Device Object's two
# symbols. Enabling CONFIG_KNX_STACK would also pull in knx_core.c, whose
# SYS_INIT starts the L2 threads and resets the transceiver.
# CONFIG_KNX_STACK is not set

# Logging off: every object_*.c's LOG_MODULE_REGISTER / LOG_DBG / LOG_WRN /
# LOG_ERR then compile away to nothing, so the test needs no logging stubs.
CONFIG_LOG=n

# object_memory.c compiles its CONFIG_SETTINGS-off branch instead: memory_reset()/
# memory_read()/memory_modified() become pure-RAM operations with no NVS
# involved. This suite tests the Load/Run State Machines' in-RAM logic, not
# persistence — persistence is outside every host suite's reach.
# CONFIG_SETTINGS is not set
