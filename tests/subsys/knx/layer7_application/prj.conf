CONFIG_ZTEST=y

# The KNX subsystem is deliberately NOT enabled: src/main.c #includes
# layer7_application.c and knx_group_object.c directly and stubs the L4/
# object_device/object_interface surface itself. Enabling CONFIG_KNX_STACK
# would also pull in knx_core.c, whose SYS_INIT starts the L2 threads and
# resets the transceiver.
# CONFIG_KNX_STACK is not set

# Logging off: every included/compiled file's LOG_MODULE_REGISTER / LOG_DBG /
# LOG_WRN / LOG_ERR then compile away to nothing, so the test needs no
# logging stubs.
CONFIG_LOG=n

# object_memory.c compiles its CONFIG_SETTINGS-off branch instead: no test
# case here needs NVS semantics, only the User Memory / Group Object logic
# that already lives entirely in RAM.
# CONFIG_SETTINGS is not set
