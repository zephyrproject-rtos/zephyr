common:
  platform_allow:
    - native_sim/native/64
    - qemu_cortex_m3
  integration_platforms:
    - native_sim/native/64
  tags:
    - usb
    - ccid
  timeout: 120
tests:
  usb.ccid.high_speed: {}
  usb.ccid.full_speed:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=full_speed.overlay
  usb.ccid.full_speed_only:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=full_speed.overlay
    extra_configs:
      - CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
      - CONFIG_USBD_MAX_SPEED_FULL=y
