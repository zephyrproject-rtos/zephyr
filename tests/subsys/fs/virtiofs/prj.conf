CONFIG_ZTEST=y
CONFIG_VIRTIO=y
CONFIG_PCIE=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_VIRTIOFS=y
# Exercise overlong entries with names that fit the host filesystem.
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=31
# Created directories need execute permission for traversal by virtiofsd.
CONFIG_VIRTIOFS_CREATE_MODE_VALUE=511
CONFIG_HEAP_MEM_POOL_SIZE=100000
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ZTEST_STACK_SIZE=8192

# Static vhost-user-fs device. The matching "-chardev socket,...path=<socket>"
# flag is injected at run time by the twister virtiofs harness.
CONFIG_QEMU_EXTRA_FLAGS="-device vhost-user-fs-pci,queue-size=1024,chardev=char0,tag=myfs -m 32M -object memory-backend-memfd,id=mem,size=32M,share=on -numa node,memdev=mem"
