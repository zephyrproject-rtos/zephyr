CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_WEBSOCKET=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_WEBSOCKET=y
# The websocket log backend requires the backend to be started by the
# application; this test only exercises the shell transport.
CONFIG_LOG_BACKEND_WS=n

# Keep the send stall the backend must tolerate short so the test stays fast.
CONFIG_NET_SOCKET_MAX_SEND_WAIT=1000
CONFIG_NET_TCP_TIME_WAIT_DELAY=250
CONFIG_NET_MAX_CONN=4

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
