CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_MQTT=y
CONFIG_SHELL_MQTT_SERVER_ADDR="127.0.0.1"
CONFIG_SHELL_MQTT_RX_BUF_SIZE=32
CONFIG_SHELL_MQTT_INIT_LOG_LEVEL_NONE=y
CONFIG_SHELL_MQTT_LOG_LEVEL_OFF=y
