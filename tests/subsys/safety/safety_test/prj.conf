CONFIG_ZTEST=y
CONFIG_SAFETY_TEST=y
CONFIG_LOG=y
CONFIG_SAFETY_TEST_LOG_LEVEL_WRN=y
CONFIG_TEST_EXTRA_STACK_SIZE=1024

# The suite provokes critical failures on purpose and overrides
# safety_test_safe_state() to return CONTINUE. Without this the board would halt
# partway through the run.
CONFIG_SAFETY_TEST_STRICT_CRITICAL=n
