CONFIG_ZTEST=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_CHANNELS=4
# The race under test is a context switch while channels_lock is held.
# With spinlock validation on, the unfixed code trips an assertion before
# the race shows; the production builds that saw it have ASSERT off.
CONFIG_SPIN_VALIDATE=n
