common:
  tags:
    - task_wdt
  harness: ztest
  platform_allow:
    - native_sim
    - qemu_cortex_m3
  integration_platforms:
    - native_sim
    - qemu_cortex_m3
tests:
  subsys.task_wdt: {}
  subsys.task_wdt.thread_info:
    extra_configs:
      - CONFIG_TASK_WDT_THREAD_INFO=y
      - CONFIG_TASK_WDT_FAULT_REASONS=y
      - CONFIG_TASK_WDT_SHELL=y
      - CONFIG_THREAD_NAME=y
      - CONFIG_INIT_STACKS=y
      - CONFIG_THREAD_STACK_INFO=y
      - CONFIG_LOG=y
      - CONFIG_LOG_MODE_IMMEDIATE=y
      - CONFIG_LOG_BACKEND_UART=n
      - CONFIG_LOG_PRINTK=n
      - CONFIG_SHELL=y
      - CONFIG_SHELL_BACKEND_DUMMY=y
      - CONFIG_SHELL_BACKEND_SERIAL=n
  subsys.task_wdt.fault_reasons:
    extra_configs:
      - CONFIG_TASK_WDT_FAULT_REASONS=y
