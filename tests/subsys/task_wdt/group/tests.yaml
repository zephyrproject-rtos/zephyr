common:
  tags:
    - task_wdt
  harness: ztest
  platform_allow:
    - native_sim
    - qemu_cortex_m3
  integration_platforms:
    - native_sim
    - qemu_cortex_m3
tests:
  subsys.task_wdt.group: {}
  subsys.task_wdt.group.supervision:
    extra_configs:
      - CONFIG_TASK_WDT_SUPERVISION=y
      - CONFIG_TASK_WDT_THREAD_INFO=y
      - CONFIG_LOG=y
  subsys.task_wdt.group.disabled:
    extra_configs:
      - CONFIG_TASK_WDT_GROUPS=n
