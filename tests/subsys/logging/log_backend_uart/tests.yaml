common:
  tags:
    - logging
    - backend
    - uart
  filter: CONFIG_UART_CONSOLE
  integration_platforms:
    - qemu_x86
tests:
  logging.backend.uart.single:
    extra_args: DTC_OVERLAY_FILE="./single.overlay"
    extra_configs:
      - CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
  logging.backend.uart.multi:
    extra_args: DTC_OVERLAY_FILE="./multi.overlay"
    extra_configs:
      - CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
  logging.backend.uart.pm_device_runtime_sync:
    extra_args: DTC_OVERLAY_FILE="./single.overlay"
    extra_configs:
      - CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_PM_DEVICE_RUNTIME_ASYNC=n
