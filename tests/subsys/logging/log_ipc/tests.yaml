common:
  sysbuild: true
  tags:
    - logging
    - ipc
  harness: ztest
  platform_allow:
    - nrf5340dk/nrf5340/cpuapp
    - nrf5340bsim/nrf5340/cpuapp
    - nrf54l15dk/nrf54l15/cpuapp
  integration_platforms:
    - nrf5340bsim/nrf5340/cpuapp
    - nrf54l15dk/nrf54l15/cpuapp
  extra_args:
    - platform:nrf54l15dk/nrf54l15/cpuapp:log_ipc_SNIPPET=nordic-flpr
tests:
  logging.log_ipc.frontend:
    extra_args:
      - remote_CONFIG_LOG_FRONTEND=y
      - remote_CONFIG_LOG_FRONTEND_ONLY=y
      - remote_CONFIG_LOG_FRONTEND_IPC=y
  logging.log_ipc.frontend.runtime_filtering:
    extra_args:
      - remote_CONFIG_LOG_FRONTEND=y
      - remote_CONFIG_LOG_FRONTEND_ONLY=y
      - remote_CONFIG_LOG_FRONTEND_IPC=y
      - remote_CONFIG_LOG_RUNTIME_FILTERING=y
      - log_ipc_CONFIG_LOG_RUNTIME_FILTERING=y
      - log_ipc_CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=4
  logging.log_ipc.frontend.no_early_buffer:
    extra_args:
      - remote_CONFIG_LOG_FRONTEND=y
      - remote_CONFIG_LOG_FRONTEND_ONLY=y
      - remote_CONFIG_LOG_FRONTEND_IPC=y
      - remote_CONFIG_LOG_FRONTEND_IPC_EARLY_BUFFER_SIZE=0
      - log_ipc_CONFIG_TEST_LOG_IPC_EARLY_LOGS=n
  logging.log_ipc.frontend.no_multithreading:
    extra_args:
      - remote_CONFIG_LOG_FRONTEND=y
      - remote_CONFIG_LOG_FRONTEND_ONLY=y
      - remote_CONFIG_LOG_FRONTEND_IPC=y
      - remote_CONFIG_MULTITHREADING=n
  logging.log_ipc.frontend.link_buffer:
    extra_args:
      - remote_CONFIG_LOG_FRONTEND=y
      - remote_CONFIG_LOG_FRONTEND_ONLY=y
      - remote_CONFIG_LOG_FRONTEND_IPC=y
      - log_ipc_CONFIG_LOG_LINK_IPC_RX_HOLD=n
  logging.log_ipc.backend:
    extra_args:
      - remote_CONFIG_LOG_BACKEND_IPC=y
  logging.log_ipc.backend.runtime_filtering:
    extra_args:
      - remote_CONFIG_LOG_BACKEND_IPC=y
      - remote_CONFIG_LOG_RUNTIME_FILTERING=y
      - log_ipc_CONFIG_LOG_RUNTIME_FILTERING=y
      - log_ipc_CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=4
