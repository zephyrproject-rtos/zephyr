CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_TEST_LOGGING_DEFAULTS=n

CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
# The backend only supports memory that does not need an explicit erase, so the
# simulator has to behave like RRAM rather than like NOR.
CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BACKEND_FLASH=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
CONFIG_LOG_PRINTK=n

# Only the test module logs, so that the record counts the test asserts on are
# not disturbed by messages from the rest of the system.
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=0

CONFIG_LOG_BACKEND_FLASH_BUILD_ID="TEST_BUILD_ID"
CONFIG_LOG_BACKEND_FLASH_BUILD_ID_HEADER="test_build_id.h"
