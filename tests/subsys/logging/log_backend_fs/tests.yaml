common:
  modules:
    - littlefs
  tags:
    - logging
    - backend
    - filesystem
    - fs
    - littlefs
  platform_allow:
    - native_sim
    - native_sim/native/64
    - nrf52840dk/nrf52840
    - mr_canhubk3
    - s32z2xxdc2/s32z270/rtu0
    - s32z2xxdc2/s32z270/rtu1
    - s32z2xxdc2@D/s32z270/rtu0
    - s32z2xxdc2@D/s32z270/rtu1
    - s32k5xxcvb/s32k566/m7
    - s32k5xxcvb/s32k566/r52
  integration_platforms:
    - native_sim
tests:
  logging.backend.fs.automounted: {}
  logging.backend.fs.manualmounted:
    extra_args: EXTRA_DTC_OVERLAY_FILE="automount.overlay"
  logging.backend.fs.startup.partial:
    extra_args: LOG_BACKEND_FS_TEST_REMAINING_SPACE=16
  logging.backend.fs.startup.partial.automounted:
    extra_args:
      - LOG_BACKEND_FS_TEST_REMAINING_SPACE=16
      - EXTRA_DTC_OVERLAY_FILE="automount.overlay"
  logging.backend.fs.startup.nearly_full:
    extra_args: LOG_BACKEND_FS_TEST_REMAINING_SPACE=1
  logging.backend.fs.startup.nearly_full.automounted:
    extra_args:
      - LOG_BACKEND_FS_TEST_REMAINING_SPACE=1
      - EXTRA_DTC_OVERLAY_FILE="automount.overlay"
  logging.backend.fs.startup.full:
    extra_args: LOG_BACKEND_FS_TEST_REMAINING_SPACE=0
  logging.backend.fs.startup.full.automounted:
    extra_args:
      - LOG_BACKEND_FS_TEST_REMAINING_SPACE=0
      - EXTRA_DTC_OVERLAY_FILE="automount.overlay"
