CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_LOG=y
CONFIG_APPLET=y

# One bookkeeping slot per applet thread, plus the k_thread itself when
# CONFIG_USERSPACE is off. The suite runs up to six threads in one applet, and
# struct k_thread is close to a kilobyte on the 64-bit targets.
CONFIG_APPLET_HEAP_SIZE=16384
