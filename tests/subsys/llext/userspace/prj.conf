CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=64
CONFIG_LLEXT_EXPORT_DEVICES=y

CONFIG_APPLICATION_DEFINED_SYSCALL=y

CONFIG_USERSPACE=y

# RISC-V runs the loaded extension from RAM, so it needs writable
# storage and the extension heap must stay executable.
# Data-execution prevention installs a locked catch-all PMP entry
# that makes all RAM non-executable, so it must be off here.
CONFIG_LLEXT_STORAGE_WRITABLE=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_PMP_DATA_EXECUTION_PREVENTION=n
