CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=64
CONFIG_LLEXT_EXPORT_DEVICES=y

CONFIG_APPLICATION_DEFINED_SYSCALL=y

# RISC-V copies the loaded extension into RAM and runs it in machine
# mode, so the loaded text must stay executable. Data execution
# prevention installs a locked catch-all PMP entry that makes all RAM
# non-executable, which faults on the first call into an extension.
# Setting an unknown symbol to 'n' has no effect, so this is safe on
# the other architectures.
CONFIG_PMP_DATA_EXECUTION_PREVENTION=n

# The bulk of the tests run with MPU/MMU disabled by including additional
# configuration entries from no_mem_protection.conf.
