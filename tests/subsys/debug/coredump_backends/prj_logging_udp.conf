CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING_UDP=y
CONFIG_DEBUG_COREDUMP_LOGGING_UDP_HOST="127.0.0.1:17777"
CONFIG_DEBUG_COREDUMP_LOGGING_UDP_MIRROR_TO_LOG=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# Send the dump to a socket opened by the test itself, over loopback
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_TEST=y
CONFIG_TEST_RANDOM_GENERATOR=y

# The whole dump is queued on the receiving socket before the test reads it
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=256
