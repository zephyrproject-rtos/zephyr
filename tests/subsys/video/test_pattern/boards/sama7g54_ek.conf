# The camera module streams raw Bayer, which the Image Sensor Controller
# converts into RGB565. It is cropped rather than scaled, so the resolution
# below is only a window on the pixel array, kept small to keep the frames in a
# modest buffer pool while still leaving 80 pixels per colour bar.
CONFIG_TEST_PIXEL_FORMAT="RGBP"
CONFIG_TEST_FRAME_WIDTH=640
CONFIG_TEST_FRAME_HEIGHT=480

# Index of "100% color bars" in the test pattern menu of the IMX219
CONFIG_TEST_PATTERN_CTRL=2

# Checking the colours of one frame costs the best part of a second here, far
# longer than capturing it, so a run that never sees a valid frame would spend
# a quarter of an hour reaching the default total. Ten frames is plenty of
# margin over the ten valid ones the test asks for.
CONFIG_TEST_FRAMES_TOTAL=20

# Two frames at two bytes per pixel, plus room for the heap itself
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1310720

# The references above are measured on an ov5640, and some of them sit a long way
# from the colours a 100% bar pattern is nominally made of: cyan alone is 22.7
# deltaE from ideal sRGB before any hardware is involved. Measured against ideal
# bars this board is within 5.6, so the margin below covers the references rather
# than the pipeline. The order of the bars is still checked strictly.
CONFIG_TEST_LAB_THRESHOLD=30
