CONFIG_ZTEST=y

# LoRa PHY
CONFIG_LORA=y

# Random number generator required for several LoRaWAN services
CONFIG_ENTROPY_GENERATOR=y

# LoRaWAN application layer
CONFIG_LORAWAN=y
CONFIG_LORAWAN_EMUL=y
CONFIG_LORAWAN_REGION_EU868=y

# LoRaWAN services, which own the class C session bookkeeping
CONFIG_LORAWAN_SERVICES=y
