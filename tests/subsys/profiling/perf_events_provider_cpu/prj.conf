CONFIG_ZTEST=y

# Performance event subsystem + hardware-backed CPU provider
CONFIG_PROFILING=y
CONFIG_PROFILING_PERF_EVENTS=y
CONFIG_PROFILING_PERF_EVENT_PROVIDER_CPU=y

# PMU backend under test
CONFIG_ARM64_PMUV3=y

# Deterministic per-CPU measurement (needed for foreign-CPU steering on SMP)
CONFIG_SCHED_CPU_MASK=y
CONFIG_TIMESLICING=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
