description: |
  Test GPIO port whose pins are wires between two drivers in one image: a level written by one
  is read by the other, and fires its edge interrupts.

compatible: "vnd,test-gpio-link"

include: [gpio-controller.yaml, base.yaml]

properties:
  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
