common:
  platform_allow:
    - native_sim
  timeout: 600
  tags:
    - psa.secure_storage
tests:
  secure_storage.psa.ps.secure_storage.store.zms:
    extra_args: &zms_extra_args
      - EXTRA_DTC_OVERLAY_FILE=zms.overlay
      - EXTRA_CONF_FILE=\
        overlay-secure_storage.conf;overlay-store_zms.conf;overlay-transform_default.conf;\
        overlay-its_store_zms.conf

  secure_storage.psa.ps.secure_storage.store.zms.64-bit_uids:
    extra_args: *zms_extra_args
    extra_configs:
      - CONFIG_SECURE_STORAGE_64_BIT_UID=y

  secure_storage.psa.ps.secure_storage.store.settings:
    filter: CONFIG_SECURE_STORAGE_PS_STORE_IMPLEMENTATION_SETTINGS
    extra_args: &settings_extra_args
      "EXTRA_CONF_FILE=\
       overlay-secure_storage.conf;overlay-transform_default.conf;overlay-store_settings.conf;\
       overlay-its_store_settings.conf"

  secure_storage.psa.ps.secure_storage.store.settings.64-bit_uids:
    filter: CONFIG_SECURE_STORAGE_PS_STORE_IMPLEMENTATION_SETTINGS
    extra_args: *settings_extra_args
    extra_configs:
      - CONFIG_SECURE_STORAGE_64_BIT_UID=y

  secure_storage.psa.ps.secure_storage.custom.aead_crypt:
    filter: CONFIG_SECURE_STORAGE and not CONFIG_SECURE_STORAGE_PS_STORE_IMPLEMENTATION_NONE
    extra_args: "EXTRA_CONF_FILE=\
      overlay-secure_storage.conf;overlay-transform_default.conf;\
      overlay-store_settings.conf;overlay-transform_aead_crypt_custom.conf;\
      overlay-its_store_settings.conf"

  secure_storage.psa.ps.secure_storage.custom.transform:
    filter: CONFIG_SECURE_STORAGE and not CONFIG_SECURE_STORAGE_PS_STORE_IMPLEMENTATION_NONE
    extra_args: "EXTRA_CONF_FILE=\
      overlay-secure_storage.conf;overlay-transform_custom.conf;overlay-store_settings.conf;\
      overlay-its_store_settings.conf"

  secure_storage.psa.ps.secure_storage.custom.store:
    filter: CONFIG_SECURE_STORAGE
    extra_args: "EXTRA_CONF_FILE=\
      overlay-secure_storage.conf;overlay-transform_default.conf;overlay-store_custom.conf;\
      overlay-its_store_settings.conf"

  secure_storage.psa.ps.secure_storage.custom.both:
    filter: CONFIG_SECURE_STORAGE
    extra_args: "EXTRA_CONF_FILE=\
      overlay-secure_storage.conf;overlay-transform_custom.conf;overlay-store_custom.conf;\
      overlay-its_store_settings.conf"

  # secure_storage.psa.ps.tfm:
  #   filter: CONFIG_BUILD_WITH_TFM
  #   integration_platforms:
  #     - nrf9151dk/nrf9151/ns
  #   extra_args: EXTRA_CONF_FILE=overlay-tfm.conf
