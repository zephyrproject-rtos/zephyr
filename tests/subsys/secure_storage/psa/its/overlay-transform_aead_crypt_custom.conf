# Used on top of overlay-transform_default.conf to keep the rest of the AEAD transform as is.
CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_CRYPT_CUSTOM=y

# Exercise a different nonce size and output overhead.
CONFIG_SECURE_STORAGE_ITS_TRANSFORM_AEAD_NONCE_SIZE=24
CONFIG_SECURE_STORAGE_ITS_TRANSFORM_OUTPUT_OVERHEAD=56

# Make the overall entry size stay below SETTINGS_MAX_VAL_LEN.
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=199
