tests:

  mpipe.core.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64

  mpipe.utils.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_DUMP=y
      - CONFIG_MPIPE_PLAYER=y
      - CONFIG_MPIPE_PLAYER_DUMP_ON_STATE_CHANGE=y

  mpipe.base.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_BASE=y
      - CONFIG_MPIPE_BASE_CAPS_FILTER=y
      - CONFIG_MPIPE_BASE_QUEUE=y
      - CONFIG_MPIPE_BASE_TEE=y

  mpipe.aud.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_I2S=y
      - CONFIG_AUDIO_DMIC=y
      - CONFIG_AUDIO_CODEC=y
      - CONFIG_MPIPE_AUD=y
