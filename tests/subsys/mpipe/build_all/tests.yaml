tests:

  mpipe.core.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64

  mpipe.utils.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_DUMP=y
      - CONFIG_MPIPE_PLAYER=y
      - CONFIG_MPIPE_PLAYER_DUMP_ON_STATE_CHANGE=y

  mpipe.base.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_BASE=y
      - CONFIG_MPIPE_BASE_APP_SINK=y
      - CONFIG_MPIPE_BASE_APP_SRC=y
      - CONFIG_MPIPE_BASE_CAPS_FILTER=y
      - CONFIG_MPIPE_BASE_QUEUE=y
      - CONFIG_MPIPE_BASE_TEE=y

  mpipe.fs.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_FS=y

  mpipe.net.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_NETWORKING=y
      - CONFIG_NET_IPV4=y
      - CONFIG_NET_TCP=y
      - CONFIG_NET_SOCKETS=y
      - CONFIG_MPIPE_NET=y

  mpipe.net.build.ipv4_only:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_NETWORKING=y
      - CONFIG_NET_IPV4=y
      - CONFIG_NET_IPV6=n
      - CONFIG_NET_TCP=y
      - CONFIG_NET_SOCKETS=y
      - CONFIG_MPIPE_NET=y
