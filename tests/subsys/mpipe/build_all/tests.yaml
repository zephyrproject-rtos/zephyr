tests:

  mpipe.core.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64

  mpipe.aud.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_I2S=y
      - CONFIG_AUDIO_DMIC=y
      - CONFIG_AUDIO_CODEC=y
      - CONFIG_MPIPE_AUD=y
