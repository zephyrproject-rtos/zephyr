tests:

  mpipe.core.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64

  mpipe.base.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_BASE=y
      - CONFIG_MPIPE_BASE_CAPS_FILTER=y
      - CONFIG_MPIPE_BASE_QUEUE=y
      - CONFIG_MPIPE_BASE_TEE=y

  mpipe.vid.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_VID=y
      - CONFIG_MPIPE_VID_CONVERT=y

  mpipe.img.build:
    tags:
      - subsys
      - mpipe
    build_only: true
    platform_allow:
      - native_sim/native/64
    extra_args:
      - CONFIG_MPIPE_IMG=y
