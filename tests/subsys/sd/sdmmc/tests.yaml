common:
  depends_on: sdhc
  tags:
    - drivers
    - sdhc
tests:
  sd.sdmmc:
    harness: ztest
    harness_config:
      fixture: fixture_sdhc
    filter: dt_compat_enabled("zephyr,sdmmc-disk")
    tags: sdhc
    min_ram: 32
    integration_platforms:
      - mimxrt1064_evk
  sd.sdmmc.emul:
    depends_on: []
    harness: ztest
    filter: dt_compat_enabled("zephyr,sdmmc-disk")
    platform_allow:
      - native_sim
      - native_sim/native/64
