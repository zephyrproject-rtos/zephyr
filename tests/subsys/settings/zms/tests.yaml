tests:
  settings.zms:
    filter: dt_label_with_parent_compat_enabled("storage_partition", "fixed-partitions") or
            dt_label_compat_enabled("storage_partition", "zephyr,mapped-partition")
    min_ram: 32
    tags:
      - settings
      - zms
  settings.zms.sim.no_erase:
    extra_configs:
      - CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=n
      - CONFIG_FLASH_SIMULATOR_CALLBACKS=y
      - CONFIG_SETTINGS_ZMS_RELINK_NAMES=y
    platform_allow:
      - native_sim
      - qemu_x86
    tags:
      - settings
      - zms
