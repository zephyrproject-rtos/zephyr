CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y

CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_TEST=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=8
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HTTP_CLIENT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_BLOCK_BUF_SIZE=512

CONFIG_FOTA_HTTP=y
CONFIG_FOTA_HTTP_SHELL=n
CONFIG_FOTA_HTTP_RECV_BUF_SIZE=1024
CONFIG_FOTA_HTTP_TIMEOUT_MS=5000
CONFIG_FOTA_HTTP_MAX_REDIRECTS=2
CONFIG_FOTA_HTTP_SHA256_CHECK=y
CONFIG_FOTA_HTTP_REJECT_DOWNGRADE=y
CONFIG_FOTA_HTTP_THREAD_STACK_SIZE=8192
