CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=4
# The Bluetooth SMP transport source is included by src/main.c; the
# CONFIG_MCUMGR_TRANSPORT_BT library source stays disabled so it is not
# compiled twice.
# struct smp_bt_user_data is 16 bytes on 64-bit targets (pointer + id).
CONFIG_MCUMGR_TRANSPORT_NETBUF_USER_DATA_SIZE=16
