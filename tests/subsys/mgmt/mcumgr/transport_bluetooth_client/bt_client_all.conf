# Credits must not exceed the ATT transmit buffer count, so raise both together
CONFIG_BT_ATT_TX_COUNT=16
CONFIG_MCUMGR_TRANSPORT_BT_CLIENT_TX_CREDITS=16
CONFIG_MCUMGR_TRANSPORT_BT_CLIENT_TX_CREDIT_TIMEOUT=10000
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512

# The SMP server transport alongside the client one; both register as client transports
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# Builds the transport's name field
CONFIG_MCUMGR_GRP_TRANSPORT=y
CONFIG_MCUMGR_GRP_TRANSPORT_INFO_FUNCTIONS=y
