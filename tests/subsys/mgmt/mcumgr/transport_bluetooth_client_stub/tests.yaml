common:
  platform_allow:
    - native_sim
    - native_sim/native/64
    - qemu_x86
    - qemu_cortex_m3
    - mps2/an385
  integration_platforms:
    - native_sim
  tags:
    - mgmt
    - mcumgr
    - transport
    - bluetooth
tests:
  mgmt.mcumgr.transport.bluetooth_client.stub: {}
  # Two bridge connects wait out the 30 s connect deadline
  mgmt.mcumgr.transport.bluetooth_client.stub.bridge:
    timeout: 240
    extra_args:
      - EXTRA_CONF_FILE="bridge.conf"
