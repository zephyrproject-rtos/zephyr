CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_SMP_CLIENT=y
CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y

# The stub answers from the system work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# Lets the test check that refused transmits release their packet
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_AVAILABLE=y

# Headroom for a command a test leaves outstanding
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=6
