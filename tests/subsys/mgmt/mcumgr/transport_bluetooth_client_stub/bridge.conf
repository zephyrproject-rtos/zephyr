# The transport as the outgoing side of transport management bridges, with the raw dummy
# transport as the incoming side. The SMP client is not built together with bridges.
CONFIG_SMP_CLIENT=n
CONFIG_MCUMGR_GRP_TRANSPORT=y
CONFIG_MCUMGR_TRANSPORT_RAW_DUMMY=y
CONFIG_MCUMGR_TRANSPORT_RAW_DUMMY_RX_BUF_SIZE=384

# The bridge connect runs on the MCUmgr work queue
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
