common:
  platform_allow:
    - native_sim
    - native_sim/native/64
    - qemu_x86
    - qemu_cortex_m3
    - mps2/an385
  integration_platforms:
    - native_sim
  tags:
    - mgmt
    - mcumgr
    - transport
    - bluetooth
tests:
  mgmt.mcumgr.transport.bluetooth_client.idle:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="no_hci.overlay"
  mgmt.mcumgr.transport.bluetooth_client.idle.with_server:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="no_hci.overlay"
      - EXTRA_CONF_FILE="server.conf"
  mgmt.mcumgr.transport.bluetooth_client.idle.all:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="no_hci.overlay"
      - EXTRA_CONF_FILE="server.conf;bt_client_all.conf"
  mgmt.mcumgr.transport.bluetooth_client.idle.bridge_out:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="no_hci.overlay"
      - EXTRA_CONF_FILE="bridge_out.conf"
