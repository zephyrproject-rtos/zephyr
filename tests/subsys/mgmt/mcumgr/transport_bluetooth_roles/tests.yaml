common:
  platform_allow: nrf52840dk/nrf52840
  tags:
    - mgmt
    - mcumgr
    - transport
    - bluetooth
  build_only: true
tests:
  mgmt.mcumgr.transport.bluetooth.roles.server:
    extra_configs:
      - CONFIG_TEST_MCUMGR_BT_ROLE_SERVER=y
      - CONFIG_BT_PERIPHERAL=y
      - CONFIG_MCUMGR_TRANSPORT_BT=y
  mgmt.mcumgr.transport.bluetooth.roles.client:
    extra_configs:
      - CONFIG_TEST_MCUMGR_BT_ROLE_CLIENT=y
      - CONFIG_BT_CENTRAL=y
      - CONFIG_BT_GATT_CLIENT=y
      - CONFIG_SMP_CLIENT=y
      - CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y
  mgmt.mcumgr.transport.bluetooth.roles.both:
    extra_configs:
      - CONFIG_TEST_MCUMGR_BT_ROLE_BOTH=y
      - CONFIG_BT_PERIPHERAL=y
      - CONFIG_BT_CENTRAL=y
      - CONFIG_BT_GATT_CLIENT=y
      - CONFIG_BT_MAX_CONN=2
      - CONFIG_MCUMGR_TRANSPORT_BT=y
      - CONFIG_SMP_CLIENT=y
      - CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y
  mgmt.mcumgr.transport.bluetooth.roles.server_bridge:
    extra_configs:
      - CONFIG_TEST_MCUMGR_BT_ROLE_SERVER_BRIDGE=y
      - CONFIG_BT_PERIPHERAL=y
      - CONFIG_BT_CENTRAL=y
      - CONFIG_BT_GATT_CLIENT=y
      - CONFIG_BT_MAX_CONN=2
      - CONFIG_MCUMGR_TRANSPORT_BT=y
      - CONFIG_MCUMGR_GRP_TRANSPORT=y
      - CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y
  mgmt.mcumgr.transport.bluetooth.roles.bridge_out:
    extra_configs:
      - CONFIG_TEST_MCUMGR_BT_ROLE_BRIDGE_OUT=y
      - CONFIG_BT_CENTRAL=y
      - CONFIG_BT_GATT_CLIENT=y
      - CONFIG_MCUMGR_GRP_TRANSPORT=y
      - CONFIG_MCUMGR_TRANSPORT_BT_CLIENT=y
