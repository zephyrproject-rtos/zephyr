common:
  tags: pm

tests:
  pm.device_runtime.stress:
    timeout: 300
    platform_allow:
      - qemu_x86
      - qemu_cortex_a53/qemu_cortex_a53/smp
  pm.device_runtime.stress.isr_safe:
    timeout: 300
    platform_allow:
      - qemu_x86
      - qemu_cortex_a53/qemu_cortex_a53/smp
    extra_configs:
      - CONFIG_TEST_PM_DEVICE_ISR_SAFE=y
