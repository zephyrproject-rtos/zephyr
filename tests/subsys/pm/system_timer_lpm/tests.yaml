common:
  tags:
    - pm
  harness: ztest
  timeout: 120
  # Run only where a system-timer low-power companion is configured, so the
  # test stays vendor-neutral and self-selects the relevant boards.
  filter: CONFIG_SYSTEM_TIMER_LPM_COMPANION_HOOKS or
    CONFIG_SYSTEM_TIMER_LPM_COMPANION_COUNTER
tests:
  pm.system_timer_lpm:
    integration_platforms:
      - kit_psc3m5_evk
      - kit_psc3m6_eval/psc3m6ges3ahq1
      - kit_pse84_eval/pse846gps2dbzc4a/m33
      - kit_pse84_eval/pse846gps2dbzc4a/m55
  pm.system_timer_lpm.mspm0:
    platform_allow:
      - lp_mspm0g3507
      - lp_mspm0g3519
      - lp_mspm0l2228
    integration_platforms:
      - lp_mspm0g3519
      - lp_mspm0l2228
    extra_args:
      - EXTRA_CONF_FILE=boards/lp_mspm0.conf
      - EXTRA_DTC_OVERLAY_FILE=boards/lp_mspm0.overlay
