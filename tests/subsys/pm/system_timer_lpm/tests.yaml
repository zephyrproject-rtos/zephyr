common:
  tags:
    - pm
  harness: ztest
  timeout: 120
  # Run only where a system-timer low-power companion is configured, so the
  # test stays vendor-neutral and self-selects the relevant boards.
  filter: CONFIG_SYSTEM_TIMER_LPM_COMPANION_HOOKS or
    CONFIG_SYSTEM_TIMER_LPM_COMPANION_COUNTER
tests:
  pm.system_timer_lpm:
    integration_platforms:
      - frdm_mcxa156
      - frdm_ke17z
