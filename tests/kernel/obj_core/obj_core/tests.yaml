tests:
  kernel.obj_core:
    tags: kernel
    integration_platforms:
      - qemu_x86
    platform_exclude:
      - qemu_x86_tiny
  kernel.obj_core.userspace:
    tags: kernel
    filter: CONFIG_ARCH_HAS_USERSPACE
    integration_platforms:
      - qemu_x86
    platform_exclude:
      - qemu_x86_tiny
    extra_configs:
      - CONFIG_USERSPACE=y
      - CONFIG_DYNAMIC_OBJECTS=y
