tests:
  kernel.ipi_optimize.smp:
    tags:
      - kernel
      - smp
    filter: (CONFIG_MP_MAX_NUM_CPUS > 1)

  kernel.ipi_optimize.smp_idle:
    tags:
      - kernel
      - smp
    extra_configs:
      - CONFIG_IPI_OPTIMIZE_IDLE=y
      - CONFIG_SCHED_CPU_MASK=y
    filter: >-
      (CONFIG_MP_MAX_NUM_CPUS > 2) and
      CONFIG_ARCH_HAS_DIRECTED_IPIS

  kernel.ipi_optimize.smp_idle_metairq:
    tags:
      - kernel
      - smp
    extra_configs:
      - CONFIG_IPI_OPTIMIZE_IDLE=y
      - CONFIG_SCHED_CPU_MASK=y
      - CONFIG_NUM_METAIRQ_PRIORITIES=1
    filter: >-
      (CONFIG_MP_MAX_NUM_CPUS > 2) and
      CONFIG_ARCH_HAS_DIRECTED_IPIS

  kernel.ipi_optimize.smp_idle_pm:
    build_only: true
    platform_allow:
      - intel_adsp/cavs25
    tags:
      - kernel
      - smp
    extra_configs:
      - CONFIG_IPI_OPTIMIZE_IDLE=y
      - CONFIG_SCHED_CPU_MASK=y
      - CONFIG_PM=y

  kernel.ipi_optimize.smp_pm:
    tags:
      - kernel
      - smp
      - pm
    platform_allow:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    extra_configs:
      - CONFIG_SCHED_CPU_MASK=y
      - CONFIG_TEST_IPI_PM_HOOKS=y
