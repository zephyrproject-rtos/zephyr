tests:
  kernel.workqueue.api:
    min_flash: 34
    tags: kernel
    # hifive1 platform fails to run due to #40376, all
    # the related CI checks got blocked, so exclude it.
    # qemu_rx platform fails to run due to #92213, exclude this
    # for now until the issue is resolved.
    platform_exclude:
      - hifive1
      - qemu_rx
    timeout: 80
  kernel.workqueue.api.tracing:
    tags: kernel
    timeout: 80
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_TRACING=y
      - CONFIG_TRACING_CTF=y
      - CONFIG_TRACING_BACKEND_POSIX=y
      - CONFIG_TRACING_PACKET_MAX_SIZE=256
      - CONFIG_TRACING_SYNC=y
