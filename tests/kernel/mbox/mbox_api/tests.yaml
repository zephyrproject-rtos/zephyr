tests:
  kernel.mailbox.api:
    tags:
      - kernel
      - mailbox
  kernel.mailbox.api.tracing:
    tags:
      - kernel
      - mailbox
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_TRACING=y
      - CONFIG_TRACING_CTF=y
      - CONFIG_TRACING_BACKEND_POSIX=y
      - CONFIG_TRACING_PACKET_MAX_SIZE=256
      - CONFIG_TRACING_SYNC=y
