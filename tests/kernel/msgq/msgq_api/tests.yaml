common:
  tags:
    - kernel
    - userspace
  # Renode drops an svc when an IRQ is pending but masked, so
  # test_msgq_isr loses an irq_offload() on this target.
  # https://github.com/renode/renode/issues/1035
  platform_exclude:
    - cortex_r8_virtual/cortex_r8_virtual/smp
tests:
  kernel.message_queue: {}
  kernel.message_queue.put_front:
    extra_configs:
      - CONFIG_TEST_MSGQ_PUT_FRONT=y
