common:
  tags:
    - kernel
    - spinlock

tests:
  kernel.critical_section_hooks.up:
    platform_allow:
      - qemu_cortex_a53
    integration_platforms:
      - qemu_cortex_a53
  kernel.critical_section_hooks.smp:
    platform_allow:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    extra_configs:
      - CONFIG_MP_MAX_NUM_CPUS=2
  kernel.critical_section_hooks.time_limit:
    platform_allow:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    extra_configs:
      - CONFIG_MP_MAX_NUM_CPUS=2
      - CONFIG_SPIN_VALIDATE=y
      - CONFIG_SPIN_LOCK_TIME_LIMIT=1000000000
