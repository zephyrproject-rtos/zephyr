common:
  tags:
    - kernel
    - process
tests:
  kernel.process:
    integration_platforms:
      - qemu_cortex_m3
      - qemu_x86
  kernel.process.sigchld:
    filter: not CONFIG_USERSPACE
    integration_platforms:
      - qemu_cortex_m3
      - qemu_x86
    extra_configs:
      - CONFIG_SIGNAL=y
      - CONFIG_SIGNAL_SET_SIZE=40
      # k_kill_pgrp queues one signal per group member simultaneously, and each
      # spawned child that exits leaves a best-effort SIGCHLD queued to the
      # (kernel) test process, which keeps it masked; size the queue with
      # headroom for both. test_kill installs one signal handler.
      - CONFIG_SIGNAL_QUEUE_SIZE=8
      - CONFIG_SIGNAL_ACTION_DB_SIZE=2
  kernel.process.init:
    filter: not CONFIG_USERSPACE
    integration_platforms:
      - qemu_cortex_m3
      - qemu_x86
    extra_configs:
      - CONFIG_PROCESS_INIT=y
  kernel.process.userspace:
    filter: CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    integration_platforms:
      - qemu_cortex_m3
      - qemu_x86
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      # SMP platforms' per-CPU statics push the thread-object count
      # past the default 16-thread permission bitmap
      - CONFIG_MAX_THREAD_BYTES=3
  kernel.process.heap:
    integration_platforms:
      - qemu_cortex_m3
      - qemu_x86
    extra_configs:
      - CONFIG_SYS_PROCESS_MAX=4
      - CONFIG_HEAP_MEM_POOL_SIZE=8192
  kernel.process.heap.userspace:
    filter: CONFIG_ARCH_HAS_USERSPACE
    tags: userspace
    integration_platforms:
      - qemu_cortex_m3
      - qemu_x86
    extra_configs:
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      # SMP platforms' per-CPU statics push the thread-object count
      # past the default 16-thread permission bitmap
      - CONFIG_MAX_THREAD_BYTES=3
      - CONFIG_SYS_PROCESS_MAX=4
      - CONFIG_HEAP_MEM_POOL_SIZE=8192
      # 6 heap-growth children + the suite's other thread objects exceed the
      # 16-thread kobject permission bitmap
      - CONFIG_MAX_THREAD_BYTES=4
  kernel.process.pool:
    integration_platforms:
      - qemu_cortex_m3
      - qemu_x86
    extra_configs:
      - CONFIG_SYS_THREAD=y
      - CONFIG_SYS_THREAD_THREAD_MAX=2
      - CONFIG_SYS_THREAD_STACK_MAX=2
      - CONFIG_HEAP_MEM_POOL_SIZE=16384
      # SYS_THREAD selects SIGNAL; size the DBs like kernel.process.sigchld
      - CONFIG_SIGNAL_SET_SIZE=40
      - CONFIG_SIGNAL_QUEUE_SIZE=8
      - CONFIG_SIGNAL_ACTION_DB_SIZE=8
