tests:
  kernel.pipe.api:
    tags:
      - kernel
      - userspace
  kernel.pipe.api.tracing:
    tags:
      - kernel
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_TRACING=y
      - CONFIG_TRACING_CTF=y
      - CONFIG_TRACING_BACKEND_POSIX=y
      - CONFIG_TRACING_PACKET_MAX_SIZE=256
      - CONFIG_TRACING_SYNC=y
