common:
  # Renode drops an svc when an IRQ is pending but masked, so
  # test_sys_sem_give_take_from_isr loses an irq_offload() on this target.
  # https://github.com/renode/renode/issues/1035
  platform_exclude:
    - cortex_r8_virtual/cortex_r8_virtual/smp
tests:
  kernel.memory_protection.sys_sem:
    filter: CONFIG_ARCH_HAS_USERSPACE
    arch_exclude:
      - posix
    tags:
      - kernel
      - userspace
  kernel.memory_protection.sys_sem.nouser:
    extra_configs:
      - CONFIG_TEST_USERSPACE=n
    tags: kernel
