CONFIG_ZTEST=y
CONFIG_SYS_THREAD=y

# these should be 1 larger than the corresponding MIN_ADD values in Kconfig
CONFIG_SYS_THREAD_STACK_MAX=3
CONFIG_SYS_THREAD_THREAD_MAX=3

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# This is to avoid ballooning stack sizes with large guard regions on x86*
CONFIG_INIT_STACKS=y
CONFIG_MAX_THREAD_BYTES=6
CONFIG_HW_STACK_PROTECTION=n
CONFIG_TEST_HW_STACK_PROTECTION=n
CONFIG_THREAD_DETACH=y
