common:
  ignore_faults: true
  tags:
    - kernel
tests:
  kernel.threads.restart:
    filter: CONFIG_THREAD_RESTARTABLE
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - qemu_x86
      - qemu_x86_64
      - qemu_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
      - qemu_riscv64
      - qemu_riscv64/qemu_virt_riscv64/smp
      - qemu_riscv64/qemu_virt_riscv64/smode
      - qemu_cortex_a53
      - qemu_cortex_a53/qemu_cortex_a53/smp
      - qemu_cortex_a9
      - qemu_cortex_r5
      - qemu_arc/qemu_arc_em
      - qemu_arc/qemu_arc_hs
      - qemu_arc/qemu_arc_hs/xip
      - qemu_arc/qemu_arc_hs5x
      - qemu_arc/qemu_arc_hs6x
      - qemu_xtensa/dc233c
      - qemu_xtensa/dc233c/mmu
      - qemu_xtensa/sample_controller32/mpu
      - qemu_leon3
      - qemu_or1k
      - qemu_malta
      - qemu_rx
    integration_platforms:
      - native_sim
      - qemu_cortex_m3
      - qemu_x86
      - qemu_x86_64
  kernel.threads.restart.smp_isr:
    filter: CONFIG_THREAD_RESTARTABLE and CONFIG_SMP
    # Targets where aborting a thread from an ISR works on SMP
    platform_allow:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
    extra_configs:
      - CONFIG_IRQ_OFFLOAD=y
  kernel.threads.restart.use_switch:
    filter: CONFIG_THREAD_RESTARTABLE
    platform_allow:
      - qemu_cortex_m3
    integration_platforms:
      - qemu_cortex_m3
    extra_configs:
      - CONFIG_USE_SWITCH=y
  kernel.threads.restart.use_switch.aarch32:
    filter: CONFIG_THREAD_RESTARTABLE
    platform_allow:
      - qemu_cortex_a9
      - qemu_cortex_r5
    extra_configs:
      - CONFIG_USE_SWITCH=y
      # The AArch32 USE_SWITCH port saves no FPU context
      - CONFIG_FPU_SHARING=n
      - CONFIG_FPU=n
  kernel.threads.restart.dynamic_stack:
    filter: CONFIG_THREAD_RESTARTABLE and CONFIG_DYNAMIC_THREAD
    platform_allow:
      - native_sim
      - qemu_cortex_m3
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_THREAD_STACK_INFO=y
      - CONFIG_DYNAMIC_THREAD=y
      - CONFIG_DYNAMIC_THREAD_POOL_SIZE=1
      - CONFIG_DYNAMIC_THREAD_STACK_SIZE=4096
  kernel.threads.restart.disabled:
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - qemu_x86
      - qemu_riscv32
      - qemu_cortex_a53
      - qemu_cortex_a9
      - qemu_arc/qemu_arc_hs
      - qemu_xtensa/dc233c
      - qemu_leon3
      - qemu_or1k
      - qemu_malta
      - qemu_rx
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_THREAD_RESTARTABLE=n
  kernel.threads.restart.userspace:
    filter: CONFIG_THREAD_RESTARTABLE and CONFIG_ARCH_HAS_USERSPACE
    platform_allow:
      - mps2/an385
      - qemu_riscv32
      - qemu_cortex_r5
      - qemu_arc/qemu_arc_em
    integration_platforms:
      - mps2/an385
    extra_configs:
      - CONFIG_USERSPACE=y
      - CONFIG_DYNAMIC_OBJECTS=y
      - CONFIG_HEAP_MEM_POOL_SIZE=32768
