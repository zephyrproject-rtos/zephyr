# Note: for dynamic stacks, x86 tends to require full guard pages for any stacks that are not
# statically allocated. On MMU platforms, SYS_THREAD_STACK_ALLOC_ANON satisfies allocations
# beyond the static pool (including oversized requests) with anonymous paged memory, so x86 is
# included in the 'alloc' test configurations.

common:
  tags:
    - kernel
    - security
  min_ram: 32
  # 1 tier0 platform per supported architecture
  platform_key:
    - arch
    - simulation
# Permutations of (pool | alloc | user)
tests:
  kernel.threads.dynamic_thread.stack.no_pool.no_alloc.no_user:
    extra_configs:
      # 000
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=0
      - CONFIG_SYS_THREAD_STACK_MAX=0
      - CONFIG_USERSPACE=n
  kernel.threads.dynamic_thread.stack.no_pool.no_alloc.user:
    tags: userspace
    # Userspace is not yet enabled on rpi_zero_2w (BCM2710 / cortex-a53);
    # forcing CONFIG_USERSPACE=y on a board without USERSPACE_SUPPORTED
    # trips a build-time _Bool[0] assertion.
    platform_exclude: rpi_zero_2w
    filter: CONFIG_ARCH_HAS_USERSPACE
    extra_configs:
      # 001
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=0
      - CONFIG_SYS_THREAD_STACK_MAX=0
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  kernel.threads.dynamic_thread.stack.no_pool.alloc.no_user:
    extra_configs:
      # 010
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=0
      - CONFIG_SYS_THREAD_STACK_MAX=3
      - CONFIG_USERSPACE=n
  kernel.threads.dynamic_thread.stack.no_pool.alloc.user:
    tags: userspace
    # See kernel.threads.dynamic_thread.stack.no_pool.no_alloc.user above.
    platform_exclude: rpi_zero_2w
    # test_dynamic_thread_stack_permission expects a kernel oops here; it
    # skips itself unless prefer_alloc, alloc and userspace are all enabled.
    ignore_faults: true
    filter: CONFIG_ARCH_HAS_USERSPACE
    extra_configs:
      # 011
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=0
      - CONFIG_SYS_THREAD_STACK_MAX=3
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  kernel.threads.dynamic_thread.stack.pool.no_alloc.no_user:
    extra_configs:
      # 100
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=2
      - CONFIG_SYS_THREAD_STACK_MAX=2
      - CONFIG_USERSPACE=n
  kernel.threads.dynamic_thread.stack.pool.no_alloc.user:
    tags: userspace
    # See kernel.threads.dynamic_thread.stack.no_pool.no_alloc.user above.
    platform_exclude: rpi_zero_2w
    filter: CONFIG_ARCH_HAS_USERSPACE
    extra_configs:
      # 101
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=2
      - CONFIG_SYS_THREAD_STACK_MAX=2
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  kernel.threads.dynamic_thread.stack.pool.alloc.no_user:
    extra_configs:
      # 110
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=2
      - CONFIG_SYS_THREAD_STACK_MAX=4
      - CONFIG_USERSPACE=n
  kernel.threads.dynamic_thread.stack.pool.alloc.user:
    tags: userspace
    # See kernel.threads.dynamic_thread.stack.no_pool.no_alloc.user above.
    platform_exclude: rpi_zero_2w
    # See kernel.threads.dynamic_thread.stack.no_pool.alloc.user.
    ignore_faults: true
    filter: CONFIG_ARCH_HAS_USERSPACE
    extra_configs:
      # 111
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=2
      - CONFIG_SYS_THREAD_STACK_MAX=4
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
  kernel.threads.dynamic_thread.stack.pool.alloc.user.paged:
    tags: userspace
    filter: CONFIG_ARCH_HAS_USERSPACE and CONFIG_ARCH_HAS_DEMAND_PAGING
    extra_configs:
      # 111 + demand paging: mapped stacks must be pinned (K_MEM_MAP_LOCK)
      - CONFIG_SYS_THREAD_STACK_MIN_ADD_TEST=2
      - CONFIG_SYS_THREAD_STACK_MAX=4
      - CONFIG_TEST_USERSPACE=y
      - CONFIG_USERSPACE=y
      - CONFIG_DEMAND_PAGING=y
      - CONFIG_BACKING_STORE_RAM=y
      - CONFIG_EVICTION_NRU=y
