tests:
  secure_call.tz:
    tags:
      - secure_call
      - trustzone
      - arm
    platform_allow:
      - mps2/an521/cpu0/ns
    integration_platforms:
      - mps2/an521/cpu0/ns
    sysbuild: true
    harness: pytest
    harness_config:
      pytest_root:
        - pytest/test_tz_calls.py
    timeout: 120

  secure_call.tz.hw:
    tags:
      - secure_call
      - trustzone
      - arm
    platform_allow:
      - kit_pse84_eval/pse846gps2dbzc4a/m33/ns
      - kit_pse84_ai/pse846gps2dbzc4a/m33/ns
      - kit_psc3m5_evk/psc3m5fds2afq1/ns
    integration_platforms:
      - kit_pse84_eval/pse846gps2dbzc4a/m33/ns
    sysbuild: true
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "SC_ADD: 7"
        - "SC_NOP: 42"
        - "SC_FILL: OK"
        - "NS: test complete"
    timeout: 120
