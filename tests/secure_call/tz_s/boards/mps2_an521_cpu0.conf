CONFIG_ARM_NSC_REGION_BASE_ADDRESS=0x0001E000
CONFIG_ARM_NSC_REGION_IN_NS_ALIAS=y
CONFIG_ARM_TZ_MPC=y
CONFIG_ARM_SSE200_SPCTRL=y

# NS image vector table: code SRAM at NS alias 0x00100000 (Secure alias 0x10100000).
CONFIG_SECURE_CALL_NS_IMAGE_BASE=0x00100000
CONFIG_SECURE_CALL_NS_IMAGE_BASE_SECURE_ALIAS=0x10100000
