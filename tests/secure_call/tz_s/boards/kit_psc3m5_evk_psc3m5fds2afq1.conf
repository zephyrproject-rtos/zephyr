CONFIG_ARM_NSC_REGION_BASE_ADDRESS=0x1201e000
CONFIG_ARM_NSC_REGION_IN_NS_ALIAS=y
CONFIG_INFINEON_MPC=y
CONFIG_INFINEON_PPC=y

# PSC3 is Infineon silicon (BXNS raises INVTRAN): enter NS via the arch SVC flow.
CONFIG_ARM_SECURE_DOMAIN_ENTRY_SVC=y

# NS image vector table: NS flash alias 0x02010000 (Secure alias 0x12010000).
CONFIG_SECURE_CALL_NS_IMAGE_BASE=0x02010000
CONFIG_SECURE_CALL_NS_IMAGE_BASE_SECURE_ALIAS=0x12010000
