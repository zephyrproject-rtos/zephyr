CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_BOOT_SHARE_DATA=y
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n

# Use the external RNG instead of the Mbed TLS legacy one (entropy module +
# HMAC/CTR-DRBG). Seeding the legacy RNG during psa_crypto_init() overflows
# the default main stack. MCUboot only verifies an RSA signature here, which
# needs no random numbers. There is no entropy driver in this image, so any
# PSA operation requiring random data would fail with this configuration.
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
