common:
  timeout: 5
  tags: clock_control

tests:
  drivers.clock.stm32_clock_configuration.h7p_core.sysclk_hsi_64:
    extra_args: DTC_OVERLAY_FILE="boards/clear_clocks.overlay;boards/hsi_64.overlay"
    platform_allow: nucleo_h7p5ii
    integration_platforms:
      - nucleo_h7p5ii
  drivers.clock.stm32_clock_configuration.h7p_core.sysclk_pll_hsi_400:
    extra_args: DTC_OVERLAY_FILE="boards/clear_clocks.overlay;boards/pll_hsi_400.overlay"
    platform_allow: nucleo_h7p5ii
    integration_platforms:
      - nucleo_h7p5ii
