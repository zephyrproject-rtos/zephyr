common:
  tags:
    - adc
    - drivers
    - userspace
  depends_on: adc
  required_snippets:
    - hw-test
  # A zephyr,user channel list, or a channel described under an enabled ADC
  # controller (zephyr,gain is required in every ADC channel node).
  filter: >-
    dt_node_has_prop("/zephyr,user","io-channels") or
    dt_any_enabled_node_has_prop("zephyr,gain")
  min_flash: 40

tests:
  drivers.adc:
    platform_exclude:
      - nucleo_u031r8
      - panb611evb/nrf54l15/cpuapp
      - panb611evb/nrf54l15/cpuapp/ns
      - nrf54l15dk/nrf54l10/cpuapp/ns
      - nrf54lm20dk/nrf54lm20a/cpuapp/ns
      - bl54l15_dvk/nrf54l10/cpuapp/ns
      - bl54l15_dvk/nrf54l15/cpuapp/ns
      - rpi_pico/rp2040/mcuboot
      - rpi_pico/rp2040/w/mcuboot
      - rpi_pico2/rp2350a/m33/mcuboot
      - rpi_pico2/rp2350a/m33/w/mcuboot
      - raytac_an54lq_db_15/nrf54l15/cpuapp/ns
      - raytac_an54lv_db_15/nrf54l15/cpuapp/ns
  drivers.adc.b_u585i_iot02a_adc4:
    extra_args:
      - platform:b_u585i_iot02a/stm32u585xx:DTC_OVERLAY_FILE="boards/b_u585i_iot02a_adc4.overlay"
    platform_allow:
      - b_u585i_iot02a
  drivers.adc.dma_st_stm32:
    depends_on:
      - dma
    platform_allow:
      - b_u585i_iot02a
      - disco_l475_iot1
      - nucleo_c5a3zg
      - nucleo_f091rc
      - nucleo_f103rb
      - nucleo_f207zg
      - nucleo_f401re
      - nucleo_f429zi
      - nucleo_f439zi
      - nucleo_f746zg
      - nucleo_g071rb
      - nucleo_g474re
      - nucleo_h743zi
      - nucleo_h753zi
      - nucleo_l073rz
      - nucleo_l152re
      - nucleo_l476rg
      - nucleo_u083rc
      - nucleo_u385rg_q
      - nucleo_u575zi_q
      - nucleo_wb55rg
      - nucleo_wba55cg
      - nucleo_wba65ri
      - nucleo_wl55jc
      - stm32f3_disco
      - stm32h573i_dk
      - stm32u083c_dk
    extra_args:
      - EXTRA_CONF_FILE=overlay-dma-stm32.conf
      - platform:nucleo_f103rb/stm32f103xb:DTC_OVERLAY_FILE="boards/nucleo_f103rb_dma.overlay"
    integration_platforms:
      - disco_l475_iot1
      - nucleo_l476rg
  drivers.adc.dma_nxp_kinetis:
    extra_args:
      - EXTRA_CONF_FILE="overlay-dma-kinetis.conf"
    depends_on:
      - dma
    min_flash: 40
    platform_allow:
      - frdm_k64f
      - frdm_k82f
    integration_platforms:
      - frdm_k82f
  drivers.adc.dma_nxp_lpadc:
    extra_args:
      - EXTRA_CONF_FILE=overlay-dma-nxp-lpadc.conf
    depends_on:
      - dma
      - adc
    platform_allow:
      - frdm_mcxa156
    integration_platforms:
      - frdm_mcxa156
  drivers.adc.dma_espressif:
    extra_args:
      - EXTRA_CONF_FILE="overlay-dma-esp32.conf"
    depends_on:
      - adc
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32c3_devkitc
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32h2_devkitm
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
  drivers.adc.dma_silabs:
    extra_args:
      - EXTRA_CONF_FILE="overlay-dma-silabs.conf"
    depends_on:
      - dma
    platform_allow:
      - slwrb4180a
      - sltb010a
      - xg23_rb4210a
      - xg24_rb4187c
      - xg27_dk2602a
      - bg29_rb4420a
      - xg29_rb4412a
      - kg100s_rb4332a
  drivers.adc.dma_silabs_async:
    extra_args:
      - EXTRA_CONF_FILE="overlay-dma-silabs.conf"
      - CONFIG_ADC_ASYNC=y
    depends_on:
      - dma
    platform_allow:
      - slwrb4180a
      - sltb010a
      - xg23_rb4210a
      - xg24_rb4187c
      - xg27_dk2602a
      - bg29_rb4420a
      - xg29_rb4412a
      - kg100s_rb4332a
  drivers.adc.error_cases:
    extra_configs:
      - CONFIG_TEST_ADC_BASIC=n
      - CONFIG_TEST_ADC_ERROR_CASES=y
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54h20dk/nrf54h20/cpuppr
      - ophelia4ev/nrf54l15/cpuapp
      - sltb010a
      - xg23_rb4210a
      - xg24_rb4187c
      - xg27_dk2602a
      - xg29_rb4412a
      - bg29_rb4420a
      - slwrb4180a
      - kg100s_rb4332a
      - pic32cx_sg41_cult
      - sam_e54_xpro
      - pic32cm_jh01_cpro
      - it8xxx2_evb
      - it82xx2_evb
  drivers.adc.accuracy.dac_source:
    depends_on:
      - dac
    extra_configs:
      - CONFIG_TEST_ADC_BASIC=n
      - CONFIG_TEST_ADC_ACCURACY_DAC=y
    # Only where the board wires a DAC output to an ADC channel
    filter: CONFIG_TEST_ADC_ACCURACY_DAC
    harness_config:
      fixture: dac_adc_loopback
    platform_allow:
      - frdm_k64f
      - ek_ra8d1
      - ek_ra8m1
      - fpb_ra8e1
      - mck_ra8t1
      - ek_ra6e2
      - ek_ra6m1
      - ek_ra6m2
      - ek_ra6m3
      - ek_ra6m4
      - ek_ra6m5
      - fpb_ra6e1
      - fpb_ra6e2
      - ek_ra4e2
      - ek_ra4l1
      - ek_ra4m1
      - ek_ra4m2
      - ek_ra4m3
      - ek_ra4w1
      - fpb_ra4e1
      - ek_ra2a1
      - ek_ra2l1
      - sam_e54_xpro
      - pic32cx_sg41_cult
      - pic32cx_sg61_cult
  drivers.adc.accuracy.ref_volt:
    extra_configs:
      - CONFIG_TEST_ADC_BASIC=n
      - CONFIG_TEST_ADC_ACCURACY_REF=y
    # Only where the board wires a known voltage to an ADC channel
    filter: CONFIG_TEST_ADC_ACCURACY_REF
    harness_config:
      fixture: adc_ref_volt
    platform_allow:
      - frdm_kl25z
      - frdm_mcxc242
      - frdm_mcxc444
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf54h20dk/nrf54h20/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
      - ophelia4ev/nrf54l15/cpuapp
      - sltb010a
      - xg23_rb4210a
      - xg24_dk2601b
      - xg24_rb4187c
      - xg27_dk2602a
      - xg29_rb4412a
      - bg29_rb4420a
      - slwrb4180a
      - kg100s_rb4332a
      - ek_ra4c1
      - pic32cx_sg41_cult
      - sam_e54_xpro
      - pic32cm_jh01_cpro
    integration_platforms:
      - frdm_kl25z
      - nrf54l15dk/nrf54l15/cpuapp
