# The CM0+ core executes from its 32 KB SRAM, reduce the image footprint.
CONFIG_ASSERT=n
CONFIG_CBPRINTF_NANO=y
CONFIG_ADC_LOG_LEVEL_ERR=y
CONFIG_HEAP_MEM_POOL_SIZE=256
CONFIG_ISR_STACK_SIZE=768
CONFIG_MAIN_STACK_SIZE=768
CONFIG_ZTEST_STACK_SIZE=768
CONFIG_ZTEST_SUMMARY=n
