CONFIG_ZTEST=y

# SMBus host controller under test (smbus2 / channel C)
CONFIG_SMBUS=y

# I2C subsystem + target mode, for the i2c0 test peripheral (channel A)
CONFIG_I2C=y
CONFIG_I2C_TARGET=y

CONFIG_LOG=y
CONFIG_SMBUS_LOG_LEVEL_INF=y
CONFIG_I2C_LOG_LEVEL_INF=y

CONFIG_ZTEST_ASSERT_VERBOSE=1
