tests:
  drivers.hwinfo.api:
    tags:
      - drivers
      - hwinfo
    platform_exclude:
      # Reset reason is not available on QEMU Cortex-M0 platform
      - qemu_cortex_m0/nrf51822
  drivers.hwinfo.api.nvmem:
    tags:
      - drivers
      - hwinfo
      - nvmem
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_HWINFO_NATIVE=n
      - CONFIG_EEPROM=y
    extra_dtc_overlay_files:
      - nvmem.overlay
