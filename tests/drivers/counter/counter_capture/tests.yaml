tests:
  # The board describes the capture inputs and the signal driving them in
  # its vane for the setup, and names the fixture where that signal is a
  # wire.
  drivers.counter.capture:
    tags:
      - drivers
      - counter
      - gpio
    requires:
      - api: counter
      - setup: counter.capture
    filter: dt_compat_enabled("test-counter-capture")
    integration_platforms:
      - native_sim
    min_ram: 16
    timeout: 600
