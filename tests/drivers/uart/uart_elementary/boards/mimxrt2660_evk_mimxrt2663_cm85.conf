# The suite's userspace partitions do not fit this SoC's MPU. On ARMv8-M the
# non-overlapping regions are programmed as a full partition of the background
# area, which costs up to three regions per partition, and the M85 has 16: the
# run panics with "Failed to allocate new MPU region 32" before the first test.
# The NXP LPUART entries in tests/drivers/uart/uart_async_api do the same.
CONFIG_USERSPACE=n
CONFIG_TEST_USERSPACE=n
