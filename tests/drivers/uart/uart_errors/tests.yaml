common:
  tags:
    - drivers
    - uart
  harness: ztest
  harness_config:
    fixture: gpio_loopback
  timeout: 30
  # The board describes the two UARTs, the wire between them and the GPIOs on
  # its pins in its vane for the setup.
  requires:
    - api: gpio
    - setup: uart.pair
tests:
  drivers.uart.uart_errors.int_driven:
    filter: CONFIG_SERIAL_SUPPORT_INTERRUPT
  drivers.uart.uart_errors.async:
    filter: CONFIG_SERIAL_SUPPORT_ASYNC
    extra_configs:
      - CONFIG_UART_ASYNC_API=y
      - CONFIG_UART_INTERRUPT_DRIVEN=n
