common:
  tags:
    - drivers
    - uart
  depends_on: gpio
  harness: ztest
  platform_allow:
    - nrf52_bsim
    - nrf52840dk/nrf52840
    - nrf9160dk/nrf9160
    - nrf5340dk/nrf5340/cpuapp
    - nrf5340bsim/nrf5340/cpuapp
    - nrf54h20dk/nrf54h20/cpuapp
    - nrf54h20dk/nrf54h20/cpurad
    - nrf54l15dk/nrf54l15/cpuapp
    - nrf54l15bsim/nrf54l15/cpuapp
    - nrf54lm20dk/nrf54lm20a/cpuapp
    - nrf54lm20dk/nrf54lm20b/cpuapp
    - nrf54lm20bsim/nrf54lm20a/cpuapp
    - nrf7120dk/nrf7120/cpuapp
    - ophelia4ev/nrf54l15/cpuapp
  harness_config:
    fixture: uart_loopback
tests:
  drivers.uart.uart_mix_poll:
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_UART_ASYNC_API=n
      - CONFIG_UART_0_ENHANCED_POLL_OUT=n

  drivers.uart.uart_mix_poll_fifo:
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=y
      - CONFIG_UART_0_INTERRUPT_DRIVEN=y
      - CONFIG_UART_0_ENHANCED_POLL_OUT=n

  drivers.uart.uart_mix_poll_async_api:
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_configs:
      - CONFIG_UART_ASYNC_API=y
      - CONFIG_UART_0_INTERRUPT_DRIVEN=n
      - CONFIG_UART_0_ASYNC=y
      - CONFIG_UART_0_ENHANCED_POLL_OUT=n

  drivers.uart.uart_mix_poll_async_api_const:
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_args: TEST_CONST_BUFFER=1
    extra_configs:
      - CONFIG_UART_ASYNC_API=y
      - CONFIG_UART_0_INTERRUPT_DRIVEN=n
      - CONFIG_UART_0_ASYNC=y
      - CONFIG_UART_0_ENHANCED_POLL_OUT=n
    tags: bsim_skip_CI # We skip a few tests to save CI time, as they give little extra coverage

  drivers.uart.uart_mix_poll_with_ppi:
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_UART_ASYNC_API=n
      - CONFIG_UART_0_ENHANCED_POLL_OUT=y
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf9160dk/nrf9160

  drivers.uart.uart_mix_poll_fifo_with_ppi:
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=y
      - CONFIG_UART_0_INTERRUPT_DRIVEN=y
      - CONFIG_UART_0_ENHANCED_POLL_OUT=y
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf9160dk/nrf9160

  drivers.uart.uart_mix_poll_async_api_with_ppi:
    integration_platforms:
      - nrf52840dk/nrf52840
    extra_configs:
      - CONFIG_UART_ASYNC_API=y
      - CONFIG_UART_0_INTERRUPT_DRIVEN=n
      - CONFIG_UART_0_ASYNC=y
      - CONFIG_UART_0_ENHANCED_POLL_OUT=y
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf9160dk/nrf9160

  drivers.uart.uart_mix_poll.pse84:
    integration_platforms:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    vendor_allow:
      - infineon
    platform_allow:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_UART_ASYNC_API=n

  drivers.uart.uart_mix_poll_fifo.pse84:
    integration_platforms:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    vendor_allow:
      - infineon
    platform_allow:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=y
      - CONFIG_UART_ASYNC_API=n

  drivers.uart.uart_mix_poll_async_api.pse84:
    integration_platforms:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    vendor_allow:
      - infineon
    platform_allow:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_UART_ASYNC_API=y

  drivers.uart.uart_mix_poll_async_api_const.pse84:
    integration_platforms:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    vendor_allow:
      - infineon
    platform_allow:
      - kit_pse84_eval/pse846gps2dbzc4a/m55
    extra_args: TEST_CONST_BUFFER=1
    extra_configs:
      - CONFIG_UART_INTERRUPT_DRIVEN=n
      - CONFIG_UART_ASYNC_API=y
