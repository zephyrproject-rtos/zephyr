CONFIG_STRESS_TEST_REPS=1000
# On Cortex-M0+ _IRQ_PRIO_OFFSET is 0, so SysTick shares the highest NVIC
# priority with all peripherals. The k_timer expiry (uart_poll_out() spinning
# on a full TX FIFO) then starves the counter ISR that drains the 4-deep RX
# FIFO, causing overruns. Let peripherals preempt SysTick.
CONFIG_CORTEX_M_SYSTICK_INTERRUPT_PRIORITY=1
