#
# Controller-side reactor for the target_driven two-board test pair.
# Board A generates bus stimulus on request; the ZTEST suite runs on
# Board B.  Not a ZTEST application.

CONFIG_PRINTK_SYNC=y
CONFIG_FAULT_DUMP=2
CONFIG_LOG=y

CONFIG_I3C=y
CONFIG_I3C_CONTROLLER_ROLE_ONLY=y
CONFIG_I3C_USE_IBI=y

# CONFIG_I3C_INIT_RSTACT is deliberately left at its default (y) even though
# the sillicon test was written against does not implement RSTACT.  A broadcast
# RSTACT cannot be NACKed by a single target, so its defining byte reaches the
# target and lands in the RX FIFO with no response descriptor for the driver
# to drain.  Turning the CCC off here would hide that path from the suite.

# Sync UART (poll-mode only - see the note in the target app's prj.conf)
CONFIG_SERIAL=y

# Misc
CONFIG_PINCTRL_KEEP_SLEEP_STATE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CLOCK_CONTROL=y
