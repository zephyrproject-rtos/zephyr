# Target app for the target_driven two-board test pair.  Unlike the
# controller_driven pair, this side runs the ZTEST suite: it asserts on
# target-side state the controller cannot observe.

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_PRINTK_SYNC=y
CONFIG_FAULT_DUMP=2
CONFIG_LOG=y
CONFIG_ASSERT=y

# I3C: target-only build so the controller paths cannot mask a target bug
CONFIG_I3C=y
CONFIG_I3C_TARGET_ROLE_ONLY=y
CONFIG_I3C_USE_IBI=y

# Sync UART (poll-mode only - do not enable CONFIG_UART_INTERRUPT_DRIVEN;
# on this bench the UART IRQ handler races poll_in/poll_out and wedges
# subsequent I3C traffic.)
CONFIG_SERIAL=y

# Misc
CONFIG_PINCTRL_KEEP_SLEEP_STATE=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CLOCK_CONTROL=y
