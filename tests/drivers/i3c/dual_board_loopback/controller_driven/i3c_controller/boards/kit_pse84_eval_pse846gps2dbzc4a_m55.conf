# Bench configuration for KIT_PSE84_EVAL (PSE846GPS2DBZC4A, M55 core).
#
# This core must be built with --sysbuild: the CM55 image only boots once
# the CM33 enable_cm55 companion has released it, and sysbuild is what
# generates that companion.  A command-line Kconfig override has to name
# the image as well, because a bare -DCONFIG_* lands in sysbuild's own
# namespace and never reaches the application:
#
#   west build -b kit_pse84_eval/pse846gps2dbzc4a/m55 --sysbuild \
#         tests/drivers/i3c/dual_board_loopback/controller_driven/i3c_controller \
#         -- -Di3c_controller_CONFIG_I3C_USE_IBI=n
#
# The SOM has a BMM350 magnetometer wired to the same I3C0 pads the test
# controller drives, with no power-enable or isolation jumper exposed.
# It only joins ENTDAA while it is in I3C mode: it falls back to its I2C
# interface whenever anything issues a soft reset to it, and only a power
# cycle puts it back.  Because the suite cannot rely on it being there
# from one run to the next, the placeholder descriptor is left disabled
# and the address it would take is treated as free.
#
# Re-enable these if the BMM350 is made to stay in I3C mode.  The PID was
# captured live from DEV_CHAR_TABLE on this SOM.
# CONFIG_I3C_DUAL_BOARD_LOOPBACK_BENCH_HAS_PERMANENT_TARGET=y
# CONFIG_I3C_DUAL_BOARD_LOOPBACK_BENCH_PERMANENT_TARGET_PID_HI=0x0770
# CONFIG_I3C_DUAL_BOARD_LOOPBACK_BENCH_PERMANENT_TARGET_PID_LO=0x10331000
# CONFIG_I3C_DUAL_BOARD_LOOPBACK_BENCH_PERMANENT_TARGET_INIT_DA=0x15
