# Controller app for the dual_board_loopback two-board test pair.

CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_PRINTK_SYNC=y
CONFIG_FAULT_DUMP=2
CONFIG_LOG=y
CONFIG_SERIAL=y

# I3C: controller-only build for max coverage of the controller paths
CONFIG_I3C=y
CONFIG_I3C_CONTROLLER_ROLE_ONLY=y
CONFIG_I3C_USE_IBI=y

# Misc
CONFIG_PINCTRL_KEEP_SLEEP_STATE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CLOCK_CONTROL=y

# For light testing of PM APIs - this suite does not do extensive PM
# validaton
CONFIG_PM_DEVICE=y
