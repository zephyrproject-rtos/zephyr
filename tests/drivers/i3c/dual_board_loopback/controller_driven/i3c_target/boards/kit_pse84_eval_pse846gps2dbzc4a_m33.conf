# Bench configuration for KIT_PSE84_EVAL (PSE846GPS2DBZC4A, M33 core).
#
# The Infineon DW I3C wrapper on PSE84 v1 silicon has an integration
# quirk the generic DW driver does not cover: a vendor wrapper-gate
# register at base+0x400 must be re-opened for SOFT_RST to self-clear,
# because the protocol clock is gated by it.  It is kept behind a
# dedicated Kconfig symbol so the generic test code stays portable.
CONFIG_I3C_DUAL_BOARD_LOOPBACK_TARGET_VENDOR_WRAPPER_GATE=y
CONFIG_I3C_DUAL_BOARD_LOOPBACK_TARGET_WRAPPER_GATE_OFFSET=0x400
CONFIG_I3C_DUAL_BOARD_LOOPBACK_TARGET_WRAPPER_GATE_VALUE=0x80000000

# On PSE84 v1 silicon, SOFT_RST does NOT clear DEVICE_ADDR — the stale
# dynamic address from the previous ENTDAA round survives and breaks
# re-enumeration.  Disable so the target zeros DEVICE_ADDR explicitly.
CONFIG_I3C_DUAL_BOARD_LOOPBACK_TARGET_SOFT_RST_CLEARS_DEVICE_ADDR=n
