# STM32U5: DMA with SPI_STM32_DMA_CACHED_MEMORY. The test buffers are in
# SRAM, which DCACHE1 does not cache.
CONFIG_SPI_STM32_DMA=y
CONFIG_SPI_STM32_DMA_CACHED_MEMORY=y
CONFIG_SPI_STM32_INTERRUPT=y
CONFIG_SPI_STM32_DMA_RX_AUTO_SUSPEND=y
