CONFIG_ZTEST=y
CONFIG_SPI=y
CONFIG_SPI_EMUL=y
CONFIG_EMUL=y
CONFIG_SENSOR=y
CONFIG_ICM20948=y
# The auxiliary I2C master is not emulated yet, so the magnetometer would
# fail to identify itself and take the whole device down with it.
CONFIG_ICM20948_MAGN_EN=n
