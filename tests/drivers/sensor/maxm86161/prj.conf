CONFIG_ZTEST=y
CONFIG_SENSOR=y

# Enable Emulation Drivers
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

# Enable test coverage reports
CONFIG_COVERAGE=y
CONFIG_COVERAGE_DUMP=y

# Disable trigger for basic tests
CONFIG_MAXM86161_TRIGGER_NONE=y

# Floating point support
CONFIG_CBPRINTF_FP_SUPPORT=y

# Logging
CONFIG_SENSOR_LOG_LEVEL_DBG=y
