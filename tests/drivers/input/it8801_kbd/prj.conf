# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_ITE_IT8801_KBD=y

# MFD support is enabled but the IT8801 MFD driver is disabled - the test
# provides its own stub implementations of the MFD API.
CONFIG_MFD=y
CONFIG_MFD_ITE_IT8801=n

# Use the register-level I2C emulator backend for the MFD parent.
CONFIG_EMUL_MFD_ITE_IT8801=y

CONFIG_PM_DEVICE=y
