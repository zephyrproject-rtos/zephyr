common:
  tags:
    - drivers
    - mipi-dbi

tests:
  drivers.mipi_dbi.api:
    platform_allow:
      - native_sim
      - native_sim/native/64
    extra_configs:
      - CONFIG_MIPI_DBI_SPI=n
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_bitbang.overlay
  drivers.mipi_dbi.config:
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_GPIO=y
      - CONFIG_SPI=y
      - CONFIG_MIPI_DBI_SPI=n
  drivers.mipi_dbi.rpi_pico.pio0.single_split:
    platform_allow:
      - rpi_pico/rp2040
      - rpi_pico2/rp2350a/m33_0
      - rpi_pico2/rp2350a/hazard3_0
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_rpi_pico_pio0_1_split.overlay
  drivers.mipi_dbi.rpi_pico.pio0.four_splits:
    platform_allow:
      - rpi_pico/rp2040
      - rpi_pico2/rp2350a/m33_0
      - rpi_pico2/rp2350a/hazard3_0
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_rpi_pico_pio0_4_splits.overlay
  drivers.mipi_dbi.rpi_pico.pio1.single_split:
    platform_allow:
      - rpi_pico/rp2040
      - rpi_pico2/rp2350a/m33_0
      - rpi_pico2/rp2350a/hazard3_0
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_rpi_pico_pio1_1_split.overlay
  drivers.mipi_dbi.rpi_pico.pio1.four_splits:
    platform_allow:
      - rpi_pico/rp2040
      - rpi_pico2/rp2350a/m33_0
      - rpi_pico2/rp2350a/hazard3_0
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_rpi_pico_pio1_4_splits.overlay
  drivers.mipi_dbi.rpi_pico.multiple_instances.four_splits:
    platform_allow:
      - rpi_pico/rp2040
      - rpi_pico2/rp2350a/m33_0
      - rpi_pico2/rp2350a/hazard3_0
    extra_configs:
      - CONFIG_TEST_MULTIPLE_INSTANCES=y
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_rpi_pico_multiple_instances_4_splits.overlay
  drivers.mipi_dbi.rpi_pico.pio2.single_split:
    platform_allow:
      - rpi_pico2/rp2350a/m33_0
      - rpi_pico2/rp2350a/hazard3_0
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_rpi_pico_pio2_1_split.overlay
  drivers.mipi_dbi.rpi_pico.pio2.four_splits:
    platform_allow:
      - rpi_pico2/rp2350a/m33_0
      - rpi_pico2/rp2350a/hazard3_0
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=overlays/mipi_dbi_rpi_pico_pio2_4_splits.overlay
  drivers.mipi_dbi.bitbang.2port_split:
    platform_allow:
      - native_sim
    extra_dtc_overlay_files:
      - overlays/mipi_dbi_bitbang_native_sim_2port_split.overlay
  drivers.mipi_dbi.bitbang.2port_split.lut_limit_1:
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_MIPI_DBI_BITBANG_MAX_LUT_PORTS=1
    extra_dtc_overlay_files:
      - overlays/mipi_dbi_bitbang_native_sim_2port_split.overlay
  drivers.mipi_dbi.bitbang.2port_split.active_low:
    platform_allow:
      - native_sim
    extra_dtc_overlay_files:
      - overlays/mipi_dbi_bitbang_native_sim_2port_split_active_low.overlay
  drivers.mipi_dbi.bitbang.4port_interleaved:
    platform_allow:
      - native_sim
    extra_dtc_overlay_files:
      - overlays/mipi_dbi_bitbang_native_sim_4port_interleaved.overlay
  drivers.mipi_dbi.bitbang.4port_interleaved.lut_limit_3:
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_MIPI_DBI_BITBANG_MAX_LUT_PORTS=3
    extra_dtc_overlay_files:
      - overlays/mipi_dbi_bitbang_native_sim_4port_interleaved.overlay
