common:
  tags:
    - drivers
    - relay
  harness: ztest
tests:
  drivers.relay.gpio:
    extra_args: DTC_OVERLAY_FILE="gpio.overlay"
    filter: dt_compat_enabled("zephyr,gpio-relay")
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  drivers.relay.pwm:
    extra_args: DTC_OVERLAY_FILE="pwm.overlay"
    filter: dt_compat_enabled("zephyr,pwm-relay")
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
