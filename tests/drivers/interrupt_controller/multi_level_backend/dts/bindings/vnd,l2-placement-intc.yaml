description: |
  Level 2 aggregator placeholder for the ISR table placement test. No
  driver binds to it; the test only reads its devicetree instance number
  and interrupt level.

compatible: "vnd,l2-placement-intc"

include: [interrupt-controller.yaml, base.yaml]

properties:
  "#interrupt-cells":
    const: 1

interrupt-cells:
  - irq
