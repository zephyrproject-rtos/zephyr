common:
  tags:
    - drivers
    - interrupt_controller
    - wkpu
  harness: ztest
  platform_allow:
    - frdm_mcxe31b
    - frdm_mcxe32b/mcxe32b/cpu0
  integration_platforms:
    - frdm_mcxe31b
    - frdm_mcxe32b/mcxe32b/cpu0
tests:
  # Exercises the WKPU driver through the RTC-timeout internal wake-up source
  # (no external pin stimulus required).
  drivers.interrupt_controller.wkpu_nxp: {}
  drivers.interrupt_controller.wkpu_nxp.wuc:
    extra_args: EXTRA_DTC_OVERLAY_FILE=wuc.overlay
    extra_configs:
      - CONFIG_WUC=y
