common:
  build_only: true
  tags:
    - drivers
    - audio
tests:
  drivers.audio.build.i2c:
    extra_args: DTC_OVERLAY_FILE="i2c_devices.overlay"
    extra_configs:
      - CONFIG_I2C=y
    platform_allow:
      - native_sim
      - native_sim/native/64

  drivers.audio.build.i2s:
    extra_args: DTC_OVERLAY_FILE="i2s_devices.overlay"
    extra_configs:
      - CONFIG_I2S=y
    platform_allow:
      - native_sim
      - native_sim/native/64

  drivers.audio.build.spi:
    extra_args: DTC_OVERLAY_FILE="spi_devices.overlay"
    extra_configs:
      - CONFIG_SPI=y
    platform_allow:
      - native_sim
      - native_sim/native/64

  drivers.audio.dmic.build:
    platform_allow:
      - arduino_giga_r1/stm32h747xx/m7
      - arduino_nicla_vision/stm32h747xx/m7
      - stm32f769i_disco
      - stm32l476g_disco
