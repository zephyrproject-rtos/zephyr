common:
  build_only: true
  tags:
    - drivers
    - flash
tests:
  drivers.flash.build:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64
  drivers.flash.emul.build:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64
    extra_configs:
      - CONFIG_EMUL=y
