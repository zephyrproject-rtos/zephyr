common:
  build_only: true
  tags:
    - drivers
    - bbram

tests:
  drivers.bbram.build:
    platform_allow:
      - native_sim

  drivers.bbram.emul.build:
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_EMUL=y

  drivers.bbram.it8xxx2.build:
    filter: dt_compat_enabled("ite,it8xxx2-bbram")
    integration_platforms:
      - it82xx2_evb

  drivers.bbram.npcx.build:
    filter: dt_compat_enabled("nuvoton,npcx-bbram")
    integration_platforms:
      - npcx9m6f_evb

  drivers.bbram.stm32.build:
    extra_args: EXTRA_CONF_FILE="stm32.conf"
    filter: dt_compat_enabled("st,stm32-bbram")
    integration_platforms:
      - nucleo_g071rb
      - stm32f746g_disco

  drivers.bbram.stm32_rtc.build:
    extra_args: EXTRA_CONF_FILE="stm32_rtc.conf"
    filter: dt_compat_enabled("st,stm32-bbram")
    integration_platforms:
      - nucleo_g071rb
      - stm32f746g_disco

  drivers.bbram.nxp_imx_snvs_gpr.build:
    filter: dt_compat_enabled("nxp,imx-snvs-gpr")
    integration_platforms:
      - mimxrt1064_evk
