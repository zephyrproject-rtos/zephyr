common:
  build_only: true
  tags:
    - drivers
    - spi
tests:
  drivers.spi.build.spi_cdns:
    # will cover drivers without in-tree boards
    platform_allow: qemu_cortex_m3
    tags: spi_cdns
    extra_args: "CONFIG_SPI=y"

  drivers.spi.build.virtio:
    platform_allow:
      - qemu_cortex_a53
      - qemu_riscv64
    integration_platforms:
      - qemu_cortex_a53
    extra_args: DTC_OVERLAY_FILE="virtio.overlay"
