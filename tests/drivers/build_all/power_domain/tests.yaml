common:
  build_only: true
  tags:
    - drivers
    - power_domain
  platform_allow:
    - native_sim
    - native_sim/native/64
tests:
  drivers.power_domain.build: {}
  drivers.power_domain.build.pm:
    extra_configs:
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
  drivers.power_domain.build.pm_no_runtime:
    extra_configs:
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=n
  drivers.power_domain.build.pm_no_power_domain:
    extra_configs:
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_PM_DEVICE_POWER_DOMAIN=n
