common:
  build_only: true
  tags:
    - drivers
    - ethernet
  depends_on:
    - eth
tests:
  net.ethernet.build.default: {}

  net.ethernet.build.spi:
    extra_args: DTC_OVERLAY_FILE="spi_devices.overlay"
    extra_configs:
      - CONFIG_SPI=y
      - CONFIG_NET_L2_ETHERNET=y
    platform_allow:
      - native_sim
      - native_sim/native/64

  net.ethernet.build.stm32_ethernet:
    filter: dt_compat_enabled("st,stm32-ethernet")
    extra_configs:
      - CONFIG_ETH_STM32_MULTICAST_FILTER=y
    platform_allow:
      - stm32h573i_dk

  net.ethernet.build.dwmac:
    extra_configs:
      - CONFIG_ETH_STM32_HAL=n
      - CONFIG_ETH_ESP32=n
      - CONFIG_ETH_NXP_ENET_QOS=n
      - CONFIG_ETH_XMC4XXX=n
      - CONFIG_ETH_NUMAKER=n
    platform_allow:
      - stm32h735g_disco
      - nucleo_h753zi
      - nucleo_f429zi
      - nucleo_f767zi
      - stm32h7s78_dk/stm32h7s7xx/ext_flash_app
      - stm32h573i_dk
      - stm32mp135f_dk
      - esp32_ethernet_kit/esp32/procpu
      - esp32p4x_function_ev_board/esp32p4/hpcore
      - frdm_mcxn947/mcxn947/cpu0
      - frdm_mcxa577
      - frdm_mcxa577/mcxa577/t1s
      - numaker_m55m1
      - numaker_pfm_m467
      - xmc47_relax_kit

  net.ethernet.build.numaker:
    extra_args:
      - platform:numaker_pfm_m467/m467:DTC_OVERLAY_FILE="app.overlay;m467_deprecated.overlay"
      - platform:numaker_m55m1/m55m1xxx:DTC_OVERLAY_FILE="app.overlay;m55m1_deprecated.overlay"
    extra_configs:
      - CONFIG_ETH_NUMAKER=y
      - CONFIG_WARN_DEPRECATED=n
    platform_allow:
      - numaker_m55m1
      - numaker_pfm_m467

  net.ethernet.build.uart:
    extra_args: DTC_OVERLAY_FILE="uart_devices.overlay"
    extra_configs:
      - CONFIG_SERIAL=y
      - CONFIG_NET_L2_ETHERNET=y
      - CONFIG_NET_SOCKETS=y
      - CONFIG_NET_SOCKETS_OFFLOAD=y
      - CONFIG_ETH_CH9120=y
    platform_allow:
      - native_sim
      - native_sim/native/64
