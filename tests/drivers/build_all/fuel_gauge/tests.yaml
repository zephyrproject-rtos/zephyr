tests:
  drivers.fuel_gauge.build:
    tags:
      - drivers
      - fuel_gauge
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64

  drivers.fuel_gauge.emul.build:
    tags:
      - drivers
      - fuel_gauge
    build_only: true
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64
    extra_configs:
      - CONFIG_EMUL=y
