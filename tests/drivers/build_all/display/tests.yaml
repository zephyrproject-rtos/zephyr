common:
  build_only: true
  tags:
    - drivers
    - display

tests:
  drivers.display.build.default:
    integration_platforms:
      - native_sim
      - native_sim/native/64
    depends_on: display

  drivers.display.build.pm:
    platform_allow:
      - native_sim
    extra_configs:
      - CONFIG_PM_DEVICE=y
      - CONFIG_PM_DEVICE_RUNTIME=y
      - CONFIG_DISPLAY_INIT_PRIORITY=95
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="nv3031b-backlight.overlay"

  drivers.display.build.bflb_dbi:
    platform_allow:
      - ai_m62_12f_kit

  drivers.display.build.sf32lb_dbi:
    platform_allow:
      - sf32lb52_devkit_lcd

  drivers.display.build.esp32_lcd_cam_rgb:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    integration_platforms:
      - esp32s3_devkitc/esp32s3/procpu

  drivers.display.build.esp32_lcd_cam_rgb_no_bb:
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    integration_platforms:
      - esp32s3_devkitc/esp32s3/procpu
    extra_configs:
      - CONFIG_DISPLAY_ESP32_LCD_CAM_RGB_BOUNCE_BUFFER_LINES=0
      - CONFIG_DISPLAY_ESP32_LCD_CAM_RGB_FB_NUM=2
      - CONFIG_DISPLAY_ESP32_LCD_CAM_RGB_RESTART_IN_VSYNC=y
