common:
  build_only: true
  tags:
    - drivers
    - memc
tests:
  # NXP AHB SRAM Controller (SRAMC). The driver is SoC specific (uses the
  # fsl_sramc HAL and the BLK_CTRL_WAKEUPMIX block), and nothing else in tree
  # enables a &sramc node, so build it on the mimxrt1180_evk to keep it covered.
  drivers.memc.nxp_sramc.build:
    platform_allow:
      - mimxrt1180_evk/mimxrt1189/cm33
      - mimxrt1180_evk/mimxrt1189/cm7
    integration_platforms:
      - mimxrt1180_evk/mimxrt1189/cm33

  # NXP AHB SRAM Controller (AHB_SRAMC) is a different device from nxp_sramc:
  # it has its own peripheral, each chip select has a corresponding pair of
  # timing registers, and it uses the HAL from the sramc_1 component in the SDK.
  drivers.memc.nxp_ahb_sramc.build:
    platform_allow:
      - mimxrt2660_evk/mimxrt2663/cm85
    integration_platforms:
      - mimxrt2660_evk/mimxrt2663/cm85
