tests:
  # The board describes the DAC output wired to an ADC input in its vane
  # for the setup, or in its own devicetree.
  drivers.dac.loopback:
    tags:
      - dac
      - drivers
    requires:
      - api: dac
      - api: adc
      - setup: dac.adc-loopback
    filter: dt_node_has_prop("/zephyr,user", "io-channels")
    harness: ztest
    harness_config:
      fixture: dac_adc_loopback
    integration_platforms:
      - nucleo_f207zg
