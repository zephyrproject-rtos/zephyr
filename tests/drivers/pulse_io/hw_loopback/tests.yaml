common:
  tags:
    - drivers
    - pulse_io
  depends_on: pulse_io
  harness: ztest
tests:
  drivers.pulse_io.hw_loopback:
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c3_devkitc
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32h2_devkitm
      - esp32p4x_function_ev_board/esp32p4/hpcore
    integration_platforms:
      - esp32s3_devkitc/esp32s3/procpu
  drivers.pulse_io.hw_loopback.nodma:
    extra_args: FILE_SUFFIX=nodma
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
  drivers.pulse_io.hw_loopback.pm:
    extra_args:
      - SNIPPET=espressif-pm
    extra_configs:
      - CONFIG_LOG=y
      - CONFIG_SOC_ESP32_PM_SLEEP_STATS=y
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s2_devkitc
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c3_devkitc
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32h2_devkitm
      - esp32p4x_function_ev_board/esp32p4/hpcore
    integration_platforms:
      - esp32c6_devkitc/esp32c6/hpcore
  drivers.pulse_io.hw_loopback.pm.periph_pd:
    extra_args:
      - SNIPPET=espressif-pm
    extra_configs:
      - CONFIG_LOG=y
      - CONFIG_SOC_ESP32_PM_SLEEP_STATS=y
      - CONFIG_ESP32_PM_POWER_DOWN_PERIPHERAL_IN_LIGHT_SLEEP=y
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - esp32h2_devkitm
      - esp32p4x_function_ev_board/esp32p4/hpcore
    integration_platforms:
      - esp32c6_devkitc/esp32c6/hpcore
