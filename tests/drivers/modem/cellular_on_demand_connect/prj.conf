CONFIG_ZTEST=y

# Emulated UART bus the modem_cellular driver binds to.
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
# Drive the modem UART backend in interrupt mode: the emulated UART's async
# close does not complete cleanly, which stalls the FSM at the init->CMUX bus
# hand-off. Interrupt mode closes synchronously.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y

# Modem cellular driver + the feature under test. The ".disabled" scenario in
# tests.yaml turns the feature back off to guard the unchanged default.
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_ON_DEMAND_CONNECT=y
# Without an APN the FSM parks in WAIT_FOR_APN and never reaches AWAIT_DIAL.
CONFIG_MODEM_CELLULAR_APN="internet"

# Networking: the PPP interface whose admin state drives dial / hang-up.
CONFIG_NETWORKING=y
CONFIG_NET_L2_PPP=y
CONFIG_PM_DEVICE=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# native_sim enables the zeth TAP ethernet backend by default, which needs a
# host /dev/net/tun. The test only drives the modem's PPP interface, so drop it
# to keep the test self-contained.
CONFIG_ETH_NATIVE_TAP=n

# The test emulates the modem side with a second CMUX instance over the
# modem backend mock, so pull those modules in explicitly.
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_CMUX=y

# Logs: the driver logs every FSM state transition, which helps diagnose the
# emulator and the transitions under test.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MODEM_MODULES_LOG_LEVEL_DBG=y
CONFIG_MODEM_LOG_LEVEL_DBG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
