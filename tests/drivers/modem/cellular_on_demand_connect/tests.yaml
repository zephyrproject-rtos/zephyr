      - CONFIG_TEST_ON_DEMAND_EARLY_ADMIN_UP=y
  drivers.modem.cellular.on_demand_connect.disabled:
    extra_configs:
      - CONFIG_MODEM_CELLULAR_ON_DEMAND_CONNECT=n
