CONFIG_ZTEST=y

# Emulated UART bus the modem_cellular driver binds to. Interrupt mode, as the
# async close of the emulated UART does not complete.
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y

# No APN: the A76xx scenario parks in WAIT_FOR_APN right after selecting the
# SIM slot, until a test sets one. The BG95 scenario sets one.
CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_APN=""
CONFIG_PM_DEVICE=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_PPP=y
# The test does not use the host network
CONFIG_ETH_NATIVE_TAP=n

# The test emulates the modem side with a second CMUX instance over the modem
# backend mock.
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_CMUX=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
