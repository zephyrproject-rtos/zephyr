CONFIG_ZTEST=y

# Emulated UART buses the modem_cellular instances bind to. Interrupt mode,
# as the async close of the emulated UART does not complete.
CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Emulated GPIO driving the SIM switch through a gpio-mux
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y
CONFIG_PM_DEVICE=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_PPP=y
# The test does not use the host network
CONFIG_ETH_NATIVE_TAP=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
