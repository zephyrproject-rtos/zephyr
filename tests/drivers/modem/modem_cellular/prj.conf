# The cellular modem driver pulls in PPP, so give it a PPP interface.
# CONFIG_NET_TEST makes the PPP network driver run without a real UART.
CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_PPP=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_L2_DUMMY=n
CONFIG_NET_IPV4=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_CRC=y

CONFIG_MODEM=y
CONFIG_MODEM_CELLULAR=y

CONFIG_ZTEST=y
