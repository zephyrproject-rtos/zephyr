CONFIG_ZTEST=y

CONFIG_SERIAL=y
CONFIG_EMUL=y
CONFIG_UART_EMUL=y
CONFIG_GPIO=y

CONFIG_MODEM=y
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_CELLULAR=y
CONFIG_MODEM_CELLULAR_HW_DEPENDENCIES=n
CONFIG_MODEM_CHAT=y
CONFIG_MODEM_PIPELINK=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_PPP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_PM_DEVICE=y

CONFIG_ETH_NATIVE_TAP=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MODEM_LOG_LEVEL_INF=y

CONFIG_MODEM_CELLULAR_APN=""
# Differs from the UARTs' current-speed so baudrate changes are observable
CONFIG_MODEM_CELLULAR_NEW_BAUDRATE=921600
CONFIG_MODEM_CELLULAR_NEW_BAUDRATE_DELAY=1
CONFIG_MODEM_CELLULAR_RESET_POWER_ON_DELAY_MS=100
CONFIG_MODEM_CELLULAR_RECOVERY_BACKOFF_MS=100
CONFIG_MODEM_CELLULAR_MAX_RECOVERIES=3
CONFIG_MODEM_CELLULAR_PERIODIC_SCRIPT_MS=500

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
