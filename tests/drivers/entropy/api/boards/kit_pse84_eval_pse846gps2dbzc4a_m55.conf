# Enable MXCRYPTO TRNG entropy driver
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_INFINEON_MXCRYPTO_TRNG=y

# Enable MXCRYPTO hardware crypto driver
CONFIG_CRYPTO=y
CONFIG_CRYPTO_INFINEON_MXCRYPTO=y