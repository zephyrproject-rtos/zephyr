tests:
  drivers.entropy:
    filter: CONFIG_ENTROPY_HAS_DRIVER
    integration_platforms:
      - frdm_mcxn236
      - kit_psc3m6_eval/psc3m6ges3ahq1
    tags:
      - drivers
      - entropy
  drivers.entropy.bt_hci:
    platform_allow:
      - nrf52_bsim
      - nrf5340bsim/nrf5340/cpunet
      - nrf5340dk/nrf5340/cpunet
    extra_args:
      - DTC_OVERLAY_FILE=./entropy_bt_hci.overlay
      - EXTRA_CONF_FILE=./entropy_bt_hci.conf
    tags:
      - driver
      - entropy
      - bluetooth
  drivers.entropy.nrf_cracen.sync_semaphore:
    platform_allow:
      - nrf54l15bsim/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15bsim/nrf54l15/cpuapp
    extra_configs:
      - CONFIG_NORDIC_CRACEN_SYNC_SEMAPHORE=y
    tags:
      - driver
      - entropy
  drivers.entropy.nrf_cracen.sync_none:
    build_only: true
    platform_allow:
      - nrf54l15bsim/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    extra_configs:
      - CONFIG_NORDIC_CRACEN_SYNC_NONE=y
    tags:
      - driver
      - entropy
  drivers.entropy.psa_crypto:
    filter: CONFIG_BUILD_WITH_TFM
    extra_args:
      - DTC_OVERLAY_FILE=./entropy_psa_crypto.overlay
      - EXTRA_CONF_FILE=./entropy_psa_crypto.conf
    tags:
      - driver
      - entropy
      - psa-crypto
