CONFIG_ZTEST=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_VIRTIO=y
CONFIG_IRQ_OFFLOAD=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_ZTEST_STACK_SIZE=4096

# The software transport drives the real queue without emulated peripherals.
CONFIG_VIRTIO_MMIO=n
CONFIG_VIRTIO_PCI=n
CONFIG_INPUT_VIRTIO=n
CONFIG_ENTROPY_VIRTIO=n
CONFIG_DISK_DRIVER_VIRTIO_BLK=n
CONFIG_ETH_VIRTIO_NET=n
CONFIG_GPIO_VIRTIO=n
CONFIG_SPI_VIRTIO=n
CONFIG_I2C_VIRTIO=n
CONFIG_UART_VIRTIO_CONSOLE=n
