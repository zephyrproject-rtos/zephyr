common:
  tags:
    - drivers
    - can
  depends_on: can
  ignore_faults: true
tests:
  drivers.can.api:
    integration_platforms:
      - native_sim
      - native_sim/native/64
    filter: dt_chosen_enabled("zephyr,canbus") and not dt_compat_enabled("kvaser,pcican")
      and not dt_compat_enabled("infineon,xmc4xxx-can-node")
  drivers.can.api.rtr:
    integration_platforms:
      - native_sim
      - native_sim/native/64
    filter: dt_chosen_enabled("zephyr,canbus") and not dt_compat_enabled("kvaser,pcican")
      and not dt_compat_enabled("infineon,xmc4xxx-can-node")
    extra_configs:
      - CONFIG_CAN_ACCEPT_RTR=y
  drivers.can.api.am62l_evm.mcan1:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=boards/am62l_evm_mcan1.overlay
      - EXTRA_CONF_FILE=boards/am62l_evm_mcan1.conf
    platform_allow:
      - am62l_evm/am62l3/a53
  drivers.can.api.am62l_evm.mcan2:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=boards/am62l_evm_mcan2.overlay
    platform_allow:
      - am62l_evm/am62l3/a53
  drivers.can.api.twai:
    extra_args: DTC_OVERLAY_FILE=twai-enable.overlay
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
      - xiao_esp32s3/esp32s3/procpu
      - esp32h2_devkitm
  drivers.can.api.twaifd:
    extra_args: DTC_OVERLAY_FILE=twaifd-enable.overlay
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
  drivers.can.api.nxp_s32_canxl.non_rx_fifo:
    extra_configs:
      - CONFIG_CAN_NXP_S32_RX_FIFO=n
    integration_platforms:
      - s32z2xxdc2/s32z270/rtu0
    platform_allow:
      - s32z2xxdc2/s32z270/rtu0
      - s32z2xxdc2/s32z270/rtu1
      - s32z2xxdc2@D/s32z270/rtu0
      - s32z2xxdc2@D/s32z270/rtu1
