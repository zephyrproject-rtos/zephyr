tests:
  drivers.dma.loop_transfer:
    depends_on: dma
    tags:
      - drivers
      - dma
    integration_platforms:
      - native_sim
      - native_sim/native/64
    filter: dt_nodelabel_enabled("tst_dma0")
  drivers.dma.ifx_axidmac.loop_transfer:
    depends_on: dma
    tags:
      - drivers
      - dma
    filter: dt_nodelabel_enabled("tst_dma0") and CONFIG_DMA_INFINEON_MDMA
    extra_args:
      - DTC_OVERLAY_FILE="boards/pse8x_axi.overlay"
    platform_allow:
      - kit_pse84_ai/pse846gps2dbzc4a/m33
      - kit_pse84_ai/pse846gps2dbzc4a/m55
      - kit_pse84_eval/pse846gps2dbzc4a/m33
      - kit_pse84_eval/pse846gps2dbzc4a/m55
  drivers.dma.stm32_lpdma.loop_transfer:
    depends_on: dma
    tags:
      - drivers
      - dma
    filter: dt_node_has_prop("/zephyr,user", "dma-test-devs")
    extra_args:
      - platform:b_u585i_iot02a/stm32u585xx:DTC_OVERLAY_FILE="boards/stm32u5_lpdma.overlay"
      - platform:b_u585i_iot02a/stm32u585xx:EXTRA_CONF_FILE="boards/stm32u5_lpdma.conf"
      - platform:nucleo_u575zi_q/stm32u575xx:DTC_OVERLAY_FILE="boards/stm32u5_lpdma.overlay"
      - platform:nucleo_u575zi_q/stm32u575xx:EXTRA_CONF_FILE="boards/stm32u5_lpdma.conf"
    platform_allow:
      - b_u585i_iot02a
      - nucleo_u575zi_q
