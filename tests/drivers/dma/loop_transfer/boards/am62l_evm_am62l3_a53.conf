# Block-copy channels are numbered from 128
CONFIG_DMA_LOOP_TRANSFER_CHANNEL_NR=128
# 64 KiB copies take one TR of two 32 KiB rows, and last long enough for
# the suspend test to catch the chain of transfers
CONFIG_DMA_LOOP_TRANSFER_SIZE=65536
