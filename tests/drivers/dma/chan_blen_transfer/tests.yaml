    - api: dma
    - setup: dma.memory-to-memory
  filter: dt_compat_enabled("test-dma-memory-to-memory")
tests:
  drivers.dma.chan_blen_transfer:
    min_ram: 12
    integration_platforms:
      - native_sim
      - native_sim/native/64
