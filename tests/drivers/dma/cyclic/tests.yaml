common:
  tags:
    - drivers
    - dma
  # The board describes the controllers to test in its vane for the setup,
  # and which of them do cyclic transfers.
  requires:
    - api: dma
    - setup: dma.memory-to-memory
  filter: dt_compat_any_prop_enabled("test-dma-memory-to-memory", "cyclic")
tests:
  drivers.dma.cyclic: {}
