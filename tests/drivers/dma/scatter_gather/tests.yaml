common:
  tags:
    - drivers
    - dma
  # The board describes the controllers to test in its vane for the setup,
  # and which of them do scatter-gather.
  requires:
    - api: dma
    - setup: dma.memory-to-memory
  filter: dt_compat_any_prop_enabled("test-dma-memory-to-memory", "scatter-gather")
tests:
  drivers.dma.scatter_gather:
    integration_platforms:
      - intel_adsp/cavs25
      - native_sim
      - native_sim/native/64
