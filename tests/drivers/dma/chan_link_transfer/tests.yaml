common:
  tags:
    - drivers
    - dma
  # The board describes the controllers to test in its vane for the setup,
  # and which of them link channels.
  requires:
    - api: dma
    - setup: dma.memory-to-memory
  filter: dt_compat_any_prop_enabled("test-dma-memory-to-memory", "channel-link")
tests:
  drivers.dma.chan_link_transfer:
    min_ram: 16
    integration_platforms:
      - frdm_k64f
      - native_sim
      - native_sim/native/64
