CONFIG_DCACHE=n
# BDMA channel 4 through DMAMUX2 channel 4
CONFIG_DMA_RESTART_CHANNEL=4
# SPI6_RX, SPI6 stays disabled
CONFIG_DMA_RESTART_IDLE_SLOT=11

# BDMA can only access SRAM4
CONFIG_CODE_DATA_RELOCATION=y
CONFIG_DMA_RESTART_RELOCATE_SECTION="SRAM4"
