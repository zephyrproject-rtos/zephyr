CONFIG_CLOCK_MONITOR=y
CONFIG_ZTEST=y

# Device power management: the cases under CONFIG_PM_DEVICE_RUNTIME and
# CONFIG_PM_POLICY_DEVICE_CONSTRAINTS only exist in these builds.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_POLICY_DEVICE_CONSTRAINTS=y

# Enable device runtime PM for every device at init, so the runtime-reference
# case is not skipped and the device starts out suspended: its first bring-up
# then depends on the RESUME that pm_device_runtime_get() triggers rather than on
# anything the driver does at init. The iterate helper takes that reference
# around every body, so the other cases are unaffected.
CONFIG_PM_DEVICE_RUNTIME_DEFAULT_ENABLE=y
