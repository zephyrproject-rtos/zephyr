# The FlexPWM counter is 16-bit and runs at bus clock / 128 = 750 kHz, so the
# default 100 ms period would need 75000 ticks and be rejected. 20 ms is 15000
# ticks, which also stays inside the 0x7FFF modulo the driver gives a
# capture-only submodule.
CONFIG_TEST_PWM_PERIOD_NSEC=20000000
CONFIG_TEST_PWM_PULSE_NSEC=10000000

CONFIG_TEST_PWM_PERIOD_USEC=20000
CONFIG_TEST_PWM_PULSE_USEC=10000
