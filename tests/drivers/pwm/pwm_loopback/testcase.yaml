common:
  tags:
    - pwm
    - drivers
    - userspace
  depends_on: pwm
  filter: dt_compat_enabled("test-pwm-loopback")
  harness: ztest
  harness_config:
    fixture: pwm_loopback

tests:
  drivers.pwm.loopback:
    extra_args:
      - platform:am62l_evm/am62l3/a53:SNIPPET=ti-io-exp
  drivers.pwm.s32k5xxcvb_s32k566_ftm.loopback:
    extra_args: DTC_OVERLAY_FILE="boards/s32k5xxcvb_s32k566_ftm.overlay"
    platform_allow:
      - s32k5xxcvb/s32k566/m7
      - s32k5xxcvb/s32k566/r52
    depends_on: pwm
    filter: dt_compat_enabled("test-pwm-loopback")

  drivers.pwm.loopback.lp_em_cc2340r5:
    tags:
      - pwm
      - drivers
    platform_allow:
      - lp_em_cc2340r5
    extra_configs:
      - CONFIG_PWM_CAPTURE=y
    harness: ztest
    harness_config:
      fixture: pwm_loopback

  drivers.pwm.loopback.lp_em_cc2745r10_q1:
