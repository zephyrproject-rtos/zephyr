common:
  tags:
    - drivers
    - mspi
    - api
  harness: ztest

tests:
  drivers.mspi.api:
    filter: dt_compat_enabled("zephyr,mspi-emul-controller")
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  drivers.mspi.api.ambiq:
    filter: dt_compat_enabled("ambiq,mspi-controller")
    platform_allow:
      - apollo3p_evb
      - apollo510_evb
    extra_configs:
      - CONFIG_MSPI_AMBIQ_CONTROLLER=y
  drivers.mspi.api.stm32:
    filter: dt_compat_enabled("st,stm32-ospi-controller")
            or dt_compat_enabled("st,stm32-xspi-controller")
    platform_allow:
      - stm32h573i_dk
      - stm32h5f5j_dk
      - stm32h7b3i_dk
      - stm32h735g_disco
  drivers.mspi.api.xec:
    filter: dt_compat_enabled("microchip,xec-qmspi-controller-mspi")
    platform_allow:
      - mec_assy6941/mec1753_qlj
  drivers.mspi.api.bitbang:
    filter: dt_compat_enabled("zephyr,mspi-bitbang-controller")
    platform_allow:
      - stm32h573i_dk
    extra_args:
      - FILE_SUFFIX="bitbang"
