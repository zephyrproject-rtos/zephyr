common:
  tags:
    - drivers
    - mspi
    - flash
  harness: ztest
  filter: dt_compat_enabled("zephyr,mspi-emul-flash")
    or dt_compat_enabled("jedec,spi-nor") or dt_compat_enabled("jedec,mspi-nor")
    or dt_compat_enabled("mspi-atxp032") or dt_compat_enabled("mspi-is25xX0xx")
tests:
  drivers.mspi.flash:
    platform_allow:
      - native_sim
      - apollo3p_evb
      - apollo510_evb
      - nrf7120dk/nrf7120/cpuapp
    integration_platforms:
      - native_sim
      - apollo3p_evb
      - apollo510_evb
  drivers.mspi.flash.stm32:
    platform_allow:
      - stm32h573i_dk
    integration_platforms:
      - stm32h573i_dk
    extra_configs:
      - CONFIG_MSPI_DMA=n
      - CONFIG_MSPI_MEMMAP=n
  drivers.mspi.flash.stm32.dma:
    platform_allow:
      - stm32h573i_dk
    integration_platforms:
      - stm32h573i_dk
    extra_configs:
      - CONFIG_MSPI_DMA=y
      - CONFIG_MSPI_MEMMAP=n
  drivers.mspi.flash.stm32.memmap:
    platform_allow:
      - stm32h573i_dk
    integration_platforms:
      - stm32h573i_dk
    extra_configs:
      - CONFIG_MSPI_DMA=n
      - CONFIG_MSPI_MEMMAP=y
  drivers.mspi.flash.xip_read:
    filter: dt_compat_enabled("is25xX0xx")
    platform_allow:
      - apollo510_evb
    integration_platforms:
      - apollo510_evb
    extra_configs:
      - CONFIG_FLASH_MSPI_MEMMAP_READ=y
  drivers.mspi.flash.mspi_dw_system_workqueue:
    filter: dt_alias_exists("mspi0") and dt_compat_enabled("jedec,nor")
      and CONFIG_MSPI_DW
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp
    extra_configs:
      - CONFIG_MSPI_DW_HANDLE_FIFOS_IN_SYSTEM_WORKQUEUE=y
  drivers.mspi.flash.mspi_nor_no_multithreading:
    filter: dt_alias_exists("mspi0") and CONFIG_FLASH_MSPI_NOR
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp
    extra_configs:
      - CONFIG_MULTITHREADING=n
      - CONFIG_SOC_FLASH_NRF_MRAM=n
