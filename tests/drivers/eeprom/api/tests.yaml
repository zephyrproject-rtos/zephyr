common:
  depends_on: eeprom
  tags:
    - drivers
    - eeprom
tests:
  drivers.eeprom.api:
    # Tests overwrite EEPROM content, only run on select boards
    platform_allow:
      - native_sim
      - native_sim/native/64
      - qemu_x86
      - nucleo_l152re
      - nucleo_l073rz
      - sama7g54_ek
      - sama7d65_curiosity
    integration_platforms:
      - qemu_x86
  drivers.eeprom.api.w_at2x_emul:
    # Tests overwrite EEPROM content, only run on select boards
    extra_args:
      - DTC_OVERLAY_FILE=at2x_emul.overlay
      - EXTRA_CONF_FILE=at2x_emul.conf
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
  drivers.eeprom.api.w_at25_emul:
    # Tests overwrite EEPROM content, only run on select boards
    extra_args:
      - DTC_OVERLAY_FILE=at25_emul.overlay
      - EXTRA_CONF_FILE=at25_emul.conf
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
  drivers.eeprom.api.shield.x_nucleo_eeprma2:
    # Tests overwrite EEPROM content; only run on select boards
    tags:
      - shield
    depends_on:
      - arduino_gpio
      - arduino_i2c
      - arduino_spi
    extra_args: SHIELD=x_nucleo_eeprma2
    harness_config:
      fixture: fixture_shield_x_nucleo_eeprma2
    integration_platforms:
      - nucleo_f070rb
  drivers.eeprom.api.build:
    # Build-only test for boards with EEPROMs
    build_only: true
    platform_exclude:
      - native_sim
      - native_sim/native/64
      - qemu_x86
      - nucleo_l152re
      - nucleo_l073rz
      - sama7g54_ek
