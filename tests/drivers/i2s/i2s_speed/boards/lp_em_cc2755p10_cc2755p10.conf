# CC2755P10 has single I2S device supporting DIR_BOTH mode
# Requires external GPIO loopback: DIO19 (SD0 TX) → DIO20 (SD1 RX)

# Enable GPIO loopback testing (requires external wiring)
CONFIG_I2S_TEST_USE_GPIO_LOOPBACK=y

# Use I2S_DIR_BOTH for simultaneous TX/RX on single device
CONFIG_I2S_TEST_USE_I2S_DIR_BOTH=y

# Disable power management to avoid PM lock issues
CONFIG_PM=n
