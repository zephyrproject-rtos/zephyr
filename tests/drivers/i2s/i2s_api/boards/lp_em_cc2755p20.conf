# CC2755P20 has single I2S device supporting DIR_BOTH mode
# Requires external GPIO loopback: DIO19 (SD0 TX) → DIO20 (SD1 RX)

# Enable GPIO loopback testing (requires external wiring)
CONFIG_I2S_TEST_USE_GPIO_LOOPBACK=y

# Use I2S_DIR_BOTH for simultaneous TX/RX on single device
CONFIG_I2S_TEST_USE_I2S_DIR_BOTH=y

# Allow up to 2 samples of RX startup offset due to I2S pipeline delay
CONFIG_I2S_TEST_ALLOWED_DATA_OFFSET=2

# Enable system power management (PM subsystem, idle state management)
CONFIG_PM=y
