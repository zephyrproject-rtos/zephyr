common:
  tags:
    - drivers
    - energy_meter
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
tests:
  drivers.energy_meter.atm90e32as: {}
  drivers.energy_meter.atm90e32as.full:
    extra_configs:
      - CONFIG_ATM90E32AS_EVENTS=y
      - CONFIG_ATM90E32AS_VERIFY_READ=y
      - CONFIG_ATM90E32AS_SHELL=y
      - CONFIG_ENERGY_METER_SHELL=y
      - CONFIG_PM_DEVICE=y
      - CONFIG_SHELL=y
      - CONFIG_SHELL_BACKEND_SERIAL=n
      - CONFIG_SHELL_BACKEND_DUMMY=y
      - CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=4096
      - CONFIG_SHELL_VT100_COMMANDS=n
