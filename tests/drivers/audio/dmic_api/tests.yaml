common:
  depends_on: dmic
  tags: dmic
  harness: ztest
  filter: dt_alias_exists("dmic0")
tests:
  drivers.audio.dmic_api:
    integration_platforms:
      - mimxrt595_evk/mimxrt595s/cm33
  drivers.audio.dmic_api.nxp_dmic_sparse_channels:
    platform_allow:
      - mimxrt595_evk/mimxrt595s/cm33
    integration_platforms:
      - mimxrt595_evk/mimxrt595s/cm33
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="nxp_dmic_hw_chan_0_2.overlay"
    extra_configs:
      - CONFIG_SAMPLE_PDM_CHANNELS=1
      - CONFIG_TEST_EXPECTED_MAX_CHANNELS=1
  drivers.audio.dmic_api.nxp_dmic_odd_channels:
    platform_allow:
      - mimxrt595_evk/mimxrt595s/cm33
    integration_platforms:
      - mimxrt595_evk/mimxrt595s/cm33
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE="nxp_dmic_hw_chan_0_1_2.overlay"
    extra_configs:
      - CONFIG_SAMPLE_PDM_CHANNELS=3
      - CONFIG_TEST_EXPECTED_MAX_CHANNELS=3
