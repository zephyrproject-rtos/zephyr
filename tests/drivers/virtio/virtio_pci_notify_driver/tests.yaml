tests:
  drivers.virtio.pci.notify_driver:
    platform_allow:
      - native_sim
      - native_sim/native/64
    tags:
      - drivers
      - virtio
  drivers.virtio.pci.notify_driver.no_assert:
    extra_configs:
      - CONFIG_ASSERT=n
      - CONFIG_SPIN_VALIDATE=n
    platform_allow:
      - native_sim
      - native_sim/native/64
    tags:
      - drivers
      - virtio
