CONFIG_ZTEST=y
CONFIG_VIRTIO=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=2048

# The helper does not need a transport or any virtio device driver, and the
# emulated boards have virtio nodes that QEMU would have to provide devices for.
CONFIG_VIRTIO_MMIO=n
CONFIG_VIRTIO_PCI=n
CONFIG_INPUT_VIRTIO=n
CONFIG_ENTROPY_VIRTIO=n
CONFIG_DISK_DRIVER_VIRTIO_BLK=n
CONFIG_ETH_VIRTIO_NET=n
CONFIG_GPIO_VIRTIO=n
CONFIG_SPI_VIRTIO=n
CONFIG_I2C_VIRTIO=n
CONFIG_UART_VIRTIO_CONSOLE=n
