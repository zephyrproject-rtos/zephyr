tests:
  drivers.virtio.queue_startup:
    # A separate binary: the concurrent virtq_create() calls must be the first
    # ones, before the lazy wake workqueue has ever been started.
    platform_allow:
      - qemu_cortex_m3
      - qemu_riscv32
      - qemu_cortex_a53/qemu_cortex_a53/smp
    integration_platforms:
      - qemu_cortex_m3
      - qemu_cortex_a53/qemu_cortex_a53/smp
    tags:
      - drivers
      - virtio
