# Upstream QEMU 11.1 models K230 UART0-UART4 with generic serial_mm_init
# (0x00-0x1f), leaving the DesignWare USR register at offset 0x7c unimplemented.
# Disable the DesignWare USR path when running under QEMU 11.1.
CONFIG_UART_NS16550_DW8250_DW_APB=n
