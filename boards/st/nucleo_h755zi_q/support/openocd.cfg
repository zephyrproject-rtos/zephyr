# Borrow the stm32h745i-disco openocd configuration as no config exists for the h755 yet.
source [find board/stm32h745i-disco.cfg]

# Preserve application state when attaching a debugger.
reset_config srst_only srst_nogate connect_deassert_srst

$_CHIPNAME.cpu0 configure -event gdb-attach {
        echo "Debugger attaching"
        gdb_breakpoint_override hard
}

$_CHIPNAME.cpu0 configure -event gdb-detach {
        echo "Debugger detaching: resuming execution"
        resume
}
