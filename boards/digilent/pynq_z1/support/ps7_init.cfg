proc ps7_mask_write {addr mask value} {
	set old [read_memory $addr 32 1]
	mww $addr [expr {($old & ~$mask) | ($value & $mask)}]
}

proc ps7_mask_poll {addr mask} {
	global PS7_POLL_TRIES
	for {set i 0} {$i < $PS7_POLL_TRIES} {incr i} {
		if {([read_memory $addr 32 1] & $mask) != 0} {
			return
		}
	}
	error [format "ps7_init: poll of 0x%08x mask 0x%08x timed out" $addr $mask]
}

proc ps7_config {list} {
	set i 0
	set n [llength $list]
	while {$i < $n} {
		set word [lindex $list $i]
		set addr [expr {$word & ~0x3}]
		set op [expr {$word & 0x3}]
		incr i
		switch $op {
			0 {
				ps7_mask_write $addr [lindex $list $i] [lindex $list [expr {$i + 1}]]
				incr i 2
			}
			1 {
				ps7_mask_poll $addr [lindex $list $i]
				incr i
			}
			2 {
				sleep [expr {[lindex $list $i]}]
				incr i
			}
			3 {
				mww $addr [lindex $list $i]
				incr i
			}
		}
	}
}

# Soft reset of the processing system, back to the boot ROM state. The memory
# access port survives the reset but reports the write as failed, hence the
# sticky error clear and the re-examination. The debug port of the core does
# not survive it: the halt goes through the memory mapped debug registers.
proc ps7_reset {} {
	poll off
	targets $::PS7_TARGET
	mww 0xF8000008 0x0000DF0D
	catch {mww 0xF8000200 0x00000001}
	sleep 1000
	zynq.dap dpreg 0x4 0x50000020
	$::PS7_TARGET arp_examine
	catch {mdw 0xF800000C}
	zynq.dap dpreg 0x4 0x50000020
	mdw 0xF800000C
	mww 0xF8890FB0 0xC5ACCE55
	mww 0xF8890088 0x00006002
	mww 0xF8890090 0x00000001
	sleep 50
	zynq.cpu0 arp_examine
	zynq.cpu1 arp_examine
	poll on
	targets zynq.cpu0
	halt
	echo "ps7_reset: processing system in its boot ROM state, cpu0 halted"
}

# With the core stopped: a running image would lose its clocks under it.
proc ps7_init {} {
	global ps7_mio_init ps7_pll_init ps7_clock_init ps7_ddr_init
	global ps7_peripherals_init

	targets zynq.cpu0
	halt
	targets $::PS7_TARGET
	foreach stage [list $ps7_mio_init $ps7_pll_init $ps7_clock_init \
			    $ps7_ddr_init $ps7_peripherals_init] {
		ps7_config $stage
	}
	targets zynq.cpu0
	echo "ps7_init: processing system up, DDR ready"
}
