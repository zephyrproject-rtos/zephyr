# Processing system bring-up over JTAG, in place of a first stage boot loader.
# The lists are the ones the Xilinx tools generate for the board, in their
# encoding: the low two bits of each register address select the operation.
#
#   0  mask write   addr mask value
#   1  mask poll    addr mask        wait until a bit of mask reads as set
#   2  mask delay   addr ms
#   3  write        addr value

