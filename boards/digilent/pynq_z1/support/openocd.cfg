source [find interface/ftdi/digilent-hs1.cfg]
transport select jtag
source [find target/zynq_7000.cfg]

# Memory access port: reaches the registers without a core, survives the reset
target create zynq.axi mem_ap -dap zynq.dap -ap-num 0

# zynq_7000.cfg leaves cpu1 selected
targets zynq.cpu0

source [find ps7_init.cfg]
