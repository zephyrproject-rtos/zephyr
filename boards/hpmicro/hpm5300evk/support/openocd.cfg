source [file join [file dirname [info script]] ft2232.cfg]
source [find soc/hpm5300.cfg]

flash bank xpi0 hpm_xpi 0x80000000 0x2000000 0 0 $_TARGET0 \
	0xF3000000 0x5 0x1000

proc init_clock {} {
	mww 0xF4000800 0xFFFFFFFF
	mww 0xF4000810 0xFFFFFFFF
	mww 0xF4000820 0xFFFFFFFF
	mww 0xF4000830 0xFFFFFFFF
}

$_TARGET0 configure -event reset-init {
	init_clock
}

# The XPI flash operations execute from ILM before PMP is configured.
$_TARGET0 configure -event gdb-attach {
	reset halt
}

bindto 127.0.0.1
