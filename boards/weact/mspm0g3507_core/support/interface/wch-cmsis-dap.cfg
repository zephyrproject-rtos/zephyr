# WCH-Link / WCH-LinkE in ARM mode (USB VID:PID 1a86:8012).
# Switch the probe to ARM mode if it enumerates as 1a86:8010 (RISC-V mode).
# CMSIS-DAP v2 over WinUSB bulk endpoints.

adapter driver cmsis-dap
cmsis-dap backend usb_bulk

# Uncomment to select a specific probe when several are connected:
# adapter serial 84448F0609E2
