source [file join [file dirname [info script]] .. .. common xsdb_parse_args.tcl]

proc load_image {} {
	global args_arr
	parse_args {elf} {bitstream pdi}

	if { [info exists ::env(HW_SERVER_URL)] } {
		connect -url $::env(HW_SERVER_URL)
	} else {
		connect
	}
	after 2000
	if { [info exists args_arr(pdi)] } {
		device program $args_arr(pdi)
	} elseif { [info exists args_arr(bitstream)] } {
		fpga -f $args_arr(bitstream) -no-revision-check
	}
	after 2000
	targets -set -nocase -filter {name =~ "Hart*" && parent =~ "*USER2*"}
	after 2000
	rst -proc
	dow $args_arr(elf)
	con
	exit
}

load_image
