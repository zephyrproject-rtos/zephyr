board:
  name: xiao_nrf54l15
  full_name: XIAO NRF54L15
  vendor: seeed
  socs:
  - name: nrf54l15
    variants:
    - name: xip
      cpucluster: cpuflpr
runners:
  run_once:
    '--recover':
    - runners:
      - nrfjprog
      - nrfutil
      run: first
      groups:
      - boards:
        - xiao_nrf54l15/nrf54l15/cpuapp
        - xiao_nrf54l15/nrf54l15/cpuflpr
        - xiao_nrf54l15/nrf54l15/cpuflpr/xip
    '--erase':
    - runners:
      - nrfjprog
      - jlink
      - nrfutil
      - openocd
      run: first
      groups:
      - boards:
        - xiao_nrf54l15/nrf54l15/cpuapp
        - xiao_nrf54l15/nrf54l15/cpuflpr
        - xiao_nrf54l15/nrf54l15/cpuflpr/xip
    '--reset':
    - runners:
      - nrfjprog
      - jlink
      - nrfutil
      run: last
      groups:
      - boards:
        - xiao_nrf54l15/nrf54l15/cpuapp
        - xiao_nrf54l15/nrf54l15/cpuflpr
        - xiao_nrf54l15/nrf54l15/cpuflpr/xip
