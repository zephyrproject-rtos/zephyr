identifier: stm32h7_renode_reference_board
name: STM32H7 Renode Reference Platform
type: mcu
arch: arm
toolchain:
  - zephyr
  - gnuarmemb
ram: 512
flash: 2048
simulation:
  - name: renode
    exec: renode
testing:
  renode:
    uart: sysbus.usart2
    resc: boards/antmicro/stm32h7_renode_reference_board/support/testing.resc
supported:
  - adc
  - can
  - crc
  - crypto
  - dma
  - entropy
  - flash
  - gpio
  - hwinfo
  - i2c
  - input
  - led
  - netif:eth
  - nvs
  - ptp_clock
  - pwm
  - rtc
  - uart
  - uart
  - watchdog
vendor: antmicro
