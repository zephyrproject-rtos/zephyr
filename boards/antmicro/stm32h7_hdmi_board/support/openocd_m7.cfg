adapter driver ftdi
adapter usb vid_pid 0x0403 0x6043

# SWD on Channel A
ftdi channel 0

# Use SWD, SCDIO and SWCLK default mapping will be used
transport select swd

# Use 2MHz
adapter speed 2000

# Pin mapping:
# ADBUS0 = SWCLK
# ADBUS1 = SWDIO_OUT
# ADBUS2 = SWDIO_IN
# ADBUS4 = nRESET

ftdi layout_init 0x0010 0x0013
# 0x0013 direction mask:
#   bit0 = 1 (SWCLK output)
#   bit1 = 1 (SWDIO_OUT output)
#   bit2 = 0 (SWDIO_IN input)
#   bit3 = 0 (Not used)
#   bit4 = 1 (nRESET output)
#   bit5 = 0 (Not used)
#   bit6 = 0 (Not used)
#   bit7 = 0 (Not used)
# 0x0010 initial state:
#   bit0 = 0 (SWCLK low)
#   bit1 = 0 (SWDIO_OUT low)
#   bit2 = 0 (SWDIO_IN low)
#   bit3 = 0 (Not used low)
#   bit4 = 1 (nRESET high)
#   bit5 = 0 (Not used low)
#   bit6 = 0 (Not used low)
#   bit7 = 0 (Not used low)

# SWD_EN not mapped on physical pin
ftdi layout_signal SWD_EN -data 0

# SWDIO_OE not mapped on physical pin
ftdi layout_signal SWDIO_OE -data 0

# nSRST mapped to ADBUS4
ftdi layout_signal nSRST -data 0x0010 -oe 0x0010

source [find target/stm32h7x_dual_bank.cfg]

# Use connect_assert_srst here to be able to program
# even when core is in sleep mode
reset_config srst_only srst_nogate connect_assert_srst

$_CHIPNAME.cpu0 configure -event gdb-attach {
        echo "Debugger attaching: halting execution"
        gdb_breakpoint_override hard
}

$_CHIPNAME.cpu0 configure -event gdb-detach {
        echo "Debugger detaching: resuming execution"
        resume
}

# Due to the use of connect_assert_srst, running gdb requires
# to reset halt just after openocd init.
rename init old_init
proc init {} {
        old_init
        reset halt
}
