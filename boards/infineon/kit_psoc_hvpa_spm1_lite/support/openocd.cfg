# OpenOCD configuration for KIT_PSOC-HVPA-SPM1_LITE
# PSoC 4 HVPA-SPM 1.0 with KitProg3 programmer

source [find interface/kitprog3.cfg]

# Set transport to SWD
transport select swd

# Set adapter speed (KitProg3 supports up to 1000 kHz for PSoC 4)
adapter speed 1000

# PSoC 4 family configuration (same target script as used by the ModusToolbox recipe)
source [find target/infineon/psoc4.cfg]

# Reset configuration
reset_config srst_only
