# OpenOCD configuration for KIT_PSOC4-HVPA-144K_LITE
# PSOC 4 HVPA 144K with KitProg3 programmer

source [find interface/kitprog3.cfg]

transport select swd

adapter speed 1000

# PSOC 4 family configuration
source [find target/infineon/psoc4.cfg]

reset_config srst_only

# Select a particular KitProg3 when several are connected
if { [info exists _ZEPHYR_BOARD_SERIAL] } {
	adapter serial $_ZEPHYR_BOARD_SERIAL
}
