# Enlarge UART mcumgr buffers so large SMP image-upload frames are not
# dropped (default 128-byte RX buffer is too small for DFU throughput).
CONFIG_UART_MCUMGR_RX_BUF_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_UART_MTU=2048
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
