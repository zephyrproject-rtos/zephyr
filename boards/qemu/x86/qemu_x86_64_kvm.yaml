identifier: qemu_x86_64_kvm
name: QEMU Emulation for X86_64 (KVM enabled)
type: qemu
arch: x86
toolchain:
  - zephyr
supported:
  - smp
simulation:
  - name: qemu
testing:
  default: false
  ignore_tags:
    - benchmark
    - kernel
vendor: qemu

# Running this board needs /dev/kvm and a QEMU able to emulate CET, which no
# CI runner nor any Zephyr SDK release provides yet.
twister: false
