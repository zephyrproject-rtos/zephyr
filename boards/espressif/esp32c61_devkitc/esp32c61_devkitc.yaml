identifier: esp32c61_devkitc
name: ESP32-C61-DevKitC
vendor: espressif
type: mcu
arch: riscv
toolchain:
  - zephyr
supported:
  - adc
  - counter
  - gpio
  - watchdog
  - uart
  - spi
  - i2c
  - dma
  - entropy
  - pwm
  - netif:wifi
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
