identifier: esp_threadbr/esp32s3/procpu/ethernet
name: ESP Thread Border Router / ZigBee Gateway PROCPU Ethernet
type: mcu
arch: xtensa
toolchain:
  - zephyr
supported:
  - gpio
  - uart
  - i2c
  - spi
  - counter
  - watchdog
  - entropy
  - pwm
  - dma
  - input
  - crypto
  - retained_mem
  - netif:eth
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
