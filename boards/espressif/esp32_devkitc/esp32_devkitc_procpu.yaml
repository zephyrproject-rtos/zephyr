identifier: esp32_devkitc/esp32/procpu
name: ESP32-DevkitC PROCPU
type: mcu
arch: xtensa
toolchain:
  - zephyr
ram: 8192
supported:
  - adc
  - dac
  - gpio
  - i2c
  - i2s
  - watchdog
  - uart
  - nvs
  - pwm
  - spi
  - counter
  - entropy
  - input
  - crypto
  - retained_mem
  - netif:wifi
  - pulse_io
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
