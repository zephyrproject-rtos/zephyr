identifier: esp32c3_devkitc
name: ESP32-C3
type: mcu
arch: riscv
toolchain:
  - zephyr
supported:
  - adc
  - gpio
  - i2c
  - i2s
  - watchdog
  - uart
  - dma
  - pwm
  - spi
  - counter
  - entropy
  - crypto
  - retained_mem
  - netif:wifi
  - pulse_io
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
