identifier: esp32_ethernet_kit/esp32/procpu
name: ESP32 ETHERNET KIT PROCPU
type: mcu
arch: xtensa
toolchain:
  - zephyr
supported:
  - gpio
  - watchdog
  - uart
  - nvs
  - pwm
  - i2s
  - crypto
  - retained_mem
  - netif:wifi
  - netif:eth
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
