identifier: esp32s2_devkitc
name: ESP32-S2 DevKitC
type: mcu
arch: xtensa
toolchain:
  - zephyr
supported:
  - adc
  - dac
  - gpio
  - i2c
  - i2s
  - watchdog
  - uart
  - nvs
  - pwm
  - spi
  - counter
  - entropy
  - input
  - dma
  - crypto
  - retained_mem
  - netif:wifi
  - pulse_io
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
