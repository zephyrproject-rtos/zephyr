identifier: esp32s3_eye/esp32s3/procpu
name: ESP32-S3 EYE PROCPU
type: mcu
arch: xtensa
toolchain:
  - zephyr
supported:
  - gpio
  - uart
  - i2c
  - spi
  - counter
  - watchdog
  - entropy
  - pwm
  - sdhc
  - dma
  - input
  - video
  - crypto
  - retained_mem
  - netif:wifi
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
