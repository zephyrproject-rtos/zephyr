identifier: esp_wrover_kit/esp32/procpu
name: ESP WROVER KIT PROCPU
type: mcu
arch: xtensa
toolchain:
  - zephyr
supported:
  - adc
  - dac
  - gpio
  - i2c
  - watchdog
  - uart
  - nvs
  - pwm
  - sdhc
  - spi
  - counter
  - entropy
  - crypto
  - retained_mem
  - netif:wifi
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
