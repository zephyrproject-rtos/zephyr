identifier: esp32s3_box3/esp32s3/procpu
name: ESP32-S3 BOX-3 PROCPU
type: mcu
arch: xtensa
toolchain:
  - zephyr
supported:
  - gpio
  - uart
  - spi
  - watchdog
  - entropy
  - dma
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
