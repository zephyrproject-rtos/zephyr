identifier: esp32c3_rust
name: ESP32-C3-DevKit-RUST-1
type: mcu
arch: riscv
toolchain:
  - zephyr
supported:
  - adc
  - gpio
  - i2c
  - watchdog
  - uart
  - dma
  - pwm
  - spi
  - counter
  - entropy
  - crypto
  - retained_mem
  - netif:wifi
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
