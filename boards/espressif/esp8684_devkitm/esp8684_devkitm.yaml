identifier: esp8684_devkitm
name: ESP8684
type: mcu
arch: riscv
toolchain:
  - zephyr
supported:
  - adc
  - dma
  - gpio
  - watchdog
  - uart
  - counter
  - entropy
  - i2c
  - pwm
  - spi
  - netif:wifi
vendor: espressif
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
