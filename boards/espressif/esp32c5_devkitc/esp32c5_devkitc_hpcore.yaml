identifier: esp32c5_devkitc/esp32c5/hpcore
name: ESP32-C5-DevKitC-1 HP Core
vendor: espressif
type: mcu
arch: riscv
toolchain:
  - zephyr
supported:
  - adc
  - can
  - gpio
  - watchdog
  - uart
  - dma
  - pwm
  - spi
  - counter
  - entropy
  - i2c
  - i2s
  - netif:openthread
  - netif:wifi
  - crypto
  - retained_mem
  - pulse_io
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
