identifier: esp32p4x_function_ev_board/esp32p4/hpcore
name: ESP32-P4X-Function-EV-Board HP Core
vendor: espressif
type: mcu
arch: riscv
toolchain:
  - zephyr
supported:
  - counter
  - display
  - dma
  - entropy
  - gpio
  - hwinfo
  - i2c
  - i2s
  - input
  - netif:eth
  - netif:wifi
  - ptp_clock
  - pulse_io
  - pwm
  - sdhc
  - spi
  - uart
  - usbh
  - watchdog
testing:
  post_connect_reset:
    method: serial
    open_state:
      dtr: true
      rts: false
    sequence:
      - dtr: false
        rts: true
      - delay_ms: 100
      - rts: false
