# SPDX-License-Identifier: Apache-2.0
#
# Target: Pic64gx processor by Microchip Technologies
#
# https://www.microchip.com/en-us/products/microprocessors/64-bit-mpus/pic64gx
#

adapter speed 6000

source [find embedded_flashpro5.cfg]

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME pic64gx
}

# Process COREID variable
if {![exists COREID]} {
	set COREID -1
}

transport select jtag

# PIC64GX hart id to name lookup table
array set hart_names {
	0	e51
	1	u54_1
	2	u54_2
	3	u54_3
	4	u54_4
}

# PIC64GX table
set pic64gx_tap_info {
	PIC64GX1000 0x0f8531cf
}

proc expected_ids {tap_list} {
	set str ""
	dict for {key value} $tap_list {
		append str "-expected-id" " " $value " "
	}

	return $str
}

set irlen 8
set expected_ids [expected_ids $pic64gx_tap_info]
eval jtag newtap $_CHIPNAME cpu -irlen $irlen $expected_ids -ignore-version

if {$COREID == -1} {
	# Single debug connection to all harts
	set _TARGETNAME_0 $_CHIPNAME.$hart_names(0)
	set _TARGETNAME_1 $_CHIPNAME.$hart_names(1)
	set _TARGETNAME_2 $_CHIPNAME.$hart_names(2)
	set _TARGETNAME_3 $_CHIPNAME.$hart_names(3)
	set _TARGETNAME_4 $_CHIPNAME.$hart_names(4)

	target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid 0 -rtos hwthread
	target create $_TARGETNAME_1 riscv -chain-position $_CHIPNAME.cpu -coreid 1 -rtos hwthread
	target create $_TARGETNAME_2 riscv -chain-position $_CHIPNAME.cpu -coreid 2 -rtos hwthread
	target create $_TARGETNAME_3 riscv -chain-position $_CHIPNAME.cpu -coreid 3 -rtos hwthread
	target create $_TARGETNAME_4 riscv -chain-position $_CHIPNAME.cpu -coreid 4 -rtos hwthread
	target smp $_TARGETNAME_1 $_TARGETNAME_2 $_TARGETNAME_3 $_TARGETNAME_4
} else {
	# Debug connection to a specific hart
	set _TARGETNAME_0 $_CHIPNAME.$hart_names($COREID)
	target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid $COREID
}

# Only TRSTn supported
reset_config trst_only

#
# HSS-aware reset/halt for loading an application into DDR
#
# DDR is trained by the Hart Software Services (HSS) running from eNVM, so an
# image cannot be loaded into DDR right after a reset. Instead, reset the MSS,
# let HSS train DDR and boot whatever the SD card holds, then take over the
# requested hart(s). For the U54 harts the E51 is left running so HSS keeps
# servicing its watchdog.
#
# The wait time can be changed with the runner option:
#   --cmd-pre-init "set HSS_BOOT_WAIT_MS <ms>"
#
if {![info exists HSS_BOOT_WAIT_MS]} {
	set HSS_BOOT_WAIT_MS 8000
}

# Put a halted hart into a clean M-mode state: the hart may have been running
# a payload booted by HSS (e.g. U-Boot/Linux in S-mode).
proc pic64gx_clean_hart {target_name} {
	targets $target_name
	reg priv 3
	reg mstatus 0
	reg mie 0
	reg medeleg 0
	reg mideleg 0
	reg satp 0
}

proc pic64gx_hss_reset_halt {hart} {
	global _CHIPNAME HSS_BOOT_WAIT_MS

	targets $_CHIPNAME.e51
	reset run
	echo "Waiting $HSS_BOOT_WAIT_MS ms for HSS to initialize DDR..."
	sleep $HSS_BOOT_WAIT_MS

	if {$hart eq "e51"} {
		halt
		pic64gx_clean_hart $_CHIPNAME.e51
	} else {
		# The U54 harts form an SMP group: halting one halts all of them
		# and "resume <addr>" restarts all of them at <addr>.
		targets $_CHIPNAME.u54_1
		halt
		foreach i {4 3 2 1} {
			pic64gx_clean_hart $_CHIPNAME.u54_$i
		}
	}
}
