# Security hardening database fragment for the statistics subsystem.

rules:
  STATS:
    value: n
    profiles: [strict]
    rationale: |
      Statistics collection exposes counters about internal operation that profile device behavior
      and support reconnaissance.
    references: [CWE-200]
