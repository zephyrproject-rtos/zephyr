# Security hardening database fragment for test infrastructure.

rules:
  TEST:
    value: n
    profiles: [strict]
    rationale: |
      Marks the image as a test build: it selects CONFIG_THREAD_NAME and turns on defaults meant for
      diagnosability, such as assertions.
    references: [CWE-489]

  TEST_USERSPACE:
    value: n
    profiles: [strict]
    rationale: |
      Adds test-only userspace hooks so test cases can exercise kernel internals, weakening the
      user/kernel boundary in the process.
    references: [CWE-489]

  ZTEST:
    value: n
    profiles: [strict]
    rationale: |
      Links the ztest framework and its test entry points into the image, and selects CONFIG_TEST
      along with the diagnosability defaults that come with it.
    references: [CWE-489]
