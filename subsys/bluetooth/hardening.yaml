# Security hardening database fragment for Bluetooth.

rules:
  BT_ID_ALLOW_UNAUTH_OVERWRITE:
    value: n
    rationale: |
      Lets a peer bonded without authentication on one local identity pair again without
      authentication on another, so a device copying that peer's address obtains a second bond as
      that peer.
    references: [CWE-290]

  BT_KEYS_LOG_LEVEL_DBG:
    value: n
    rationale: |
      Debug logging of the Bluetooth keys subsystem can write link keys and identity keys to the log
      output, exposing long-term secrets to anyone able to read the logs.
    references: [CWE-532]

  BT_LOG_SNIFFER_INFO:
    value: n
    rationale: |
      Emits pairing information in the log output specifically so that sniffers can decrypt the
      connection, exactly what an attacker with log access needs.
    references: [CWE-532]

  BT_SMP_ALLOW_UNAUTH_OVERWRITE:
    value: n
    rationale: |
      Lets any device that copies a bonded peer's address pair again without authentication and
      replace the stored bond with its own keys, after which it is trusted as that peer.
    references: [CWE-290]

  BT_SMP_ENFORCE_MITM:
    value: y
    rationale: |
      Requires man-in-the-middle protection during Bluetooth pairing whenever the local or remote
      device is capable of it, preventing silent downgrades to unauthenticated pairing.
    references: [CWE-757]

  BT_SMP_LOG_LEVEL_DBG:
    value: n
    rationale: |
      Debug logging of the Security Manager Protocol can expose pairing keys and intermediate values
      of the pairing procedure in the log output.
    references: [CWE-532]

  BT_SMP_MIN_ENC_KEY_SIZE:
    min: 16
    rationale: |
      Values below 16 let a peer, or an attacker tampering with the pairing exchange, settle LE
      pairing on a key of as few as 7 octets that can be brute-forced offline. 16 makes LE pairing
      fail unless it yields a full 128-bit key.
    references: [CWE-326, CWE-757, CVE-2019-9506]

  BT_SMP_SC_PAIR_ONLY:
    value: y
    rationale: |
      Rejects LE legacy pairing, whose keys a passive sniffer of the pairing exchange recovers by
      brute-forcing the temporary key unless out-of-band data is used, so every pairing uses LE
      Secure Connections.
    references: [CWE-757, CWE-326]

  BT_STORE_DEBUG_KEYS:
    value: n
    rationale: |
      Persists keys distributed by devices using the well-known debug key pair; such peers offer no
      confidentiality, and storing their keys treats them as trusted bonds.
    references: [CWE-798]

  BT_TESTING:
    value: n
    rationale: |
      Exposes Bluetooth stack-internal testing hooks that bypass normal state checks.
    references: [CWE-489]

  BT_USE_DEBUG_KEYS:
    value: n
    rationale: |
      Pairs using the publicly known debug key pair from the Bluetooth specification instead of a
      random key pair, allowing any sniffer to decrypt the pairing and subsequent traffic.
    references: [CWE-798]
